<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paper.io</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#1a1a2e;color:#fff;font-family:'Segoe UI',Arial,sans-serif;overflow:hidden;user-select:none;}
#homeScreen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(13,13,26,0.82);z-index:100;overflow:hidden;backdrop-filter:blur(2px);}
#menuCanvas{display:none;}
#homeScreen>*:not(#menuCanvas){position:relative;z-index:1;}
#homeScreen h1{font-size:72px;font-weight:900;letter-spacing:4px;background:linear-gradient(90deg,#ff6b6b,#ffd93d,#6bcb77,#4d96ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px;}
.subtitle{color:#888;font-size:16px;margin-bottom:40px;letter-spacing:2px;}
.home-card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:32px 40px;width:440px;backdrop-filter:blur(10px);}
.home-card label{display:block;font-size:12px;letter-spacing:1px;color:#aaa;margin-bottom:8px;text-transform:uppercase;}
.home-card input[type=text]{width:100%;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:8px;padding:12px 16px;color:#fff;font-size:16px;outline:none;transition:border-color 0.2s;margin-bottom:24px;}
.home-card input[type=text]:focus{border-color:rgba(255,255,255,0.4);}
.skin-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:28px;}
.skin-swatch{border-radius:10px;padding:10px 6px;cursor:pointer;border:2px solid transparent;transition:all 0.2s;text-align:center;font-size:11px;font-weight:600;}
.skin-swatch:hover{transform:scale(1.05);}
.skin-swatch.selected{border-color:#fff;transform:scale(1.08);}
.swatch-dot{width:28px;height:28px;border-radius:50%;margin:0 auto 6px;border:3px solid rgba(255,255,255,0.3);}
.btn-play{width:100%;padding:16px;background:linear-gradient(135deg,#ff6b6b,#ff8e53);border:none;border-radius:10px;color:#fff;font-size:20px;font-weight:800;letter-spacing:2px;cursor:pointer;transition:all 0.2s;text-transform:uppercase;}
.btn-play:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(255,107,107,0.4);}
.home-bottom{display:flex;gap:16px;margin-top:20px;}
.btn-secondary{flex:1;padding:12px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:8px;color:#ccc;font-size:14px;font-weight:600;cursor:pointer;transition:all 0.2s;}
.btn-secondary:hover{background:rgba(255,255,255,0.14);color:#fff;}
.records-display{margin-top:20px;background:rgba(255,255,255,0.04);border-radius:10px;padding:16px 20px;width:440px;}
.records-display h3{font-size:12px;letter-spacing:1px;color:#888;text-transform:uppercase;margin-bottom:12px;}
.records-row{display:flex;justify-content:space-between;font-size:14px;color:#ccc;margin-bottom:6px;}
.records-row span:last-child{color:#ffd93d;font-weight:700;}
#achievementsPanel{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:200;display:none;align-items:center;justify-content:center;}
#achievementsPanel.open{display:flex;}
.ach-modal{background:#1a1a2e;border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:32px;width:500px;max-height:80vh;overflow-y:auto;}
.ach-modal h2{font-size:24px;margin-bottom:24px;color:#ffd93d;}
.ach-item{display:flex;align-items:center;gap:16px;padding:14px;border-radius:10px;margin-bottom:10px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);}
.ach-item.unlocked{background:rgba(255,217,61,0.08);border-color:rgba(255,217,61,0.2);}
.ach-icon{font-size:28px;width:44px;text-align:center;filter:grayscale(1);opacity:0.4;}
.ach-item.unlocked .ach-icon{filter:none;opacity:1;}
.ach-info h4{font-size:15px;margin-bottom:3px;}
.ach-info p{font-size:12px;color:#888;}
.ach-item.unlocked .ach-info h4{color:#ffd93d;}
.btn-close-ach{margin-top:20px;width:100%;padding:12px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:8px;color:#ccc;font-size:14px;cursor:pointer;}
#gameScreen{position:fixed;inset:0;display:none;}
#gameScreen.active{display:block;}
canvas{display:block;}
#gameCanvas{position:absolute;top:0;left:0;}
#menuCanvas{position:absolute;top:0;left:0;}
#minimap{position:fixed!important;bottom:20px!important;left:20px!important;top:auto!important;width:225px;height:225px;border:2px solid rgba(0,0,0,0.3);border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,0.25);image-rendering:pixelated;z-index:9999;background:#ddd;}
#leaderboard{position:absolute;top:20px;right:20px;background:rgba(255,255,255,0.93);border-radius:12px;padding:14px 18px;min-width:190px;box-shadow:0 4px 20px rgba(0,0,0,0.15);}
#leaderboard h3{font-size:11px;letter-spacing:1.5px;color:#999;text-transform:uppercase;margin-bottom:10px;}
.lb-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:13px;}
.lb-rank{color:#bbb;width:16px;font-size:11px;}
.lb-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.lb-name{flex:1;color:#333;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lb-name.me{color:#111;font-weight:700;}
.lb-pct{color:#e67e22;font-weight:700;font-size:12px;}
#statsBar{position:absolute;top:20px;left:20px;display:flex;flex-direction:column;gap:8px;}
.stat-pill{background:rgba(255,255,255,0.93);border-radius:20px;padding:7px 16px;font-size:13px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,0.1);display:flex;align-items:center;gap:8px;}
.stat-label{color:#999;font-size:11px;font-weight:400;}
.stat-val{color:#333;}
#achPopup{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-120px);background:#fff;border:2px solid #ffd93d;border-radius:12px;padding:14px 22px;display:flex;align-items:center;gap:14px;z-index:300;transition:transform 0.35s cubic-bezier(0.34,1.4,0.64,1),opacity 0.35s;pointer-events:none;min-width:260px;box-shadow:0 8px 30px rgba(0,0,0,0.25);opacity:0;}
#achPopup.show{transform:translateX(-50%) translateY(0);opacity:1;}
.pop-icon{font-size:32px;}
.pop-label{font-size:10px;color:#999;letter-spacing:1px;text-transform:uppercase;}
.pop-text h4{color:#e67e22;font-size:14px;margin-bottom:2px;}
.pop-text p{color:#666;font-size:12px;}
#deathScreen{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:150;display:none;align-items:center;justify-content:center;}
#deathScreen.active{display:flex;}
.death-card{background:#fff;border-radius:20px;padding:40px 48px;text-align:center;min-width:380px;color:#333;box-shadow:0 20px 60px rgba(0,0,0,0.4);}
.death-card h2{font-size:36px;font-weight:900;color:#e74c3c;margin-bottom:6px;letter-spacing:2px;}
.death-sub{color:#999;font-size:14px;margin-bottom:28px;}
.death-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:28px;}
.death-stat{background:#f8f8f8;border-radius:10px;padding:14px 10px;}
.ds-val{font-size:24px;font-weight:800;color:#e67e22;display:block;}
.ds-label{font-size:11px;color:#999;margin-top:4px;display:block;}
.death-new-ach{margin-bottom:24px;}
.death-new-ach h4{font-size:12px;color:#e67e22;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;}
.death-ach-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(230,126,34,0.1);border:1px solid rgba(230,126,34,0.3);border-radius:20px;padding:6px 14px;font-size:13px;margin:4px;color:#333;}
.death-buttons{display:flex;gap:12px;}
.death-buttons button{flex:1;padding:14px;border-radius:10px;border:none;font-size:15px;font-weight:700;cursor:pointer;transition:all 0.2s;}
.btn-again{background:linear-gradient(135deg,#ff6b6b,#ff8e53);color:#fff;}
.btn-again:hover{transform:translateY(-2px);}
.btn-home-death{background:#f0f0f0;color:#666;}
.btn-home-death:hover{background:#e0e0e0;}
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.15);border-radius:3px;}
#hud{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:10;}
</style>
</head>
<body>
<div id="homeScreen">
  <canvas id="menuCanvas"></canvas>
  <h1>PAPER.IO</h1>
  <p class="subtitle">CLAIM YOUR TERRITORY</p>
  <div class="home-card">
    <label for="nameInput">Your Name</label>
    <input type="text" id="nameInput" maxlength="16" placeholder="Leave blank for random name...">
    <label>Choose Your Skin</label>
    <div class="skin-grid" id="skinGrid"></div>
    <button class="btn-play" id="btnPlay">&#9654; PLAY</button>
    <div class="home-bottom">
      <button class="btn-secondary" id="btnAchievements">&#127942; Achievements</button>
    </div>
  </div>
  <div class="records-display">
    <h3>Personal Records</h3>
    <div class="records-row"><span>Best Territory</span><span id="recTerritory">-</span></div>
    <div class="records-row"><span>Most Kills</span><span id="recKills">-</span></div>
    <div class="records-row"><span>Longest Survival</span><span id="recSurvival">-</span></div>
  </div>
</div>
<div id="achievementsPanel">
  <div class="ach-modal">
    <h2>&#127942; Achievements</h2>
    <div id="achList"></div>
    <button class="btn-close-ach" id="btnCloseAch">Close</button>
  </div>
</div>
<div id="gameScreen">
  <canvas id="gameCanvas"></canvas>
  <div id="hud">
    <div id="statsBar">
      <div class="stat-pill"><span class="stat-label">TERRITORY</span><span class="stat-val" id="statTerritory">0%</span></div>
      <div class="stat-pill"><span class="stat-label">KILLS</span><span class="stat-val" id="statKills">0</span></div>
      <div class="stat-pill"><span class="stat-label">TIME</span><span class="stat-val" id="statTime">0:00</span></div>
    </div>
    <div id="leaderboard">
      <h3>&#127942; Top Players</h3>
      <div id="lbRows"></div>
    </div>
  </div>
</div>
<canvas id="minimap" width="250" height="250"></canvas>
<div id="achPopup">
  <div class="pop-icon" id="popIcon"></div>
  <div class="pop-text">
    <div class="pop-label">Achievement Unlocked!</div>
    <h4 id="popName"></h4>
    <p id="popDesc"></p>
  </div>
</div>
<div id="deathScreen">
  <div class="death-card">
    <h2>GAME OVER</h2>
    <p class="death-sub" id="deathSub">You were eliminated!</p>
    <div class="death-stats">
      <div class="death-stat"><span class="ds-val" id="dsBestTerritory">0%</span><span class="ds-label">Best Territory</span></div>
      <div class="death-stat"><span class="ds-val" id="dsKills">0</span><span class="ds-label">Kills</span></div>
      <div class="death-stat"><span class="ds-val" id="dsTime">0:00</span><span class="ds-label">Survived</span></div>
    </div>
    <div class="death-new-ach" id="deathNewAch" style="display:none">
      <h4>&#127942; New Achievements</h4>
      <div id="deathAchBadges"></div>
    </div>
    <div class="death-buttons">
      <button class="btn-again" id="btnPlayAgain">&#9654; Play Again</button>
      <button class="btn-home-death" id="btnGoHome">&#8962; Home</button>
    </div>
  </div>
</div>
<script>
// ===== SKINS =====
const SKINS = [
  {name:'Crimson', fill:'rgba(220,50,50,0.28)', stroke:'#e03232', dot:'#e03232', light:'rgba(220,50,50,0.12)'},
  {name:'Ocean',   fill:'rgba(30,144,255,0.28)', stroke:'#1e90ff', dot:'#1e90ff', light:'rgba(30,144,255,0.12)'},
  {name:'Forest',  fill:'rgba(34,180,34,0.28)', stroke:'#22b422', dot:'#22b422', light:'rgba(34,180,34,0.12)'},
  {name:'Galaxy',  fill:'rgba(160,0,255,0.28)', stroke:'#a000ff', dot:'#a000ff', light:'rgba(160,0,255,0.12)'},
  {name:'Candy',   fill:'rgba(255,80,180,0.28)', stroke:'#ff50b4', dot:'#ff50b4', light:'rgba(255,80,180,0.12)'},
  {name:'Gold',    fill:'rgba(220,170,0,0.28)', stroke:'#dcaa00', dot:'#dcaa00', light:'rgba(220,170,0,0.12)'},
  {name:'Ice',     fill:'rgba(80,200,240,0.28)', stroke:'#50c8f0', dot:'#50c8f0', light:'rgba(80,200,240,0.12)'},
  {name:'Lava',    fill:'rgba(255,100,0,0.28)', stroke:'#ff6400', dot:'#ff6400', light:'rgba(255,100,0,0.12)'},
];

// Generate a random dark/vivid RGB color for bots (avoid light colors)
function randomBotColor(){
  let r,g,b,brightness;
  do {
    r = Math.floor(Math.random()*200);
    g = Math.floor(Math.random()*200);
    b = Math.floor(Math.random()*200);
    // Ensure at least one channel is vivid
    const maxC = Math.max(r,g,b);
    if(maxC < 80) continue;
    // Perceived brightness: avoid colors that look washed out / too light
    brightness = (r*299 + g*587 + b*114) / 1000;
  } while(brightness > 160 || Math.max(r,g,b) < 80);
  const hex = '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
  return {
    name:'Bot',
    fill:`rgba(${r},${g},${b},0.28)`,
    stroke:hex,
    dot:hex,
    light:`rgba(${r},${g},${b},0.12)`
  };
}

// ===== ACHIEVEMENTS (tiered) =====
const ACHIEVEMENT_TRACKS = [
  {
    id:'territory', icon:'👑', name:'Conqueror',
    tiers:[
      {t:1, req:3,   desc:'Own 3% of the map'},
      {t:2, req:5,   desc:'Own 5% of the map'},
      {t:3, req:10,  desc:'Own 10% of the map'},
      {t:4, req:15,  desc:'Own 15% of the map'},
      {t:5, req:20,  desc:'Own 20% of the map'},
      {t:6, req:25,  desc:'Own 25% of the map'},
      {t:7, req:50,  desc:'Own 50% of the map'},
      {t:8, req:80,  desc:'Own 80% of the map'},
      {t:9, req:100, desc:'Own 100% of the map'},
    ]
  },
  {
    id:'kills', icon:'⚔️', name:'Killer',
    tiers:[
      {t:1, req:1,   desc:'Get 1 kill in a match'},
      {t:2, req:3,   desc:'Get 3 kills in a match'},
      {t:3, req:5,   desc:'Get 5 kills in a match'},
      {t:4, req:10,  desc:'Get 10 kills in a match'},
      {t:5, req:15,  desc:'Get 15 kills in a match'},
      {t:6, req:20,  desc:'Get 20 kills in a match'},
      {t:7, req:30,  desc:'Get 30 kills in a match'},
      {t:8, req:50,  desc:'Get 50 kills in a match'},
      {t:9, req:100, desc:'Get 100 kills in a match'},
    ]
  },
  {
    id:'survive', icon:'⏱️', name:'Survivor',
    tiers:[
      {t:1, req:60,   desc:'Survive 1 minute'},
      {t:2, req:180,  desc:'Survive 3 minutes'},
      {t:3, req:300,  desc:'Survive 5 minutes'},
      {t:4, req:600,  desc:'Survive 10 minutes'},
      {t:5, req:900,  desc:'Survive 15 minutes'},
      {t:6, req:1200, desc:'Survive 20 minutes'},
      {t:7, req:1500, desc:'Survive 25 minutes'},
      {t:8, req:1800, desc:'Survive 30 minutes'},
      {t:9, req:2700, desc:'Survive 45 minutes'},
    ]
  },
];

const TIER_NAMES=['','I','II','III','IV','V','VI','VII','VIII','IX'];
const TIER_COLORS=['','#cd7f32','#c07830','#aaaaaa','#888888','#ffd700','#ffb700','#a0d8ef','#b9f2ff','#ff6bff'];

function getAchState(){
  try{return JSON.parse(localStorage.getItem('paperio_ach3')||'{}');}catch(e){return {};}
}
function saveAchState(s){localStorage.setItem('paperio_ach3',JSON.stringify(s));}
function getTrackTier(trackId){ return getAchState()[trackId]||0; }
function setTrackTier(trackId,tier){
  const s=getAchState();
  if((s[trackId]||0)>=tier)return false;
  s[trackId]=tier; saveAchState(s); return true;
}

// Per-session tracking
let sessionKills=0, sessionStartTime=0, sessionDeathFreeStart=0;

function checkAchievements(human,elapsed,loopTime){
  const pct=human.territoryPct;
  // Territory
  for(const tier of ACHIEVEMENT_TRACKS[0].tiers){
    if(pct>=tier.req&&setTrackTier('territory',tier.t))
      queueAchPopup(ACHIEVEMENT_TRACKS[0],tier);
  }
  // Kills
  for(const tier of ACHIEVEMENT_TRACKS[1].tiers){
    if(sessionKills>=tier.req&&setTrackTier('kills',tier.t))
      queueAchPopup(ACHIEVEMENT_TRACKS[1],tier);
  }
  // Survive
  for(const tier of ACHIEVEMENT_TRACKS[2].tiers){
    if(elapsed>=tier.req&&setTrackTier('survive',tier.t))
      queueAchPopup(ACHIEVEMENT_TRACKS[2],tier);
  }
}

// Achievement popup — slides down from top, auto-hides
let achQueue=[], achShowing=false;
function queueAchPopup(track,tier){
  newAchs.push({icon:track.icon,name:track.name+' '+TIER_NAMES[tier.t]});
  achQueue.push({track,tier});
  if(!achShowing) nextAchPopup();
}
function nextAchPopup(){
  if(!achQueue.length){achShowing=false;return;}
  achShowing=true;
  const {track,tier}=achQueue.shift();
  const col=TIER_COLORS[tier.t];
  document.getElementById('popIcon').textContent=track.icon;
  document.getElementById('popName').textContent=`${track.name} ${TIER_NAMES[tier.t]}`;
  document.getElementById('popName').style.color=col;
  document.getElementById('popDesc').textContent=tier.desc;
  achPopup.classList.add('show');
  setTimeout(()=>{
    achPopup.classList.remove('show');
    setTimeout(nextAchPopup,500);
  },2800);
}

function buildAchList(){
  const el=document.getElementById('achList');
  el.innerHTML='';
  for(const track of ACHIEVEMENT_TRACKS){
    const cur=getTrackTier(track.id);
    const wrap=document.createElement('div');
    wrap.style.cssText='margin-bottom:20px;';
    wrap.innerHTML=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
      <span style="font-size:22px">${track.icon}</span>
      <span style="font-size:15px;font-weight:700;color:#fff">${track.name}</span>
      <span style="font-size:12px;color:${cur>0?TIER_COLORS[cur]:'#555'};margin-left:4px">${cur>0?'Tier '+TIER_NAMES[cur]+' unlocked':'Locked'}</span>
    </div>`;
    const row=document.createElement('div');
    row.style.cssText='display:flex;gap:5px;flex-wrap:wrap;';
    for(const tier of track.tiers){
      const done=cur>=tier.t;
      const pip=document.createElement('div');
      pip.title=tier.desc;
      pip.style.cssText=`width:30px;height:30px;border-radius:50%;border:2px solid ${done?TIER_COLORS[tier.t]:'#444'};background:${done?TIER_COLORS[tier.t]+'44':'transparent'};display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:${done?TIER_COLORS[tier.t]:'#555'};`;
      pip.textContent=TIER_NAMES[tier.t];
      row.appendChild(pip);
    }
    wrap.appendChild(row);
    el.appendChild(wrap);
  }
}

// Legacy stubs
function unlockAch(){}
const ACHIEVEMENTS_DEF=[];
const ACH_ICONS={};

// ===== NAMES =====
const ADJS = ['Swift','Neon','Crimson','Shadow','Blazing','Frozen','Toxic','Cosmic','Hyper','Stealth','Turbo','Phantom','Rogue','Savage','Venom','Cyber','Lunar','Solar','Storm','Void','Rusty','Slick','Grim','Jolly','Sneaky'];
const NOUNS = ['Fox','Shark','Bear','Wolf','Eagle','Tiger','Cobra','Hawk','Viper','Panther','Dragon','Falcon','Lynx','Raven','Puma','Jaguar','Manta','Hydra','Phoenix','Titan','Otter','Gecko','Moose','Dingo','Ferret'];
function randomName(){return ADJS[Math.random()*ADJS.length|0]+NOUNS[Math.random()*NOUNS.length|0];}

// ===== STORAGE =====
function loadSave(){try{return JSON.parse(localStorage.getItem('paperio2')||'{}');}catch(e){return {};}}
function writeSave(d){localStorage.setItem('paperio2',JSON.stringify(d));}
function getRecords(){return loadSave().records||{territory:0,kills:0,survival:0};}
function saveRecords(r){const d=loadSave();d.records=r;writeSave(d);}
function getAchs(){return loadSave().achievements||[];}
function saveAchs(a){const d=loadSave();d.achievements=a;writeSave(d);}

// ===== DOM =====
const homeScreen=document.getElementById('homeScreen');
const gameScreen=document.getElementById('gameScreen');
const deathScreen=document.getElementById('deathScreen');
const achPanel=document.getElementById('achievementsPanel');
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
const nameInput=document.getElementById('nameInput');
const skinGridEl=document.getElementById('skinGrid');
const lbRows=document.getElementById('lbRows');
const statTerritory=document.getElementById('statTerritory');
const statKills=document.getElementById('statKills');
const statTime=document.getElementById('statTime');
const achPopup=document.getElementById('achPopup');
const popIcon=document.getElementById('popIcon');
const popName=document.getElementById('popName');
const popDesc=document.getElementById('popDesc');

// ===== HOME SETUP =====
let selectedSkin=0;
function buildSkins(){
  skinGridEl.innerHTML='';
  SKINS.forEach((s,i)=>{
    const d=document.createElement('div');
    d.className='skin-swatch'+(i===selectedSkin?' selected':'');

  else if (k === 'ArrowLeft' || k === 'a' || k === 'A') d = 2;
  else if (k === 'ArrowUp' || k === 'w' || k === 'W') d = 3;
  if (d >= 0) { if (homeScreen.style.display === 'none') e.preventDefault(); pushDir(d); }
  if (k === ' ' && homeScreen.style.display === 'none') e.preventDefault();
});
let tsx = 0, tsy = 0;
canvas.addEventListener('touchstart', e => { const t = e.touches[0]; tsx = t.clientX; tsy = t.clientY; }, { passive: true });
canvas.addEventListener('touchmove', e => {
  const t = e.touches[0], dx = t.clientX - tsx, dy = t.clientY - tsy;
  if (Math.abs(dx) > 24 || Math.abs(dy) > 24) { pushDir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 0 : 2) : (dy > 0 ? 1 : 3)); tsx = t.clientX; tsy = t.clientY; }
  e.preventDefault();
}, { passive: false });

// =====================================================================
//  HUD
// =====================================================================
function updateHUD(elapsed) {
  const h = humanPlayer();
  if (!h || !h.alive) { statTerritory.textContent = '—'; statKills.textContent = '—'; statTime.textContent = '—'; return; }
  statTerritory.textContent = h.territoryPct.toFixed(1) + '%';
  statKills.textContent = h.kills;
  statTime.textContent = fmtTime(elapsed);
}
function updateLeaderboard() {
  const alive = players.filter(p => p.alive).sort((a, b) => b.territoryPct - a.territoryPct).slice(0, 5);
  let html = '';
  alive.forEach((p, i) => {
    const crown = i === 0 ? '<span style="font-size:13px;margin-right:3px;">&#128081;</span>' : '';
    html += '<div class="lb-row"><span class="lb-rank">' + (i + 1) + '</span><span class="lb-dot" style="background:' + p.skin.dot + '"></span><span class="lb-name' + (p.isHuman ? ' me' : '') + '">' + crown + p.name.replace(/</g, '&lt;') + '</span><span class="lb-pct">' + p.territoryPct.toFixed(1) + '%</span></div>';
  });
  lbRows.innerHTML = html;
}
function renderMinimap() {
  const base = 0xFFF2ECE8;
  for (let i = 0; i < NN; i++) { const o = own[i]; mm32[i] = o ? byId[o].mm32 : base; }
  mmCtx.putImageData(mmImg, 0, 0);
  const h = humanPlayer();
  const f = (h && h.alive) ? h : null;
  if (f) {
    mmCtx.strokeStyle = 'rgba(0,0,0,0.55)'; mmCtx.lineWidth = 2;
    const cp = BASE_CELL * camZoom, vw = innerWidth / cp, vh = innerHeight / cp;
    mmCtx.strokeRect(camX - vw / 2, camY - vh / 2, vw, vh);
    mmCtx.fillStyle = '#fff'; mmCtx.strokeStyle = f.cDark; mmCtx.lineWidth = 3;
    mmCtx.beginPath(); mmCtx.arc(f.vx + 0.5, f.vy + 0.5, 4.5, 0, 6.283); mmCtx.fill(); mmCtx.stroke();
  }
}

// =====================================================================
//  RENDER
// =====================================================================
function rrect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}
function render() {
  const W = canvas.width, H = canvas.height, cp = BASE_CELL * camZoom * DPR;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#394050'; ctx.fillRect(0, 0, W, H);
  const ox = W / 2 - camX * cp, oy = H / 2 - camY * cp;
  ctx.fillStyle = '#f2f4f8'; ctx.fillRect(ox, oy, N * cp, N * cp);
  const x0 = Math.max(0, Math.floor(-ox / cp)), y0 = Math.max(0, Math.floor(-oy / cp));
  const x1 = Math.min(N - 1, Math.floor((W - ox) / cp)), y1 = Math.min(N - 1, Math.floor((H - oy) / cp));

  // territory
  let last = 0;
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const o = own[y * N + x]; if (!o) continue;
    if (o !== last) { ctx.fillStyle = byId[o].cFill; last = o; }
    ctx.fillRect(ox + x * cp, oy + y * cp, cp + 0.6, cp + 0.6);
  }
  // darker lip under the bottom edge of each territory = the little "3D tile" look of the original
  const band = Math.max(2, cp * 0.2); last = 0;
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const i = y * N + x, o = own[i]; if (!o) continue;
    if (y + 1 < N && own[i + N] === o) continue;
    if (o !== last) { ctx.fillStyle = byId[o].cDark; last = o; }
    ctx.fillRect(ox + x * cp, oy + (y + 1) * cp - band, cp + 0.6, band);
  }
  // faint paper grid
  ctx.strokeStyle = 'rgba(0,0,0,0.055)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let x = x0; x <= x1 + 1; x++) { const sx = Math.round(ox + x * cp) + 0.5; ctx.moveTo(sx, Math.max(0, oy)); ctx.lineTo(sx, Math.min(H, oy + N * cp)); }
  for (let y = y0; y <= y1 + 1; y++) { const sy = Math.round(oy + y * cp) + 0.5; ctx.moveTo(Math.max(0, ox), sy); ctx.lineTo(Math.min(W, ox + N * cp), sy); }
  ctx.stroke();

  // trails
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const p of players) {
    if (!p.alive || !p.trail.length) continue;
    ctx.beginPath();
    ctx.moveTo(ox + (p.fromX + 0.5) * cp, oy + (p.fromY + 0.5) * cp);
    for (let k = 0; k < p.trail.length; k++) { const t = p.trail[k]; ctx.lineTo(ox + ((t % N) + 0.5) * cp, oy + (((t / N) | 0) + 0.5) * cp); }
    ctx.lineTo(ox + (p.vx + 0.5) * cp, oy + (p.vy + 0.5) * cp);
    ctx.strokeStyle = p.cTrailD; ctx.lineWidth = cp * 0.66; ctx.stroke();
    ctx.strokeStyle = p.cTrail; ctx.lineWidth = cp * 0.5; ctx.stroke();
  }

  // players
  const s = cp * 0.86;
  for (const p of players) {
    if (!p.alive) continue;
    const hx = ox + (p.vx + 0.5) * cp, hy = oy + (p.vy + 0.5) * cp;
    if (hx < -cp * 3 || hx > W + cp * 3 || hy < -cp * 3 || hy > H + cp * 3) continue;
    ctx.fillStyle = 'rgba(0,0,0,0.22)'; rrect(hx - s / 2 + cp * 0.05, hy - s / 2 + cp * 0.14, s, s, s * 0.28); ctx.fill();
    ctx.fillStyle = p.cDark; rrect(hx - s / 2, hy - s / 2 + cp * 0.06, s, s, s * 0.28); ctx.fill();
    ctx.fillStyle = p.cHead; rrect(hx - s / 2, hy - s / 2, s, s, s * 0.28); ctx.fill();
    const ex = DX[p.dirI], ey = DY[p.dirI], px = -ey, py = ex;
    for (const sd of [-1, 1]) {
      const cx = hx + ex * s * 0.12 + px * s * 0.2 * sd, cy = hy + ey * s * 0.12 + py * s * 0.2 * sd;
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx, cy, s * 0.17, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#1b1b24'; ctx.beginPath(); ctx.arc(cx + ex * s * 0.07, cy + ey * s * 0.07, s * 0.085, 0, 6.283); ctx.fill();
    }
    // name tag
    ctx.font = '700 ' + Math.max(11, cp * 0.4) + 'px "Segoe UI",Arial'; ctx.textAlign = 'center';
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.strokeText(p.name, hx, hy - s * 0.72);
    ctx.fillStyle = '#2a2d38'; ctx.fillText(p.name, hx, hy - s * 0.72);
  }

  // death particles
  for (const q of particles) {
    ctx.globalAlpha = Math.max(0, q.life / q.max); ctx.fillStyle = q.c;
    const sz = cp * 0.22; ctx.fillRect(ox + q.x * cp - sz / 2, oy + q.y * cp - sz / 2, sz, sz);
  }
  ctx.globalAlpha = 1;

  // map border
  ctx.lineWidth = Math.max(4, cp * 0.3); ctx.strokeStyle = '#2a2f3c';
  ctx.strokeRect(ox - ctx.lineWidth / 2, oy - ctx.lineWidth / 2, N * cp + ctx.lineWidth, N * cp + ctx.lineWidth);
}

// =====================================================================
//  MAIN LOOP
// =====================================================================
let lastTs = 0, hudT = 0, lbT = 0, mmT = 0, achT = 0, camTarget = null;
function update(dt) {
  for (const p of players) {
    if (p.alive) advance(p, dt);
    else if (!p.isHuman) { p.respawnT -= dt; if (p.respawnT <= 0) { if (spawnPlayer(p)) { p.name = randomName(); const c = randomBotColor(); p.skin = c; setColors(p); p.plan = null; } else p.respawnT = 1; } }
    p.territoryPct = p.count / NN * 100;
  }
  for (let i = particles.length - 1; i >= 0; i--) { const q = particles[i]; q.life -= dt; q.x += q.dx * dt; q.y += q.dy * dt; q.dx *= 0.96; q.dy *= 0.96; if (q.life <= 0) particles.splice(i, 1); }

  const h = humanPlayer();
  if (h && h.alive && h.territoryPct > h.maxTerritoryPct) h.maxTerritoryPct = h.territoryPct;

  // camera: follow the player; otherwise watch the biggest bot (menu / death screen)
  let f = (h && h.alive) ? h : null;
  if (!f) { if (!camTarget || !camTarget.alive) camTarget = players.filter(p => p.alive).sort((a, b) => b.count - a.count)[0] || null; f = camTarget; }
  if (f) {
    const k = 1 - Math.exp(-dt * (f === h ? 7 : 2.5));
    camX += (f.vx - camX) * k; camY += (f.vy - camY) * k;
    const tz = Math.max(0.62, 1 - f.territoryPct * 0.012);
    camZoom += (tz - camZoom) * (1 - Math.exp(-dt * 1.5));
  }

  const elapsed = (performance.now() - gameStartTime) / 1000;
  hudT -= dt; if (hudT <= 0) { updateHUD(elapsed); hudT = 0.12; }
  lbT -= dt; if (lbT <= 0) { updateLeaderboard(); lbT = 0.35; }
  mmT -= dt; if (mmT <= 0) { if (homeScreen.style.display === 'none') renderMinimap(); mmT = 0.14; }
  achT -= dt; if (achT <= 0) { if (h && h.alive) checkAchievements(h, elapsed, performance.now()); achT = 0.5; }
}
function loop(ts) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, Math.max(0.001, (ts - lastTs) / 1000)); lastTs = ts;
  update(dt); render();
}

// =====================================================================
//  GAME FLOW
// =====================================================================
function sizeCanvas() {
  DPR = Math.min(window.devicePixelRatio || 1, 1.5);
  canvas.width = Math.round(innerWidth * DPR); canvas.height = Math.round(innerHeight * DPR);
  canvas.style.width = innerWidth + 'px'; canvas.style.height = innerHeight + 'px';
}
window.addEventListener('resize', sizeCanvas);

function initWorld() {
  own.fill(0); trl.fill(0);
  players = []; byId = [null]; particles = [];
  for (let i = 0; i < MAX_BOTS; i++) {
    const b = new Player(randomName(), randomBotColor(), false);
    players.push(b);
    if (!spawnPlayer(b)) b.respawnT = 1 + Math.random() * 3;
  }
  // give the bots a little head start so the map already looks lived-in
  for (let t = 0; t < 60 * 12; t++) update(1 / 30);
  particles = [];
}
function respawnHuman(h) {
  deathScreen.classList.remove('active');
  if (!spawnPlayer(h)) { setTimeout(() => respawnHuman(h), 500); return; }
  gameStartTime = performance.now(); sessionKills = 0; newAchs = [];
  camX = h.vx; camY = h.vy;
}
function startGame() {
  homeScreen.style.display = 'none';
  deathScreen.classList.remove('active');
  gameScreen.classList.add('active');
  let h = humanPlayer();
  const nm = nameInput.value.trim() || randomName();
  if (!h) { h = new Player(nm, SKINS[selectedSkin], false); h.isHuman = true; h.speed = PLAYER_SPEED; players.push(h); }
  h.name = nm; h.skin = SKINS[selectedSkin]; setColors(h);
  gameRunning = true;
  if (!h.alive) respawnHuman(h);
}
function endGame() {}
function goHome() {
  deathScreen.classList.remove('active');
  homeScreen.style.display = 'flex';
  gameRunning = false;
  updateRecords(); buildAchList();
}

// ---- music (starts on the first click / key press) ----
let bgMusic = null;
function ensureMusic() {
  if (!bgMusic) { bgMusic = new Audio('paperio_music.mp3'); bgMusic.loop = true; bgMusic.volume = 0.4; }
  if (bgMusic.paused) bgMusic.play().catch(() => {});
}
document.addEventListener('click', () => ensureMusic());
document.addEventListener('keydown', () => ensureMusic());

// ---- boot: the live world runs behind the home screen ----
sizeCanvas();
gameScreen.classList.add('active');
initWorld();
updateRecords();
requestAnimationFrame(loop);

</script>
</body>
</html>
