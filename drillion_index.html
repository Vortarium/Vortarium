 catch(e){if(R!==run)return;tEnd+=Date.now()-pausedAt;grading=false;$('#inp').disabled=false;$('#res').innerHTML='<p class="err">Grader error: '+esc(e.message||e)+'</p>';return}
 if(R!==run)return;
 tEnd+=Date.now()-pausedAt;grading=false;if(gr.tier>=0)return settle(gr,a);
 if(Date.now()>=tEnd)return settle(null);
 $('#inp').disabled=false;$('#inp').select();$('#inp').focus();$('#res').innerHTML='<p class="err">Not a valid answer. Keep guessing!</p>'}

async function settle(gr,a){if(done)return;const R=run;done=true;clearInterval(timer);$('#inp').disabled=true;$('#res').innerHTML='';
 const i=G.i,t=gr?gr.tier:-1,pts=t<0?0:TIERS[t].p,dd=t<0?0:TIERS[t].d,shown=gr&&gr.why&&lev(nz2(a),nz2(gr.why))<=3?gr.why:(a||'');
 G.tiers.push(t);G.pts+=pts;G.dd+=dd;G.ans.push(shown);if(t>=0&&nz2(shown)!=nz2(a)){$('#inp').value=shown;$('#ac').style.display='block'}
 if(t>=0){busy=true;SFX.drill();digTo(G.dd,3200);await sleep(3300);if(R!==run)return;busy=false;SFX.tier(t);pop={t,k:0};if(t>=4)flash=12}else{SFX.miss();await sleep(500);if(R!==run)return}
 $('#kbadge').textContent=`Key ${cur.k} · Q${i+1}/7 · ${G.pts} pts`;
 const go=()=>{document.removeEventListener('keydown',kk);if(R!==run)return;$('#res').innerHTML='';if(++G.i<7)ask();else finish()},kk=e=>{if(R!==run)return document.removeEventListener('keydown',kk);if(e.key=='Enter')go()};
 $('#res').innerHTML=`<div class="ore" style="color:${t<0?'#b9a6c9':ORECOL[t]}">${t<0?'NO ORE':TIERS[t].n.toUpperCase()+' +'+pts}</div><button id="nxt">${G.i<6?'Next question':'See results'}</button>`;$('#nxt').onclick=go;setTimeout(()=>document.addEventListener('keydown',kk),300)}

async function finish(){const cnt={};G.tiers.forEach(t=>{const k=t<0?'cm':'c'+t;cnt[k]=(cnt[k]||0)+1});const b=writeBatch(db),p={tiers:G.tiers,pts:G.pts,dd:G.dd,ans:G.ans};cur.qs.forEach(x=>{if(x.id)b.set(doc(db,'users',uid,'seen',x.id),{at:serverTimestamp(),q:x.q})});
 b.set(doc(db,'users',uid,'plays',cur.k),{...p,at:serverTimestamp()});
 const up={n:increment(1),sum:increment(G.pts)};for(const k in cnt)up[k]=increment(cnt[k]);b.update(doc(db,'questions',cur.k),up);
 b.update(doc(db,'users',uid),{depth:increment(G.dd),score:increment(G.pts),played:increment(1),best:Math.max(me.best||0,G.dd)});
 try{await b.commit()}catch(e){console.error('dig save failed',e);$('#q').textContent='Could not save that dig: '+(e.code||'')+' '+(e.message||'');return}
 try{await setDoc(doc(db,'stats','scores'),{n:increment(1),['b'+Math.min(20,G.pts/40|0)]:increment(1)},{merge:true})}catch(e){console.warn('stats update failed',e)}
 me.depth+=G.dd;me.score+=G.pts;me.played++;me.best=Math.max(me.best||0,G.dd);if(SEEN)cur.qs.forEach(x=>{if(x.id){SEEN.ids.add(x.id);SEEN.texts.push(x.q)}});digTo(0,3000);result(p)}

async function result(p){let st={};try{st=(await getDoc(doc(db,'stats','scores'))).data()||{}}catch(e){}
 const h=Array.from({length:21},(_,i)=>st['b'+i]||0),tot=h.reduce((a,b)=>a+b,0),mb=Math.min(20,p.pts/40|0),pct=tot?Math.round((h.slice(0,mb).reduce((a,b)=>a+b,0)+h[mb]/2)/tot*100):50;
 $('#back').textContent='Menu';$('#q').textContent='Dig complete';$('#ans').style.display='none';
 $('#res').innerHTML=`<div class="card pn"><h2 style="color:var(--hi)">${p.pts} / 840 points</h2>`+p.tiers.map((t,i)=>`<div class="lr" style="width:100%"><img src="${GU[t<0?0:t]}" style="width:30px;${t<0?'opacity:.25':''}" alt=""><span>${esc(p.ans[i]||'(no answer)')}<small>${esc(cur.qs[i].q)}</small></span><em>${t<0?'0':'+'+TIERS[t].p}</em></div>`).join('')
  +`<canvas id="bell" width="672" height="200"></canvas><p>Better than ${pct}% of ${fmt(tot)} games</p>
  <div class="row" style="width:100%">${cur.mode=='inf'?'<button id="next">Next dig</button>':''}<button id="home" class="alt">Menu</button></div></div>`;
 bell(h,p.pts);if($('#next'))$('#next').onclick=()=>start('inf');$('#home').onclick=menu}

function bell(h,pts){const x=$('#bell').getContext('2d'),w=672,ht=200,pad=26,gw=w-2*pad,gh=ht-70,base=ht-34;
 /* true bell curve: normal distribution fit to all scores (mean = center, spread = width, concentration = height) */
 const tot=h.reduce((a,v)=>a+v,0),ctr=i=>i==20?840:i*40+20;
 let mu=420,sd=150;
 if(tot>0){mu=h.reduce((a,v,i)=>a+v*ctr(i),0)/tot;const vr=h.reduce((a,v,i)=>a+v*(ctr(i)-mu)**2,0)/tot-40*40/12;sd=Math.sqrt(Math.max(vr,0))}
 sd=Math.max(sd,35);
 const pdf=s=>Math.exp(-((s-mu)**2)/(2*sd*sd))/(sd*Math.sqrt(2*Math.PI)),mx=1/(35*Math.sqrt(2*Math.PI)),X=s=>pad+s/840*gw,Y=v=>base-v/mx*gh;
 x.clearRect(0,0,w,ht);x.lineJoin='round';x.lineCap='round';
 const pts2=[];for(let s=0;s<=840;s+=4)pts2.push([s,pdf(s)]);
 x.beginPath();x.moveTo(X(0),base);pts2.forEach(([s,v])=>x.lineTo(X(s),Y(v)));x.lineTo(X(840),base);x.closePath();x.fillStyle='rgba(89,216,255,.18)';x.fill();
 x.beginPath();pts2.forEach(([s,v],i)=>i?x.lineTo(X(s),Y(v)):x.moveTo(X(s),Y(v)));x.strokeStyle='#59d8ff';x.lineWidth=4;x.stroke();
 x.beginPath();x.moveTo(pad,base);x.lineTo(w-pad,base);x.strokeStyle='#4a3563';x.lineWidth=2;x.stroke();
 const mp=pad+pts/840*gw;x.setLineDash([8,7]);x.beginPath();x.moveTo(mp,30);x.lineTo(mp,base);x.strokeStyle='#ffc83a';x.lineWidth=3;x.stroke();x.setLineDash([]);
 x.fillStyle='#ffc83a';x.font='700 22px "Share Tech Mono",monospace';x.textAlign=mp>w-60?'right':mp<60?'left':'center';x.fillText('YOU '+pts,mp,22);
 x.fillStyle='#b9a6c9';x.font='20px "Share Tech Mono",monospace';x.textAlign='left';x.fillText('0',pad,ht-6);x.textAlign='center';x.fillText('420',w/2,ht-6);x.textAlign='right';x.fillText('840',w-pad,ht-6)}

async function board(mode='score'){SFX.click();show('lb');$('#lb').innerHTML='<p>Loading...</p>';
 const dep=mode=='depth',s=await getDocs(query(collection(db,'users'),orderBy(dep?'depth':'score','desc'),limit(25)));
 $('#lb').innerHTML=`<h2>${dep?'Depth':'Points'} Leaderboard</h2><div class="row"><button id="tbs" class="${dep?'ghost':'alt'}">Points</button><button id="tbd" class="${dep?'alt':'ghost'}">Depth</button></div><div class="lr" style="color:var(--mu)"><b></b><span>Digger</span><em>${dep?'Total depth · Deepest dig':'Points · Digs'}</em></div>`+s.docs.map((d,i)=>{const u=d.data();return`<div class="lr${d.id==uid?' me':''}"><b>${i+1}</b><span>${esc(u.username)}</span><em>${dep?fmt(u.depth||0)+'m · '+fmt(u.best||0)+'m':fmt(u.score)+' pts · '+fmt(u.played||0)}</em></div>`}).join('')+'<button id="lbback" class="ghost">Menu</button>';
 $('#tbs').onclick=()=>board('score');$('#tbd').onclick=()=>board('depth');
 $('#lbback').onclick=menu}
</script></body></html>
