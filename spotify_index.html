<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spotify</title>
<link rel="icon" type="image/png" href="spotify_favicon.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--g:#1ed760;--bg:#121212;--el:#1a1a1a;--hv:#2a2a2a;--sub:#b3b3b3}
html,body{height:100%}
body{background:#000;color:#fff;font:400 14px/1.4 "Helvetica Neue",Helvetica,Arial,sans-serif;overflow:hidden}
button{background:none;border:0;color:inherit;cursor:pointer;font:inherit}
input{font:inherit}
svg{width:20px;height:20px;fill:currentColor;flex-shrink:0}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#4a4a4a;border-radius:4px}
#app{height:100%;display:grid;grid-template-columns:300px 1fr;grid-template-rows:1fr 84px;gap:8px;padding:8px}
.box{background:var(--bg);border-radius:8px}
#side{display:flex;flex-direction:column;gap:8px;min-height:0}
.nav{padding:8px 12px}
.nav button{display:flex;gap:16px;align-items:center;width:100%;padding:10px 12px;color:var(--sub);font-weight:700;font-size:15px;border-radius:6px}
.nav button:hover,.nav button.on{color:#fff}
#libbox{flex:1;min-height:0;display:flex;flex-direction:column}
.libhead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 8px;color:var(--sub);font-weight:700}
.ib{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--sub)}
.ib:hover{background:var(--hv);color:#fff}
#lib{overflow-y:auto;padding:0 8px 8px;flex:1}
.li{display:flex;gap:12px;align-items:center;padding:8px;border-radius:6px;cursor:pointer}
.li:hover,.li.on{background:var(--hv)}
.li .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{color:var(--sub);font-size:13px}
.art{width:48px;height:48px;border-radius:4px;background:#333;object-fit:cover;display:flex;align-items:center;justify-content:center;color:var(--sub);flex-shrink:0;font-size:20px}
.art.liked{background:linear-gradient(135deg,#450af5,#c4efd9);color:#fff}
#mainbox{overflow-y:auto;position:relative;min-width:0;background:linear-gradient(#2b2b2b,var(--bg) 320px)}
#top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:14px 24px;background:rgba(18,18,18,.6);backdrop-filter:blur(8px)}
.rbtn{width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.6);display:inline-flex;align-items:center;justify-content:center}
.pill{background:#fff;color:#000;font-weight:700;border-radius:500px;padding:10px 28px}
.pill:hover{transform:scale(1.04)}
.pill.green{background:var(--g)}
.ghost{color:var(--sub);font-weight:700;padding:10px 20px}.ghost:hover{color:#fff}
.me{display:flex;gap:8px;align-items:center;background:rgba(0,0,0,.6);border-radius:500px;padding:3px 12px 3px 3px;font-weight:700}
.av{width:28px;height:28px;border-radius:50%;background:#535353;object-fit:cover;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
#main{padding:8px 24px 32px}
h1.g{font-size:30px;margin:8px 0 20px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:24px 0 12px}.sec h2{font-size:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.card{background:var(--el);padding:14px;border-radius:8px;cursor:pointer;position:relative}
.card:hover{background:var(--hv)}
.card .art{width:100%;height:auto;aspect-ratio:1;border-radius:6px;margin-bottom:12px;font-size:40px}
.card .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .s{color:var(--sub);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .pp{position:absolute;right:22px;top:calc(100% - 82px);opacity:0;transition:.2s;width:44px;height:44px;border-radius:50%;background:var(--g);color:#000;display:flex;align-items:center;justify-content:center}
.card:hover .pp{opacity:1;top:calc(100% - 92px)}
.hero{display:flex;gap:24px;align-items:flex-end;padding:16px 0 24px}
.hero .art{width:200px;height:200px;font-size:70px;border-radius:6px;box-shadow:0 4px 60px rgba(0,0,0,.5)}
.hero.u .art,.hero.u .av{border-radius:50%}
.hero h1{font-size:clamp(32px,5vw,72px);line-height:1.05;font-weight:900;margin:6px 0 10px}
.hero small{font-weight:700}
.bar{display:flex;gap:20px;align-items:center;padding:8px 0 20px}
.big{width:56px;height:56px;border-radius:50%;background:var(--g);color:#000;display:flex;align-items:center;justify-content:center}
.big:hover{transform:scale(1.06)}
.big svg{width:26px;height:26px}
.th,.row{display:grid;grid-template-columns:36px 1fr 200px 40px 40px 60px;gap:12px;align-items:center;padding:6px 12px;border-radius:4px}
.th{color:var(--sub);border-bottom:1px solid #2a2a2a;border-radius:0;margin-bottom:6px;font-size:13px}
.row{cursor:pointer}.row:hover{background:rgba(255,255,255,.1)}
.row .n{color:var(--sub);text-align:center}
.row.cur .tt{color:var(--g)}
.row .art{width:40px;height:40px;font-size:16px}
.row .c1{display:flex;gap:12px;align-items:center;min-width:0}
.tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.by{color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.by:hover,.lk a:hover{color:#fff;text-decoration:underline}
.hb{color:var(--sub);opacity:0}.row:hover .hb{opacity:1}.hb.on{opacity:1;color:var(--g)}
.row.nd .tt{opacity:.5}.hb.dl{opacity:1;font-size:16px}
.dur{color:var(--sub);text-align:right}
.empty{color:var(--sub);padding:40px 0;text-align:center}

.pl{display:flex;gap:12px;align-items:center;min-width:0}
.pl .art{width:56px;height:56px}
.pc{display:flex;flex-direction:column;align-items:center;gap:6px}
.ctl{display:flex;gap:16px;align-items:center}
.ctl button{color:var(--sub);display:flex;position:relative;padding:4px}.ctl button:hover{color:#fff}.ctl button.on,.ctl button.on:hover{color:var(--g)}.ctl button.on::after{content:"";position:absolute;left:50%;bottom:-5px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--g)}
.ctl .pp2{padding:0;width:34px;height:34px;border-radius:50%;background:#fff;color:#000;justify-content:center;align-items:center}
.ctl .pp2:hover{transform:scale(1.06);color:#000}
.seek{display:flex;gap:8px;align-items:center;width:100%;max-width:560px;color:var(--sub);font-size:12px}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:2px;background:linear-gradient(90deg,#fff var(--p,0%),#4d4d4d var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;opacity:0}
input[type=range]:hover::-webkit-slider-thumb{opacity:1}
input[type=range]:hover{background:linear-gradient(90deg,var(--g) var(--p,0%),#4d4d4d var(--p,0%))}
.vol{display:flex;justify-content:flex-end;align-items:center;gap:8px;color:var(--sub)}.vol input{flex:none;width:100px}
.menu{position:fixed;z-index:50;background:#282828;border-radius:6px;padding:4px;min-width:200px;box-shadow:0 16px 24px rgba(0,0,0,.5)}
.menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:3px}
.menu button:hover{background:#3e3e3e}.menu hr{border:0;border-top:1px solid #3e3e3e;margin:4px 0}.menu .x{color:#ff6b6b}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:60;display:flex;align-items:center;justify-content:center}
.modal{background:#282828;border-radius:10px;padding:24px;width:min(440px,92vw)}
.modal h2{margin-bottom:16px}
.modal label{display:block;color:var(--sub);font-size:12px;font-weight:700;margin:12px 0 4px}
.modal input,.auth input{width:100%;background:#3e3e3e;border:1px solid transparent;border-radius:4px;color:#fff;padding:10px 12px}
.modal input:focus,.auth input:focus{outline:0;border-color:#fff}
.mb{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#fff;color:#000;font-weight:700;padding:10px 20px;border-radius:6px;z-index:90;display:none}
.authwrap{height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(#222,#000 70%)}
.auth{background:#000;border-radius:10px;padding:48px 40px;width:min(440px,94vw);text-align:center}
.auth svg.logo{width:48px;height:48px;color:var(--g);margin-bottom:12px}
.auth h1{font-size:34px;font-weight:800;margin-bottom:28px;line-height:1.15}
.auth label{display:block;text-align:left;font-weight:700;font-size:13px;margin:14px 0 6px}
.auth .pill{width:100%;margin-top:24px;background:var(--g)}
.auth .err{color:#ff6b6b;margin-top:14px;min-height:18px}
.auth hr{border:0;border-top:1px solid #292929;margin:28px 0 20px}
.auth .sw{color:var(--sub)}.auth .sw button{color:#fff;text-decoration:underline;margin-left:6px}
svg.st{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.art svg{width:42%;height:42%}.hb svg,.hb2 svg{width:18px;height:18px}.menu svg{width:16px;height:16px}
.hb2{color:var(--sub);display:flex}.hb2:hover{color:#fff}.hb2.on,.hb2.on:hover{color:var(--g)}
.ghost{display:inline-flex;align-items:center;gap:8px}.dur svg{width:16px;height:16px;display:inline-block}
.spin{animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.modal label.chk{display:flex;gap:10px;align-items:center;cursor:pointer;font-size:14px;color:#fff;margin-top:18px}.modal input[type=checkbox]{width:18px;height:18px;accent-color:var(--g)}
.li.drop{background:var(--hv);box-shadow:inset 0 0 0 2px var(--g)}.row.ins-b{box-shadow:inset 0 2px 0 var(--g)}.row.ins-a{box-shadow:inset 0 -2px 0 var(--g)}
.card .cdl{position:absolute;top:22px;right:22px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;color:#fff}.card .cdl.on{color:var(--g)}.card.nd .art{opacity:.6}
@media(max-width:800px){#app{grid-template-columns:1fr}#side{display:none}.th,.row{grid-template-columns:30px 1fr 40px 40px 50px}.th span:nth-child(3),.row .by{display:none}#player{grid-template-columns:1fr 1fr}.vol{display:none}}
</style>
</head>

 document.body.appendChild(bg);bg.querySelector("input")?.focus();

  const v=[...bg.querySelectorAll("input")].map(i=>i.type=="file"?i.files:i.type=="checkbox"?i.checked:i.value.trim());

/* ---------- actions ---------- */
function uploadModal(){
 form("Upload songs",[{label:"Audio files or ZIP archives",type:"file",accept:"audio/*,.zip,application/zip",multiple:1},{label:"Or choose a whole folder",type:"file",multiple:1,dir:1},{label:"Title (optional, single song only)"},{label:"Cover image (optional, otherwise the file's own cover is used)",type:"file",accept:"image/*"}],"Upload",async([a,fd,t,c])=>{
  toast("Reading files…",1);
  const all=await expand([...a,...fd]);
  if(!all.length)throw new Error("No audio files found.");
  const keyOf=n=>clean(n).replace(/\.[^.]+$/,"").toLowerCase();
  const seen=new Set(songs.map(x=>x.key||x.title.toLowerCase())),todo=[];let dup=0;
  for(const f of all){const k=keyOf(f.name);if(seen.has(k)){dup++;continue}seen.add(k);todo.push(f)}
  if(!todo.length)throw new Error(`Nothing to upload: ${dup} song${dup>1?"s":""} already exist.`);
  const cv=c[0]?await uploadFile("",c[0],400):{};
  let done=0,fail=0;const prog=()=>toast(`Uploading ${done+fail}/${todo.length}…`,1);prog();
  pool(todo,10,async file=>{
   try{
    if(file.size>30e6)throw new Error("over 30 MB");
    const d=await durOf(file);let cu=cv.url||"";
    if(!cu){const eb=await embeddedCover(file);if(eb)try{cu=(await uploadFile("",eb,400)).url}catch{}}
    const ext=file.name.split(".").pop().toLowerCase(),N=Math.ceil(file.size/CH),r=doc(db,"songs",crypto.randomUUID());
    await setDoc(r,{uuid:r.id,title:clean((todo.length==1&&t)||clean(file.name).replace(/\.[^.]+$/,"")),key:keyOf(file.name),ownerId:me.uid,coverUrl:cu,duration:d,size:file.size,mime:file.type||MIME[ext]||"audio/mpeg",chunkCount:N,ready:false,createdAt:serverTimestamp()});
    for(let i=0;i<N;i+=3)await Promise.all([...Array(Math.min(3,N-i))].map((_,k)=>{const j=i+k;return b64(file.slice(j*CH,(j+1)*CH)).then(data=>setDoc(doc(db,"songs",r.id,"chunks",String(j).padStart(4,"0")),{i:j,data}))}));
    await tx("readwrite",x=>x.put(file,r.id));have.add(r.id);
    await updateDoc(r,{ready:true});done++;
   }catch(e){fail++;console.error(file.name,e)}
   prog();
  }).then(()=>toast(`Uploaded ${done} song${done!=1?"s":""}`+(dup?`, skipped ${dup} duplicate${dup>1?"s":""}`:"")+(fail?`, ${fail} failed`:"")));
 });
}
function editSong(s){
 form("Edit song",[{label:"Title",value:s.title},{label:"Change cover image",type:"file",accept:"image/*"}],"Save",async([t,c])=>{
  if(!t)throw new Error("Title can't be empty.");const d={title:t};
  if(c[0]){const n=await uploadFile(`covers/${me.uid}/${Date.now()}_${c[0].name}`,c[0]);await rm(s.coverPath);d.coverUrl=n.url;d.coverPath=n.path}
  await updateDoc(doc(db,"songs",s.id),d);toast("Saved");
 });
}
async function delSong(s){
 if(!confirm(`Delete "${s.title}" for everyone?`))return;
 if(queue[qi]==s.id){audio.pause();audio.removeAttribute("src");queue=[];qi=-1}
 const cs=await getDocs(collection(db,"songs",s.id,"chunks"));await Promise.all(cs.docs.map(d=>deleteDoc(d.ref)));await deleteDoc(doc(db,"songs",s.id));await tx("readwrite",x=>x.delete(s.id));have.delete(s.id);playerUI();toast("Song deleted");
}
function newPlaylist(addId){
 form("Create playlist",[{label:"Name",value:"My playlist #"+(pls.filter(p=>p.ownerId==me.uid).length+1)},{label:"Description (optional)"},{label:"Cover image (optional)",type:"file",accept:"image/*"},{label:"Make this playlist public (anyone can open it)",type:"check"}],"Create",async([n,dsc,c,pub])=>{
  if(!n)throw new Error("Give it a name.");
  const cv=c[0]?await uploadFile("",c[0],400):{url:""},id=crypto.randomUUID();
  const d={uuid:id,name:n,description:dsc,public:!!pub,ownerId:me.uid,songIds:addId?[addId]:[],coverUrl:cv.url,coverPath:"",createdAt:serverTimestamp()};
  pls.unshift({id,...d,createdAt:null});renderSide();
  try{await setDoc(doc(db,"users",me.uid,"playlists",id),d);if(d.public)await setDoc(doc(db,"public_playlists",id),d)}catch(e){pls=pls.filter(p=>p.id!=id);renderSide();render();throw e}
  go({t:"pl",id});
 });
}
function editPl(p){
 form("Edit playlist",[{label:"Name",value:p.name},{label:"Description",value:p.description||""},{label:"Change cover image",type:"file",accept:"image/*"},{label:"Public (anyone can open it)",type:"check",value:!!p.public}],"Save",async([n,dsc,c,pub])=>{
  if(!n)throw new Error("Name can't be empty.");const d={name:n,description:dsc,public:pub};
  if(c[0])d.coverUrl=(await uploadFile("",c[0],400)).url;
  await plUpdate(p,d);
 });
}
async function plUpdate(p,d){
 const np={...p,...d};
 await updateDoc(doc(db,"users",me.uid,"playlists",p.id),d);
 const m=doc(db,"public_playlists",p.id);
 if(np.public){const{id,...x}=np;await setDoc(m,x)}else if(p.public)await deleteDoc(m).catch(()=>{});
}
async function delPl(p){if(!confirm(`Delete playlist "${p.name}"?`))return;await rm(p.coverPath);await deleteDoc(doc(db,"users",me.uid,"playlists",p.id));if(p.public)await deleteDoc(doc(db,"public_playlists",p.id)).catch(()=>{});if(view.id==p.id){view={t:"home"};hist=[]}toast("Playlist deleted")}
function toggleLike(id){const r=doc(db,"users",me.uid,"likes",id);likes.has(id)?deleteDoc(r):setDoc(r,{at:serverTimestamp()})}
function editProfile(){
 const u=users[me.uid];
 form("Edit profile",[{label:"Display name",value:u.displayName},{label:"Profile picture",type:"file",accept:"image/*"}],"Save",async([n,p])=>{
  if(!n)throw new Error("Display name can't be empty.");const d={displayName:n};
  if(p[0]){const f=await uploadFile(`avatars/${me.uid}/${Date.now()}_${p[0].name}`,p[0]);d.photoUrl=f.url}
  await updateDoc(doc(db,"users",me.uid),d);toast("Profile updated");
 });
}
function changePw(){
 form("Change password",[{label:"Current password",type:"password"},{label:"New password (6+ characters)",type:"password"}],"Update",async([c,n])=>{
  if(n.length<6)throw new Error("New password must be at least 6 characters.");
  try{await reauthenticateWithCredential(me,EmailAuthProvider.credential(me.email,c));await updatePassword(me,n)}
  catch(x){throw new Error(x.code?.includes("credential")||x.code?.includes("password")?"Current password is incorrect.":x.message)}
  toast("Password updated");
 });
}

/* ---------- drag and drop ---------- */
const clr=()=>document.querySelectorAll(".ins-a,.ins-b,.drop").forEach(x=>x.classList.remove("ins-a","ins-b","drop"));
const ownView=()=>view.t=="pl"&&pls.find(p=>p.id==view.id)?.ownerId==me?.uid;
document.addEventListener("dragstart",e=>{const r=e.target.closest?.(".row,[data-song]");if(!r||!built)return;const id=r.dataset.id||r.dataset.song;e.dataTransfer.setData("text/song",id);e.dataTransfer.setData("text/plain",id);e.dataTransfer.effectAllowed="copyMove"});
document.addEventListener("dragend",clr);
document.addEventListener("dragover",e=>{if(!built||!e.dataTransfer.types.includes("text/song"))return;const li=e.target.closest(".li[data-k]"),row=e.target.closest(".row");clr();
 if(li){e.preventDefault();li.classList.add("drop")}
 else if(row&&ownView()){e.preventDefault();const r=row.getBoundingClientRect();row.classList.add(e.clientY>r.top+r.height/2?"ins-a":"ins-b")}});
document.addEventListener("drop",async e=>{if(!built)return;const sid=e.dataTransfer.getData("text/song");if(!sid)return;
 const li=e.target.closest(".li[data-k]"),row=e.target.closest(".row"),after=row&&e.clientY>row.getBoundingClientRect().top+row.offsetHeight/2;clr();
 try{
  if(li){e.preventDefault();
   if(li.dataset.k=="liked"){if(!likes.has(sid))toggleLike(sid);return toast("Saved to Liked Songs")}
   const p=pls.find(x=>x.id==li.dataset.id);if(!p)return;const ids=p.songIds||[];
   if(ids.includes(sid))return toast("Already in "+p.name);
   await plUpdate(p,{songIds:[...ids,sid]});toast("Added to "+p.name)}
  else if(row&&ownView()){e.preventDefault();
   const p=pls.find(x=>x.id==view.id),ids=shown.map(x=>x.id);let to=+row.dataset.i+(after?1:0);
   const from=ids.indexOf(sid);if(from>-1){ids.splice(from,1);if(from<to)to--}
   ids.splice(to,0,sid);await plUpdate(p,{songIds:ids})}
 }catch(x){toast(fsMsg(x))}
});

/* ---------- player ---------- */
let pt;const savePrefs=()=>{clearTimeout(pt);pt=setTimeout(()=>updateDoc(doc(db,"users",me.uid),{prefs:{shuffle,repeat,vol:audio.volume}}).catch(()=>{}),600)};
function playFrom(list,i){const s=list[i];if(!s)return;if(!have.has(s.id))return toast("Download this song first (⇩)");queue=list.filter(x=>have.has(x.id)).map(x=>x.id);qi=queue.indexOf(s.id);loadCur()}
function playFirst(l){const d=l.filter(s=>have.has(s.id));d.length?playFrom(d,0):toast("Download songs first (⇩)")}
let cur=null;
async function loadCur(){const s=song(queue[qi]);if(!s)return;const b=await tx("readonly",x=>x.get(s.id));if(!b){have.delete(s.id);render();return toast("Local copy missing. Download it again.")}
 if(cur)URL.revokeObjectURL(cur);cur=URL.createObjectURL(b);audio.src=cur;audio.play().catch(()=>{});playerUI();markPlaying()}
async function download(id,quiet){const s=song(id);if(!s||have.has(id)||dling.has(id))return;dling.add(id);render();
 try{const q=await getDocs(collection(db,"songs",id,"chunks")),p=q.docs.map(d=>d.data()).sort((a,b)=>a.i-b.i);
  if(p.length!=s.chunkCount)throw new Error("song data is incomplete");
  const parts=p.map(c=>{const t=atob(c.data),u=new Uint8Array(t.length);for(let k=0;k<t.length;k++)u[k]=t.charCodeAt(k);return u});
  await tx("readwrite",x=>x.put(new Blob(parts,{type:s.mime}),id));have.add(id);quiet||toast("Downloaded "+s.title)}
 catch(e){toast("Download failed: "+e.message)}finally{dling.delete(id);render()}}
async function downloadAll(l){const t=l.filter(s=>!have.has(s.id));if(!t.length)return toast("Everything here is already downloaded");
 for(let k=0;k<t.length;k++){toast(`Downloading ${k+1}/${t.length}…`);await download(t[k].id,1)}toast("Downloaded "+t.length+" songs")}
async function undownload(id){await tx("readwrite",x=>x.delete(id));have.delete(id);if(queue[qi]==id)audio.pause();render();toast("Removed from this device")}
function next(auto){
 if(!queue.length)return;
 if(auto&&repeat==2){audio.currentTime=0;return audio.play()}
 if(shuffle&&queue.length>1){let n;do n=Math.floor(Math.random()*queue.length);while(n==qi);qi=n}
 else if(qi+1<queue.length)qi++;
 else if(repeat==1)qi=0;
 else if(auto){audio.pause();return playerUI()}
 else qi=0;
 loadCur();
}
function prev(){if(audio.currentTime>3||qi<=0){audio.currentTime=0}else{qi--;loadCur()}}
function markPlaying(){document.querySelectorAll(".row").forEach(r=>r.classList.toggle("cur",r.dataset.id==queue[qi]))}
function playerUI(){
 if(!built)return;const s=song(queue[qi]);
 $("#pl").innerHTML=s?`${art(s.coverUrl)}<div style="min-width:0"><div class="tt">${esc(s.title)}</div><div class="by" data-pu="${s.ownerId}" style="cursor:pointer;font-size:12px">${esc(uname(s.ownerId))}</div></div><button class="hb2 ${likes.has(s.id)?"on":""}" data-pl-like="${s.id}">${heart(likes.has(s.id))}</button>`:`<span style="color:#b3b3b3">Pick a song to start listening</span>`;
 $("#pl").onclick=e=>{const l=e.target.closest("[data-pl-like]");if(l)return toggleLike(l.dataset.plLike);const u=e.target.closest("[data-pu]");if(u)go({t:"user",id:u.dataset.pu})};
 $("#bpp").innerHTML=audio.paused?I.play:I.pause;
 $("#bsh").classList.toggle("on",shuffle);$("#brp").classList.toggle("on",repeat>0);$("#brp").title=["Repeat","Repeat all","Repeat one"][repeat];$("#brp").innerHTML=repeat==2?I.rep1:I.rep;
 markPlaying();
}
document.addEventListener("keydown",e=>{if(e.code=="Space"&&!/INPUT|TEXTAREA/.test(e.target.tagName)&&audio.src){e.preventDefault();audio.paused?audio.play():audio.pause()}});
</script>
