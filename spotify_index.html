<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--g:#1ed760;--g2:#3be477;--bg:#121212;--el:#1f1f1f;--el2:#181818;--hv:#2a2a2a;--sub:#b3b3b3;--line:#2a2a2a;--hc:#535353;--lw:300px;--rw:360px;
--f:"SpotSans",CircularSp,Circular,"Helvetica Neue",Helvetica,Arial,sans-serif}
html,body{height:100%}
body{background:#000;color:#fff;font:400 14px/1.4 var(--f);overflow:hidden;-webkit-font-smoothing:antialiased}
button{background:none;border:0;color:inherit;cursor:pointer;font:inherit}
input,textarea,select{font:inherit}
svg{width:20px;height:20px;fill:currentColor;flex-shrink:0}
svg.st{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
::-webkit-scrollbar{width:12px;height:12px}::-webkit-scrollbar-thumb{background:transparent;border-radius:6px;border:3px solid transparent;background-clip:padding-box}
*:hover::-webkit-scrollbar-thumb{background:rgba(255,255,255,.3);background-clip:padding-box;border:3px solid transparent}
::-webkit-scrollbar-track{background:transparent}
a{color:inherit;text-decoration:none}

/* ---- shell ---- */
#app{height:100%;display:grid;grid-template-columns:var(--lw) minmax(0,1fr) var(--rw);grid-template-rows:64px minmax(0,1fr) 72px;grid-template-areas:"top top top" "side main right" "player player player";gap:8px;padding:0 8px 8px;transition:grid-template-columns .2s}
#app.nopanel{--rw:0px}#app.nopanel #right{display:none}#app.nopanel #mainbox{margin-right:-8px}
#app.wide{--lw:420px}
.box{background:var(--bg);border-radius:8px;min-height:0;min-width:0}

/* ---- top bar ---- */
#topbar{grid-area:top;display:grid;grid-template-columns:1fr minmax(0,auto) 1fr;align-items:center;gap:8px;padding:0 4px}
#topbar .l{display:flex;align-items:center;gap:10px}
#topbar .logo{width:32px;height:32px;color:#fff;margin:0 6px 0 4px}
.nv{width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.7);display:inline-flex;align-items:center;justify-content:center;color:#fff}
.nv:disabled{opacity:.4;cursor:default}
.nv:not(:disabled):hover{background:#1a1a1a}
#topbar .c{display:flex;align-items:center;gap:8px}
#homebtn{width:48px;height:48px;border-radius:50%;background:var(--el);display:flex;align-items:center;justify-content:center;color:var(--sub)}
#homebtn:hover{background:var(--hv);transform:scale(1.04);color:#fff}#homebtn.on{color:#fff}
.sbox{display:flex;align-items:center;gap:10px;width:min(474px,38vw);min-width:220px;height:48px;background:var(--el);border-radius:500px;padding:0 6px 0 14px;border:2px solid transparent;color:var(--sub)}
.sbox:hover{background:var(--hv)}.sbox:focus-within{border-color:#fff;background:var(--hv);color:#fff}
.sbox input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font-size:15px;height:100%}
.sbox input::placeholder{color:#a7a7a7}
.sbox .sep{width:1px;height:24px;background:#4d4d4d;margin:0 2px}
.sbox button{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--sub)}.sbox button:hover{color:#fff}
#topbar .r{display:flex;align-items:center;justify-content:flex-end;gap:14px}
.pill{background:#fff;color:#000;font-weight:700;border-radius:500px;padding:10px 24px;font-size:14px;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.pill:hover:not(:disabled){transform:scale(1.04);background:#f6f6f6}.pill:active:not(:disabled){transform:scale(1)}.pill:disabled{opacity:.5;cursor:default}
.pill.green{background:var(--g)}.pill.green:hover:not(:disabled){background:var(--g2)}
.pill.dark{background:#2a2a2a;color:#fff}.pill.dark:hover:not(:disabled){background:#3a3a3a}
.pill.sm{padding:7px 16px}
.ghost{color:var(--sub);font-weight:700;padding:10px 20px;display:inline-flex;align-items:center;gap:8px;border-radius:500px}.ghost:hover{color:#fff;transform:scale(1.04)}
.avbtn{width:48px;height:48px;border-radius:50%;background:var(--el);display:flex;align-items:center;justify-content:center}
.avbtn:hover{transform:scale(1.06);background:var(--hv)}
.avbtn .av{width:32px;height:32px;font-size:14px}
.av{width:28px;height:28px;border-radius:50%;background:#535353;object-fit:cover;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}

/* ---- sidebar ---- */
#side{grid-area:side;display:flex;flex-direction:column;min-height:0}
#libbox{flex:1;min-height:0;display:flex;flex-direction:column}
.libhead{display:flex;justify-content:space-between;align-items:center;padding:14px 8px 4px 20px;color:var(--sub);font-weight:700}
.libhead .tl{display:flex;align-items:center;gap:12px;font-size:16px}
.libhead .tl:hover{color:#fff}
.ib{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--sub);flex-shrink:0}
.ib:hover{background:var(--hv);color:#fff}.ib.on{color:var(--g)}
.ib.lg{width:40px;height:40px}.ib.sm svg{width:16px;height:16px}
.chips{display:flex;gap:8px;padding:8px 16px;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{background:#2a2a2a;border-radius:500px;padding:6px 12px;font-size:13px;white-space:nowrap;font-weight:400}
.chip:hover{background:#333}.chip.on{background:#fff;color:#000}
.libtools{display:flex;align-items:center;justify-content:space-between;padding:2px 12px 4px 14px;color:var(--sub)}
.libtools .sb{display:flex;align-items:center;gap:6px;font-size:13px}.libtools .sb:hover{color:#fff;transform:scale(1.03)}
.libsearch{display:flex;align-items:center;background:#2a2a2a;border-radius:4px;height:32px;padding:0 4px 0 8px;gap:4px;flex:1;margin-right:10px;max-width:200px}
.libsearch input{background:none;border:0;outline:0;color:#fff;flex:1;min-width:0;font-size:13px}
#lib{overflow-y:auto;padding:0 8px 8px;flex:1}
.li{display:flex;gap:12px;align-items:center;padding:8px;border-radius:6px;cursor:pointer}
.li:hover{background:var(--el)}.li.on{background:var(--hv)}
.li .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.li .s{color:var(--sub);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.li .s svg{width:12px;height:12px;color:var(--g)}
.li.playing .t{color:var(--g)}
.li .tx{min-width:0;flex:1}
#app:not(.wide) .li .ex{display:none}
.li .ex{color:var(--sub);font-size:13px;width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.art{width:48px;height:48px;border-radius:4px;background:#282828;object-fit:cover;display:flex;align-items:center;justify-content:center;color:#7f7f7f;flex-shrink:0}
.art svg{width:42%;height:42%}
.art.liked{background:linear-gradient(135deg,#450af5,#8e8ee5);color:#fff}
.art.round{border-radius:50%}

/* ---- main ---- */
#mainbox{grid-area:main;overflow-y:auto;position:relative;min-width:0;background:linear-gradient(180deg,var(--hc) 0,var(--bg) 340px) no-repeat,var(--bg)}
#mainbox.plain{background:linear-gradient(180deg,#2d2d2d 0,var(--bg) 300px) no-repeat,var(--bg)}
#hdr{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:8px;padding:16px 24px 8px;min-height:64px}
#hdr .stick{position:absolute;inset:0;background:var(--hc);opacity:0;pointer-events:none;transition:opacity .15s;filter:brightness(.7)}
#hdr>*{position:relative}
#hdr .hp{opacity:0;transition:opacity .15s;display:flex;align-items:center;gap:14px;margin-left:6px}
#hdr .hp .big{width:48px;height:48px}
#hdr .hp b{font-size:24px}
#mainbox.scrolled #hdr .stick{opacity:1}#mainbox.scrolled #hdr .hp{opacity:1}
#main{padding:0 24px 32px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:28px 0 8px}.sec h2{font-size:24px;font-weight:700;letter-spacing:-.2px}
.sec a,.sec button{color:var(--sub);font-weight:700;font-size:14px}.sec a:hover,.sec button:hover{text-decoration:underline;color:#fff}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;margin:12px 0 4px}
.qt{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden;cursor:pointer;height:56px;position:relative;padding-right:8px}
.qt:hover{background:rgba(255,255,255,.2)}
.qt .art{width:56px;height:56px;border-radius:4px 0 0 4px}
.qt b{font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qt .qp{opacity:0;width:40px;height:40px;border-radius:50%;background:var(--g);color:#000;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 8px rgba(0,0,0,.3);transition:.15s}
.qt:hover .qp{opacity:1}.qt .qp:hover{transform:scale(1.06);background:var(--g2)}
.qt .qp svg{width:16px;height:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px;margin:0 -12px}
.card{padding:12px;border-radius:8px;cursor:pointer;position:relative;background:transparent;transition:background .2s}
.card:hover{background:var(--el)}
.card .art{width:100%;height:auto;aspect-ratio:1;border-radius:6px;margin-bottom:12px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.card .art.round,.card .av.round{border-radius:50%}
.card .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.card .s{color:var(--sub);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.card .pp{position:absolute;right:20px;top:calc(100% - 88px);opacity:0;transition:.2s;width:48px;height:48px;border-radius:50%;background:var(--g);color:#000;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 8px rgba(0,0,0,.3)}
.card:hover .pp{opacity:1;top:calc(100% - 96px)}.card .pp:hover{transform:scale(1.06);background:var(--g2)}
.card .pp svg{width:22px;height:22px}
.hero{display:flex;gap:24px;align-items:flex-end;padding:8px 0 24px;min-height:232px}
.hero .art,.hero .av.big{width:232px;height:232px;font-size:86px;border-radius:4px;box-shadow:0 4px 60px rgba(0,0,0,.5)}
.hero .av.big{border-radius:50%}.hero.u .art{border-radius:50%}
.hero .ty{font-weight:700;font-size:13px}
.hero h1{font-size:clamp(32px,6vw,86px);line-height:1.05;font-weight:900;margin:4px 0 14px;letter-spacing:-2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.hero .meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px}
.hero .meta b{font-weight:700}.hero .meta .av{width:24px;height:24px;font-size:11px}
.hero .meta .dim{color:#ffffffb3}
.hero .ds{color:#ffffffb3;margin-bottom:8px}
.bar{display:flex;gap:22px;align-items:center;padding:16px 0 20px}
.big{width:56px;height:56px;border-radius:50%;background:var(--g);color:#000;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.big:hover{transform:scale(1.06);background:var(--g2)}.big:active{transform:scale(1)}.big svg{width:24px;height:24px}
.bar .ib{width:40px;height:40px}.bar .ib svg{width:30px;height:30px}
.bar .ib.sm2 svg{width:24px;height:24px}
.th,.row{display:grid;grid-template-columns:32px minmax(160px,6fr) minmax(100px,3fr) 96px 56px;gap:16px;align-items:center;padding:0 16px;border-radius:4px}
.th{color:var(--sub);border-bottom:1px solid #ffffff1a;border-radius:0;margin-bottom:8px;font-size:13px;height:36px;position:sticky;top:64px;z-index:4;background:var(--bg);text-transform:none;letter-spacing:.2px}
.th .hn{text-align:center}
.row{height:56px;cursor:pointer;position:relative}
.row:hover{background:rgba(255,255,255,.1)}
.row .n{color:var(--sub);text-align:center;position:relative;height:16px;font-size:16px;display:flex;align-items:center;justify-content:center}
.row .n .rp{display:none;color:#fff}.row .n .rp svg{width:14px;height:14px}
.row:hover .n .num,.row:hover .n .eq{display:none}.row:hover .n .rp{display:flex}
.eq{display:none;gap:2px;align-items:flex-end;height:14px}.eq i{width:3px;background:var(--g);animation:eq 1s ease-in-out infinite;height:30%}.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}.eq i:nth-child(4){animation-delay:-.15s}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}
.row.cur .num{color:var(--g)}.row.cur .tt{color:var(--g)}
.row.cur.playing .num{display:none}.row.cur.playing .eq{display:flex}
.row .art{width:40px;height:40px}
.row .c1{display:flex;gap:12px;align-items:center;min-width:0}
.row .tw{min-width:0}
.tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px;color:#fff}
.by{color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.by .ar:hover,.by .up:hover{color:#fff;text-decoration:underline;cursor:pointer}.by .bl{margin:0 6px;opacity:.9}
.row:hover .by{color:#fff}
.row .da{color:var(--sub);white-space:nowrap}
.row:hover .da{color:#fff}
.row .ac{display:flex;gap:4px;align-items:center;justify-content:flex-end}
.hb{color:var(--sub);display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%}
.hb:hover{color:#fff;transform:scale(1.08)}
.row .hb.like{opacity:0}.row:hover .hb.like,.row .hb.like.on{opacity:1}
.hb.on{color:var(--g)}
.hb svg{width:18px;height:18px}.hb.dl svg{width:20px;height:20px}
.row.nd .tt,.row.nd .art{opacity:.55}
.dur{color:var(--sub);text-align:right;font-variant-numeric:tabular-nums}.dur svg{width:16px;height:16px;display:inline-block}
.row:hover .dur{color:#fff}
.row .ins{display:none}
.row.ins-b{box-shadow:inset 0 2px 0 var(--g)}.row.ins-a{box-shadow:inset 0 -2px 0 var(--g)}
.li.drop{background:var(--hv);box-shadow:inset 0 0 0 2px var(--g)}
.empty{color:var(--sub);padding:56px 0;text-align:center;font-size:16px}
.empty b{display:block;color:#fff;font-size:24px;margin-bottom:8px}
.empty .pill{margin-top:16px}
.card .cdl{position:absolute;top:20px;right:20px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;color:#fff}.card .cdl.on{color:var(--g)}.card.nd .art{opacity:.6}
.card .cdl svg{width:20px;height:20px}
.card .by{white-space:normal}
.about{max-width:560px;margin:8px 0}
.spin{animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}

/* ---- right panel ---- */
#right{grid-area:right;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.rh{display:flex;align-items:center;justify-content:space-between;padding:16px 8px 8px 16px;gap:4px}
.rh .ttl{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;text-align:left}
.rh .ttl.lk:hover{text-decoration:underline}
.rb{overflow-y:auto;flex:1;padding:0 16px 16px}
.npcov{width:100%;aspect-ratio:1;border-radius:8px;object-fit:cover;background:#282828;display:flex;align-items:center;justify-content:center;color:#7f7f7f;box-shadow:0 8px 24px rgba(0,0,0,.5);margin-top:4px}
.npcov svg{width:30%;height:30%}
.npi{display:flex;align-items:center;gap:10px;margin:18px 0 8px}
.npi .tx{flex:1;min-width:0}
.npi .nt{font-size:24px;font-weight:700;line-height:1.2;word-break:break-word}
.npi .nt:hover{text-decoration:underline}
.npi .na{color:var(--sub);font-size:15px;margin-top:2px}
.npi .na span.ar:hover{color:#fff;text-decoration:underline;cursor:pointer}
.npcard{background:var(--el);border-radius:8px;padding:16px;margin-top:16px;position:relative;overflow:hidden}
.npcard h4{font-size:16px;font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.npcard h4 button{font-size:13px;color:var(--sub);font-weight:700}.npcard h4 button:hover{color:#fff;text-decoration:underline}
.npcard.hl{padding:0}.npcard.hl .bgc{height:210px;background-size:cover;background-position:center;position:relative}
.npcard.hl .bgc::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,.1) 40%,var(--el))}
.npcard.hl .bgc h4{position:absolute;left:16px;top:16px;z-index:1;margin:0}
.npcard.hl .inner{padding:0 16px 16px;margin-top:-34px;position:relative;z-index:1}
.npcard .nm{font-weight:700;font-size:16px}.npcard .sm{color:var(--sub);font-size:14px;margin-top:6px}
.cr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}
.cr .a{font-weight:500;cursor:pointer}.cr .a:hover{text-decoration:underline}.cr .r{color:var(--sub);font-size:13px}
.qi{display:flex;align-items:center;gap:12px;padding:6px 8px;border-radius:4px;cursor:pointer;margin:0 -8px}
.qi:hover{background:var(--el)}.qi .art{width:40px;height:40px}.qi .tx{flex:1;min-width:0}.qi .tt{font-size:15px}.qi .by{font-size:13px}
.qi.cur .tt{color:var(--g)}.qi .hb{opacity:0}.qi:hover .hb{opacity:1}
.qh{font-weight:700;font-size:16px;margin:16px 0 6px}
.qh.first{margin-top:4px}
.noplay{color:var(--sub);text-align:center;padding:60px 10px;line-height:1.6}

/* ---- player ---- */
#player{grid-area:player;display:grid;grid-template-columns:minmax(180px,1fr) minmax(300px,722px) minmax(180px,1fr);align-items:center;padding:0 12px;background:#000;border-radius:0;gap:12px}
.pl{display:flex;gap:14px;align-items:center;min-width:0}
.pl .art{width:56px;height:56px;border-radius:4px}
.pl .tx{min-width:0}.pl .tt{font-size:14px}.pl .tt:hover{text-decoration:underline;cursor:pointer}
.pl .by{font-size:12px}
.pc{display:flex;flex-direction:column;align-items:center;gap:8px}
.ctl{display:flex;gap:18px;align-items:center}
.ctl button{color:var(--sub);display:flex;position:relative;padding:4px;align-items:center;justify-content:center}.ctl button:hover{color:#fff;transform:scale(1.06)}
.ctl button.on,.ctl button.on:hover{color:var(--g)}
.ctl button.on::after{content:"";position:absolute;left:50%;bottom:-6px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--g)}
.ctl button svg{width:20px;height:20px}
.ctl .pp2{padding:0;width:32px;height:32px;border-radius:50%;background:#fff;color:#000}
.ctl .pp2:hover{transform:scale(1.06);color:#000}.ctl .pp2 svg{width:16px;height:16px}
.ctl .sk2 svg{width:16px;height:16px}
.seek{display:flex;gap:8px;align-items:center;width:100%;color:var(--sub);font-size:12px;font-variant-numeric:tabular-nums}
.seek span{min-width:40px}.seek span:first-child{text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:12px;background:transparent;cursor:pointer;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,#fff var(--p),#4d4d4d var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;margin-top:-4px;opacity:0;box-shadow:0 2px 4px rgba(0,0,0,.5)}
input[type=range]:hover::-webkit-slider-thumb,input[type=range]:active::-webkit-slider-thumb{opacity:1}
input[type=range]:hover::-webkit-slider-runnable-track{background:linear-gradient(90deg,var(--g) var(--p),#4d4d4d var(--p))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:#4d4d4d}input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:#fff}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:#fff}
.vol{display:flex;justify-content:flex-end;align-items:center;gap:2px;color:var(--sub)}
.vol .ib svg{width:18px;height:18px}.vol input{flex:none;width:96px}
.vol .sp{width:6px}

/* ---- menus / modals ---- */
.menu{position:fixed;z-index:80;background:#282828;border-radius:6px;padding:4px;min-width:210px;box-shadow:0 16px 24px rgba(0,0,0,.5);animation:pop .08s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.97)}}
.menu button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border-radius:3px;font-size:14px;color:#ffffffe6;white-space:nowrap}
.menu button:hover{background:#ffffff1a}.menu hr{border:0;border-top:1px solid #ffffff1a;margin:4px 0}.menu .x{color:#ff7a7a}
.menu button svg{width:16px;height:16px;color:var(--sub)}.menu .x svg{color:#ff7a7a}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .12s}
@keyframes fade{from{opacity:0}}
.modal{background:#282828;border-radius:8px;padding:24px;width:min(524px,100%);max-height:calc(100vh - 32px);overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.6);animation:mpop .15s ease-out}
.modal.xl{width:min(640px,100%)}.modal.sm{width:min(400px,100%)}
@keyframes mpop{from{opacity:0;transform:translateY(8px) scale(.98)}}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.mh h2{font-size:24px;font-weight:700;letter-spacing:-.3px}
.mh .ib{margin-right:-8px}
.mbody{display:grid;grid-template-columns:180px 1fr;gap:16px}
.mbody.one{grid-template-columns:1fr}
.fld{margin-bottom:12px;position:relative}
.fld>label{display:block;font-size:12px;font-weight:700;color:#fff;margin-bottom:6px}
.fld .hint{color:var(--sub);font-size:12px;margin-top:6px}
.fld input[type=text],.fld input[type=password],.fld textarea{width:100%;background:#3e3e3e;border:1px solid transparent;border-radius:4px;color:#fff;padding:10px 12px;outline:0;font-size:14px}
.fld input:hover,.fld textarea:hover{background:#444;border-color:#555}
.fld input:focus,.fld textarea:focus{background:#444;border-color:#fff}
.fld textarea{resize:none;height:96px;font-family:inherit}
.cvr{width:180px;height:180px;border-radius:4px;background:#3e3e3e;position:relative;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#b3b3b3;box-shadow:0 4px 60px rgba(0,0,0,.5)}
.cvr.round{border-radius:50%}
.cvr img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cvr svg{width:56px;height:56px}
.cvr .ov{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;opacity:0;transition:.15s;color:#fff;font-weight:700;font-size:14px;text-align:center}
.cvr:hover .ov,.cvr:focus-visible .ov{opacity:1}.cvr .ov svg{width:40px;height:40px}
.cvx{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;opacity:0;z-index:2}
.cvr:hover .cvx{opacity:1}.cvx svg{width:14px;height:14px}.cvx:hover{background:#000}
.chk{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 0;cursor:pointer}
.chk .tx b{display:block;font-weight:500;font-size:14px}.chk .tx small{color:var(--sub);font-size:12px}
.sw{appearance:none;-webkit-appearance:none;width:40px;height:24px;border-radius:12px;background:#727272;position:relative;cursor:pointer;flex-shrink:0;transition:.15s;outline:0;border:0}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#000;transition:.15s}
.sw:checked{background:var(--g)}.sw:checked::after{left:19px}.sw:focus-visible{box-shadow:0 0 0 2px #fff}
.mf{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:20px}
.mf .pill{padding:12px 32px;font-size:15px}
.mf .msg{flex:1;color:var(--sub);font-size:13px}
.mf .msg.err{color:#ff7a7a}
.chipin{display:flex;flex-wrap:wrap;gap:6px;background:#3e3e3e;border:1px solid transparent;border-radius:4px;padding:6px 8px;min-height:42px;align-items:center;cursor:text}
.chipin:hover{background:#444;border-color:#555}.chipin:focus-within{background:#444;border-color:#fff}
.chipin .cp{display:inline-flex;align-items:center;gap:4px;background:#1f1f1f;border-radius:500px;padding:3px 4px 3px 10px;font-size:13px}
.chipin .cp button{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--sub)}.chipin .cp button:hover{background:#333;color:#fff}
.chipin .cp svg{width:10px;height:10px}
.chipin input{flex:1;min-width:90px;background:none!important;border:0!important;outline:0;color:#fff;padding:4px!important;font-size:14px}
.seg{display:flex;background:#1a1a1a;border-radius:500px;padding:4px;gap:4px;margin-bottom:16px}
.seg button{flex:1;border-radius:500px;padding:9px 12px;font-weight:700;color:var(--sub);display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px}
.seg button:hover{color:#fff}.seg button.on{background:#3e3e3e;color:#fff}
.seg button svg{width:16px;height:16px}
.note{background:#1a1a1a;border-radius:6px;padding:10px 12px;font-size:13px;color:var(--sub);margin-bottom:14px;display:flex;gap:10px;line-height:1.45}
.note svg{width:16px;height:16px;margin-top:2px;color:var(--g)}
.dz{border:2px dashed #5a5a5a;border-radius:8px;padding:22px 16px;text-align:center;color:var(--sub);transition:.15s;margin-bottom:14px}
.dz.over{border-color:var(--g);background:#1ed76012;color:#fff}
.dz>svg{width:36px;height:36px;margin-bottom:6px;color:#fff}
.dz b{display:block;color:#fff;font-size:16px;margin-bottom:2px}
.dz .btns{display:flex;gap:8px;justify-content:center;margin-top:12px}
.dz .fl{margin-top:12px;max-height:104px;overflow:auto;text-align:left;font-size:13px;background:#1a1a1a;border-radius:6px;padding:6px 10px}
.dz .fl div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:2px 0}
.dz .cnt{margin-top:12px;color:#fff;font-weight:700;display:flex;justify-content:center;align-items:center;gap:6px}
.dz .cnt button{color:var(--sub);font-weight:400;text-decoration:underline;font-size:13px}.dz .cnt button:hover{color:#fff}
.prog{height:6px;border-radius:3px;background:#3e3e3e;overflow:hidden;margin:14px 0 6px;display:none}
.prog i{display:block;height:100%;width:0;background:var(--g);transition:width .15s}
.res{display:none;background:#1a1a1a;border-radius:6px;padding:10px 12px;font-size:13px;margin-top:10px;line-height:1.7}
.res b{color:var(--g)}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#fff;color:#000;font-weight:700;padding:12px 24px;border-radius:500px;z-index:120;display:none;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:90vw;text-align:center}

/* ---- auth ---- */
.authwrap{height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(#1f1f1f,#000 60%);padding:16px;overflow:auto}
.auth{background:#121212;border-radius:12px;padding:48px 40px;width:min(464px,100%);text-align:center}
.auth svg.logo{width:44px;height:44px;margin-bottom:18px}
.auth h1{font-size:32px;font-weight:700;margin-bottom:28px;line-height:1.15;letter-spacing:-1px}
.auth label{display:block;text-align:left;font-weight:700;font-size:13px;margin:16px 0 6px}
.auth input{width:100%;background:#121212;border:1px solid #7c7c7c;border-radius:4px;color:#fff;padding:13px 14px;outline:0;font-size:15px}
.auth input:hover{border-color:#fff}.auth input:focus{border-color:#fff;box-shadow:0 0 0 1px #fff}
.auth .pill{width:100%;margin-top:26px;background:var(--g);padding:14px;font-size:16px}
.auth .err{color:#ff7a7a;margin-top:14px;min-height:18px;font-size:14px}
.auth hr{border:0;border-top:1px solid #292929;margin:28px 0 22px}
.auth .sw2{color:var(--sub)}.auth .sw2 button{color:#fff;text-decoration:underline;margin-left:6px;font-weight:700}

/* ---- settings ---- */
.wrap{max-width:640px;margin:0 auto;padding-bottom:40px}.wy{font-size:clamp(96px,22vw,200px);font-weight:900;letter-spacing:-6px;line-height:1;text-align:center;background:linear-gradient(135deg,#1ed760,#7a5cff 60%,#ff5ca8);-webkit-background-clip:text;background-clip:text;color:transparent;padding-top:12px}
.wsub{text-align:center;font-size:22px;font-weight:700;margin:4px 0 22px}.wtot{background:var(--el);border-radius:12px;padding:20px;text-align:center}.wtot b{display:block;font-size:48px;letter-spacing:-1px;color:var(--g)}.wtot span{color:var(--sub)}
.wrow{display:flex;align-items:center;gap:14px;padding:8px 10px;border-radius:8px}.wrow:hover{background:var(--hv)}.wn{width:22px;text-align:center;color:var(--sub);font-weight:700}.wrow .tx{flex:1;min-width:0}.wrow .tx b,.wrow .tx small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.wrow small{color:var(--sub);font-size:13px}.wm{color:var(--sub);font-size:14px;white-space:nowrap}.wart{width:48px;height:48px;border-radius:4px;flex-shrink:0}
.setrow{display:flex;align-items:center;gap:16px;background:var(--el);border-radius:8px;padding:16px;max-width:560px;margin-bottom:12px}
.setrow .tx{flex:1;min-width:0}.setrow .av{width:56px;height:56px;font-size:22px}

@media(max-width:1180px){#app:not(.nopanel){--rw:0px}#app:not(.nopanel) #right{display:none}#app:not(.nopanel) #mainbox{margin-right:-8px}}
@media(max-width:900px){.th,.row{grid-template-columns:32px minmax(0,1fr) 88px 52px}.th .dac,.row .da{display:none}.sbox{width:34vw;min-width:150px}#topbar .r .pill{display:none}}
@media(max-width:720px){#app{grid-template-columns:1fr!important;grid-template-areas:"top" "main" "player"}#side,#right{display:none!important}#player{grid-template-columns:1fr auto}.vol{display:none}.hero .art,.hero .av.big{width:140px;height:140px}.mbody{grid-template-columns:1fr}.cvr{margin:0 auto}}
#ucv .ov span,#plcv .ov span{display:none}#ucv .ov svg,#plcv .ov svg{width:22px;height:22px}#ucv svg,#plcv svg{width:28px;height:28px}#ucv .cvx,#plcv .cvx{top:2px;right:2px;width:20px;height:20px}

/* ---- collapsed library (covers only) ---- */
#app.collapsed{--lw:80px}
#app.collapsed .libhead{justify-content:center;padding:14px 0 8px}
#app.collapsed .libhead .tl{font-size:0;gap:0;justify-content:center;width:100%}
#app.collapsed .libhead>span,#app.collapsed #chips,#app.collapsed #libtools,#app.collapsed .noplay{display:none}
#app.collapsed #lib{padding:0 8px}
#app.collapsed .li{padding:8px 0;justify-content:center}
#app.collapsed .li .tx,#app.collapsed .li .ex{display:none!important}
/* ---- notifications / follow ---- */
.avbtn{position:relative}
.bdg{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;border-radius:9px;background:var(--g);color:#000;font-size:11px;font-weight:700;display:none;align-items:center;justify-content:center;padding:0 4px}
.fbtn{border:1px solid #7c7c7c;border-radius:500px;padding:7px 16px;font-weight:700;color:#fff}
.fbtn:hover{border-color:#fff;transform:scale(1.04)}
.note a{color:var(--g);text-decoration:underline;font-weight:700}
/* ---- now playing panel ---- */
.npcov.sm{width:128px}
.npv{color:var(--sub);font-size:13px;margin-top:4px}
.qh .qa{color:var(--sub);font-size:13px;font-weight:700}.qh .qa:hover{color:#fff;text-decoration:underline}

/* ================= phone layout (html.phone) ================= */
#bnav{display:none}.npctl{display:none}.hb.mo{display:none}
.row[data-top] .tw::after{content:attr(data-v);display:none}
img.npcov{display:block}
html.phone,html.phone body{height:100dvh;overscroll-behavior:none}
html.phone *{-webkit-tap-highlight-color:transparent}
html.phone #app{height:100dvh;padding:0;gap:0;grid-template-columns:minmax(0,1fr)!important;grid-template-rows:calc(56px + env(safe-area-inset-top)) minmax(0,1fr) auto auto;grid-template-areas:"top" "main" "player" "nav"}
html.phone .box{border-radius:0}
html.phone #app #mainbox{grid-area:main;margin-right:0!important}
html.phone #side{grid-area:main;display:none!important}
html.phone #right{display:flex!important;position:fixed;inset:0;z-index:70;background:linear-gradient(180deg,color-mix(in srgb,var(--npc,#3a3a3a) 65%,#000) 0,#121212 78%);padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);border-radius:0;transform:translateY(100%);visibility:hidden;pointer-events:none;will-change:transform;transition:transform .4s cubic-bezier(.32,.72,0,1),visibility 0s linear .4s}
html.phone #app.tablib #side{display:flex!important}
html.phone #app.tablib #mainbox{display:none}
/* top bar */
html.phone #topbar{padding:env(safe-area-inset-top) 12px 0;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;background:#000}
html.phone #topbar .logo,html.phone #fw,html.phone #homebtn,html.phone #brw,html.phone .sbox .sep,html.phone #up2{display:none}
html.phone #bk:disabled{visibility:hidden}
html.phone #topbar .l{gap:0}
html.phone #topbar .c{min-width:0}
html.phone .sbox{width:100%;min-width:0;height:40px;padding:0 6px 0 12px}
html.phone #topbar .r{gap:8px}
html.phone .avbtn{width:40px;height:40px}
html.phone .avbtn .av{width:28px;height:28px}
html.phone input,html.phone textarea{font-size:16px!important}
/* bottom nav */
html.phone #bnav{display:flex;grid-area:nav;background:rgba(0,0,0,.96);padding:6px 4px calc(6px + env(safe-area-inset-bottom));border-top:1px solid #1a1a1a}
html.phone #bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--sub);font-size:11px;font-weight:500;padding:4px 0}
html.phone #bnav button svg{width:24px;height:24px}
html.phone #bnav button.on{color:#fff}
html.phone #bnav button.on svg.st{stroke-width:2.4}
/* mini player */
html.phone #player{position:relative;grid-area:player;display:flex;align-items:center;gap:8px;margin:0 8px 6px;padding:0 8px;height:56px;background:#2a2a2a;border-radius:8px;overflow:hidden}
html.phone #player:has(.pl:empty){display:none}
html.phone .pl{flex:1;min-width:0;gap:10px;cursor:pointer}
html.phone .pl .art{width:40px;height:40px}
html.phone .pc{flex:none}
html.phone .pc .ctl button:not(#bpp):not(#bnx){display:none}
html.phone .ctl{gap:6px}
html.phone .ctl .pp2{width:36px;height:36px;background:transparent;color:#fff}
html.phone .ctl .pp2 svg{width:24px;height:24px}
html.phone .ctl .sk2 svg{width:20px;height:20px}
html.phone .seek{position:absolute;left:8px;right:8px;bottom:0;pointer-events:none;gap:0}
html.phone .seek span{display:none}
html.phone .seek input{height:4px}
html.phone .vol{display:none}
/* content */
html.phone #main{padding:0 16px 24px}
html.phone #hdr{padding:10px 16px 6px;min-height:48px}
html.phone .sec{margin:22px 0 8px}
html.phone .sec h2{font-size:20px}
html.phone .quick{grid-template-columns:repeat(2,minmax(0,1fr))}
html.phone .qt .qp,html.phone .card .pp{display:none}
html.phone .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));margin:0 -8px}
html.phone .card{padding:8px}
html.phone .hero{flex-direction:column;align-items:center;gap:16px;min-height:0;padding:0 0 16px}
html.phone .hero>div:last-child{align-self:stretch}
html.phone .hero .art,html.phone .hero .av.big{width:min(62vw,240px);height:min(62vw,240px);font-size:64px}
html.phone .hero h1{font-size:28px;letter-spacing:-.5px;margin:2px 0 8px}
html.phone .bar{gap:14px;padding:8px 0 12px}
html.phone .big{width:52px;height:52px}
html.phone .th{display:none}
html.phone .row{grid-template-columns:minmax(0,1fr) auto;gap:8px;height:60px;padding:0}
html.phone .row .n,html.phone .row .dur,html.phone .row .da{display:none}
html.phone .row .hb.like{opacity:1}
html.phone .row .hb.mo{display:flex}
html.phone .row:hover{background:none}
html.phone .row[data-top] .tw::after{display:block;color:var(--sub);font-size:12px}
html.phone .row .ac{gap:0}
/* library page */
html.phone .libhead .tl{font-size:24px;color:#fff}
html.phone #wdbtn{display:none}
html.phone .li{padding:8px 4px}
html.phone .li .art{width:56px;height:56px}
html.phone .chip{padding:8px 14px;font-size:14px}
html.phone .ib{width:40px;height:40px}
/* full-screen now playing */
html.phone #app.npopen #right{transform:none;visibility:visible;pointer-events:auto;transition-delay:0s}
html.phone .rh{padding:12px 8px 4px}
html.phone .rh #rhx{order:-1}
html.phone .rh .ttl{text-align:center;font-size:14px}
html.phone .rb{padding:0 24px 24px}
html.phone .npcov{max-width:min(100%,420px);margin:12px auto 0}
html.phone .npcov.sm{max-width:140px}
html.phone .npi .nt{font-size:22px}
html.phone .npctl{display:block;margin:4px 0 12px}
html.phone .npctl .seek{width:100%;font-size:12px}
html.phone .npctl input[type=range]{height:24px}
html.phone .npctl input[type=range]::-webkit-slider-thumb{opacity:1}
html.phone .npctl .ctl{justify-content:space-between;width:100%;padding:6px 4px}
html.phone .npctl .ctl button{display:flex}
html.phone .npctl .ctl button svg{width:26px;height:26px}
html.phone .npctl .ctl .pp2{width:64px;height:64px;background:#fff;color:#000}
html.phone .npctl .ctl .pp2 svg{width:28px;height:28px}
html.phone .npctl .ctl .sk2 svg{width:28px;height:28px}
/* menus, modals, auth */
html.phone .menu button{padding:14px;font-size:16px}
html.phone #toast{bottom:calc(140px + env(safe-area-inset-bottom))}
html.phone .mbg{align-items:flex-end;padding:0}
html.phone .modal{width:100%!important;max-width:none;border-radius:16px 16px 0 0;max-height:92dvh;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
html.phone .mbody{grid-template-columns:1fr}
html.phone #pd{display:none}
html.phone .auth{padding:32px 20px}
html.phone .row,html.phone .card{-webkit-touch-callout:none}

/* ---- select mode, long menus, 3-way upload tabs ---- */
.menu{max-height:min(70vh,440px);overflow-y:auto}
.seg button{padding:9px 8px;font-size:13px;line-height:1.15;text-align:center}
html.phone .seg button svg{display:none}
.ck{width:20px;height:20px;border-radius:4px;border:2px solid #7c7c7c;display:inline-flex;align-items:center;justify-content:center;color:transparent;flex-shrink:0}
.ck svg{width:14px;height:14px;stroke-width:3}
.ck.on{background:var(--g);border-color:var(--g);color:#000}
.row.selected{background:rgba(255,255,255,.14)}
.row.selected .tt{color:var(--g)}
.selm .row .ac{visibility:hidden}
.selbar{position:sticky;bottom:10px;z-index:7;display:flex;align-items:center;gap:8px;margin:16px 0 0;padding:8px 10px;background:rgba(40,40,40,.97);backdrop-filter:blur(12px);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.6);overflow-x:auto;scrollbar-width:none}
.selbar::-webkit-scrollbar{display:none}
.selbar .sc{flex:none;margin:0 6px 0 4px;font-size:14px}
.sb2{flex:none;display:inline-flex;align-items:center;gap:6px;background:#3a3a3a;border-radius:500px;padding:8px 14px;font-size:13px;font-weight:700;color:#fff;white-space:nowrap}
.sb2:hover:not(:disabled){background:#4a4a4a}.sb2:disabled{opacity:.4;cursor:default}.sb2 svg{width:16px;height:16px}.sb2.x{color:#ff7a7a}
html.phone .selm .row{grid-template-columns:28px minmax(0,1fr) auto}
html.phone .selm .row .n{display:flex}

/* ---- explicit badge, report dialog, older notifications ---- */
.xb{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:3px;background:#b3b3b3;color:#000;font-size:11px;font-weight:700;margin-right:6px;vertical-align:middle;flex-shrink:0;line-height:1}
.rd{appearance:none;-webkit-appearance:none;width:20px;height:20px;border-radius:50%;border:2px solid #7c7c7c;flex-shrink:0;cursor:pointer;position:relative;outline:0;background:transparent}
.rd:checked{border-color:var(--g)}.rd:checked::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--g)}
.nrow{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:6px;cursor:pointer;font-size:14px}.nrow:hover{background:#ffffff1a}

/* ---- loading skeletons ---- */
.sk{background:linear-gradient(90deg,#222 25%,#333 50%,#222 75%);background-size:200% 100%;animation:skm 1.2s linear infinite;border-radius:6px}
@keyframes skm{to{background-position:-200% 0}}
.sk.sq{aspect-ratio:1;width:100%;border-radius:8px}
.sk.big{width:200px;height:200px;flex:none}
.skel{padding-top:8px}
.skg{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.skc{display:flex;flex-direction:column;gap:8px;padding:12px}
.skq{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-top:8px}
.skr{display:flex;align-items:center;gap:14px;padding:8px 0}
.skh{display:flex;align-items:flex-end;gap:24px;padding:24px 0}
html.phone .skh{flex-direction:column;align-items:stretch}
html.phone .skh .big{width:min(62vw,240px);height:min(62vw,240px);align-self:center}
html.phone .skg{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
@media(prefers-reduced-motion:reduce){.sk{animation:none}}
/* ---- lyrics ---- */
#right .rb{position:relative}
.lyh{margin:4px 0 14px}.lyh .nt{font-size:20px;font-weight:700}.lyh .na{color:var(--sub);font-size:14px;margin-top:2px}
.lyl{padding-bottom:40vh}
.lyl .ll{font-size:24px;font-weight:700;line-height:1.3;color:#ffffff66;padding:8px 0;cursor:pointer;transition:color .2s}
.lyl .ll:hover{color:#ffffffcc}.lyl .ll.on{color:#fff}
.lyl.plain{font-size:17px;font-weight:500;line-height:1.7;color:#fff;cursor:default}
html.phone .lyl .ll{font-size:22px}

/* phone now playing: blurred cover backdrop, rounded cover, lyrics under it */
.npbg,.npshade{display:none}
html.phone .npbg{display:block;position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;filter:blur(44px) saturate(1.4) brightness(.62);transform:scale(1.6);z-index:0;pointer-events:none}
html.phone .npshade{display:block;position:absolute;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.08) 0,rgba(0,0,0,.32) 55%,rgba(0,0,0,.78) 100%)}
html.phone #right .rh,html.phone #right .rb{position:relative;z-index:1}
html.phone .npcov{border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.55)}
html.phone .npcov.sm{border-radius:12px}
html.phone .lybox{position:relative;max-height:50vh;overflow-y:auto;margin:10px -8px 6px;padding:0 8px;-webkit-overflow-scrolling:touch;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 22px,#000 calc(100% - 22px),transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 22px,#000 calc(100% - 22px),transparent 100%)}
html.phone .lybox .lyl{padding-bottom:22vh}
.npout{display:flex;align-items:center;gap:8px;margin-top:4px}
.npout .ib{width:36px;height:36px;color:#b3b3b3}.npout .ib.on{color:#1ed760}
.npout span{font-size:12px;color:#b3b3b3;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
html.phone #player{z-index:5}
/* the mini-player progress line was also styling the full-screen seek bar (absolute + untouchable); reset it there */
html.phone .npctl .seek{position:static;left:auto;right:auto;bottom:auto;pointer-events:auto;gap:8px}
html.phone .npctl .seek span{display:block}
/* Daily Mix covers */
.dmcov{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;margin-bottom:12px;box-shadow:0 8px 24px rgba(0,0,0,.5);background:#282828}
.dmcov .art{width:100%;height:100%;margin:0;border-radius:0;box-shadow:none;aspect-ratio:auto}
.dmshade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.72) 100%)}
.dmlab{position:absolute;left:12px;bottom:14px;color:#fff;font-weight:900;line-height:1;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.dmlab span{display:block;font-size:clamp(13px,1.6vw,19px)}.dmlab b{display:block;font-size:clamp(24px,3.4vw,40px);margin-top:3px;letter-spacing:-1px}
.dmbar{position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--dc)}
.hero .dmcov{width:232px;height:232px;flex:none;margin:0;border-radius:4px}
.hero .dmcov .art{width:100%;height:100%}
.hero .dmcov .dmlab span{font-size:20px}.hero .dmcov .dmlab b{font-size:46px}
html.phone .hero .dmcov{width:min(62vw,240px);height:min(62vw,240px)}
html.phone .hero .dmcov .art{width:100%;height:100%}
.art.round{object-fit:cover}

async function doUpload(list,o,prog){
 if(!songsFull)throw new Error("Still loading the library, try again in a moment.");
 /* "(#)" files: skip only if a song with the same title (without the number) AND the same artists already exists, here or in this batch */
 const fb=f=>nbT(f.name.replace(/\.[^.]+$/,"")),artOf=async f=>{let t={};try{t=await readTags(f)||{}}catch{}return aKeyOf(buildArtists(f.name,t,o.artists))},drop=new Set(),dn=list.filter(f=>DUPN.test(clean(f.name)));
 if(dn.length){const have=new Set(songs.map(x=>nbT(x.title)+"|"+aKeyOf(sArtOf(x)))),bases=new Set(dn.map(fb));
  for(const f of list)if(!DUPN.test(clean(f.name))&&bases.has(fb(f)))have.add(fb(f)+"|"+await artOf(f));
  for(const f of dn){const k=fb(f)+"|"+await artOf(f);if(have.has(k))drop.add(f);else have.add(k)}
  list=list.filter(f=>!drop.has(f))}
 const seen=new Set(songs.map(x=>x.key||x.title.toLowerCase())),todo=[],byKey=new Map(songs.map(x=>[x.key||x.title.toLowerCase(),x.id])),idOf=new Map();let dup=drop.size;
 for(const f of list){const k=keyOf(f.name);if(seen.has(k)){dup++;if(byKey.has(k))idOf.set(f,byKey.get(k));continue}seen.add(k);todo.push(f)}
 if(!todo.length&&!(o.keepDups&&idOf.size))throw new Error(`Nothing to upload: ${dup} song${dup>1?"s":""} already exist.`);
 const cv=o.cover?await uploadFile("",o.cover,400):{};
 let done=0,fail=0,n=0;if(todo.length)prog(0,todo.length);
 await pool(todo,16,async file=>{
  try{
   if(file.size>30e6)throw new Error("over 30 MB");
   const [d,tags]=await Promise.all([durOf(file),readTags(file)]);let cu=cv.url||"";
   if(!cu&&tags.pic)try{cu=(await uploadFile("",tags.pic,400)).url}catch{}
   const artists=buildArtists(file.name,tags,o.artists);
   const ext=file.name.split(".").pop().toLowerCase(),N=Math.ceil(file.size/CH),r=doc(db,"songs",crypto.randomUUID());
   await setDoc(r,{uuid:r.id,title:clean((todo.length==1&&o.title)||clean(file.name).replace(/\.[^.]+$/,"")),key:keyOf(file.name),ownerId:o.asUid||me.uid,artists,artist:artists.join(", "),explicit:!!o.explicit,coverUrl:cu,duration:d,size:file.size,mime:file.type||MIME[ext]||"audio/mpeg",chunkCount:N,ready:false,createdAt:serverTimestamp()});
   /* chunks go up 3 per request, every request in parallel (16 in flight across all files); the last request also flips ready:true once the rest have landed */
   const per=3,groups=[];for(let i=0;i<N;i+=per)groups.push([...Array(Math.min(per,N-i))].map((_,k)=>i+k));
   const send=async(g,last)=>{await upSlot();try{const parts=await Promise.all(g.map(j=>b64(file.slice(j*CH,(j+1)*CH)))),w=g.map((j,k)=>({update:{name:FS_NAME+"songs/"+r.id+"/chunks/"+String(j).padStart(4,"0"),fields:{i:{integerValue:String(j)},data:{stringValue:parts[k]}}}}));if(last)w.push({update:{name:FS_NAME+"songs/"+r.id,fields:{ready:{booleanValue:true}}},updateMask:{fieldPaths:["ready"]},currentDocument:{exists:true}});await restCommit(w)}finally{upFree()}};
   if(groups.length){await Promise.all(groups.slice(0,-1).map(g=>send(g,false)));await send(groups[groups.length-1],true)}else await updateDoc(r,{ready:true});
   idOf.set(file,r.id);done++;
  }catch(e){fail++;console.error(file.name,e)}
  prog(++n,todo.length);
 });
 return{done,fail,dup,ids:[...new Set(list.map(f=>idOf.get(f)).filter(Boolean))]};
}
async function doCheck(list,o,prog){
 if(!songsFull)throw new Error("Still loading the library, try again in a moment.");
 
 const idx=new Map();songs.forEach(s=>{const k=s.key||s.title.toLowerCase();if(!idx.has(k))idx.set(k,[]);idx.get(k).push(s)});
 const cv=o.cover?await uploadFile("",o.cover,400):null;
 let upd=0,same=0,nf=0,notMine=0,fail=0,n=0;prog(0,list.length);
 await pool(list,10,async f=>{
  try{
   const tags=await readTags(f),k1=keyOf(f.name),k2=tags.title?clean0(tags.title).toLowerCase():"";
   const ms_=[...(idx.get(k1)||[]),...(k2&&k2!=k1?idx.get(k2)||[]:[])];
   if(!ms_.length){nf++;return}
   const own=ms_.filter(mine);if(!own.length){notMine++;return}
   const na=buildArtists(f.name,tags,o.artists);
   let cu=cv?.url||"";if(!cu&&tags.pic)try{cu=(await uploadFile("",tags.pic,400)).url}catch{}
   let changed=false;
   for(const s of [...new Set(own)]){const p={};
    if(o.fa&&na.length&&na.join("|")!=artistsOf(s).join("|")){p.artists=na;p.artist=na.join(", ")}
    if(o.ft&&tags.title){const nt=clean(tags.title);if(nt&&nt!=s.title)p.title=nt}
    if(o.fc&&cu&&cu!=s.coverUrl)p.coverUrl=cu;
    if(Object.keys(p).length){await updateDoc(doc(db,"songs",s.id),p);changed=true}}
   changed?upd++:same++;
  }catch(e){fail++;console.error(f.name,e)}
  prog(++n,list.length);
 });
 return{upd,same,nf,notMine,fail};
}

/* ---------- endless queue ----------

   songs you listen to a lot or like), skipping anything already queued or played recently. Not used with repeat-all, which loops instead. */
const QMIN=10;
function recommendNext(n){

 const A=new Map(),O=new Map(),P=new Map(),add=(m,k,w)=>m.set(k,(m.get(k)||0)+w);
 recent.forEach((s,i)=>{const w=1-i*.07;artOf(s).forEach(x=>add(A,x,w));add(O,s.ownerId,w);(plMap.get(s.id)||[]).forEach(x=>add(P,x,w))});

 const score=s=>{let a=0;artOf(s).forEach(x=>{a=Math.max(a,A.get(x)||0)});let p=0;(plMap.get(s.id)||[]).forEach(x=>{p=Math.max(p,P.get(x)||0)});

 const out=[],key=s=>artOf(s)[0];let la=null,lb=null;
 for(const r of ranked){if(out.length>=n)break;const k=key(r.s);if(k==la&&k==lb)continue;out.push(r.s);lb=la;la=k}
 for(const r of ranked){if(out.length>=n)break;if(!out.includes(r.s))out.push(r.s)}

/* ---------- cover art lookup (iTunes Search API: free, no key) ---------- */
const nrm=t=>String(t||"").toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g,"").replace(/&/g," and ").replace(/[^a-z0-9]+/g," ").trim();
/* Both services block normal browser requests (no CORS), so they are called with script tags (JSONP). iTunes rate limits hard (403),
   so Deezer is the main source (generous limit) and iTunes only a backup. Requests are spaced out so a big batch can't trip a limit. */
function jsonp(url,param){return new Promise((res,rej)=>{const cb="cv"+Math.random().toString(36).slice(2),sc=document.createElement("script");let t;
 const end=()=>{clearTimeout(t);delete window[cb];sc.remove()};
 window[cb]=d=>{end();res(d)};sc.onerror=()=>{end();rej(new Error("Cover service unreachable"))};t=setTimeout(()=>{end();rej(new Error("Cover service timed out"))},12000);
 sc.src=url+"&"+param+"="+cb;document.head.appendChild(sc)})}
let cvChain=Promise.resolve();const cvGate=()=>cvChain=cvChain.then(()=>new Promise(r=>setTimeout(r,450)));
async function dzSearch(q){await cvGate();const d=await jsonp("https://api.deezer.com/search?"+new URLSearchParams({q,limit:"15",output:"jsonp"}),"callback");
 if(d?.error)throw new Error("Deezer: "+(d.error.message||d.error.type||"error"));
 return(d.data||[]).map(x=>({trackName:x.title,artistName:x.artist?.name||"",collectionArtistName:"",trackTimeMillis:(x.duration||0)*1000,artworkUrl100:x.album?.cover_xl||x.album?.cover_big||""}))}
async function itSearch(term){await cvGate();const d=await jsonp("https://itunes.apple.com/search?"+new URLSearchParams({term,media:"music",entity:"song",limit:"15"}),"callback");return d.results||[]}

/* a wrong cover is worse than none, so a result needs a matching title and (when known) a matching artist */
function bestCover(res,t,a,d){
 const nt=nrm(t),na=nrm(a);let best=null,bs=0;
 for(const x of res){if(!x.artworkUrl100)continue;const rt=nrm(x.trackName),ra=nrm(x.artistName),rc=nrm(x.collectionArtistName);
  let sc=0;if(rt==nt)sc+=3;else if(rt.startsWith(nt+" ")||nt.startsWith(rt+" "))sc+=1;else continue;
  if(na){if(ra.includes(na)||na.includes(ra)||rc.includes(na))sc+=3;else continue}
  const dd=(x.trackTimeMillis||0)/1000;if(d>0&&dd&&Math.abs(dd-d)<=6)sc+=1;else if(!na)continue;
  if(sc>bs){bs=sc;best=x}}
 return best}
async function findCover(s){

/* a wrong face is worse than a letter, so only an exact name match counts (the most popular one if several share the name).
   Each service is tried in turn; it only counts as unreachable when none of them answered. */
/* Deezer answers with a grey silhouette when it has no photo of an artist: that is treated as "no picture" */
const dzDefault=u=>/\/artist\/\/|d41d8cd98f00b204e9800998ecf8427e/.test(u||"");

  ["wikipedia",()=>wikiArtist(name)]];

/* ---------- lyrics (LRCLIB lookup, saved to the server in the "lyrics" collection) ---------- */
const lyr={};let lyIdx=-1;
function parseLrc(t){const out=[];for(const ln of String(t||"").split("\n")){const m=[...ln.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)];if(!m.length)continue;const x=ln.replace(/\[[^\]]*\]/g,"").trim();m.forEach(k=>out.push({t:+k[1]*60+ +k[2],x}))}return out.sort((a,b)=>a.t-b.t)}
async function lrSearch(qs){const r=await fetch("https://lrclib.net/api/search?"+new URLSearchParams(qs));if(!r.ok)throw new Error("Lyrics service error "+r.status);return r.json()}
const pickLy=(arr,d)=>{arr=(Array.isArray(arr)?arr:[]).filter(x=>x&&!x.instrumental&&(x.syncedLyrics||x.plainLyrics));if(d>0)arr=arr.filter(x=>!x.duration||Math.abs(x.duration-d)<=6);return arr.sort((a,b)=>(b.syncedLyrics?1:0)-(a.syncedLyrics?1:0))[0]||null};
const packLy=x=>({status:"found",synced:x.syncedLyrics||"",plain:x.plainLyrics||(x.syncedLyrics||"").replace(/\[[^\]]*\]\s*/g,""),source:"lrclib"});
async function findLyrics(s){
 const d=Math.round(s.duration||0),ar=artistsOf(s)[0]||"",tn=(s.title||"").replace(/[\(\[][^\)\]]*[\)\]]/g,"").replace(/\s{2,}/g," ").trim()||s.title||"";
 const c=[];if(/ - /.test(tn)){const[a,...t]=tn.split(" - ");c.push([t.join(" - ").trim(),a.trim()])}c.push([tn,ar]);
 for(const [t,a] of c){if(!t)continue;
  let x=pickLy(await lrSearch(a?{track_name:t,artist_name:a}:{track_name:t}),d);
  if(!x&&a)x=pickLy(await lrSearch({q:t+" "+a}),d);
  if(x)return packLy(x)}

/* auto-explicit: swear words, slurs and other bad words found in the lyrics */
const BAD=/\b(?:f+u+c+k\w*|motherf\w+|sh[i1]t\w*|bullsh\w+|b[i1]tch\w*|cunt\w*|pussy|pussies|dick\w*|cock(?:s|sucker\w*)?|asshole\w*|ass|jackass|dumbass|badass|bastard\w*|whore\w*|slut\w*|goddamn\w*|n[i1]gg(?:a|as|er|ers|az|uh)|f[a4]gg?(?:ot|ots|its?)?|fag|fags|retard\w*|ch[i1]nk\w*|sp[i1]c|sp[i1]cs|k[i1]ke\w*|gook\w*|wetback\w*|beaner\w*|tranny|trannies|dyke|dykes|coon|coons|paki|towelhead\w*|raghead\w*|negro|negroes|wop|piss\w*|twat\w*|wank\w*|prick|prick?s|douche\w*|skank\w*|jizz|cum|cumming)\b/i;

const lyDoc=d=>({status:d.status,synced:d.synced||"",plain:d.plain||"",source:d.source||"lrclib",by:me.uid,at:serverTimestamp()});

/* Vortarium only: scan every song and look up lyrics for the ones that don't have any yet */
async function doLyricCheck(prog){
 const ex=new Map();(await getDocs(collection(db,"lyrics"))).forEach(d=>ex.set(d.id,d.data()));
 let found=0,none=0,fail=0,n=0,marked=0;
 /* songs that already have lyrics: scan them for bad words and mark explicit */
 await pool(songs.filter(s=>ex.get(s.id)?.status=="found"&&!s.explicit),5,async s=>{if(await autoExplicit(s,ex.get(s.id)))marked++});
 const todo=songs.filter(s=>ex.get(s.id)?.status!="found"),skipped=songs.length-todo.length;
 if(!todo.length)return{found,none,skipped,fail,marked};prog(0,todo.length);
 await pool(todo,3,async s=>{
  try{const d=await findLyrics(s);await setDoc(doc(db,"lyrics",s.id),lyDoc(d));
   const L={status:d.status,synced:d.synced,plain:d.plain};if(L.synced)L.lines=parseLrc(L.synced);lyr[s.id]=L;d.status=="found"?found++:none++;
   if(await autoExplicit(s,L))marked++}
  catch(e){fail++;console.error(s.title,e)}
  prog(++n,todo.length)});

/* ---------- media keys / OS media controls ---------- */
function mediaAct(n){
 const g=n=="play"||n=="pause"||n=="toggle"?"pp":n,t=Date.now();
 if(mediaAct.g==g&&t-mediaAct.t<250)return;mediaAct.g=g;mediaAct.t=t;

 else if(n=="pause")fadePause();
 else if(n=="toggle")togglePlay();
 else if(n=="next")next(false);
 else if(n=="prev")prev();
 else if(n=="stop"){audio.pause();audio.currentTime=0}
}
let artObj="";
function mediaMeta(s){

 const base={title:s.title,artist:artistsOf(s).join(", ")||uname(s.ownerId),album:ctxName||uname(s.ownerId)};
 const put=src=>{try{navigator.mediaSession.metadata=new MediaMetadata({...base,artwork:src?[96,128,192,256,384,512].map(z=>({src,sizes:z+"x"+z,type:"image/jpeg"})):[]})}catch{}};

 /* the lock screen needs a real image URL; the cover is stored as a data URL, so it is converted to a blob URL first (iOS builds the blurred lock-screen background from this image) */

(function initMedia(){

  const h=[["play",()=>mediaAct("play")],["pause",()=>mediaAct("pause")],["previoustrack",()=>mediaAct("prev")],["nexttrack",()=>mediaAct("next")],["stop",()=>mediaAct("stop")],
   ["seekto",d=>{if(audio.duration&&d.seekTime!=null)audio.currentTime=d.seekTime}],["seekbackward",null],["seekforward",null]];
  h.forEach(([a,f])=>{try{navigator.mediaSession.setActionHandler(a,f)}catch{}});
 }
 const K={MediaPlayPause:"toggle",MediaPlay:"play",MediaPause:"pause",MediaTrackNext:"next",MediaTrackPrevious:"prev",MediaStop:"stop"};

  const a=K[e.code]||K[e.key];if(a){e.preventDefault();return mediaAct(a)}

})();
