<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NUMERUS</title>
<style>
:root{--bg:#f5f4ef;--ink:#1d1d1f;--mute:#8d8b84;--card:#fff;--line:#e7e4da;--acc:#ff6b57;--ok:#3ecf8e}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;justify-content:center}
#app{width:100%;max-width:520px;min-height:100vh;position:relative;display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column;padding:22px 20px 24px;animation:in .35s ease}
.screen.on{display:flex}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.logo{font-weight:800;letter-spacing:.32em;font-size:22px}
.logo i{font-style:normal;color:var(--acc)}
.mono{font-variant-numeric:tabular-nums}
.btn{appearance:none;border:0;background:var(--ink);color:#fff;font:inherit;font-weight:700;padding:14px 22px;border-radius:16px;cursor:pointer;transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.small{padding:8px 14px;font-size:13px;border-radius:12px}
.btn[disabled]{opacity:.4;pointer-events:none}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px}
.muted{color:var(--mute)}
#muteBtn{position:fixed;top:14px;right:14px;z-index:20;width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--card);cursor:pointer;font-size:16px}
/* auth */
#auth{justify-content:center;gap:22px;text-align:center}
#auth .logo{font-size:34px}
#auth .sub{color:var(--mute);font-size:14px;margin-top:-10px}
.seg{display:flex;background:#ebe9e0;border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;font:inherit;font-weight:700;padding:10px;border-radius:11px;cursor:pointer;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px #0001}
.field{width:100%;font:inherit;font-size:16px;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);outline:none;margin-bottom:10px}
.field:focus{border-color:var(--ink)}
.err{color:#d6402c;font-size:13px;min-height:18px;margin:2px 0 8px}
/* main */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;padding-right:44px}
.who{font-size:13px;color:var(--mute)}
.who b{color:var(--ink)}
.who a{margin-left:8px;cursor:pointer;text-decoration:underline}
.pane{display:none;flex:1;flex-direction:column}
.pane.on{display:flex}
.stage{display:flex;flex-direction:column;align-items:center;margin:14px 0 6px}
.robot{width:150px;height:175px;animation:hover 2.6s ease-in-out infinite}
.robot svg{width:100%;height:100%;overflow:visible}
@keyframes hover{50%{transform:translateY(-12px)}}
.ped{width:150px;height:14px;border-radius:50%;background:#1d1d1f14;margin-top:-4px;animation:sh 2.6s ease-in-out infinite}
@keyframes sh{50%{transform:scale(.8);opacity:.6}}
.gui{width:210px;height:18px;border-radius:12px;background:var(--card);border:2px solid var(--line);margin-top:-2px}
.step{text-align:center;margin:14px 0 10px;font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase}
.dots{display:flex;justify-content:center;gap:6px;margin-bottom:12px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ink)}
.opts{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:6px 2px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font:inherit;font-size:11px;color:var(--mute);transition:transform .12s}
.opt:active{transform:scale(.95)}
.opt.on{border-color:var(--ink);color:var(--ink)}
.opt svg{width:100%;height:56px}
.sw{width:34px;height:34px;border-radius:50%;margin:11px 0}
.row{display:flex;gap:10px;justify-content:center;margin-top:16px}
.nav{display:flex;gap:8px;margin-top:auto;padding-top:18px}
.nav button{flex:1;border:0;background:transparent;font:inherit;font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:12px;padding:14px;border-radius:14px;cursor:pointer;color:var(--mute)}
.nav button.on{background:var(--ink);color:#fff}
/* stats */
.lb{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.tile{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px}
.tile .rk{width:26px;font-weight:800;color:var(--mute)}
.tile .nm{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .vl{font-weight:800}
.tile.me{border-color:var(--ink)}
.dotsep{text-align:center;color:var(--mute);letter-spacing:.3em;font-weight:800;line-height:.6}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.summary div{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.summary b{display:block;font-size:22px}
.summary span{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.1em}
/* mode screens */
.h1{font-size:26px;font-weight:800;text-align:center;margin:8px 0 18px}
.choices{display:flex;flex-direction:column;gap:12px}
.choice{display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px;cursor:pointer;font:inherit;transition:transform .12s,border-color .2s}
.choice:hover{border-color:var(--ink)}
.choice:active{transform:scale(.98)}
.choice .ic{font-size:30px;width:44px;text-align:center}
.choice b{display:block;font-size:17px}
.choice span{font-size:13px;color:var(--mute)}
/* queue */
#queue{align-items:center;justify-content:center;text-align:center;gap:14px}
.big{font-size:84px;font-weight:800}
/* match */
.mbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pl{display:flex;align-items:center;gap:8px;min-width:0}
.pl.r{flex-direction:row-reverse;text-align:right}
.pl svg{width:44px;height:52px}
.pl b{display:block;font-size:13px;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl span{font-size:22px;font-weight:800}
.rd{font-size:12px;color:var(--mute);text-align:center}
.rd b{color:var(--ink)}
.tbar{height:6px;background:var(--line);border-radius:6px;margin:14px 0 22px;overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:var(--ink);transition:width .1s linear}
.cat{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);font-weight:800;text-align:center}
#qText{font-size:24px;line-height:1.3;text-align:center;margin:10px 0 8px}
.unit{text-align:center;color:var(--mute);font-size:14px;margin-bottom:22px}
#ansIn{text-align:center;font-size:30px;font-weight:800;padding:16px}
#ansForm .btn{width:100%;margin-top:2px}
#waitMsg{text-align:center;color:var(--mute);margin-top:14px;min-height:20px}
.revnum{text-align:center;margin:6px 0 16px}
.revnum small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.revnum b{font-size:38px}
.rrow{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.rrow .g{flex:1}
.rrow .g small{display:block;color:var(--mute);font-size:12px}
.rrow .g b{font-size:18px}
.rrow .pt{font-size:24px;font-weight:800}
.rrow.win{border-color:var(--ok)}
/* result */
#result{align-items:center;justify-content:center;text-align:center;gap:10px}
#result .robot{width:130px;height:150px}
.rt{font-size:42px;font-weight:800}
.tot{display:flex;gap:28px;font-size:14px;color:var(--mute);margin:4px 0 16px}
.tot b{display:block;font-size:30px;color:var(--ink)}
#busy{position:fixed;inset:0;background:#f5f4efee;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:30;font-weight:700}
#busy.on{display:flex}
.spin{width:30px;height:30px;border:4px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.pop{animation:pop .4s ease}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}

#bgc{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#app{z-index:1}
.ansWrap{display:flex;gap:8px;align-items:stretch}
.ansWrap .field{flex:1;min-width:0}
.calcBtn{flex:0 0 58px;margin-bottom:10px;border:2px solid var(--line);background:var(--card);border-radius:14px;cursor:pointer;display:grid;place-items:center;color:var(--ink);transition:transform .12s,border-color .2s}
.calcBtn:hover{border-color:var(--ink)}
.calcBtn:active{transform:scale(.94)}
.calcBtn[disabled]{opacity:.4;pointer-events:none}
.calcWrap{position:fixed;inset:0;z-index:25;display:none;align-items:center;justify-content:center;background:#1d1d1f40;padding:16px}
.calcWrap.on{display:flex}
.calcPanel{width:100%;max-width:360px;background:var(--card);border:2px solid var(--line);border-radius:26px;padding:16px;box-shadow:0 20px 60px #0003;animation:in .25s ease}
.calcTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.calcTop button{border:0;background:#ebe9e0;border-radius:50%;width:30px;height:30px;cursor:pointer;font:inherit;font-weight:800}
.calcIn{font-size:22px!important;font-weight:800;text-align:right;margin-bottom:4px!important;font-variant-numeric:tabular-nums}
.calcRes{text-align:right;color:var(--mute);font-weight:700;min-height:22px;margin-bottom:10px;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.calcKeys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.calcKeys button{border:0;border-radius:14px;padding:14px 0;font:inherit;font-size:18px;font-weight:700;background:#f1efe7;cursor:pointer;color:var(--ink)}
.calcKeys button:active{transform:scale(.94)}
.calcKeys button.op{background:#e4e1d6}
.calcKeys button.eq{grid-column:span 4;background:#e4e1d6}
.summary b{display:block;font-variant-numeric:tabular-nums}
.summary b.up{animation:statUp 3s ease both}
.summary b.down{animation:statDown 3s ease both}
@keyframes statUp{0%{opacity:0;color:#2fbf7a;transform:scale(.9)}15%{opacity:1;color:#2fbf7a;transform:scale(1.08)}85%{opacity:1;color:#2fbf7a;transform:scale(1.04)}100%{opacity:1;color:var(--ink);transform:none}}
@keyframes statDown{0%{opacity:0;color:#e5384a;transform:scale(.9)}15%{opacity:1;color:#e5384a;transform:scale(1.08)}85%{opacity:1;color:#e5384a;transform:scale(1.04)}100%{opacity:1;color:var(--ink);transform:none}}
.tile .av{width:38px;height:38px;flex:none;background:#f3f1ea;border-radius:12px;overflow:hidden}
.tile .av svg{width:100%;height:100%;display:block}

:root{--z:1.5}
#app{zoom:var(--z);min-height:calc(100vh / var(--z))}
@media (max-width:800px){:root{--z:1.3}}
@media (max-width:560px){:root{--z:1.15}}
.summary div{overflow:visible}
.summary b{position:relative;z-index:2}
.summary b.up,.summary b.down{animation-duration:3s;animation-fill-mode:both}
@keyframes statUp{
  0%{opacity:0;color:#2fbf7a;transform:scale(1)}
  8%{opacity:1;color:#2fbf7a;transform:scale(1.04);animation-timing-function:cubic-bezier(.5,0,1,.8)}
  80%{opacity:1;color:#2fbf7a;transform:scale(1.9);animation-timing-function:cubic-bezier(.9,0,1,1)}
  85%{color:#2fbf7a;transform:scale(.86);animation-timing-function:ease-out}
  89%{color:#2fbf7a;transform:scale(1.06)}
  93%{color:#2fbf7a;transform:scale(1)}
  100%{opacity:1;color:var(--ink);transform:scale(1)}
}
@keyframes statDown{
  0%{opacity:0;color:#e5384a;transform:scale(1)}
  8%{opacity:1;color:#e5384a;transform:scale(1.04);animation-timing-function:cubic-bezier(.5,0,1,.8)}
  80%{opacity:1;color:#e5384a;transform:scale(1.9);animation-timing-function:cubic-bezier(.9,0,1,1)}
  85%{color:#e5384a;transform:scale(.86);animation-timing-function:ease-out}
  89%{color:#e5384a;transform:scale(1.06)}
  93%{color:#e5384a;transform:scale(1)}
  100%{opacity:1;color:var(--ink);transform:scale(1)}
}
.tile{position:relative}
.tile.me{z-index:2}

.choice.locked{opacity:.55;cursor:not-allowed;pointer-events:none}
.solo .pl.r,.solo #revOpp{display:none}
.dscore{text-align:center;margin:6px 0 4px}
.dscore b{font-size:64px;font-weight:800}
.dscore span{font-size:18px;color:var(--mute);margin-left:6px}
.dpct{text-align:center;font-weight:700;font-size:18px}
#dChart svg{width:100%;height:auto;display:block}
</style>
</head>
<body>
<canvas id="bgc"></canvas>
<div id="app">
<button id="muteBtn" title="Sound">♪</button>

<!-- AUTH -->
<section id="auth" class="screen on">
  <div class="logo">NUME<i>R</i>US</div>
  <div class="sub">how close can you get?</div>
  <div class="seg"><button id="tabIn" class="on">Log in</button><button id="tabUp">Sign up</button></div>
  <form id="authForm" autocomplete="off">
    <input class="field" id="uName" placeholder="Username" maxlength="14" autocapitalize="off" spellcheck="false">
    <input class="field" id="uPass" type="password" placeholder="Password" autocomplete="off">
    <div class="err" id="authErr"></div>
    <button class="btn" id="authBtn" style="width:100%">Log in</button>
  </form>
</section>

<!-- MAIN -->
<section id="main" class="screen">
  <div class="top"><div class="logo" style="font-size:16px">NUME<i>R</i>US</div><div class="who"><b id="whoName"></b><a id="logout">log out</a></div></div>

  <div class="pane on" id="paneplay">
    <div class="stage"><div class="robot" id="stageBot"></div><div class="ped"></div><div class="gui"></div></div>
    <div class="step" id="stepLbl"></div>
    <div class="dots" id="dots"></div>
    <div class="opts" id="opts"></div>
    <div class="row"><button class="btn ghost small" id="stepBack">‹ Back</button><button class="btn small" id="stepNext">Continue ›</button></div>
  </div>

  <div class="pane" id="panestats">
    <div class="summary"><div><b id="sPts" class="mono">0</b><span>points</span></div><div><b id="sWins" class="mono">0</b><span>wins</span></div><div><b id="sGames" class="mono">0</b><span>games</span></div></div>
    <div class="seg" style="margin-top:16px"><button id="lbPts" class="on">Points</button><button id="lbWins">Wins</button><button id="lbGames">Games</button></div>
    <div class="lb" id="lbList"></div>
    <p class="muted" style="font-size:12px;text-align:center;margin-top:14px">Only Hard AI and human matches count.</p>
  </div>

  <div class="nav"><button id="navPlay" class="on">Play</button><button id="navStats">Stats</button></div>
</section>

<!-- MODE -->
<section id="mode" class="screen">
  <div class="stage"><div class="robot" id="modeBot" style="width:110px;height:130px"></div><div class="ped" style="width:110px"></div></div>
  <div class="h1">Who do you want to face?</div>
  <div class="choices">
    <button class="choice" id="chHuman"><div class="ic">👤</div><div><b>Human</b><span>Queue up for a real opponent (60s)</span></div></button>
    <button class="choice" id="chAI"><div class="ic">🤖</div><div><b>Robot</b><span>Easy, medium or hard</span></div></button>
    <button class="choice" id="chDaily"><div class="ic">📅</div><div><b>Daily</b><span id="dailySub">Same 10 questions for everyone. One try a day.</span></div></button>
  </div>
  <div class="row" style="margin-top:auto;padding-top:20px"><button class="btn ghost small" id="modeBack">‹ Back</button></div>
</section>

<section id="diff" class="screen">
  <div class="h1" style="margin-top:40px">Pick a difficulty</div>
  <div class="choices">
    <button class="choice" data-d="easy"><div class="ic">🌱</div><div><b>Easy</b><span>Wide guesses. Practice only.</span></div></button>
    <button class="choice" data-d="medium"><div class="ic">⚡</div><div><b>Medium</b><span>Decent aim. Practice only.</span></div></button>
    <button class="choice" data-d="hard"><div class="ic">🔥</div><div><b>Hard</b><span>Razor precision. Counts for stats.</span></div></button>
  </div>
  <div class="row" style="margin-top:auto;padding-top:20px"><button class="btn ghost small" id="diffBack">‹ Back</button></div>
</section>

<!-- QUEUE -->
<section id="queue" class="screen">
  <div class="robot" id="queueBot" style="width:110px;height:130px"></div>
  <div class="big mono" id="qTime">60</div>
  <div id="qMsg" class="muted">Searching for an opponent…</div>
  <div class="row"><button class="btn ghost" id="qLeave">Leave queue</button><button class="btn" id="qRetry" style="display:none">Try again</button></div>
</section>

<!-- MATCH -->
<section id="match" class="screen">
  <div class="mbar">
    <div class="pl"><div id="mMeBot"></div><div><b id="mMeName"></b><span class="mono" id="mMeScore">0</span></div></div>
    <div class="rd">Round<br><b id="mRound">1</b>/10</div>
    <div class="pl r"><div id="mOppBot"></div><div><b id="mOppName"></b><span class="mono" id="mOppScore">0</span></div></div>
  </div>
  <div class="tbar"><i id="tFill"></i></div>
  <div id="qBox">
    <h2 id="qText"></h2>
    <div class="unit" id="qUnit"></div>
    <form id="ansForm" autocomplete="off">
      <div class="ansWrap">
        <input class="field" id="ansIn" inputmode="decimal" placeholder="your number" autocomplete="off" maxlength="18">
        <button type="button" class="calcBtn" id="calcBtn" aria-label="Calculator"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2.5" width="16" height="19" rx="3"/><rect x="7" y="5.5" width="10" height="4" rx="1"/><circle cx="8.5" cy="13.5" r=".7" fill="currentColor"/><circle cx="12" cy="13.5" r=".7" fill="currentColor"/><circle cx="15.5" cy="13.5" r=".7" fill="currentColor"/><circle cx="8.5" cy="17.5" r=".7" fill="currentColor"/><circle cx="12" cy="17.5" r=".7" fill="currentColor"/><circle cx="15.5" cy="17.5" r=".7" fill="currentColor"/></svg></button>
      </div>
      <button class="btn" id="lockBtn">Lock in</button>
    </form>
    <div id="waitMsg"></div>
  </div>
  <div id="revBox" style="display:none">
    <div class="revnum pop"><small>Correct answer</small><b class="mono" id="revAns"></b> <span class="muted" id="revUnit"></span></div>
    <div class="rrow" id="revMe"><div class="g"><small id="revMeN"></small><b class="mono" id="revMeG"></b></div><div class="pt mono" id="revMeS"></div></div>
    <div class="rrow" id="revOpp"><div class="g"><small id="revOppN"></small><b class="mono" id="revOppG"></b></div><div class="pt mono" id="revOppS"></div></div>
  </div>
</section>

<!-- RESULT -->
<section id="result" class="screen">
  <div class="robot" id="resBot"></div><div class="ped"></div>
  <div class="rt" id="resTitle"></div>
  <div class="tot"><div><b class="mono" id="resMe">0</b><span id="resMeN"></span></div><div><b class="mono" id="resOpp">0</b><span id="resOppN"></span></div></div>
  <div class="muted" id="resNote" style="font-size:13px;margin-bottom:8px"></div>
  <div class="row"><button class="btn ghost" id="resHome">Home</button><button class="btn" id="resAgain">Play again</button></div>
</section>

<section id="daily" class="screen">
  <div class="h1" style="margin-top:20px">Daily complete</div>
  <div class="dscore"><b class="mono" id="dScore">0</b><span>/ 1000</span></div>
  <div class="dpct" id="dPct"></div>
  <div class="card" style="margin-top:12px"><div id="dChart"></div><div class="muted" id="dNote" style="font-size:12px;text-align:center;margin-top:8px"></div></div>
  <div class="muted" id="dNext" style="text-align:center;font-size:13px;margin-top:14px"></div>
  <div class="row"><button class="btn" id="dHome">Home</button></div>
</section>

<div id="calcWrap" class="calcWrap"><div class="calcPanel">
  <div class="calcTop"><b>Calculator</b><button type="button" id="calcClose" aria-label="Close">✕</button></div>
  <input class="field calcIn" id="calcIn" inputmode="none" placeholder="0" autocomplete="off" spellcheck="false">
  <div class="calcRes" id="calcRes"></div>
  <div class="calcKeys" id="calcKeys"></div>
  <button type="button" class="btn" id="calcUse" style="width:100%">Use as answer</button>
</div></div>

<div id="busy"><div class="spin"></div><div id="busyMsg">Loading…</div></div>
</div>

<script type="module">

async function genQuestions() {

    const prompt = `Create 10 short numeric estimation questions for a party game that rewards intuition. Each question is ONE sentence (under 25 words) that makes the player combine TWO things they might roughly know or can ballpark. Examples of the right style: "If you stacked Elon Musk's net worth in $1 bills, how many miles tall would the stack be?" (needs his net worth and the thickness of a bill), "How many hours would it take to drive to the Moon at 60 miles per hour?", "How many Eiffel Towers stacked would reach the top of Mount Everest?". Do NOT ask single-fact trivia someone could simply know (no "what element is silver", no "what year", no counts like keys on a piano, no famous single measurements). Never write out the math and never give away the ingredient numbers; the player supplies them from their own head. Make every question about a totally different random subject so nobody can prepare, loosely inspired by: ${cats.join(", ")}. Use stable, well-established figures; if a question uses a changing figure (net worth, population), use the most recent widely reported value. The answer must be one number computed from those widely known figures. Seed ${Math.floor(Math.random() * 1e6)}. Return ONLY a JSON array of exactly 10 objects: {"q": the question text, "a": the answer as a plain number (no commas or text), "unit": short unit label like "miles" or "hours"}.`;

function scoreOf(g, a) {
  if (g === null || g === undefined || !isFinite(g)) return 0;
  const L = v => Math.sign(v) * Math.log10(1 + Math.abs(v));

/* ---------- human matchmaking ---------- */
let Q = null;

  } catch (e) { console.error(e); $("qMsg").textContent = "Couldn't join the queue. Check Firestore rules."; $("qLeave").textContent = "Back"; return; }

/* ---------- calculator ---------- */

  function pow() { const b = prim(); if (peek() === "^") { i++; return Math.pow(b, unary()); } return b; }
  function unary() { if (peek() === "-") { i++; return -unary(); } if (peek() === "+") { i++; return unary(); } return pow(); }
  function term() { let v = unary(); while (peek() === "*" || peek() === "/") { const o = t[i++]; const r = unary(); v = o === "*" ? v * r : v / r; } return v; }
  function expr() { let v = term(); while (peek() === "+" || peek() === "-") { const o = t[i++]; const r = term(); v = o === "+" ? v + r : v - r; } return v; }
  const v = expr(); if (i !== t.length || !isFinite(v)) throw 0; return v;

/* ---------- living background ---------- */
(function () {
  const cv = $("bgc"), cx = cv.getContext("2d");
  const pal = ["#ff6b57", "#4aa8ff", "#3ecf8e", "#ffc83d", "#9b6bff", "#1d1d1f"];
  const mouse = { x: 0, y: 0, on: false }; let W = 0, H = 0, P = [];

  }

      p.x += p.vx + p.pvx; p.y += p.vy + p.pvy; p.a += p.va; p.pvx *= .93; p.pvy *= .93;

      const a = P[i], b = P[j], d = Math.hypot(a.rx - b.rx, a.ry - b.ry);

    }

        cx.globalAlpha = .14 * p.f; cx.beginPath(); cx.moveTo(mx, my); cx.lineTo(p.rx, p.ry); cx.stroke();

/* ---------- daily challenge ---------- */
const ET = "America/New_York";
function etParts() {
  const o = {}; new Intl.DateTimeFormat("en-US", { timeZone: ET, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" }).formatToParts(new Date()).forEach(x => o[x.type] = x.value); return o;
}
const dayKey = () => { const o = etParts(); return `${o.year}-${o.month}-${o.day}`; };
const secsToMidnight = () => { const o = etParts(); return 86400 - (+o.hour * 3600 + +o.minute * 60 + +o.second); };

let dailyDone = false, dailyDay = dayKey();
function updDailyUI() {

  $("dNext").textContent = "Next daily unlocks in " + left + " (midnight Eastern)";

  updDailyUI();
}
setInterval(() => { const k = dayKey(); if (k !== dailyDay) { dailyDay = k; dailyDone = false; refreshDaily(); } updDailyUI(); }, 1000);

}

}
$("chDaily").onclick = () => startDaily();
function normCdf(z) { const t = 1 / (1 + .2316419 * Math.abs(z)), d = .3989423 * Math.exp(-z * z / 2); const p = d * t * (.3193815 + t * (-.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274)))); return z > 0 ? 1 - p : p; }
// Mean/spread of every daily score ever played. Five "typical" pseudo-scores keep the curve sensible until real data piles up.
function dailyModel(st) {
  const k = 5, n = (st && st.n) || 0, sum = (st && st.sum) || 0, sq = (st && st.sumsq) || 0, N = n + k;
  const mean = (sum + k * 500) / N, v = Math.max(400, (sq + k * (150 * 150 + 500 * 500)) / N - mean * mean);
  return { mean, sd: Math.sqrt(v) };
}
function curveSVG(score, m) {
  const W = 320, H = 160, padB = 24, top = 26;
  const lo = Math.max(0, Math.min(m.mean - 4 * m.sd, score - 40)), hi = Math.min(1000, Math.max(m.mean + 4 * m.sd, score + 40));
  const X = v => (v - lo) / (hi - lo) * W, base = H - padB;
  const Yv = v => base - Math.exp(-.5 * ((v - m.mean) / m.sd) ** 2) * (base - top);
  let line = "", area = `M${X(lo).toFixed(1)} ${base}`;
  for (let i = 0; i <= 140; i++) { const v = lo + (hi - lo) * i / 140; line += (i ? "L" : "M") + X(v).toFixed(1) + " " + Yv(v).toFixed(1); if (v <= score) area += `L${X(v).toFixed(1)} ${Yv(v).toFixed(1)}`; }
  area += `L${X(score).toFixed(1)} ${Yv(score).toFixed(1)}L${X(score).toFixed(1)} ${base}Z`;
  const sx = X(score), sy = Yv(score), mx = X(m.mean);
  return `<svg viewBox="0 0 ${W} ${H}" font-family="inherit">
    <path d="${area}" fill="#ff6b57" opacity=".28"/>
    <path d="${line}" fill="none" stroke="#1d1d1f" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="0" y1="${base}" x2="${W}" y2="${base}" stroke="#e7e4da" stroke-width="2"/>
    <line x1="${mx.toFixed(1)}" y1="${top - 6}" x2="${mx.toFixed(1)}" y2="${base}" stroke="#8d8b84" stroke-width="1" stroke-dasharray="3 4"/>
    <text x="${mx.toFixed(1)}" y="${top - 10}" text-anchor="middle" font-size="10" fill="#8d8b84">avg ${Math.round(m.mean)}</text>
    <line x1="${sx.toFixed(1)}" y1="${sy.toFixed(1)}" x2="${sx.toFixed(1)}" y2="${base}" stroke="#ff6b57" stroke-width="2.5"/>
    <circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="5.5" fill="#ff6b57" stroke="#fff" stroke-width="2"/>
    <text x="${Math.min(W - 18, Math.max(18, sx)).toFixed(1)}" y="${Math.max(12, sy - 12).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="800" fill="#ff6b57">You</text>
    <text x="2" y="${H - 6}" font-size="10" fill="#8d8b84">${Math.round(lo)}</text>
    <text x="${W - 2}" y="${H - 6}" text-anchor="end" font-size="10" fill="#8d8b84">${Math.round(hi)}</text>
  </svg>`;
}
function showDailyResult(score, st) {
  $("dScore").textContent = score;
  if (st) {
    const m = dailyModel(st), pct = Math.min(99, Math.max(1, Math.round(normCdf((score - m.mean) / m.sd) * 100)));
    $("dPct").textContent = `Higher than ${pct}% of players`;
    $("dChart").innerHTML = curveSVG(score, m);
    $("dNote").textContent = `Built from ${fmt(st.n)} daily game${st.n === 1 ? "" : "s"} across every day so far.`;
    if (pct >= 50) sfx(sWin);
  } else { $("dPct").textContent = "Couldn't load the curve"; $("dChart").innerHTML = ""; $("dNote").textContent = ""; }
  updDailyUI(); show("daily");
}
async function finishDaily() {
  M.done = true; clearInterval(M.timer);
  const score = M.my, mref = doc(db, "numerus_dailyscores", M.day + "_" + me.uid), sref = doc(db, "numerus_daily_stats", "global");
  busy("Plotting your score…"); let st = null;
  try {
    await runTransaction(db, async tx => {
      const sn = await tx.get(mref); if (!sn.exists() || sn.data().score !== null) throw new Error("dup");
      tx.update(mref, { score });
      tx.set(sref, { n: increment(1), sum: increment(score), sumsq: increment(score * score) }, { merge: true });
      tx.update(doc(db, USERS, me.uid), { points: increment(score), games: increment(1) });
    });
    me.points += score; me.games += 1; dailyDone = true;
    st = (await getDoc(sref)).data();
  } catch (e) { console.error(e); }
  unbusy(); showDailyResult(score, st);
}
$("dHome").onclick = () => { step = 0; renderWizard(); goTab("play"); show("main"); };
