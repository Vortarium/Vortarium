<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jewelfish</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Patrick+Hand&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="jewelfish_style.css" />
</head>
<body>

<!-- LOGIN / SIGNUP -->
<section id="auth" class="screen">
  <div class="card auth-card">
    <h1 class="logo">🐟 Jewelfish 💎</h1>
    <p class="tagline">Mix things. Discover everything.</p>

    <div class="tabs">
      <button id="tabLogin" class="tab active" type="button">Log in</button>
      <button id="tabSignup" class="tab" type="button">Sign up</button>
    </div>

    <form id="authForm" autocomplete="on">
      <label>Username
        <input id="username" type="text" maxlength="16" autocomplete="username" required placeholder="coolfish_42" />
      </label>
      <label>Password
        <input id="password" type="password" minlength="6" autocomplete="current-password" required placeholder="••••••" />
      </label>
      <p id="authError" class="error"></p>
      <button id="authSubmit" class="btn big" type="submit">Log in</button>
    </form>

    <p class="desc">
      There are a total of <b id="totalCount">0</b> new discoveries that exist,
      updating live. Can you find the next one?
    </p>
  </div>
</section>

<!-- GAME -->
<section id="game" class="screen hidden">
  <aside id="sidebar">
    <div class="side-head">
      <span id="whoami" class="whoami"></span>
      <button id="logoutBtn" class="mini" type="button" title="Log out">⎋</button>
    </div>
    <div id="elementList"></div>
  </aside>

  <main id="board">
    <div id="boardHint">Click an element on the left, then drag one onto another to mix! ✏️</div>
    <button id="trophyBtn" class="btn round" type="button" title="Leaderboard">🏆</button>
    <button id="clearBtn" class="btn" type="button">Clear</button>
    <div id="toast" class="toast hidden"></div>
  </main>

  <div id="lbModal" class="modal hidden">
    <div class="card lb-card">
      <button id="lbClose" class="mini close" type="button">✕</button>
      <h2>🏆 Top Discoverers</h2>
      <ol id="lbList"></ol>
      <div id="lbYou" class="lb-you hidden">
        <div class="dots">⋯</div>
        <div class="lb-row me" id="lbYouRow"></div>
      </div>
    </div>
  </div>
</section>

<script type="module" src="jewelfish_app.js"></script>
</body>
</html>
