<!doctype html>
<html lang="en">
<head>

<style>
  /* Plain 2000s look — monospace, black & white, square corners */
  :root { --bg: #fff; --fg: #000; }
  html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family: 'Courier New', monospace;font-size:14px}
  *{box-sizing:border-box}
  .app { display:grid; grid-template-columns:240px 1fr 320px; gap:8px; height:100vh; padding:8px; }
  .panel { background:#fff; border:1px solid #000; padding:10px; overflow:auto; }
  h1,h2,h3,h4 { margin:4px 0; font-weight:700; }
  label{display:block;margin-top:8px}
  input, textarea, select, button { font-family:inherit; font-size:14px; background:#fff; color:#000; border:1px solid #000; padding:6px; }
  button { cursor:pointer; }
  .small { font-size:12px; color:#000; }
  .group-btn{display:block;width:100%;text-align:left;margin-bottom:6px}
  .post { border:1px solid #000; padding:8px; margin-bottom:8px; white-space:pre-wrap; }
  .reply { margin-left:18px; border-left:1px solid #000; padding-left:8px; margin-top:6px; white-space:pre-wrap;}
  .attachments img, .attachments video { max-width:260px; display:block; margin-top:6px; border:1px solid #000; }
  .attachments audio { display:block; margin-top:6px; }
  .muted { color:#333; font-size:12px; }
  .topbar { display:flex; gap:8px; align-items:center; justify-content:space-between; }
  .form-row { margin-top:8px; }
  .tiny { font-size:11px; padding:4px; }
  .notice { margin-top:8px; color:#900; }
  .pfp { width:32px; height:32px; border:1px solid #000; vertical-align:middle; margin-right:6px; }
  .author-line { display:flex; align-items:center; }
  .likes-dislikes { display:flex; gap:8px; margin-top:6px; }
  .like-btn, .dislike-btn { font-size:12px; }
  .big-pfp { width:128px; height:128px; border:1px solid #000; }
  .profile-view { padding:10px; }
  .profile-images img { max-width:200px; margin:6px; border:1px solid #000; }
  .user-post { margin-bottom:12px; border-bottom:1px solid #000; padding-bottom:8px; }
  .deleted { color:#900; font-style:italic; }
  .clickable { cursor:pointer; text-decoration:underline; }
  .spoiler { background-color:#000; color:#000; cursor:pointer; }
  .spoiler.revealed { color:inherit; background-color:transparent; }
  .poll-options { margin-top:8px; }
  .poll-option { display:block; margin-bottom:4px; }
  .poll-result { display:block; margin-bottom:4px; }
  .html-embed { border:1px dashed #000; padding:8px; margin-top:8px; }
  iframe { width:300px; height:200px; border:1px solid #000; }
</style>

<script>
/*
Vortalk single-file app
- Attachments saved in IndexedDB as blobs (avoids localStorage quota)
- Metadata (users, boards, posts) saved in localStorage (small)
- Anonymous until logged in
- Boards case-sensitive and support symbols
*/
// ---------- IndexedDB helpers for attachments ----------
const DB_NAME = 'VortalkDB_v1';
const ATT_STORE = 'attachments';
let dbPromise = null;
function openDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(ATT_STORE)) {
        db.createObjectStore(ATT_STORE, { keyPath: 'id' });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}
async function saveBlobToDB(blob, meta = {}) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(ATT_STORE, 'readwrite');
    const store = tx.objectStore(ATT_STORE);
    const id = 'att_' + Date.now() + '_' + Math.floor(Math.random()*9000+1000);
    const obj = { id, blob, meta };
    const r = store.put(obj);
    r.onsuccess = () => resolve(id);
    r.onerror = () => reject(r.error || new Error('indexeddb put failed'));
  });
}
async function getBlobFromDB(id) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(ATT_STORE, 'readonly');
    const store = tx.objectStore(ATT_STORE);
    const r = store.get(id);
    r.onsuccess = () => resolve(r.result ? r.result.blob : null);
    r.onerror = () => reject(r.error || new Error('indexeddb get failed'));
  });
}
async function deleteBlobFromDB(id) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(ATT_STORE, 'readwrite');
    const store = tx.objectStore(ATT_STORE);
    const r = store.delete(id);
    r.onsuccess = () => resolve();
    r.onerror = () => reject(r.error);
  });
}
// ---------- App state (metadata) ----------
const LS_KEY = 'vortalk_meta_v1'; // stores boards, posts, users (lightweight)
let meta = {
  boards: {}, // boardKey -> { desc, created, creator, posts: [postId,...] }
  posts: {}, // postId -> {id, boardKey, title, text, attachments: [{id,name,type,size}], author, created, replies: [], likes: [], dislikes: [], deleted: false, deletedBy: null, edited: false, editedAt: null, poll: null, htmlCode: null, embedLinks: false } // poll: {options: [str], votes: [[usernames]]}
  users: {}, // username -> {username, pass, bio:'', pfpAttId: null, profileImages: [], followers: [], created: null}
  currentUser: null // username or null
};
// load meta from localStorage
function loadMeta() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) meta = JSON.parse(raw);
  } catch(e) {
    console.error('load meta failed', e);
  }
}
function saveMeta() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(meta));
  } catch(e) {
    console.error('save meta failed', e);
    // if quota issues arise, we can't store attachments here (they're in IndexedDB), so try to trim old posts
    // simple fallback: keep only last 100 posts metadata
    try {
      const postIds = Object.keys(meta.posts).sort((a,b) => (meta.posts[b].created||0) - (meta.posts[a].created||0));
      const keep = postIds.slice(0, 200);
      const newPosts = {};
      keep.forEach(id => newPosts[id] = meta.posts[id]);
      meta.posts = newPosts;
      localStorage.setItem(LS_KEY, JSON.stringify(meta));
      console.warn('trimmed meta posts to reduce storage');
    } catch(err2) {
      console.error('failed to trim meta', err2);
    }
  }
}
// ---------- Utilities ----------
function uid(prefix='x') { return prefix + '_' + Date.now() + '_' + Math.floor(Math.random()*9000+1000); }
function now() { return Date.now(); }
function escapeHtml(s){ if(!s) return ''; return String(s).replace(/[&<>\"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c])); }
// Minimal markdown-ish rendering: **bold**, *italic*, lines starting with "# " => header
function renderFormatted(text, isTitle = false, embedLinks = false) {
  if (!text) return '';
  let out = escapeHtml(text);
  if (!isTitle) {
    out = out.replace(/^#\s+(.*)$/gm, '<strong style="font-size:18px">$1</strong>');
  }
  out = out.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  out = out.replace(/\*(.*?)\*/g, '<em>$1</em>');
  out = out.replace(/\n/g, '<br/>');
  // spoilers
  out = out.replace(/\|\|\s*(.*?)\s*\|\|/g, '<span class="spoiler" onclick="this.classList.add(\'revealed\')">$1</span>');
  // links
  if (embedLinks) {
    out = out.replace(/(https?:\/\/[^\s<]+)/g, '<iframe src="$1"></iframe>');
  } else {
    out = out.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank">$1</a>');
  }
  // bullets - simple replace
  out = out.replace(/^-\s+(.*)$/gm, '&bull; $1<br/>');
  return out;
}
// ---------- DOM refs ----------
const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));
const refs = {
  boardsList: $('#boardsList'),
  boardChar: $('#boardChar'),
  boardName: $('#boardName'),
  createBoardBtn: $('#createBoardBtn'),
  refreshBoardsBtn: $('#refreshBoardsBtn'),
  createBoardMsg: $('#createBoardMsg'),
  postSelect: $('#postSelect'),
  postTitle: $('#postTitle'),
  postText: $('#postText'),
  postFiles: $('#postFiles'),
  postBtn: $('#postBtn'),
  clearComposerBtn: $('#clearComposerBtn'),
  composerMsg: $('#composerMsg'),
  pollToggle: $('#pollToggle'),
  pollOptions: $('#pollOptions'),
  addPollOpt: $('#addPollOpt'),
  removePollOpt: $('#removePollOpt'),
  pollOptsContainer: $('#pollOptsContainer'),
  addHtmlBtn: $('#addHtmlBtn'),
  htmlInput: $('#htmlInput'),
  htmlCode: $('#htmlCode'),
  embedLinks: $('#embedLinks'),
  feedArea: $('#feedArea'),
  selectedBoardDisplay: $('#selectedBoardDisplay'),
  boardCreatorDisplay: $('#boardCreatorDisplay'),
  feedTitle: $('#feedTitle'),
  profileName: $('#profileName'),
  profileBio: $('#profileBio'),
  bioText: $('#bioText'),
  saveBioBtn: $('#saveBioBtn'),
  profilePfp: $('#profilePfp'),
  pfpUpload: $('#pfpUpload'),
  uploadPfpBtn: $('#uploadPfpBtn'),
  profileImagesUpload: $('#profileImagesUpload'),
  uploadProfileImagesBtn: $('#uploadProfileImagesBtn'),
  profileImages: $('#profileImages'),
  pfpMsg: $('#pfpMsg'),
  accountStatus: $('#accountStatus'),
  accountCreated: $('#accountCreated'),
  userBoardsList: $('#userBoardsList'),
  // auth
  showSignUpBtn: $('#showSignUpBtn'),
  showLoginBtn: $('#showLoginBtn'),
  logoutBtn: $('#logoutBtn'),
  signUpForm: $('#signUpForm'),
  loginForm: $('#loginForm'),
  suUsername: $('#suUsername'),
  suPass: $('#suPass'),
  doSignUp: $('#doSignUp'),
  cancelSignUp: $('#cancelSignUp'),
  suMsg: $('#suMsg'),
  liUsername: $('#liUsername'),
  liPass: $('#liPass'),
  doLogin: $('#doLogin'),
  cancelLogin: $('#cancelLogin'),
  liMsg: $('#liMsg'),
  debug: $('#debug'),
  mainPanel: $('#mainPanel')
};
// ---------- Board logic ----------
function boardKeyFrom(char, name) {
  return `${char}&${name}`;
}
function createBoard(char, name) {
  const key = boardKeyFrom(char, name);
  if (!char || !name) return { ok:false, msg:'Provide char and name' };
  if (meta.boards[key]) return { ok:false, msg:'Board already exists' };
  const creator = (getCurrentUser()) ? getCurrentUser().username : 'Anonymous';
  meta.boards[key] = { desc: name, created: now(), creator, posts: [] };
  saveMeta();
  return { ok:true, key };
}
async function deleteBoard(key) {
  const board = meta.boards[key];
  if (!board) return { ok:false, msg:'Board not found' };
  const user = getCurrentUser();
  if (!user || board.creator !== user.username) return { ok:false, msg:'You cannot delete this board' };
  // delete all posts
  for (const pid of board.posts) {
    await deletePost(pid, true); // force as admin
  }
  delete meta.boards[key];
  if (meta.currentBoard === key) meta.currentBoard = null;
  saveMeta();
  return { ok:true };
}
function renderBoards() {
  refs.boardsList.innerHTML = '';
  const keys = Object.keys(meta.boards).sort((a,b)=> meta.boards[a].created - meta.boards[b].created );
  if (keys.length === 0) refs.boardsList.innerHTML = '<div class="small muted">No boards yet</div>';
  keys.forEach(k => {
    const cont = document.createElement('div');
    const btn = document.createElement('button');
    btn.textContent = k + ' — ' + meta.boards[k].desc;
    btn.className = 'group-btn';
    btn.onclick = () => selectBoard(k);
    cont.appendChild(btn);
    const user = getCurrentUser();
    if (user && meta.boards[k].creator === user.username) {
      const delBtn = document.createElement('button');
      delBtn.textContent = 'Delete';
      delBtn.className = 'tiny';
      delBtn.onclick = async () => {
        if (!confirm('Delete board ' + k + ' and all posts?')) return;
        const res = await deleteBoard(k);
        if (!res.ok) alert(res.msg);
        renderBoards();
        if (meta.currentBoard === k) selectBoard(null);
        renderFeed();
      };
      cont.appendChild(delBtn);
    }
    refs.boardsList.appendChild(cont);
  });
  // update post select
  refs.postSelect.innerHTML = '';
  if (keys.length === 0) {
    const opt = document.createElement('option'); opt.text = 'No boards'; refs.postSelect.appendChild(opt);
  } else {
    keys.forEach(k => { const opt = document.createElement('option'); opt.value = k; opt.text = k; refs.postSelect.appendChild(opt); });
    if (!meta.currentBoard && keys.length) meta.currentBoard = keys[0];
    if (meta.currentBoard) refs.postSelect.value = meta.currentBoard;
  }
  saveMeta();
}
function selectBoard(key) {
  meta.currentBoard = key;
  saveMeta();
  refs.selectedBoardDisplay.textContent = key || 'No board selected';
  const board = meta.boards[key];
  refs.boardCreatorDisplay.textContent = board ? `Made by ${board.creator}` : '';
  renderFeed();
  renderBoards();
}
// ---------- Post logic ----------
async function postAttachmentsFromFiles(fileList) {
  const arr = Array.from(fileList||[]);
  const saved = [];
  for (const f of arr) {
    if (f.size > 10*1024*1024) throw new Error('File ' + f.name + ' exceeds 10 MB');
    const id = await saveBlobToDB(f, { name: f.name, type: f.type, size: f.size });
    saved.push({ id, name: f.name, type: f.type, size: f.size });
  }
  return saved;
}
function createPost(boardKey, title, text, attachmentsMeta, author, poll = null, htmlCode = null, embedLinks = false) {
  const id = uid('post');
  const post = { id, boardKey, title, text, attachments: attachmentsMeta||[], author, created: now(), replies: [], likes: [], dislikes: [], deleted: false, deletedBy: null, edited: false, editedAt: null, poll, htmlCode, embedLinks };
  meta.posts[id] = post;
  meta.boards[boardKey].posts.push(id);
  saveMeta();
  return post;
}
function createReplyOnPost(postId, parentReplyId, text, attachmentsMeta, author) {
  const post = meta.posts[postId];
  if (!post) return { ok:false, msg:'Post not found' };
  const replyObj = { id: uid('r'), text, attachments: attachmentsMeta||[], author, created: now(), replies: [], likes: [], dislikes: [], deleted: false, deletedBy: null, edited: false, editedAt: null };
  if (!parentReplyId) {
    post.replies.push(replyObj);
  } else {
    // recursive find
    function findReply(list, id) {
      for (const r of list) {
        if (r.id === id) return r;
        if (r.replies && r.replies.length) {
          const found = findReply(r.replies, id);
          if (found) return found;
        }
      }
      return null;
    }
    const parent = findReply(post.replies, parentReplyId);
    if (!parent) return { ok:false, msg:'Parent reply not found' };
    parent.replies.push(replyObj);
  }
  saveMeta();
  return { ok:true, reply: replyObj };
}
async function deletePost(postId, forceAdmin = false) {
  const post = meta.posts[postId];
  if (!post) return { ok:false, msg:'Post not found' };
  const user = getCurrentUser();
  const board = meta.boards[post.boardKey];
  const isAdmin = user && board && board.creator === user.username;
  const isOwner = user && post.author === user.username;
  if (!forceAdmin && !isOwner && !isAdmin) return { ok:false, msg:'You cannot delete this post' };
  // mark as deleted
  post.deleted = true;
  post.deletedBy = isAdmin && !isOwner ? 'admin' : 'self';
  // delete attachments
  for (const a of post.attachments) {
    await deleteBlobFromDB(a.id);
  }
  post.attachments = [];
  post.text = '';
  post.title = '';
  post.poll = null;
  post.htmlCode = null;
  // recursively mark replies deleted
  function markRepliesDeleted(list) {
    for (const r of list) {
      r.deleted = true;
      r.deletedBy = post.deletedBy;
      r.text = '';
      for (const a of r.attachments) {
        deleteBlobFromDB(a.id);
      }
      r.attachments = [];
      if (r.replies) markRepliesDeleted(r.replies);
    }
  }
  markRepliesDeleted(post.replies);
  saveMeta();
  return { ok:true };
}
function deleteReply(postId, replyId, forceAdmin = false) {
  const post = meta.posts[postId];
  if (!post) return { ok:false, msg:'Post not found' };
  const user = getCurrentUser();
  const board = meta.boards[post.boardKey];
  const isAdmin = user && board && board.creator === user.username;
  function findAndMark(list, id) {
    for (let i = 0; i < list.length; i++) {
      if (list[i].id === id) {
        const r = list[i];
        const isOwner = user && r.author === user.username;
        if (!forceAdmin && !isOwner && !isAdmin) return false;
        r.deleted = true;
        r.deletedBy = isAdmin && !isOwner ? 'admin' : 'self';
        r.text = '';
        for (const a of r.attachments) {
          deleteBlobFromDB(a.id);
        }
        r.attachments = [];
        function markChildren(list) {
          for (const child of list) {
            child.deleted = true;
            child.deletedBy = r.deletedBy;
            child.text = '';
            for (const a of child.attachments) {
              deleteBlobFromDB(a.id);
            }
            child.attachments = [];
            if (child.replies) markChildren(child.replies);
          }
        }
        markChildren(r.replies);
        return true;
      }
      if (list[i].replies && findAndMark(list[i].replies, id)) return true;
    }
    return false;
  }
  const found = findAndMark(post.replies, replyId);
  if (!found) return { ok:false, msg:'Reply not found' };
  saveMeta();
  return { ok:true };
}
function editPost(postId, newTitle, newText) {
  const post = meta.posts[postId];
  if (!post) return { ok:false, msg:'Post not found' };
  const user = getCurrentUser();
  if (!user || post.author !== user.username) return { ok:false, msg:'You cannot edit this post' };
  post.title = newTitle;
  post.text = newText;
  post.edited = true;
  post.editedAt = now();
  saveMeta();
  return { ok:true };
}
function editReply(postId, replyId, newText) {
  const post = meta.posts[postId];
  if (!post) return { ok:false, msg:'Post not found' };
  function findAndEdit(list, id) {
    for (const r of list) {
      if (r.id === id) {
        r.text = newText;
        r.edited = true;
        r.editedAt = now();
        return true;
      }
      if (r.replies && findAndEdit(r.replies, id)) return true;
    }
    return false;
  }
  const found = findAndEdit(post.replies, replyId);
  if (!found) return { ok:false, msg:'Reply not found' };
  saveMeta();
  return { ok:true };
}
// like/dislike
function toggleLike(item, isLike = true) {
  const user = getCurrentUser();
  if (!user) return { ok:false, msg:'Must be logged in' };
  const username = user.username;
  const likes = item.likes;
  const dislikes = item.dislikes;
  const arr = isLike ? likes : dislikes;
  const oppArr = isLike ? dislikes : likes;
  if (arr.includes(username)) {
    // remove
    arr.splice(arr.indexOf(username), 1);
  } else {
    // add, remove from opp if present
    arr.push(username);
    if (oppArr.includes(username)) oppArr.splice(oppArr.indexOf(username), 1);
  }
  saveMeta();
  return { ok:true };
}
function votePoll(postId, optionIndex) {
  const post = meta.posts[postId];
  if (!post || !post.poll) return { ok:false, msg:'No poll' };
  const user = getCurrentUser();
  if (!user) return { ok:false, msg:'Must be logged in' };
  const username = user.username;
  const votes = post.poll.votes;
  // check if already voted
  const hasVoted = votes.some(v => v.includes(username));
  if (hasVoted) return { ok:false, msg:'Already voted' };
  votes[optionIndex].push(username);
  saveMeta();
  return { ok:true };
}

// ---------- Edit box ----------
function openEditBox(item, insertAfterNode, isPost = false, postId = null, replyId = null) {
  const container = insertAfterNode || refs.feedArea;
  const existing = container.querySelector('.edit-box');
  if (existing) { existing.remove(); return; }
  const box = document.createElement('div'); box.className = 'edit-box'; box.style.marginTop='6px';
  let html = '';
  if (isPost) {
    html = `<label for="editTitle">Title</label><input id="editTitle" value="${escapeHtml(item.title || '')}" />
    <label for="editText">Text</label><textarea id="editText" rows="5">${escapeHtml(item.text)}</textarea>`;
  } else {
    html = `<textarea id="editText" rows="3">${escapeHtml(item.text)}</textarea>`;
  }
  html += `<div style="display:flex;gap:8px;margin-top:6px">
    <button class="tiny">Save</button>
    <button class="tiny">Cancel</button>
  </div>`;
  box.innerHTML = html;
  const titleIn = box.querySelector('#editTitle');
  const ta = box.querySelector('#editText');
  const save = box.querySelector('button');
  const cancel = box.querySelectorAll('button')[1];
  save.onclick = () => {
    const newText = ta.value.trim();
    if (!newText) return alert('Cannot be empty');
    let res;
    if (isPost) {
      const newTitle = titleIn.value.trim();
      res = editPost(item.id, newTitle, newText);
    } else {
      res = editReply(postId, replyId, newText);
    }
    if (!res.ok) return alert(res.msg);
    const scrollPos = refs.mainPanel.scrollTop;
    renderFeed();
    refs.mainPanel.scrollTop = scrollPos;
    box.remove();
  };
  cancel.onclick = () => box.remove();
  container.appendChild(box);
  addTextShortcuts(ta);
}

// ---------- PFP and profile images ----------
async function uploadPfp(file) {
  const user = getCurrentUser();
  if (!user) return { ok:false, msg:'Must be logged in' };
  if (!file || !file.type.startsWith('image/')) return { ok:false, msg:'Invalid image' };
  // crop to 1:1 and resize
  const img = new Image();
  img.src = URL.createObjectURL(file);
  await new Promise(r => img.onload = r);
  const size = Math.min(img.width, img.height);
  const canvas = document.createElement('canvas');
  canvas.width = 128; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, (img.width - size)/2, (img.height - size)/2, size, size, 0, 0, 128, 128);
  const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
  // delete old if exists
  if (user.pfpAttId) await deleteBlobFromDB(user.pfpAttId);
  // save new
  const id = await saveBlobToDB(blob, { name: 'pfp.png', type: 'image/png', size: blob.size });
  user.pfpAttId = id;
  saveMeta();
  return { ok:true };
}
async function uploadProfileImages(files) {
  const user = getCurrentUser();
  if (!user) return { ok:false, msg:'Must be logged in' };
  const arr = Array.from(files).slice(0, 4 - user.profileImages.length);
  if (arr.length === 0) return { ok:false, msg:'No images or limit reached' };
  const saved = [];
  for (const f of arr) {
    if (!f.type.startsWith('image/')) continue;
    const id = await saveBlobToDB(f, { name: f.name, type: f.type, size: f.size });
    saved.push({ id, name: f.name, type: f.type, size: f.size });
  }
  user.profileImages.push(...saved);
  if (user.profileImages.length > 4) user.profileImages = user.profileImages.slice(-4);
  saveMeta();
  return { ok:true };
}
async function renderPfpForAuthor(author) {
  if (author === 'Anonymous') return null;
  const u = meta.users[author];
  if (!u || !u.pfpAttId) return null;
  const blob = await getBlobFromDB(u.pfpAttId);
  if (!blob) return null;
  const img = document.createElement('img');
  img.src = URL.createObjectURL(blob);
  img.className = 'pfp';
  return img;

      items.push({ type: 'post', board: p.boardKey, content: p.title ? p.title + ' - ' + p.text : p.text, created: p.created });
    }
    function collectReplies(list) {

        if (r.author === username && !r.deleted) {
          items.push({ type: 'reply', board: p.boardKey, content: r.text, created: r.created });

        if (r.replies) collectReplies(r.replies);

  for (const item of items) {

    userPosts.appendChild(up);
  }
  if (items.length === 0) userPosts.innerHTML += '<div class="small muted">No posts or replies</div>';

  const c = refs.boardChar.value.trim();
  const n = refs.boardName.value.trim();
  const res = createBoard(c, n);
  if (!res.ok) {
    refs.createBoardMsg.textContent = res.msg;
    return;
  }
  refs.createBoardMsg.textContent = 'Created ' + res.key;
  refs.boardChar.value = '';
  refs.boardName.value = '';
  renderBoards();
  selectBoard(res.key);
};
refs.refreshBoardsBtn.onclick = () => renderBoards();
refs.postBtn.onclick = async () => {
  const board = refs.postSelect.value;
  if (!board || !meta.boards[board]) return alert('Select a board to post to');
  const title = refs.postTitle.value.trim();
  const text = refs.postText.value.trim();
  const files = refs.postFiles.files;
  if (!text && (!files || files.length === 0)) return alert('Cannot post empty');
  refs.composerMsg.textContent = 'Uploading attachments...';
  let attachments = [];
  try {
    if (files && files.length) {
      attachments = await postAttachmentsFromFiles(files);
    }
  } catch(e) {
    refs.composerMsg.textContent = '';
    return alert('Attachment error: ' + e.message);
  }
  let poll = null;
  if (refs.pollToggle.checked) {
    const opts = $$('.pollOpt').map(i => i.value.trim()).filter(v => v);
    if (opts.length < 2) return alert('Poll needs at least 2 options');
    poll = { options: opts, votes: opts.map(() => []) };
  }
  let htmlCode = null;
  if (refs.htmlCode.value.trim()) htmlCode = refs.htmlCode.value.trim();
  const embedLinks = refs.embedLinks.checked;
  const author = (getCurrentUser()) ? getCurrentUser().username : 'Anonymous';
  const scrollPos = refs.mainPanel.scrollTop;
  createPost(board, title, text, attachments, author, poll, htmlCode, embedLinks);
  refs.composerMsg.textContent = 'Posted';
  refs.postTitle.value = '';
  refs.postText.value = '';
  refs.postFiles.value = '';
  refs.pollToggle.checked = false;
  refs.pollOptions.style.display = 'none';
  refs.pollOptsContainer.innerHTML = '';
  refs.htmlInput.style.display = 'none';
  refs.htmlCode.value = '';
  refs.embedLinks.checked = false;
  renderFeed();
  refs.mainPanel.scrollTop = scrollPos;
  setTimeout(()=>refs.composerMsg.textContent = '', 1500);
};
refs.clearComposerBtn.onclick = () => { refs.postTitle.value=''; refs.postText.value=''; refs.postFiles.value=''; refs.composerMsg.textContent=''; refs.pollToggle.checked = false; refs.pollOptions.style.display = 'none'; refs.pollOptsContainer.innerHTML = ''; refs.htmlInput.style.display = 'none'; refs.htmlCode.value = ''; refs.embedLinks.checked = false; };
refs.pollToggle.onchange = () => {
  if (refs.pollToggle.checked) {
    refs.pollOptions.style.display = 'block';
    initPollOpts();
  } else {
    refs.pollOptions.style.display = 'none';
    refs.pollOptsContainer.innerHTML = '';
  }
};
function initPollOpts(num = 2) {
  refs.pollOptsContainer.innerHTML = '';
  for (let i = 0; i < num; i++) {
    const label = document.createElement('label');
    label.textContent = `Option ${i+1}`;
    const inp = document.createElement('input');
    inp.className = 'pollOpt';
    label.appendChild(inp);
    refs.pollOptsContainer.appendChild(label);
  }
}
refs.addPollOpt.onclick = () => {
  const curr = $$('.pollOpt').length;
  if (curr >= 4) return;
  initPollOpts(curr + 1);
};
refs.removePollOpt.onclick = () => {
  const curr = $$('.pollOpt').length;
  if (curr <= 2) return;
  initPollOpts(curr - 1);
};
refs.addHtmlBtn.onclick = () => {
  refs.htmlInput.style.display = refs.htmlInput.style.display === 'none' ? 'block' : 'none';
};
refs.showSignUpBtn.onclick = () => { showOnly('signup'); clearAuthMessages(); };
refs.cancelSignUp.onclick = () => { showOnly(null); clearAuthMessages(); };
refs.doSignUp.onclick = () => {
  const un = refs.suUsername.value.trim();
  const pw = refs.suPass.value;
  const r = signup(un, pw);
  if (!r.ok) { refs.suMsg.textContent = r.msg; return; }
  refs.suMsg.textContent = 'Account created and logged in.';
  renderProfile();
  showOnly(null);
};
refs.showLoginBtn.onclick = () => { showOnly('login'); clearAuthMessages(); };
refs.cancelLogin.onclick = () => { showOnly(null); clearAuthMessages(); };
refs.doLogin.onclick = () => {
  const un = refs.liUsername.value.trim();
  const pw = refs.liPass.value;
  const r = login(un, pw);
  if (!r.ok) { refs.liMsg.textContent = r.msg; return; }
  refs.liMsg.textContent = 'Logged in as ' + un;
  renderProfile();
  showOnly(null);
};
refs.logoutBtn.onclick = () => { logout(); renderProfile(); };
refs.saveBioBtn.onclick = () => {
  const user = getCurrentUser();
  if (!user) return alert('Must be logged in');
  user.bio = refs.bioText.value.trim();
  saveMeta();
  renderProfile();
};
refs.uploadPfpBtn.onclick = async () => {
  const file = refs.pfpUpload.files[0];
  if (!file) return alert('Select an image');
  const res = await uploadPfp(file);
  if (!res.ok) return alert(res.msg);
  refs.pfpMsg.textContent = 'PFP uploaded';
  renderProfile();
  renderFeed();
  refs.pfpUpload.value = '';
  setTimeout(()=>refs.pfpMsg.textContent='', 1500);
};
refs.uploadProfileImagesBtn.onclick = async () => {
  const files = refs.profileImagesUpload.files;
  if (!files.length) return alert('Select images');
  const res = await uploadProfileImages(files);
  if (!res.ok) return alert(res.msg);
  refs.pfpMsg.textContent = 'Images uploaded';
  renderProfile();
  refs.profileImagesUpload.value = '';
  setTimeout(()=>refs.pfpMsg.textContent='', 1500);
};
// ---------- Auth UI & profile rendering ----------
async function renderProfile() {
  const u = getCurrentUser();
  if (!u) {
    refs.profileName.textContent = 'Anonymous';
    refs.profileName.classList.remove('clickable');
    refs.profileName.onclick = null;
    refs.profileBio.textContent = 'Not signed in';
    refs.bioText.value = '';
    refs.bioText.disabled = true;
    refs.accountStatus.textContent = 'Not signed in';
    refs.profilePfp.innerHTML = '';
    refs.profileImages.innerHTML = '';
    refs.saveBioBtn.disabled = true;
    refs.uploadPfpBtn.disabled = true;
    refs.uploadProfileImagesBtn.disabled = true;
    refs.accountCreated.textContent = '';
    refs.userBoardsList.innerHTML = 'Not signed in';
    return;
  }
  refs.profileName.textContent = u.username;
  refs.profileName.classList.add('clickable');
  refs.profileName.onclick = () => showUserProfile(u.username);
  refs.profileBio.textContent = u.bio || 'No bio';
  refs.bioText.value = u.bio || '';
  refs.bioText.disabled = false;
  refs.accountStatus.textContent = 'Logged in';
  refs.saveBioBtn.disabled = false;
  refs.uploadPfpBtn.disabled = false;
  refs.uploadProfileImagesBtn.disabled = false;
  refs.profilePfp.innerHTML = '';
  if (u.pfpAttId) {
    const blob = await getBlobFromDB(u.pfpAttId);
    if (blob) {
      const img = document.createElement('img');
      img.src = URL.createObjectURL(blob);
      img.className = 'pfp';
      img.style.width = '64px';
      img.style.height = '64px';
      refs.profilePfp.appendChild(img);
    }
  }
  refs.profileImages.innerHTML = '';
  for (const pi of u.profileImages) {
    const blob = await getBlobFromDB(pi.id);
    if (blob) {
      const img = document.createElement('img');
      img.src = URL.createObjectURL(blob);
      img.style.maxWidth = '100px';
      refs.profileImages.appendChild(img);
    }
  }
  refs.accountCreated.textContent = `Account created: ${new Date(u.created).toLocaleString()}`;
  // boards created
  refs.userBoardsList.innerHTML = '';
  const userBoards = Object.keys(meta.boards).filter(k => meta.boards[k].creator === u.username);
  if (userBoards.length === 0) {
    refs.userBoardsList.innerHTML = 'None';
  } else {
    userBoards.forEach(k => {
      const div = document.createElement('div');
      div.textContent = k;
      refs.userBoardsList.appendChild(div);
    });
  }
}
// ---------- Keyboard shortcuts for textareas ----------
function addTextShortcuts(ta) {
  ta.addEventListener('keydown', (e) => {
    if (e.ctrlKey) {
      if (e.key === 'b') {
        e.preventDefault();
        wrapSelection(ta, '**');
      } else if (e.key === 'i') {
        e.preventDefault();
        wrapSelection(ta, '*');
      } else if (e.key === 'u') {
        e.preventDefault();
        wrapSelection(ta, '<u>', '</u>');
      }
    }
  });
}
function wrapSelection(ta, open, close = open) {
  const start = ta.selectionStart;
  const end = ta.selectionEnd;
  const selected = ta.value.substring(start, end);
  const before = ta.value.substring(0, start);
  const after = ta.value.substring(end);
  ta.value = before + open + selected + close + after;
  ta.selectionStart = start + open.length;
  ta.selectionEnd = ta.selectionStart + selected.length;
  ta.focus();
}
// ---------- Boot ----------
async function boot() {
  await openDB();
  loadMeta();
  // ensure meta structure
  meta.boards = meta.boards || {};
  meta.posts = meta.posts || {};
  meta.users = meta.users || {};
  meta.currentUser = meta.currentUser || null;
  // migrate if needed
  for (const k in meta.boards) {
    if (!meta.boards[k].creator) meta.boards[k].creator = 'Anonymous';
  }
  for (const p in meta.posts) {
    if (meta.posts[p].deleted === undefined) meta.posts[p].deleted = false;
    if (meta.posts[p].deletedBy === undefined) meta.posts[p].deletedBy = null;
    if (meta.posts[p].edited === undefined) meta.posts[p].edited = false;
    if (meta.posts[p].editedAt === undefined) meta.posts[p].editedAt = null;
    if (meta.posts[p].poll === undefined) meta.posts[p].poll = null;
    if (meta.posts[p].htmlCode === undefined) meta.posts[p].htmlCode = null;
    if (meta.posts[p].embedLinks === undefined) meta.posts[p].embedLinks = false;
    function addToReplies(list) {
      for (const r of list) {
        if (r.deleted === undefined) r.deleted = false;
        if (r.deletedBy === undefined) r.deletedBy = null;
        if (r.edited === undefined) r.edited = false;
        if (r.editedAt === undefined) r.editedAt = null;
        if (r.attachments === undefined) r.attachments = [];
        if (r.replies) addToReplies(r.replies);
      }
    }
    addToReplies(meta.posts[p].replies);
  }
  for (const u in meta.users) {
    if (!meta.users[u].profileImages) meta.users[u].profileImages = [];
    if (!meta.users[u].followers) meta.users[u].followers = [];
    if (!meta.users[u].created) meta.users[u].created = now();
  }
  // set currentBoard initially to first board if exists
  const bkeys = Object.keys(meta.boards);
  if (!meta.currentBoard && bkeys.length) meta.currentBoard = bkeys[0];
  renderBoards();
  await renderProfile();
  await renderFeed();
  refs.debug.textContent = 'Loaded. Boards: ' + Object.keys(meta.boards).length + ', Posts: ' + Object.keys(meta.posts).length + ', Users: ' + Object.keys(meta.users).length;
  addTextShortcuts(refs.postText);
  addTextShortcuts(refs.bioText);
}
boot();
</script>
