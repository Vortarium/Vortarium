<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pitch</title>
<style>
:root{--bg:#0a0a0b;--card:#141416;--line:#232327;--fg:#f4f4f5;--mut:#8a8a93;--acc:#bc4dff;--good:#4ade80;--bad:#ff5d5d}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--fg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;justify-content:center;overflow-x:hidden}
#app{width:100%;max-width:760px;padding:28px 20px 60px}
#app.wide{max-width:none;padding:28px 0 40px}
#app.wide header{padding:0 20px;max-width:760px;margin:0 auto 32px}
.pvpad{max-width:760px;margin:0 auto;padding:0 20px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:44px}
.logo{font-weight:800;letter-spacing:-.03em;font-size:20px;cursor:pointer}
.logo span{color:var(--acc)}
.status{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
.ld{margin-left:8px;cursor:pointer;text-decoration:underline;color:var(--mut)}.ld:hover{color:var(--fg)}
input[type=range]:disabled{opacity:.35}
.live{font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums}
.dot{width:7px;height:7px;border-radius:50%;background:var(--mut)}
.dot.ok{background:var(--good)}.dot.synth{background:var(--acc)}
h1{font-size:clamp(34px,7vw,54px);letter-spacing:-.04em;line-height:1.02;font-weight:800}
.sub{color:var(--mut);margin:12px 0 34px;font-size:16px}
.cards{display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;align-items:center;gap:18px;cursor:pointer;transition:.15s;text-align:left;color:inherit;font:inherit;width:100%}
.card:hover{border-color:var(--acc);transform:translateY(-2px)}
.card .n{font-size:13px;color:var(--acc);font-weight:700;width:28px}
.card h3{font-size:20px;letter-spacing:-.02em;margin-bottom:4px}
.card p{color:var(--mut);font-size:14px}
.card .best{margin-left:auto;font-size:12px;color:var(--mut);white-space:nowrap}
.top{display:flex;justify-content:space-between;color:var(--mut);font-size:14px;margin-bottom:10px}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:46px}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:.3s}
.stage{text-align:center}
.big{font-size:clamp(46px,12vw,92px);font-weight:800;letter-spacing:-.05em;line-height:1;min-height:1em}
.hint{color:var(--mut);margin:14px 0 30px;min-height:22px}
.btn{background:var(--fg);color:#000;border:0;border-radius:999px;padding:15px 30px;font:inherit;font-weight:700;cursor:pointer;transition:.15s}
.btn:hover{transform:scale(1.03)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--fg)}
.btn.acc{background:var(--acc)}
.btn.on{background:var(--acc);color:#000}
.btn:disabled{opacity:.35;cursor:default;transform:none}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;background:var(--line);border-radius:6px;outline:0;margin:26px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:var(--acc);cursor:pointer;border:0}
input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:var(--acc);cursor:pointer;border:0}
.result{margin-top:26px;min-height:60px}
.pts{font-size:26px;font-weight:800;letter-spacing:-.03em}
.pts.g{color:var(--good)}.pts.b{color:var(--bad)}.pts.a{color:var(--acc)}
.res-sub{color:var(--mut);font-size:14px;margin-top:6px}
.pianoWrap{overflow-x:auto;padding-bottom:6px;margin-top:10px}
.piano{position:relative;display:flex;height:190px;min-width:640px;user-select:none}
.wk{flex:1;background:#f4f4f5;border:1px solid #0a0a0b;border-radius:0 0 8px 8px;cursor:pointer;transition:background .1s;position:relative}
.wk:hover{background:#f1e3ff;}
.bk{position:absolute;top:0;width:3.2%;height:62%;background:#1b1b1e;border:1px solid #333;border-radius:0 0 6px 6px;cursor:pointer;z-index:2;transition:background .1s}
.bk:hover{background:#3a3a40}
.kn{position:absolute;left:0;right:0;bottom:5px;text-align:center;font-size:clamp(6px,1.1vw,11px);font-weight:700;font-style:normal;color:#6b6b75;pointer-events:none;line-height:1}
.bk .kn{color:#a0a0aa}
body.nonames .kn,body.nonames .nm{display:none!important}
.pb .nm{writing-mode:vertical-rl;transform:rotate(180deg);font-size:clamp(5px,.7vw,9px);margin-top:1px}
.pbtn{background:none;font-family:inherit;cursor:pointer}
.pbtn:hover{border-color:var(--mut)}
.pw .kl,.pb .kl,.pw .kn2,.pb .kn2{display:block;font-style:normal;line-height:1.15}
.wk.good,.wk.good:hover{background:var(--good)}.bk.good,.bk.good:hover{background:var(--good)}
.wk.bad,.wk.bad:hover{background:var(--bad)}.bk.bad,.bk.bad:hover{background:var(--bad)}
.wk.near,.wk.near:hover{background:#ffe27a}.bk.near,.bk.near:hover{background:#c9a400}
.wk.dis,.bk.dis{pointer-events:none}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;max-width:520px;margin:0 auto}
.nb{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:14px;padding:16px 0;font:inherit;font-weight:700;font-size:18px;cursor:pointer;transition:.12s}
.nb:hover{border-color:var(--mut)}
.nb.sel{background:var(--acc);color:#000;border-color:var(--acc)}
.nb.good{background:var(--good);color:#000;border-color:var(--good)}
.nb.bad{background:var(--bad);color:#000;border-color:var(--bad)}
.seg{flex-wrap:wrap;justify-content:center;display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;margin:18px 0 6px}
.seg button{background:transparent;border:0;color:var(--mut);font:inherit;font-weight:700;padding:11px 18px;border-radius:999px;cursor:pointer}
.seg button.sel{background:var(--fg);color:#000}
.seg button.good{background:var(--good);color:#000}.seg button.bad{background:var(--bad);color:#000}
.fin .big{color:var(--acc)}
.sm{padding:8px 16px;font-size:13px}
.pvstat{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.pill{border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700}
.pill.on{background:var(--acc);color:#000;border-color:var(--acc)}
.pvn{margin-left:auto;font-weight:800;font-size:20px;letter-spacing:-.02em;min-width:48px;text-align:right}
.sel{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;max-width:100%}
.sel:focus{outline:0;border-color:var(--acc)}
.pill:empty{display:none}
.pvscale{color:var(--mut);font-size:13px;margin:-2px 0 12px}
.songbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 8px}
.songbar .sel{flex:1;min-width:160px}
.sgt{color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums;margin-left:auto}
.sgbar{height:3px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px}
.sgbar i{display:block;height:100%;width:0;background:#5ad1ff}
label.btn{display:inline-block}
.pv{position:relative;width:100%}.pv canvas{display:block}
.pk{position:relative;user-select:none;-webkit-user-select:none;touch-action:none;height:clamp(150px,15vw,260px);width:100%}
.pw{position:absolute;top:0;height:100%;background:#f4f4f5;border:1px solid #0a0a0b;border-radius:0 0 6px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:6px;font-size:clamp(6px,.75vw,10px);font-weight:700;color:#8a8a93;box-sizing:border-box;overflow:hidden}
.pb{position:absolute;top:0;height:62%;background:#1b1b1e;border:1px solid #333;border-radius:0 0 4px 4px;cursor:pointer;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:5px;font-size:clamp(5px,.65vw,9px);font-weight:700;color:#8a8a93;box-sizing:border-box;overflow:hidden}
.pw.win{background:#ead8ff;color:#5a1a99}.pb.win{background:#4a2275;color:#fff;border-color:#6b35a8}

.pw.dn,.pb.dn{background:var(--acc);color:#000}
.pvhelp{color:var(--mut);font-size:13px;line-height:1.6;margin-top:14px}
.pvhelp b{color:var(--fg)}
@media(max-width:520px){.grid{grid-template-columns:repeat(4,1fr)}}
.odd{position:relative;width:min(380px,100%);aspect-ratio:1;margin:8px auto 0}
.ob{position:absolute;width:22%;aspect-ratio:1;transform:translate(-50%,-50%);border:0;border-radius:50%;font:inherit;font-size:clamp(20px,6vw,30px);font-weight:800;color:#000;cursor:pointer;transition:.12s}

.ob.dim{opacity:.4}

.ob.good{box-shadow:0 0 0 5px var(--bg),0 0 0 8px #fff}

.odd .listen{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}

.tap{display:block;margin:22px auto 0;width:min(300px,80%);height:130px;border-radius:26px;border:2px solid var(--line);background:var(--card);color:var(--mut);font:inherit;font-weight:800;font-size:26px;cursor:default;transition:.08s;user-select:none;touch-action:manipulation}

.tap.on{border-color:var(--acc);color:var(--fg);cursor:pointer}
.tap.on:active,.tap.hit{background:var(--acc);color:#000;transform:scale(.97)}
.tl{position:relative;height:72px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin:18px auto 0;max-width:560px;overflow:hidden}

.tl .p{top:8px;height:24px;background:var(--fg)}
.tl .t{bottom:8px;height:24px;background:var(--acc)}

.nt.hh{background:transparent;color:#f4f4f5;font-size:28px;line-height:1;border-radius:0}
.nt.g1{background:var(--good);color:#000}.nt.g2{background:#ffe27a;color:#000}.nt.g3{background:#ff9f43;color:#000}.nt.miss{background:var(--bad);color:#000}
.nt.hh.g1{background:transparent;color:var(--good)}.nt.hh.g2{background:transparent;color:#ffe27a}.nt.hh.g3{background:transparent;color:#ff9f43}.nt.hh.miss{background:transparent;color:var(--bad)}
.ph{position:absolute;top:6%;bottom:10%;width:3px;left:6%;background:var(--acc);box-shadow:0 0 14px var(--acc);border-radius:2px;display:none}

<body>
<div id="app">
  <header>
    <div class="logo" onclick="menu()">pitch<span>.</span></div>
    <div class="status"><span class="dot" id="dot"></span><span id="stxt">piano: loading</span><label class="ld" id="ldl">load .sf2<input id="sff" type="file" accept=".sf2,.sf3" hidden></label><span class="ld" id="dfl" style="display:none">use default</span></div>
  </header>
  <main id="main"></main>
</div>

<script>
/* ============ AUDIO ============ */
const NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
let NN=true;try{const v=localStorage.getItem('notenames');if(v!==null)NN=v==='1';}catch(e){}
function applyNN(){
  document.body.classList.toggle('nonames',!NN);
  document.querySelectorAll('.nnbtn').forEach(b=>{b.textContent='Note names '+(NN?'on':'off');b.classList.toggle('on',NN);});
  if(typeof PV!=='undefined'&&PV.on&&typeof pvUpdate==='function')pvUpdate();
}
function setNN(v){NN=!!v;try{localStorage.setItem('notenames',NN?'1':'0')}catch(e){}applyNN();}
function bindNN(){document.querySelectorAll('.nnbtn').forEach(b=>b.onclick=()=>{setNN(!NN);b.blur();});applyNN();}
const mf=m=>440*Math.pow(2,(m-69)/12);
let revWet=null,revLong=null,revLongWet=null,ctx,master,reverb,samples={},sampleMode=false,sf=null,sfP=null,salP=null,voices=[];

/*SF2START*/
function parseSF2(buf){
  const dv=new DataView(buf),u8=new Uint8Array(buf);
  const id=o=>String.fromCharCode(u8[o],u8[o+1],u8[o+2],u8[o+3]);
  if(id(0)!=='RIFF'||id(8)!=='sfbk')throw new Error('not an sf2 file');
  const ch={};
  const walk=(p,e)=>{while(p+8<=e){const c=id(p),sz=dv.getUint32(p+4,true);
    if(c==='LIST')walk(p+12,p+8+sz);else ch[c]=[p+8,sz];p+=8+sz+(sz&1);}};
  walk(12,buf.byteLength);
  const rec=(k,size,fn)=>{const [o,s]=ch[k],r=[];for(let i=0;i+size<=s;i+=size)r.push(fn(o+i));return r;};
  const [so,ss]=ch.smpl;
  const pcm=(so%2)?new Int16Array(buf.slice(so,so+ss)):new Int16Array(buf,so,ss>>1);
  const shdr=rec('shdr',46,o=>({start:dv.getUint32(o+20,true),end:dv.getUint32(o+24,true),rate:dv.getUint32(o+36,true),ls:dv.getUint32(o+28,true),le:dv.getUint32(o+32,true),pitch:u8[o+40],corr:dv.getInt8(o+41)}));
  const gl=k=>rec(k,4,o=>({op:dv.getUint16(o,true),v:dv.getInt16(o+2,true),lo:u8[o+2],hi:u8[o+3]}));
  const pgen=gl('pgen'),igen=gl('igen');
  const pbag=rec('pbag',4,o=>dv.getUint16(o,true)),ibag=rec('ibag',4,o=>dv.getUint16(o,true));
  const phdr=rec('phdr',38,o=>dv.getUint16(o+24,true)),inst=rec('inst',22,o=>dv.getUint16(o+20,true));
  const zones=(bags,g,from,to)=>{const z=[];for(let i=from;i<to;i++)z.push(g.slice(bags[i],bags[i+1]));return z;};
  const toMap=a=>{const m={};a.forEach(g=>m[g.op]=g);return m;};
  const regions=[];
  const pz=zones(pbag,pgen,phdr[0],phdr[1]);
  let pglobal={};
  pz.forEach((z,zi)=>{
    const m=toMap(z);
    if(!m[41]){if(zi===0)pglobal=m;return;}
    const pv=m[44]||pglobal[44];
    const ii=m[41].v,iz=zones(ibag,igen,inst[ii],inst[ii+1]);
    let iglobal={};
    iz.forEach((q,qi)=>{
      const n=toMap(q);
      if(!n[53]){if(qi===0)iglobal=n;return;}
      const get=(op,def)=>n[op]?n[op].v:(iglobal[op]?iglobal[op].v:def);
      const kr=n[43]||iglobal[43],vr=n[44]||iglobal[44];
      const sid=n[53].v,h=shdr[sid];
      let vLo=vr?vr.lo:0,vHi=vr?vr.hi:127;
      if(pv){vLo=Math.max(vLo,pv.lo);vHi=Math.min(vHi,pv.hi);}
      let root=get(58,-1);if(root<0)root=(h.pitch===255?60:h.pitch);
      regions.push({sid,kLo:kr?kr.lo:0,kHi:kr?kr.hi:127,vLo,vHi,root,
        scale:get(56,100),tune:get(51,0)*100+get(52,0)+h.corr,
        pan:Math.max(-1,Math.min(1,get(17,0)/500)),fc:get(8,13500),att:Math.max(0,get(48,0)),loop:(get(54,0)&1)?1:0,atk:Math.min(3,Math.pow(2,get(34,-12000)/1200))});
    });
  });
  return {pcm,shdr,regions,cache:{}};
}
/*SF2END*/

function sfBuf(sid,F=sf){
  if(F.cache[sid])return F.cache[sid];
  const h=F.shdr[sid],n=h.end-h.start,buf=ctx.createBuffer(1,n,h.rate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=F.pcm[h.start+i]/32768;
  return F.cache[sid]=buf;
}
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('pitch-sf',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
const idbReq=async(mode,fn)=>{const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('f',mode),q=fn(t.objectStore('f'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);});};
const idbGet=k=>idbReq('readonly',o=>o.get(k));
const idbSet=(k,v)=>idbReq('readwrite',o=>o.put(v,k));
const idbDel=k=>idbReq('readwrite',o=>o.delete(k));
const SF_FILE='1_Giga_piano.sf2';
async function fetchSF(name){            // tries name.sf2 and name.SF2 (and the other casings of the extension)
  const base=name.replace(/\.sf[23]$/i,''),seen=new Set();
  for(const ext of ['.sf2','.SF2','.Sf2','.sf3','.SF3']){
    const n=base+ext;if(seen.has(n))continue;seen.add(n);
    try{const r=await fetch(n);if(r.ok)return {r,name:n};}catch(e){}
  }
  return null;
}
let sfSrc='',sfCustom=false;

// Load order: file you picked manually -> 1_Giga_piano.sf2 from this page's directory -> Salamander online -> synth
function loadSF2Auto(){
  if(sfP)return sfP;
  sfP=(async()=>{
    try{const c=await idbGet('custom');if(c&&c.buf){sf=parseSF2(c.buf);sfSrc=c.name;sfCustom=true;setStatus();return true;}}catch(e){}
    sfCustom=false;
    try{const f=await fetchSF(SF_FILE);if(f){sf=parseSF2(await f.r.arrayBuffer());sfSrc=f.name;setStatus();return true;}}catch(e){}
    return false;
  })();
  return sfP;
}
async function loadSF2File(file){
  try{
    const b=await file.arrayBuffer();sf=parseSF2(b);sfSrc=file.name;sfCustom=true;sfP=Promise.resolve(true);setStatus();
    try{await idbSet('custom',{buf:b,name:file.name})}catch(e){}
  }catch(e){alert('Could not read that soundfont: '+e.message);}
}
async function useDefaultSF(){
  try{await idbDel('custom')}catch(e){}
  sf=null;sfP=null;sfSrc='';sfCustom=false;setStatus();
  const ok=await loadSF2Auto();
  if(!ok&&ctx&&!sampleMode)await loadSamples();
  setStatus();
}

function initAudio(){
  if(ctx){ if(ctx.state==='suspended')ctx.resume(); return; }
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  const comp=ctx.createDynamicsCompressor();
  master=ctx.createGain(); master.gain.value=.9;
  master.connect(comp); comp.connect(ctx.destination);
  const len=ctx.sampleRate*1.6, ir=ctx.createBuffer(2,len,ctx.sampleRate);
  for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.2);}
  reverb=ctx.createConvolver(); reverb.buffer=ir;
  const rg=ctx.createGain(); rg.gain.value=.16; reverb.connect(rg); rg.connect(comp);
  revWet=rg;
  // second, longer tail that only opens up when sustain is on (feeds off the first reverb)
  const llen=ctx.sampleRate*3.6, lir=ctx.createBuffer(2,llen,ctx.sampleRate);
  for(let c=0;c<2;c++){const d=lir.getChannelData(c);for(let i=0;i<llen;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/llen,2.6);}
  const lc=ctx.createConvolver(); lc.buffer=lir;
  revLong=ctx.createGain(); revLong.gain.value=0;
  revLongWet=ctx.createGain(); revLongWet.gain.value=.5;
  reverb.connect(revLong); revLong.connect(lc); lc.connect(revLongWet); revLongWet.connect(comp);
  salP=loadSF2Auto().then(ok=>ok?null:loadSamples());
}

// Fallback: Salamander Grand (hosted for Tone.js)
async function loadSamples(){
  const base='https://tonejs.github.io/audio/salamander/';
  const jobs=[];
  for(let o=2;o<=6;o++)[['C',0],['Ds',3],['Fs',6],['A',9]].forEach(([n,s])=>{
    const midi=12*(o+1)+s;
    jobs.push(fetch(base+n+o+'.mp3').then(r=>{if(!r.ok)throw 0;return r.arrayBuffer()})
      .then(b=>ctx.decodeAudioData(b)).then(buf=>{samples[midi]=buf;}).catch(()=>{}));
  });
  await Promise.all(jobs);
  sampleMode=Object.keys(samples).length>=8;
  setStatus();
}
function setStatus(){
  const d=document.getElementById('dot'),t=document.getElementById('stxt');
  document.getElementById('dfl').style.display=sfCustom?'inline':'none';
  if(sf){d.className='dot ok';t.textContent='piano: '+sfSrc;}
  if(curInst!=='grand'){const n=INSTR[curInst].label;t.textContent=(sf?t.textContent+' · ':'')+'instrument: '+n+(instSF[curInst]?'':instErr[curInst]?' ('+INSTR[curInst].file+' not found, using piano)':' (loading…)');}
  else if(sampleMode){d.className='dot ok';t.textContent='piano: sampled grand (no sf2 found)';}
  else{d.className='dot synth';t.textContent='piano: synth (no sf2 found)';}
}

// voice tracking so a sequence can be cut off cleanly
function trackVoice(env,end){const n=ctx.currentTime;voices=voices.filter(v=>v.end>n);voices.push({env,end});}
function fadeVoices(){
  if(!ctx)return;const n=ctx.currentTime;
  voices.filter(v=>v.end>n).forEach(({env})=>{try{env.gain.cancelScheduledValues(n);env.gain.setValueAtTime(env.gain.value,n);env.gain.linearRampToValueAtTime(0,n+.15);}catch(e){}});
  voices=[];
}

function mkHandle(env){return {release(r=.35){if(!ctx)return;const n=ctx.currentTime;try{env.gain.cancelScheduledValues(n);env.gain.setValueAtTime(Math.max(env.gain.value,.0005),n);env.gain.exponentialRampToValueAtTime(.0005,n+r);}catch(e){}}};}
function playSF(midi,dur,vel,t,F=sf){
  const mk=Math.round(midi);
  const vi=Math.max(1,Math.round(vel*127));
  let rs=F.regions.filter(r=>mk>=r.kLo&&mk<=r.kHi&&vi>=r.vLo&&vi<=r.vHi);
  if(!rs.length)return null;
  rs=rs.filter(r=>r.vLo===rs[0].vLo&&r.vHi===rs[0].vHi); // layers overlap at their edges: use one
  const env=ctx.createGain(),peak=.5+.5*vel;
  const atk=F===sf?0:Math.min(dur*.6,Math.max(.012,F.regions.length?(rs[0].atk>.02?rs[0].atk:.012):.012));
  if(atk>.013){env.gain.setValueAtTime(.0001,t);env.gain.linearRampToValueAtTime(peak,t+atk);}else env.gain.setValueAtTime(peak,t);
  env.gain.setValueAtTime(peak,t+dur);
  env.gain.exponentialRampToValueAtTime(.001,t+dur+.5);
  env.connect(master);env.connect(reverb);
  rs.forEach(r=>{
    const src=ctx.createBufferSource();src.buffer=sfBuf(r.sid,F);
    if(r.loop){const h=F.shdr[r.sid];if(h.le>h.ls+8){src.loop=true;src.loopStart=(h.ls-h.start)/h.rate;src.loopEnd=(h.le-h.start)/h.rate;}}
    src.playbackRate.value=Math.pow(2,((midi-r.root)*r.scale+r.tune)/1200);
    let node=src;
    if(r.fc<13500){const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=Math.min(20000,8.176*Math.pow(2,r.fc/1200));lp.Q.value=.7;node.connect(lp);node=lp;}
    const g=ctx.createGain();g.gain.value=Math.pow(10,-r.att/200);node.connect(g);node=g;
    if(ctx.createStereoPanner){const p=ctx.createStereoPanner();p.pan.value=r.pan;node.connect(p);node=p;}
    node.connect(env);src.start(t);src.stop(t+dur+.6);
  });
  trackVoice(env,t+dur+.6);
  return env;
}

function playPiano(midi,dur=2.2,vel=.8,when=0){
  initAudio();
  const t=ctx.currentTime+when+.01;
  const F=activeSF();
  if(F){const e=playSF(midi,dur,vel,t,F);if(e)return mkHandle(e);}
  if(sampleMode){
    const keys=Object.keys(samples).map(Number);
    const near=keys.reduce((a,b)=>Math.abs(b-midi)<Math.abs(a-midi)?b:a);
    const src=ctx.createBufferSource(); src.buffer=samples[near];
    src.playbackRate.value=Math.pow(2,(midi-near)/12);
    const g=ctx.createGain();
    g.gain.setValueAtTime(vel,t);
    g.gain.setValueAtTime(vel,t+dur);
    g.gain.exponentialRampToValueAtTime(.001,t+dur+.5);
    src.connect(g); g.connect(master); g.connect(reverb);
    src.start(t); src.stop(t+dur+.6);
    trackVoice(g,t+dur+.6);
    return mkHandle(g);
  }
  // additive synth fallback
  const f0=mf(midi), B=.0004, out=ctx.createGain();
  const lp=ctx.createBiquadFilter(); lp.type='lowpass';
  lp.frequency.setValueAtTime(Math.min(9000,f0*14),t);
  lp.frequency.exponentialRampToValueAtTime(Math.max(900,f0*2.5),t+dur);
  out.gain.setValueAtTime(vel*.38,t);
  out.gain.setValueAtTime(vel*.38,t+dur);
  out.gain.exponentialRampToValueAtTime(.0005,t+dur+.35);
  out.connect(lp); lp.connect(master); lp.connect(reverb);
  trackVoice(out,t+dur+.5);
  const decayBase=Math.max(.8,3.4-midi/30);
  for(let n=1;n<=10;n++){
    const f=f0*n*Math.sqrt(1+B*n*n); if(f>12000)break;
    for(const det of [-1.2,1.2]){
      const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=f; o.detune.value=det*(1+n*.05);
      const g=ctx.createGain(), amp=(1/Math.pow(n,1.15))*(n%2===0?.8:1)*.5;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(amp,t+.004);
      g.gain.exponentialRampToValueAtTime(.0005,t+decayBase/(1+n*.35)+.3);
      o.connect(g); g.connect(out); o.start(t); o.stop(t+dur+.5);
    }
  }
  const nb=ctx.createBuffer(1,ctx.sampleRate*.05,ctx.sampleRate), d=nb.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
  const ns=ctx.createBufferSource(); ns.buffer=nb;
  const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=Math.min(4000,f0*4); bp.Q.value=.8;
  const ng=ctx.createGain(); ng.gain.value=.25*vel;
  ns.connect(bp); bp.connect(ng); ng.connect(out); ns.start(t);
  return mkHandle(out);
}
const CHORDS={maj:[0,4,7],min:[0,3,7],aug:[0,4,8],dim:[0,3,6]};
const CHORD_NAMES={maj:'major',min:'minor',aug:'augmented',dim:'diminished'};
const chordIv=q=>CHORDS[q]||CHORDS.maj;
function playChord(root,q,dur=1.7){
  chordIv(q).forEach((i,k)=>playPiano(root+i,dur,.72,k*.03));
}
function playArp(root,q){
  [...chordIv(q),12].forEach((i,k,a)=>playPiano(root+i,k===a.length-1?1.8:.9,.75,k*.35));

/* ----- timed sequences (cancelled whenever the round ends / menu opens) ----- */
let timers=[],seqId=0;
function cancelSeq(){try{spStop();}catch(e){}try{if(POLY.out){POLY.out.gain.setTargetAtTime(0,ctx.currentTime,.02);POLY.out=null;}}catch(e){}try{clearInterval(SPN.iv);if(SPN.in){SPN.in.gain.cancelScheduledValues(0);SPN.in.gain.setTargetAtTime(0,ctx.currentTime,.03);SPN.in=null;}}catch(e){}seqId++;timers.forEach(clearTimeout);timers=[];stopHeld();fadeVoices();}
function later(ms,fn){const id=seqId;timers.push(setTimeout(()=>{if(id===seqId)fn();},ms));}
function seq(steps){ // steps: [[ms,fn],...] — waits for the piano to be ready first
  cancelSeq();const id=seqId;
  pianoReady().then(()=>{if(id!==seqId)return;steps.forEach(([ms,fn])=>later(ms,fn));});
}

// pure sine for the pitch-match game (target)
function pureTone(freq,secs){
  initAudio();
  const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;
  o.type='sine';o.frequency.value=freq;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.35,t+.04);
  g.gain.setValueAtTime(.35,t+secs-.1);g.gain.linearRampToValueAtTime(0,t+secs);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+secs+.05);
  return o;
}

  pvStop();
  S={key:k,round:0,score:0,rounds:({hl:20,odd:10,rhythm:10,spatial:10,hold:5})[k]||5};
  ({match:gMatch,note:gNote,chord:gChord,hl:gHL,odd:gOdd,rhythm:gRhythm,spatial:gSpatial,hold:gHold,song:gSong,poly:gPoly})[k]();
}

/* ============ GAME 1: MATCH THE TONE ============ */
const FMIN=150,FMAX=1000,SL=(FMAX-FMIN)*100;  // one slider step = exactly 0.01 Hz
const s2f=v=>FMIN+v/100;
const hz=f=>f.toFixed(2);
function gMatch(){
  S.title='Match the tone';S.max=100;
  S.start=()=>{
    cancelSeq();
    S.target=Math.round(Math.exp(rnd(Math.log(200),Math.log(800)))*100)/100;
    S.done=false;
    M.innerHTML=header('Match the tone')+`<div class="stage">
      <div class="big" id="bigm">♪</div>
      <div class="hint" id="hm">Listen closely…</div>
      <input type="range" id="sl" min="0" max="${SL}" value="${ri(5000,SL-5000)}" disabled>
      <div class="row" style="margin-top:0"><button class="btn acc" id="sub" disabled>Lock in</button></div>
      <div class="result" id="res"><div class="res-sub">Arrow keys nudge the slider by 0.01 Hz.</div></div></div>`;
    const sl=$('sl');
    const startMine=()=>{
      initAudio();
      const o=ctx.createOscillator(),g=ctx.createGain(),n=ctx.currentTime;
      o.type='sine';o.frequency.value=s2f(+sl.value);
      g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(.3,n+.05);
      o.connect(g);g.connect(master);o.start();held={o,g};
    };
    const showLive=()=>{$('hm').innerHTML=`Your tone: <span class="live">${hz(s2f(+sl.value))} Hz</span>`;};
    sl.addEventListener('input',()=>{
      if(S.done)return;
      if(held)held.o.frequency.setTargetAtTime(s2f(+sl.value),ctx.currentTime,.01);
      showLive();
    });
    $('sub').onclick=()=>{
      if(S.done)return;S.done=true;stopHeld();
      const g=s2f(+sl.value),cents=1200*Math.log2(g/S.target),ac=Math.abs(cents);
      const pts=Math.round(Math.max(0,100*(1-ac/200)));
      S.score+=pts;$('sc').textContent=S.score;
      $('bigm').textContent=hz(S.target)+' Hz';
      $('hm').textContent='You: '+hz(g)+' Hz';
      $('res').innerHTML=`<div class="pts ${pts>80?'g':pts>40?'a':'b'}">+${pts}</div>
        <div class="res-sub">${ac<1?'Perfect.':Math.round(ac)+' cents '+(cents>0?'sharp':'flat')+' · '+Math.abs(g-S.target).toFixed(2)+' Hz off'}</div>
        <div class="row"><button class="btn acc" onclick="nextOrEnd()">${S.round+1>=S.rounds?'Finish':'Next'}</button></div>`;
      $('sub').disabled=true;sl.disabled=true;
    };
    initAudio();
    pureTone(S.target,2);
    later(2050,()=>{
      sl.disabled=false;$('sub').disabled=false;
      showLive();
      startMine();                      // your tone now sounds constantly while you slide
    });
  };
  S.start();
}

/* ============ PIANO UI ============ */
const LOW=48,HIGH=83; // C3..B5
function buildPiano(onKey){
  const whites=[],blacks=[];
  for(let m=LOW;m<=HIGH;m++){NAMES[m%12].includes('#')?blacks.push(m):whites.push(m);}
  const W=whites.length;
  let h=`<div class="pianoWrap"><div class="piano" id="piano">`;
  whites.forEach(m=>h+=`<div class="wk" data-m="${m}"><i class="kn">${label(m)}</i></div>`);
  blacks.forEach(m=>{
    const wi=whites.filter(w=>w<m).length; // white keys to the left
    h+=`<div class="bk" data-m="${m}" style="left:calc(${wi/W*100}% - 1.6%)"><i class="kn">${label(m)}</i></div>`;
  });
  return h+`</div></div>`;
}
function bindPiano(fn){

const HL_CENTS=Array.from({length:20},(_,i)=>Math.round(100-i*99/19));   // 20 rounds, a constant step from 100 cents down to 1 cent
function gHL(){
  S.title='Higher or lower';S.max=10;
  const pool=Array.from({length:19},(_,i)=>i+1);S.same=new Set();     // four surprise "same" rounds

  S.start=()=>{
    const cents=S.same.has(S.round)?0:HL_CENTS[S.round];

    document.querySelectorAll('#hlseg button').forEach(b=>b.onclick=()=>{

/* ============ GAME 7: RHYTHM ============ */
const BPM=80,SPB=60/BPM,BARB=4;            // one 4-beat bar per round
let pc=null,pcP=null,pcSrc='',pcKeysCache=null;
const PC_FILE='Percussion.sf2';
function loadPercAuto(){
  if(pcP)return pcP;
  pcP=(async()=>{
    try{const c=await idbGet('perc');if(c&&c.buf){pc=parseSF2(c.buf);pcSrc=c.name;pcKeysCache=null;return true;}}catch(e){}
    try{const f=await fetchSF(PC_FILE);if(f){pc=parseSF2(await f.r.arrayBuffer());pcSrc=f.name;pcKeysCache=null;return true;}}catch(e){}
    return false;
  })();
  return pcP;
}
async function loadPercFile(file){
  try{
    const b=await file.arrayBuffer();pc=parseSF2(b);pcSrc=file.name;pcKeysCache=null;pcP=Promise.resolve(true);
    try{await idbSet('perc',{buf:b,name:file.name})}catch(e){}
  }catch(e){alert('Could not read that soundfont: '+e.message);}
  pcStatus();
}
function pcStatus(){
  const el=$('pcs');if(!el)return;
  el.innerHTML=pc?`percussion: ${pcSrc}`:`${PC_FILE} not found next to this page, so synth sounds are used. <label class="ld">load ${PC_FILE}<input id="pcf" type="file" accept=".sf2" hidden></label>`;
  const f=$('pcf');if(f)f.onchange=e=>{if(e.target.files[0])loadPercFile(e.target.files[0]);};
}
function percKeys(){
  if(pcKeysCache)return pcKeysCache;
  const set=new Set();pc.regions.forEach(r=>{for(let k=r.kLo;k<=r.kHi;k++)set.add(k);});
  return pcKeysCache=[...set].sort((a,b)=>a-b);
}
function percBuf(sid){
  if(pc.cache[sid])return pc.cache[sid];
  const h=pc.shdr[sid],n=h.end-h.start,b=ctx.createBuffer(1,n,h.rate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=pc.pcm[h.start+i]/32768;
  return pc.cache[sid]=b;
}
function drumKeys(){
  const c=pc?percKeys():null;
  const pickK=(cands,avoid)=>{
    if(!c)return cands.find(k=>!avoid.includes(k));
    const a=cands.find(k=>c.includes(k)&&!avoid.includes(k));
    if(a!==undefined)return a;
    const b=c.find(k=>!avoid.includes(k));return b!==undefined?b:c[0];
  };
  const main=pickK([38,37,56,76],[]),low=pickK([36,45,77,35],[main]);
  const tick=pickK([42,75,44,37],[main,low]),tap=pickK([39,76,56,40],[main,low,tick]);
  const kick=pickK([36,35],[]),snare=pickK([38,40,37],[kick]),hat=pickK([42,44,46],[kick,snare]),met=pickK([75,76,77,56],[kick,snare,hat]);
  return {main,low,tick,tap,kick,snare,hat,met};
}
function synthHit(key,t,vel,dst=master){
  const g=ctx.createGain();g.connect(dst);
  if(key<41){
    const o=ctx.createOscillator();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);
    g.gain.setValueAtTime(.9*vel,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);
    o.connect(g);o.start(t);o.stop(t+.25);
  }else{
    const n=Math.floor(ctx.sampleRate*.12),b=ctx.createBuffer(1,n,ctx.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
    const s=ctx.createBufferSource();s.buffer=b;
    const f=ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=900+((key*37)%1800);
    s.connect(f);f.connect(g);g.gain.value=.8*vel;s.start(t);
  }
}
function playPerc(key,t,vel=.85,dst=master){
  if(!pc)return synthHit(key,t,vel,dst);
  const vi=Math.max(1,Math.round(vel*127));
  let rs=pc.regions.filter(r=>key>=r.kLo&&key<=r.kHi&&vi>=r.vLo&&vi<=r.vHi);
  if(!rs.length)return synthHit(key,t,vel,dst);
  rs=rs.filter(r=>r.vLo===rs[0].vLo&&r.vHi===rs[0].vHi);
  const env=ctx.createGain();env.gain.value=.5+.5*vel;env.connect(dst);
  rs.forEach(r=>{
    const src=ctx.createBufferSource();src.buffer=percBuf(r.sid);
    src.playbackRate.value=Math.pow(2,((key-r.root)*r.scale+r.tune)/1200);
    let node=src;
    const g=ctx.createGain();g.gain.value=Math.pow(10,-r.att/200);node.connect(g);node=g;
    if(ctx.createStereoPanner){const p=ctx.createStereoPanner();p.pan.value=r.pan;node.connect(p);node=p;}
    node.connect(env);src.start(t);src.stop(t+3);
  });
}

const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const rpick=a=>a[ri(0,a.length-1)];
const shufflePick=(a,n)=>a.slice().sort(()=>Math.random()-.5).slice(0,n);
// Pattern = events {t: beat position inside the bar, l: 0 main sound / 1 low sound}. Gets harder each round.
function genPattern(r){
  const E=(ts,l=0)=>ts.map(t=>({t,l}));
  const grid=(step,n)=>{const all=[];for(let t=step;t<BARB-1e-9;t+=step)all.push(+t.toFixed(4));return [0,...shufflePick(all,n-1)];};
  let ev,label;
  switch(r){
    case 0:ev=E([0,1,2,3]);label='Steady quarter notes';break;
    case 1:ev=E([0,...shufflePick([1,2,3],ri(1,2))]);label='Quarter notes with rests';break;
    case 2:ev=E([0,...shufflePick([1,2,3],2),...shufflePick([.5,1.5,2.5,3.5],2)]);label='Eighth-note off-beats';break;
    case 3:ev=E(grid(.5,ri(6,7)));label='Eighth-note groove';break;
    case 4:ev=E(grid(.25,ri(5,6)));label='Syncopation';break;
    case 5:ev=E(grid(.25,ri(7,8)));label='Sixteenth notes';break;
    case 6:ev=E(grid(1/3,ri(6,7)));label='Triplets';break;
    case 7:{
      let ts,anyT;
      do{ts=[];anyT=false;
        for(let b=0;b<4;b++){const T=Math.random()<.5;anyT=anyT||T;
          (T?[0,1/3,2/3]:[0,.5]).forEach((x,i)=>{if(i===0||Math.random()<.75)ts.push(+(b+x).toFixed(4));});}
      }while(ts.length<6||!anyT);
      ev=E(ts);label='Triplets mixed with straight notes';break;}
    default:{
      const [p,q]=rpick(r===8?[[3,4],[3,2]]:[[5,4],[5,3],[7,4]]);
      ev=[...E(Array.from({length:p},(_,k)=>+(k*BARB/p).toFixed(4))),...E(Array.from({length:q},(_,k)=>+(k*BARB/q).toFixed(4)),1)];
      label=`Polyrhythm ${p}:${q}`;}
  }
  ev.sort((a,b)=>a.t-b.t||a.l-b.l);
  ev=ev.filter((e,i)=>!i||e.t-ev[i-1].t>1e-6);
  return {ev,label};
}

// Judging: Timing (60%) how close each hit is - 100 ms off is ~45% for that hit, not zero.
// Steadiness (25%) how even your offsets are (a steady player who is consistently a bit late keeps this).
// Cleanliness (15%) hit every note, no extra / wrong-key taps.
function hitScore(d){d=Math.abs(d);if(d<=.03)return 1;if(d<=.1)return 1-.55*(d-.03)/.07;if(d<=.2)return .45-.35*(d-.1)/.1;if(d<=.3)return .1*(1-(d-.2)/.1);return 0;}
function judge(ev,taps,spb){            // ev: {t in beats, key?}  taps: {t in seconds, key?}
  const used=new Set(),match=[];
  ev.forEach((e,ei)=>{
    const tt=e.t*spb;let bi=-1,bd=9;
    taps.forEach((tp,i)=>{if(used.has(i)||(e.key&&tp.key!==e.key))return;const d=Math.abs(tp.t-tt);if(d<bd){bd=d;bi=i;}});
    if(bi>=0&&bd<=.3){used.add(bi);match[ei]={i:bi,dt:taps[bi].t-tt};}
  });
  const n=ev.length,ms=match.filter(Boolean),m=ms.length,extra=taps.length-used.size;
  const timing=ms.reduce((a,x)=>a+hitScore(x.dt),0)/n;
  let steady=0,sd=0,avg=0;
  if(m)avg=ms.reduce((a,x)=>a+x.dt,0)/m;
  if(m>=2){sd=Math.sqrt(ms.reduce((a,x)=>a+(x.dt-avg)*(x.dt-avg),0)/m);steady=Math.max(0,1-sd/.1)*(m/n);}
  else if(m===1&&n===1)steady=1;
  const clean=(m/n)*(1-Math.min(1,extra/n));
  const pts=Math.round(60*timing+25*steady+15*clean);
  return {pts,timing,steady,clean,match,used,extra,m,n,avgMs:avg*1000,sdMs:sd*1000};
}
const rateOf=p=>p>=92?'Perfect':p>=80?'Great':p>=65?'Good':p>=50?'Okay':'Keep practicing';
const pc100=x=>Math.round(x*100)+'%';
function breakdown(r){
  return `Timing ${pc100(r.timing)} · Steadiness ${pc100(r.steady)} · Clean ${pc100(r.clean)}<br>${r.m}/${r.n} hits${r.extra?` · ${r.extra} extra`:''}${r.m?` · avg ${Math.abs(Math.round(r.avgMs))} ms ${r.avgMs<0?'early':'late'}`:''}`;
}

function gRhythm(){
  S.title='Rhythm';S.max=100;
  S.start=()=>{
    const {ev,label}=genPattern(S.round);
    S.ev=ev;S.label=label;S.phase='idle';S.done=false;S.heard=false;S.taps=[];
    M.innerHTML=header('Rhythm')+`<div class="stage">
      <div class="big" id="bigm">♪</div>
      <div class="hint" id="hm">Press Listen, then Record and tap the pattern back.</div>
      <div class="row" style="margin-top:0"><button class="btn acc" id="rl">▶ Listen</button><button class="btn ghost" id="rr" disabled>● Record</button></div>
      <button class="tap" id="tap" disabled>TAP<small>or press Space</small></button>
      <div class="result" id="res"></div>
      <div class="pvhelp" id="pcs"></div></div>`;
    $('rl').onclick=()=>rhRun('listen');
    $('rr').onclick=()=>rhRun('rec');
    $('tap').addEventListener('pointerdown',e=>{e.preventDefault();rhTap(e.timeStamp);});
    pcStatus();loadPercAuto().then(pcStatus);

}
function rhBtns(){
  if(!$('rl'))return;
  const busy=S.phase==='listen'||S.phase==='rec';
  $('rl').disabled=busy||S.done;
  $('rr').disabled=busy||S.done||!S.heard;
  $('tap').disabled=S.phase!=='rec';
  $('tap').classList.toggle('on',S.phase==='rec');
}
function rhRun(mode){
  if(S.phase==='listen'||S.phase==='rec'||S.done)return;
  initAudio();
  loadPercAuto().then(()=>{
    if(S.phase==='listen'||S.phase==='rec'||S.done||!$('rl'))return;
    cancelSeq();
    pcStatus();
    const K=S.keys=drumKeys(),lat=(ctx.outputLatency||0)+(ctx.baseLatency||0);
    const a0=ctx.currentTime+.2,bar=a0+4*SPB;
    for(let k=0;k<4;k++)playPerc(K.tick,a0+k*SPB,k===0?.75:.55);               // count-in
    if(mode==='listen')S.ev.forEach(e=>playPerc(e.l?K.low:K.main,bar+e.t*SPB,.9));
    S.perfBar=performance.now()+(bar-ctx.currentTime)*1000+lat*1000;           // when the downbeat is heard, in performance.now() time
    S.taps=[];S.phase=mode;rhBtns();
    $('res').innerHTML='';
    $('hm').textContent=mode==='listen'?'Listen…':'Get ready…';
    for(let k=0;k<4;k++)later(200+k*SPB*1000,()=>{$('bigm').textContent=k+1;});
    later(200+4*SPB*1000,()=>{$('bigm').textContent=mode==='listen'?'♪':'Tap!';$('hm').textContent=mode==='listen'?'Listen to the pattern':'Your turn';});
    if(mode==='listen')later(200+8*SPB*1000+300,()=>{S.phase='idle';S.heard=true;$('bigm').textContent='♪';$('hm').textContent='Listen again, or press Record when ready.';rhBtns();});
    else later(200+8*SPB*1000+500,rhFinish);
  });
}
function rhTap(ts){
  if(S.phase!=='rec'||!ctx)return;
  const rel=(ts-S.perfBar)/1000;
  if(rel<-.3||rel>BARB*SPB+.5)return;
  S.taps.push(rel);
  playPerc(S.keys.tap,ctx.currentTime,.9);
  const t=$('tap');if(t){t.classList.add('hit');setTimeout(()=>t.classList.remove('hit'),80);}
}
function rhFinish(){
  S.phase='idle';S.done=true;rhBtns();
  const r=judge(S.ev.map(e=>({t:e.t})),S.taps.map(t=>({t})),SPB),pts=r.pts;
  S.score+=pts;$('sc').textContent=S.score;
  const total=BARB*SPB,X=t=>(4+92*Math.max(0,Math.min(1,t/total)))+'%';
  const tl=`<div class="tl">${[1,2,3].map(b=>`<i class="g" style="left:${X(b*SPB)}"></i>`).join('')}
    ${S.ev.map(e=>`<i class="p" style="left:${X(e.t*SPB)}"></i>`).join('')}
    ${S.taps.map((t,i)=>`<i class="t${r.used.has(i)?'':' x'}" style="left:${X(t)}"></i>`).join('')}</div>`;
  $('bigm').textContent=pts+'%';
  $('hm').textContent=`${rateOf(pts)} · ${S.label}`;
  $('res').innerHTML=`<div class="pts ${pts>=65?'g':pts>=50?'a':'b'}">+${pts}</div>
    <div class="res-sub">${breakdown(r)}</div>
    ${tl}<div class="res-sub">white = the rhythm · purple = your taps${r.extra?' · red = extra':''}</div>
    <div class="row"><button class="btn ghost" id="rl2">Hear it again</button><button class="btn acc" onclick="nextOrEnd()">${S.round+1>=S.rounds?'Finish':'Next'}</button></div>`;
  $('rl2').onclick=()=>{ // replay the answer (no scoring effect)
    initAudio();cancelSeq();const K=S.keys,t0=ctx.currentTime+.15;
    S.ev.forEach(e=>playPerc(e.l?K.low:K.main,t0+e.t*SPB,.9));
  };
}

function humOn(dur){                         // low hum; with dur it fades out by itself at exactly that time
  initAudio();
  const o=ctx.createOscillator(),o2=ctx.createOscillator(),lfo=ctx.createOscillator(),lg=ctx.createGain(),g=ctx.createGain(),lp=ctx.createBiquadFilter();
  o.type='sawtooth';o.frequency.value=55;o2.type='sine';o2.frequency.value=110.4;lp.type='lowpass';lp.frequency.value=240;
  lfo.frequency.value=4.5;lg.gain.value=.08;lfo.connect(lg);lg.connect(g.gain);
  const n=ctx.currentTime+.05;g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(.2,n+.03);
  o.connect(lp);o2.connect(lp);lp.connect(g);g.connect(master);
  const h={o,o2,lfo,g};
  [o,o2,lfo].forEach(x=>x.start(n));
  if(dur){const e=n+dur/1000;g.gain.setValueAtTime(.2,e-.03);g.gain.linearRampToValueAtTime(0,e);[o,o2,lfo].forEach(x=>x.stop(e+.02));}
  return h;
}
function humOff(h){
  if(!h)return;
  try{const n=ctx.currentTime;h.g.gain.cancelScheduledValues(n);h.g.gain.setValueAtTime(h.g.gain.value,n);h.g.gain.linearRampToValueAtTime(0,n+.05);[h.o,h.o2,h.lfo].forEach(x=>x.stop(n+.07));}catch(e){}
}
// calm abstract motion: a soft orb that breathes, with slow rings drifting outward (muted violet to blue)
let HA=null;
function holdAnimOn(el){
  holdAnimOff(el);
  const hb=el,tm=setInterval(()=>{
    const r=document.createElement('i');r.className='hring';hb.appendChild(r);setTimeout(()=>r.remove(),2200);
  },520);
  HA={tm,on:true};
  const loop=()=>{
    if(!HA||!HA.on)return;
    const x=performance.now(),h=250+22*Math.sin(x/1800);
    hb.style.background=`radial-gradient(circle at ${50+10*Math.sin(x/1300)}% ${50+10*Math.cos(x/1700)}%,hsl(${h},45%,58%),hsl(${h+25},40%,30%))`;
    hb.style.transform=`scale(${1+.04*Math.sin(x/700)})`;
    hb.style.boxShadow=`0 0 ${50+14*Math.sin(x/900)}px hsla(${h},50%,55%,.4)`;
    requestAnimationFrame(loop);
  };
  loop();
}
function holdAnimOff(el){
  if(HA){HA.on=false;clearInterval(HA.tm);HA=null;}
  if(el){el.style.background='';el.style.transform='';el.style.boxShadow='';el.querySelectorAll('.hring').forEach(r=>r.remove());}
}
function gHold(){
  S.title='Hold it';S.max=100;
  S.start=()=>{
    S.target=ri(100,500)*10;S.phase='idle';S.done=false;S.heard=false;
    M.innerHTML=header('Hold it')+`<div class="stage">
      <div class="big" id="bigm">?</div>
      <div class="hint" id="hm">Press Go and listen. The hum plays for a secret length of time, between 1 and 5 seconds. Then hold the circle for exactly as long.</div>
      <button class="holdb" id="hb" disabled>HOLD<small>or Space</small></button>
      <div class="row"><button class="btn acc" id="go">▶ Go</button></div>
      <div class="result" id="res"></div></div>`;
    $('hb').addEventListener('pointerdown',e=>{e.preventDefault();holdDown(e.timeStamp);});
    $('go').onclick=()=>{
      if(S.phase!=='idle'||S.done)return;

      $('bigm').textContent='Listen…';$('hm').textContent='Remember how long it lasts.';
      HD=humOn(S.target);
      later(50,()=>holdAnimOn($('hb')));
      later(50+S.target,()=>{holdAnimOff($('hb'));S.phase='idle';S.heard=true;$('go').disabled=false;$('go').textContent='▶ Listen again';$('hb').disabled=false;$('bigm').textContent='Your turn';$('hm').textContent='Press and hold the circle for the same length of time, then let go.';});
    };
  };
  S.start();
}
let HD=null;
function holdDown(ts){
  if(S.key!=='hold'||S.done||S.phase!=='idle'||!S.heard||!$('hb'))return;
  initAudio();S.phase='hold';S.t0=ts;$('go').disabled=true;
  HD=humOn();holdAnimOn($('hb'));$('bigm').textContent='…';$('hm').textContent='Holding';
}
function holdUp(ts){
  if(S.phase!=='hold'||S.done)return;
  S.phase='done';S.done=true;
  humOff(HD);HD=null;holdAnimOff($('hb'));
  const held=Math.round(ts-S.t0),err=held-S.target,ae=Math.abs(err);
  const pts=Math.round(100*Math.max(0,1-ae/1000));
  S.score+=pts;$('sc').textContent=S.score;
  $('hb').disabled=true;$('go').style.display='none';
  $('bigm').textContent=(held/1000).toFixed(3)+'s';
  $('hm').textContent=`Target ${S.target} ms · you held ${held} ms`;
  $('res').innerHTML=`<div class="pts ${pts>=85?'g':pts>=50?'a':'b'}">+${pts}</div>
    <div class="res-sub">${ae<=10?'Basically perfect.':ae+' ms '+(err<0?'too short':'too long')} (${err>0?'+':''}${err} ms)</div>
    <div class="row"><button class="btn acc" onclick="nextOrEnd()">${S.round+1>=S.rounds?'Finish':'Next'}</button></div>`;
}

    };

function gsShow(){
  const bar=$('pbar');if(!bar)return;

  bar.innerHTML=`<div class="un" style="width:${(S.stage+1)/n*100}%"></div><i id="pfill"></i>`+SONG_DUR.map((d,i)=>`<b class="tk" style="left:${(i+1)/n*100}%"></b>`).join('');
  $('pl').innerHTML=SONG_DUR.map((d,i)=>`<span style="color:${i<=S.stage?'var(--fg)':'var(--mut)'}">${d}s</span>`).join('');

  $('gsn').style.display=S.stage>=n-1?'none':'';$('gsg').style.display=S.cur&&!S.done&&S.stage>=n-1?'':'none';
  if(S.cur&&!S.done)$('hm').textContent=`Clip ${S.stage+1} of ${n} (${SONG_DUR[S.stage]} s) · a correct guess now earns ${SONG_PTS[S.stage]}`;
}
function gsAnim(tk){                           // fill the bar piecewise: every tick is one equal slot, however short the clip
  const f=$('pfill');if(!f||S.animTk!==tk)return;
  const n=SONG_DUR.length;let frac=0;
  if(S.t0>0||S.t0===-1){
    const t=S.t0===-1?S.cd:Math.min(S.cd,(performance.now()-S.t0)/1000);
    let k=0;while(k<n-1&&t>SONG_DUR[k]+1e-9)k++;
    const prev=k?SONG_DUR[k-1]:0;frac=(k+Math.min(1,(t-prev)/(SONG_DUR[k]-prev)))/n;
  }

}
function gsPlay(){spClip(S.off,SONG_DUR[S.stage]);const tk=S.animTk=(S.animTk||0)+1;const f=$('pfill');if(f)f.style.width='0';gsAnim(tk);}

function gsGuess(i){
  if(S.done||!S.cur)return;

  $('gsin').value='';$('gsul').innerHTML='';S.sug=[];

/* ============ GAME 8: 8D AUDIO ============ */
/* A ~5 second randomised mini-song (chords, bass, melody, kick/snare/hats) starts at point A and orbits the listener.
   The player drags a dot around the ring to where it stopped. Back is made obvious by a low-pass that closes as the sound moves behind you. */
const SPN={in:null,iv:0,noise:null};
function spNoise(){
  if(SPN.noise&&SPN.noise.sampleRate===ctx.sampleRate)return SPN.noise;
  const b=ctx.createBuffer(1,Math.floor(ctx.sampleRate*.5),ctx.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  return SPN.noise=b;
}
function spKick(dst,t){
  const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';
  o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(42,t+.14);
  g.gain.setValueAtTime(.95,t);g.gain.exponentialRampToValueAtTime(.001,t+.28);
  o.connect(g);g.connect(dst);o.start(t);o.stop(t+.3);
}
function spSnare(dst,t,v=1){
  const n=ctx.createBufferSource();n.buffer=spNoise();
  const hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=1400;
  const g=ctx.createGain();g.gain.setValueAtTime(.55*v,t);g.gain.exponentialRampToValueAtTime(.001,t+.17);
  n.connect(hp);hp.connect(g);g.connect(dst);n.start(t,Math.random()*.2);n.stop(t+.2);
  const o=ctx.createOscillator(),og=ctx.createGain();o.type='triangle';o.frequency.setValueAtTime(210,t);o.frequency.exponentialRampToValueAtTime(150,t+.08);
  og.gain.setValueAtTime(.35*v,t);og.gain.exponentialRampToValueAtTime(.001,t+.1);o.connect(og);og.connect(dst);o.start(t);o.stop(t+.12);
}
function spHat(dst,t,v=1,open=false){
  const n=ctx.createBufferSource();n.buffer=spNoise();
  const hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=7500;
  const g=ctx.createGain(),len=open?.16:.045;g.gain.setValueAtTime(.2*v,t);g.gain.exponentialRampToValueAtTime(.001,t+len);
  n.connect(hp);hp.connect(g);g.connect(dst);n.start(t,Math.random()*.2);n.stop(t+len+.03);
}
/* plays the song through an orbiting HRTF panner. azAt(u) gives the azimuth (radians, clockwise from front) at u=0..1 of the song; dur is the length in seconds.
   Two different instruments are mixed: iA plays chords + bass, iB plays the melody. Returns {T}. */
function spOrbit(azAt,dur,iA,iB){
  initAudio();
  const now=ctx.currentTime,t0=now+.25;
  const minor=Math.random()<.4,sc=minor?SC_MIN:SC_MAJ,root=rpick([48,50,52,53,55,57]);
  const bpm=rpick([100,108,116,124]),step=60/bpm/2,N=Math.floor(dur/step),T=N*step;
  const dn=d=>root+sc[((d%7)+7)%7]+12*Math.floor(d/7);
  const PROGS=[[0,4,5,3],[0,5,3,4],[5,3,0,4],[0,3,4,4],[0,2,3,4],[0,3,5,4]];
  const progs=Array.from({length:Math.ceil(N/16)+1},()=>rpick(PROGS));        // a new progression every 2 bars so longer songs keep moving
  // signal chain: in -> lowpass (closes when behind) -> HRTF panner -> out -> master
  const inp=ctx.createGain(),lp=ctx.createBiquadFilter(),p=ctx.createPanner(),out=ctx.createGain();
  lp.type='lowpass';lp.Q.value=.6;
  p.panningModel='HRTF';p.distanceModel='inverse';p.refDistance=1;p.rolloffFactor=0;
  out.gain.value=1.25;inp.connect(lp);lp.connect(p);p.connect(out);out.connect(master);
  SPN.in=inp;
  const cutAt=az=>2000*Math.pow(9,(Math.cos(az)+1)/2);       // behind ≈ 2 kHz, front ≈ 18 kHz
  const gainAt=az=>.78+.3*(Math.cos(az)+1)/2;
  const K=Math.max(240,Math.round(T*60)),X=new Float32Array(K),Z=new Float32Array(K),C=new Float32Array(K),G=new Float32Array(K);
  for(let k=0;k<K;k++){const az=azAt(k/(K-1));X[k]=Math.sin(az);Z[k]=-Math.cos(az);C[k]=cutAt(az);G[k]=gainAt(az);}
  if(p.positionX){
    p.positionY.value=0;
    p.positionX.setValueAtTime(X[0],now);p.positionZ.setValueAtTime(Z[0],now);
    lp.frequency.setValueAtTime(C[0],now);inp.gain.setValueAtTime(G[0],now);
    p.positionX.setValueCurveAtTime(X,t0,T);p.positionZ.setValueCurveAtTime(Z,t0,T);
    lp.frequency.setValueCurveAtTime(C,t0,T);inp.gain.setValueCurveAtTime(G,t0,T);
  }else{
    p.setPosition(X[0],0,Z[0]);lp.frequency.value=C[0];
    clearInterval(SPN.iv);
    SPN.iv=setInterval(()=>{
      const u=Math.min(1,Math.max(0,(ctx.currentTime-t0)/T)),az=azAt(u);
      p.setPosition(Math.sin(az),0,-Math.cos(az));lp.frequency.value=cutAt(az);inp.gain.value=gainAt(az);
      if(u>=1)clearInterval(SPN.iv);
    },30);
  }
  // route piano voices through the chain for these calls only
  const mS=master,rS=reverb;master=inp;reverb=ctx.createGain();
  try{
    let m=rpick([0,2,4]);
    for(let i=0;i<N;i++){
      const w=.25+i*step,prog=progs[Math.floor(i/16)],d=prog[Math.floor(i/4)%prog.length];
      if(i%4===0){
        instOver=iA;
        [0,2,4].forEach((o,j)=>playPiano(dn(d+o)+12,step*3.7,.55,w+j*.012));
        playPiano(dn(d)-12,step*3.6,.8,w);
      }
      const onBeat=i%2===0;
      if(Math.random()<(onBeat?.75:.5)){
        m+=rpick([-2,-1,-1,0,1,1,2]);m=Math.max(-2,Math.min(9,m));
        instOver=iB;
        playPiano(dn(m)+12,step*rpick([1.2,1.8,2.4]),.5+.25*Math.random(),w);
      }
    }
  }finally{master=mS;reverb=rS;instOver=null;}
  for(let i=0;i<N;i++){
    const t=t0+i*step,pos=i%8;
    if(pos===0||pos===4||(pos===7&&Math.random()<.35)||(pos===3&&Math.random()<.3))spKick(inp,t);
    if(pos===2||pos===6)spSnare(inp,t,1);
    else if(i>=N-2&&Math.random()<.7)spSnare(inp,t,.6);
    spHat(inp,t,pos%2===0?1:.55,pos===7&&Math.random()<.5);
  }
  return {T};
}
/* choose two different instruments at random (whatever is loadable), independent of the one picked on the Piano page */
async function spPickPair(){
  const keys=Object.keys(INSTR).sort(()=>Math.random()-.5),got=[];
  for(const k of keys){
    if(got.length===2)break;
    if(instErr[k])continue;
    if(await instLoad(k))got.push(k);
  }
  for(const k of ['grand',...keys]){if(got.length>=2)break;if(!got.includes(k)&&(k==='grand'||instSF[k]))got.push(k);}
  while(got.length<2)got.push('grand');
  return got;
}
/* orbit path: early rounds spin one way at a steady pace; later rounds reverse direction partway (smoothly) AND speed up / slow down, and the song grows from 5 s to 10 s */
function spPath(round){
  const turns=round<4?0:round<7?1:round<9?2:3;
  let base,az0;
  if(turns===0){
    const a0=rnd(0,Math.PI*2),dir=Math.random()<.5?1:-1,sw=rnd(2.4,5.6);
    base=u=>a0+dir*sw*u;az0=a0;
  }else{
    const segs=turns+1,pts=[rnd(0,Math.PI*2)];let dir=Math.random()<.5?1:-1;
    for(let i=0;i<segs;i++){pts.push(pts[i]+dir*rnd(1.2,3.3));dir=-dir;}
    base=u=>{if(u>=1)return pts[segs];const x=Math.max(0,u)*segs,i=Math.floor(x),v=x-i,e=v*v*(3-2*v);return pts[i]+(pts[i+1]-pts[i])*e;};
    az0=pts[0];
  }
  // speed variation: the sound's pace is 1+amp·(wobble), always positive, so it only ever slows/speeds, never stalls or runs backwards in time
  const amp=round<2?0:Math.min(.88,.2+.1*(round-2));
  let azAt=base;
  if(amp>0){
    const f1=rnd(1,2.2),f2=rnd(2.5,4.5),p1=rnd(0,6.28),p2=rnd(0,6.28),M=600,W=new Float32Array(M+1);
    for(let i=0;i<M;i++){const u=(i+.5)/M;W[i+1]=W[i]+1+amp*(.65*Math.sin(2*Math.PI*f1*u+p1)+.35*Math.sin(2*Math.PI*f2*u+p2));}
    for(let i=0;i<=M;i++)W[i]/=W[M];                      // warp(0)=0, warp(1)=1
    const warp=u=>{if(u<=0)return 0;if(u>=1)return 1;const x=u*M,i=Math.floor(x);return W[i]+(W[i+1]-W[i])*(x-i);};
    azAt=u=>base(warp(u));
  }
  return {azAt,az0,turns,amp};
}
const dirName=a=>['front','front-right','right','back-right','back','back-left','left','front-left'][Math.round(((a%360)+360)%360/45)%8];
function gSpatial(){
  S.title='8D audio';S.max=10;
  S.start=()=>{
    S.path=spPath(S.round);S.dur=5+5*Math.min(1,S.round/9);
    S.az0=S.path.az0;S.endAz=S.path.azAt(1);S.done=false;S.heard=false;S.drag=false;S.guess=null;
    const pos=(a,r=40)=>`left:${50+r*Math.sin(a)}%;top:${50-r*Math.cos(a)}%`;
    const tip=(S.path.turns?'It may change direction':'It spins around you')+(S.path.amp>0?(S.path.turns?', and it':' and')+' speeds up and slows down along the way.':(S.path.turns?' on the way.':'.'));
    M.innerHTML=header('8D audio')+`<div class="stage">
      <div class="hint" id="hm">Headphones on. The song (about ${Math.round(S.dur)} s) starts at <b>A</b> and orbits you. ${tip} Press Ready, then drag the dot around the ring to where it stopped.</div>
      <div class="joy" id="joy"><div class="ring"></div><span class="jl f">FRONT</span><span class="jl b">BACK</span><span class="jl l">L</span><span class="jl r">R</span><div class="head"></div>
        <div class="pa" style="${pos(S.az0)}">A</div><div class="puck" id="puck"></div></div>
      <div class="row" style="margin-top:0"><button class="btn acc" id="rdy">Ready</button><button class="btn ghost" id="lock" disabled>Lock in</button></div>
      <div class="result" id="res"></div></div>`;
    const joy=$('joy'),puck=$('puck');
    const setPuck=(cx,cy)=>{
      const r=joy.getBoundingClientRect(),R=r.width/2;
      const dx=cx-(r.left+R),dy=cy-(r.top+R);if(Math.hypot(dx,dy)<4)return;
      const a=Math.atan2(dx,-dy);S.guess=a;
      puck.style.left=(50+40*Math.sin(a))+'%';puck.style.top=(50-40*Math.cos(a))+'%';puck.classList.add('set');$('lock').disabled=false;

    joy.addEventListener('pointermove',e=>{if(S.drag&&!S.done)setPuck(e.clientX,e.clientY);});

      $('hm').textContent=`It stopped at the ${dirName(S.endAz*180/Math.PI)} · you were ${Math.round(err)}° off`+(mix?` · ${mix}`:'');
      $('res').innerHTML=`<div class="pts ${pts>=7?'g':pts>=4?'a':'b'}">+${pts}</div>
        <div class="row"><button class="btn acc" onclick="nextOrEnd()">${S.round+1>=S.rounds?'Finish':'Next'}</button></div>`;
    };
  };

/* ============ GAME 11: POLYRHYTHM ============ */
/* a:b = left hand (S) plays a evenly spaced notes while right hand (K) plays b notes over the same cycle. */
const POLY={out:null};
const POLY_STAGES=[
  [[1,2],[2,1],[4,2],[2,4],[4,8],[8,4],[6,3],[3,6],[5,10],[10,5]],   // 1: simple, even multiples
  [[2,3],[3,2]],                                                       // 2: the classic
  [[3,4],[4,3],[2,5],[5,2]],                                           // 3
  [[4,5],[5,4],[5,3],[3,5]],                                           // 4
  [[7,3],[3,7],[5,6],[6,5],[7,4],[4,7]]                                // 5: nothing over 10
];
function polyVoice(kind,t,dst){
  const K=drumKeys();
  const m={L:[K.main,.9],R:[K.low,.9],C:[K.tick,.55],CA:[K.tick,.8],D:[K.kick,.85]}[kind];
  playPerc(m[0],t,m[1],dst||master);
}
function polyCycle(a,b){return Math.max(2.6,Math.max(a,b)*.3);}
/* counts off (in the same grid: max(a,b) pulses per cycle), then optionally plays the pattern. returns audio-clock times */
function polySchedule(a,b,cycles,withPattern){
  initAudio();
  if(POLY.out){try{POLY.out.gain.setTargetAtTime(0,ctx.currentTime,.02);}catch(e){}}
  const out=ctx.createGain();out.gain.value=.9;out.connect(master);POLY.out=out;
  const C=polyCycle(a,b),m=Math.max(a,b),nc=Math.max(1,Math.ceil(4/m)),t0=ctx.currentTime+.3,step=C/m;
  for(let i=0;i<nc*m;i++)polyVoice(i%m===0?'CA':'C',t0+i*step,out);
  const ps=t0+nc*C;
  for(let c=0;c<cycles;c++)polyVoice('D',ps+c*C,out);
  if(withPattern){
    for(let k=0;k<a*cycles;k++)polyVoice('L',ps+k*C/a,out);
    for(let k=0;k<b*cycles;k++)polyVoice('R',ps+k*C/b,out);
  }
  return {t0,ps,C,end:ps+cycles*C};
}
function polyKey(e){
  if(typeof S==='undefined'||!S||S.key!=='poly'||e.repeat||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.code==='KeyS'){e.preventDefault();polyTap('L');}
  else if(e.code==='KeyK'){e.preventDefault();polyTap('R');}
}
addEventListener('keydown',polyKey);
function polyTap(h){
  if(!S||S.key!=='poly')return;
  initAudio();
  const el=$(h==='L'?'pl':'pr');
  if(el){el.classList.add('hit');setTimeout(()=>el.classList.remove('hit'),90);}
  if(S.phase==='done'||S.phase==='rec'||S.phase==='idle'||S.phase==='listen')polyVoice(h,ctx.currentTime,master);
  if(S.phase==='rec'){S.taps[h].push(performance.now()-S.recT0);}
}
function polyScore(){
  const [a,b]=S.ratio,C=polyCycle(a,b)*1000,cyc=S.cycles;
  let E=0,hits=0,extra=0,prSum=0,errSum=0;const det={L:[],R:[]};
  for(const h of ['L','R']){
    const n=h==='L'?a:b,sp=C/n,W=Math.max(70,Math.min(sp*.45,210));
    const taps=S.taps[h].filter(t=>t>=-300&&t<=C*cyc+500).sort((x,y)=>x-y),used=new Array(taps.length).fill(false);
    for(let k=0;k<n*cyc;k++){
      const ex=k*sp;let bi=-1,bd=1e9;
      taps.forEach((t,i)=>{if(!used[i]&&Math.abs(t-ex)<bd){bd=Math.abs(t-ex);bi=i;}});
      E++;
      if(bi>=0&&bd<=W){used[bi]=true;hits++;errSum+=bd;prSum+=Math.max(0,1-Math.max(0,bd-25)/Math.max(40,W-25));det[h].push({ex,t:taps[bi],ok:true});}
      else det[h].push({ex,t:null,ok:false});
    }
    taps.forEach((t,i)=>{if(!used[i]){extra++;det[h].push({ex:null,t,ok:false});}});
  }
  const acc=Math.max(0,(hits-.5*extra)/E),prec=prSum/E;
  return {pts:Math.round(50*acc+50*Math.min(prec,acc)),hits,E,extra,avg:hits?Math.round(errSum/hits):null,det,C:C*cyc};
}
function polyTimeline(r){
  const lo=-300,span=r.C+800,x=t=>Math.max(0,Math.min(100,(t-lo)/span*100));
  const row=(h,label)=>`<div style="display:flex;align-items:center;gap:8px;margin:6px 0"><b style="width:18px;color:var(--mut)">${label}</b>
    <div style="position:relative;flex:1;height:22px;background:#161619;border-radius:8px;overflow:hidden">
      ${r.det[h].filter(d=>d.ex!==null).map(d=>`<i style="position:absolute;left:${x(d.ex)}%;top:3px;width:3px;height:16px;background:#fff;opacity:.85"></i>`).join('')}

function gPoly(){

    M.innerHTML=header('Polyrhythm')+`<div class="stage">

      <div style="width:min(420px,92vw);margin:4px auto 10px;display:flex;flex-direction:column;gap:6px">
        <div style="display:flex;align-items:center;gap:8px"><b style="width:18px;color:var(--mut)">S</b>${diag(a,'var(--acc)')}</div>
        <div style="display:flex;align-items:center;gap:8px"><b style="width:18px;color:var(--mut)">K</b>${diag(b,'#5ad1ff')}</div>
      </div>
      <div style="display:flex;gap:12px;width:min(420px,92vw);margin:6px auto">
        <button class="ppad" id="pl">S<small>LEFT</small></button><button class="ppad r" id="pr">K<small>RIGHT</small></button></div>
      <div class="row"><button class="btn ghost" id="plisten">🔊 Listen</button><button class="btn acc" id="pplay">Play</button></div>
      <div class="result" id="res"></div></div>`;
    ['pl','pr'].forEach(id=>$(id).addEventListener('pointerdown',e=>{e.preventDefault();polyTap(id==='pl'?'L':'R');}));
    const lock=on=>{$('plisten').disabled=on;$('pplay').disabled=on||!!S.scored;};
    $('plisten').onclick=()=>{

      Promise.all([pianoReady(),loadPercAuto()]).then(()=>{
        const o=polySchedule(a,b,S.cycles,true);
        later((o.ps-ctx.currentTime)*1000,()=>{$('hm').textContent='Listen…';});
        later((o.end-ctx.currentTime)*1000+500,()=>{S.phase='idle';lock(false);$('hm').textContent='Press Play when you are ready to try it, or Listen again.';});
      });
    };
    $('pplay').onclick=()=>{
      if(S.phase==='listen'||S.phase==='rec'||S.scored)return;
      cancelSeq();S.phase='count';S.taps={L:[],R:[]};lock(true);$('res').innerHTML='';
      $('hm').textContent='Count-off… start on the downbeat. S = left, K = right.';
      Promise.all([pianoReady(),loadPercAuto()]).then(()=>{
        const o=polySchedule(a,b,S.cycles,false);
        const lat=(ctx.outputLatency||ctx.baseLatency||0)*1000;
        S.recT0=performance.now()+(o.ps-ctx.currentTime)*1000+lat;
        S.phase='rec';                                   // taps before the downbeat are accepted down to −300 ms
        later((o.ps-ctx.currentTime)*1000,()=>{$('hm').textContent='Go!';});
        later((o.end-ctx.currentTime)*1000+550,()=>{
          S.phase='done';S.scored=true;lock(false);
          const r=polyScore();S.score+=r.pts;$('sc').textContent=S.score;
          $('hm').textContent=`Notes ${r.hits}/${r.E} · extra taps ${r.extra}`+(r.avg!==null?` · average ${r.avg} ms off`:'');
          
          $('res').innerHTML=`<div class="pts ${r.pts>=75?'g':r.pts>=40?'a':'b'}">+${r.pts}</div>${polyTimeline(r)}
            <div class="row"><button class="btn acc" onclick="nextOrEnd()">${S.round+1>=S.rounds?'Finish':'Next stage'}</button></div>`;
        });
      });
    };
  };
  S.start();
}

/* ---- tiny MIDI parser: every non-drum channel becomes notes {m,t,d,v} in seconds ---- */
function parseMidi(buf){
  const u=new Uint8Array(buf),dv=new DataView(buf);
  const id4=o=>String.fromCharCode(u[o],u[o+1],u[o+2],u[o+3]);
  if(u.length<14||id4(0)!=='MThd')throw new Error('not a MIDI file');
  const hl=dv.getUint32(4),nt=dv.getUint16(10),div=dv.getUint16(12);
  if(div&0x8000)throw new Error('SMPTE timing is not supported');
  let p=8+hl,tr=0;const tempos=[[0,500000]],evs=[];
  while(tr<nt&&p+8<=u.length){
    const id=id4(p),len=dv.getUint32(p+4),end=Math.min(u.length,p+8+len);p+=8;
    if(id!=='MTrk'){p=end;continue;}
    tr++;let tick=0,run=0;
    const vlq=()=>{let v=0,b;do{b=u[p++];v=v*128+(b&127);}while((b&128)&&p<end);return v;};
    while(p<end){
      tick+=vlq();let st=u[p];
      if(st===0xFF){const ty=u[p+1];p+=2;const l=vlq();
        if(ty===0x51&&l===3)tempos.push([tick,(u[p]<<16)|(u[p+1]<<8)|u[p+2]]);
        p+=l;if(ty===0x2F)break;continue;}
      if(st===0xF0||st===0xF7){p++;p+=vlq();continue;}
      if(st&128){run=st;p++;}else st=run;
      const hi=st>>4,ch=st&15;
      if(hi===8||hi===9){const a=u[p],b=u[p+1];p+=2;evs.push([tick,(hi===9&&b>0)?1:0,ch,a,b]);}
      else if(hi===0xA||hi===0xB||hi===0xE)p+=2;
      else if(hi===0xC||hi===0xD)p+=1;
      else p++;
    }
    p=end;
  }
  tempos.sort((x,y)=>x[0]-y[0]);
  const seg=[];let sec=0;
  tempos.forEach((tp,i)=>{if(i>0){const pv=tempos[i-1];sec+=(tp[0]-pv[0])*pv[1]/1e6/div;}seg.push({tick:tp[0],sec,us:tp[1]});});
  const toSec=tk=>{let lo=0,hi=seg.length-1;while(lo<hi){const mid=(lo+hi+1)>>1;if(seg[mid].tick<=tk)lo=mid;else hi=mid-1;}const g=seg[lo];return g.sec+(tk-g.tick)*g.us/1e6/div;};
  evs.sort((x,y)=>x[0]-y[0]||x[1]-y[1]);   // note-offs before note-ons on the same tick
  const open={},notes=[];let dur=0;
  const fit=m=>{while(m<PLOW)m+=12;while(m>PHIGH)m-=12;return m;};
  const close=(o,t)=>{const d=Math.max(.06,t-o.t);notes.push({m:o.m,t:o.t,d,v:o.v});dur=Math.max(dur,o.t+d);};
  for(const [tk,on,ch,nn,vel] of evs){
    if(ch===9)continue;                       // skip drums
    const t=toSec(tk),k=ch*128+nn;
    if(on){(open[k]||(open[k]=[])).push({t,m:fit(nn),v:vel});}
    else if(open[k]&&open[k].length)close(open[k].shift(),t);
  }
  for(const k in open)open[k].forEach(o=>close(o,o.t+.5));
  if(!notes.length)throw new Error('no playable notes found');
  notes.sort((x,y)=>x.t-y.t||x.m-y.m);
  const lastTick=evs.length?evs[evs.length-1][0]:0,secTot=toSec(lastTick);
  const bpm=secTot>0?lastTick/div/(secTot/60):60e6/seg[seg.length-1].us;   // average tempo of the whole piece
  const speed=SONGSPEED*Math.max(.5,Math.min(2.2,bpm/100));                // slow pieces fall slower, fast ones faster
  return {notes,dur,bpm,speed,lead:BARH/speed+.3,tempos:seg.map(g=>({sec:g.sec,bpm:60e6/g.us}))};
}
async function sgLoad(e){
  if(e.song)return e.song;
  let buf=e.buf;
  if(!buf){
    let why='';
    if(location.protocol==='file:')why=' This page was opened as a file:// address, and browsers block loading other files that way. Use the "pick folder" button to choose the folder with your songs, or run a local server in it (for example "python -m http.server") and open http://localhost:8000.';
    else{
      let found=false;
      for(const u of [e.url].concat(e.alts||[])){
        try{const r=await fetch(u);if(!r.ok)continue;const b=await r.arrayBuffer();found=true;parseMidi(b);buf=b;break;}
        catch(err){if(found){why=' A file was found but could not be read: '+err.message;break;}}
      }
    }
    if(!buf)throw new Error('could not load "'+e.name+'".'+(why||' No file with that name (.mid, .midi or no extension) was found next to this page.'));
  }
  e.song=parseMidi(buf);return e.song;
}

/* sustain on: wetter + longer reverb tail */
function susWet(){
  if(!ctx||!revWet)return;
  const on=!!(PV&&PV.on&&PV.sus),t=ctx.currentTime;
  revWet.gain.setTargetAtTime(on?.34:.16,t,.12);
  revLong.gain.setTargetAtTime(on?1:0,t,.2);

/* sustain on: each note rings on into the next one (legato, pedal-like overlap) */
function susDur(n){
  const S=PS.song;
  if(!S.on){const a=[];let last=-1;S.notes.forEach(x=>{if(x.t-last>.03){a.push(x.t);last=x.t;}});S.on=a;}
  const A=S.on;let lo=0,hi=A.length;
  while(lo<hi){const mid=(lo+hi)>>1;if(A[mid]<n.t+.03)lo=mid+1;else hi=mid;}
  const gap=lo<A.length?A[lo]-n.t:n.d+1.5;
  return Math.max(n.d*1.25+.25,Math.min(gap+.4,6));
}
function sgTick(){
  if(!PS.playing||!PS.song)return;
  susWet();
  const pos=ctx.currentTime-PS.base,N=PS.song.notes,sus=PV.sus;
  while(PS.i<N.length&&N[PS.i].t<pos+.3){
    const n=N[PS.i++],w=n.t-pos;if(w<-.05)continue;
    const d=sus?susDur(n):n.d;
    PS.hs.push({h:playPiano(n.m,Math.max(.12,d),.3+.6*(n.v/127),Math.max(0,w)),end:n.t+d+.7});
  }
  if(PS.hs.length>64)PS.hs=PS.hs.filter(x=>x.end>pos);
  if(pos>PS.song.dur+1){sgHalt();PS.pos=-PS.song.lead;PS.vlo=0;$('sgplay').textContent='▶ Play';}
}

function sgDraw(g,W,H){
  const cnt=PV.cnt;cnt.fill(0);

  if(PS.song)pos=PS.playing?ctx.currentTime-PS.base:PS.pos;
  if(pos!==null){

    while(PS.vlo<N.length&&N[PS.vlo].t+N[PS.vlo].d<pos-.05)PS.vlo++;
    for(let k=PS.vlo;k<N.length;k++){
      const n=N[k];if(n.t>pos+look)break;

      const f=PV.cx[n.m],w=f[1]*W,x=f[0]*W-w/2,bot=H-(n.t-pos)*SP,top=H-(n.t+n.d-pos)*SP;
      const y=top+1,h=Math.max(3,bot-top-2);

      g.beginPath();if(g.roundRect)g.roundRect(x,y,w,h,Math.min(4,w/2));else g.rect(x,y,w,h);g.fill();

        g.fillStyle=f[2]?'#fff':'#04222e';g.fillText(nm,x+w/2,Math.max(y+fs+1,y+h-1.5));
      }
      if(n.t<=pos&&pos<n.t+n.d)cnt[n.m]=1;
    }
    const bt='♩ '+Math.round(PS.song.bpm)+' BPM';   // average tempo (some files change tempo hundreds of times)
    if(PV.bpmtxt!==bt){PV.bpmtxt=bt;$('sgbpm').textContent=bt;}
    const dur=PS.song.dur,txt=fmtT(pos)+' / '+fmtT(dur);
    if(PV.sgtxt!==txt){PV.sgtxt=txt;const t=$('sgt');if(t)t.textContent=txt;}
    $('sgp').style.width=Math.max(0,Math.min(1,pos/dur))*100+'%';
  }
  for(let m=PLOW;m<=PHIGH;m++){
    const want=(PS.playing&&cnt[m])?1:0;
    if(want!==PV.auOn[m]){PV.auOn[m]=want;PV.els[m].classList.toggle('au',!!want);}
  }
}

  return (g,p)=>{for(let k=0;k<K;k++){
    let q;if(p<.5){const dl=k*.09;q=eo(clamp01((p*2-dl)/(1-dl)));}else{const dl=(K-1-k)*.09;q=1-ei(clamp01(((p-.5)*2-dl)/(1-dl)));}
    if(q<=0)continue;g.fillStyle=pal[k%pal.length];g.fillRect(W/2-W*q/2-.5,H/2-H*q/2-.5,W*q+1,H*q+1);}};
}
// vertical slats flip open in a wave from left to right
function trSlats(W,H,pal){
  const n=16,w=W/n;
  return (g,p)=>{for(let i=0;i<n;i++){const d=i/n*.5;
    const s=p<.5?clamp01((p*2-d)/.5):1-clamp01(((p-.5)*2-d)/.5);if(s<=0)continue;
    g.fillStyle=pal[i%pal.length];const z=w*s+(s>=1?1:0);g.fillRect(i*w+(w-z)/2,0,z,H);}};
}
// soft bubbles bloom everywhere and then pop
function trBubbles(W,H,pal){
  const px=Math.max(W,H)/7,nx=Math.ceil(W/px)+1,ny=Math.ceil(H/px)+1,bs=[];
  for(let y=0;y<ny;y++)for(let x=0;x<nx;x++)bs.push({x:x*px+(Math.random()-.5)*px*.5,y:y*px+(Math.random()-.5)*px*.5,d:Math.random()*.5,e:Math.random()*.5,c:pick(pal)});
  return (g,p)=>bs.forEach(b=>{
    const s=p<.5?eo(clamp01((p*2-b.d)/(1-b.d))):1-ei(clamp01(((p-.5)*2-b.e)/(1-b.e)));if(s<=0)return;
    g.fillStyle=b.c;g.globalAlpha=.95;g.beginPath();g.arc(b.x,b.y,px*1.4*s,0,6.2832);g.fill();g.globalAlpha=1;
  });
}
// a field of triangles pops in and out
function trTris(W,H,pal){
  const px=Math.max(50,Math.min(W,H)/9),nx=Math.ceil(W/px),ny=Math.ceil(H/px),ts=[];
  for(let y=0;y<ny;y++)for(let x=0;x<nx;x++){const X=x*px,Y=y*px;
    ts.push({pts:[[X,Y],[X+px,Y],[X,Y+px]],o:Math.random()*.55,o2:Math.random()*.55,c:pick(pal)});
    ts.push({pts:[[X+px,Y+px],[X+px,Y],[X,Y+px]],o:Math.random()*.55,o2:Math.random()*.55,c:pick(pal)});}
  return (g,p)=>ts.forEach(t=>{
    const s=p<.5?clamp01((p*2-t.o)/.4):1-clamp01(((p-.5)*2-t.o2)/.4);if(s<=0)return;
    const cx=(t.pts[0][0]+t.pts[1][0]+t.pts[2][0])/3,cy=(t.pts[0][1]+t.pts[1][1]+t.pts[2][1])/3,k=s*1.04;
    g.fillStyle=t.c;g.beginPath();t.pts.forEach(([x,y],i)=>{const X=cx+(x-cx)*k,Y=cy+(y-cy)*k;i?g.lineTo(X,Y):g.moveTo(X,Y);});g.closePath();g.fill();
  });
}
// a slanted beam of light wipes the screen, then wipes it clean
function trBeam(W,H,pal){
  const L=Math.hypot(W,H),ang=(Math.random()<.5?-1:1)*.5;
  return (g,p)=>{g.save();g.translate(W/2,H/2);g.rotate(ang);
    if(p<.5){const e=-L/2+L*eo(p*2);g.fillStyle=pal[0];g.fillRect(-L/2,-L/2,e+L/2,L);g.fillStyle=pal[1];g.fillRect(e-55,-L/2,55,L);}
    else{const e=-L/2+L*ei((p-.5)*2);g.fillStyle=pal[0];g.fillRect(e,-L/2,L/2-e,L);g.fillStyle=pal[1];g.fillRect(e,-L/2,55,L);}
    g.restore();};
}
// rays burst out from the centre like a sunburst, then retract outward
function trBurst(W,H,pal){
  const n=28,sp=Math.PI*2/n,R=Math.hypot(W,H)/2+4,cx=W/2,cy=H/2,rs=[];
  for(let i=0;i<n;i++)rs.push({d:Math.random()*.4,e:Math.random()*.4,c:pal[i%pal.length]});
  return (g,p)=>rs.forEach((r,i)=>{
    let rin=0,rout=R;
    if(p<.5)rout=R*eo(clamp01((p*2-r.d)/(1-r.d)));else rin=R*ei(clamp01(((p-.5)*2-r.e)/(1-r.e)));
    if(rout<=rin)return;const a0=i*sp-.003,a1=(i+1)*sp+.003;
    g.fillStyle=r.c;g.beginPath();g.arc(cx,cy,rout,a0,a1);g.arc(cx,cy,rin,a1,a0,true);g.closePath();g.fill();
  });
}
// plus signs swell until they fuse into a wall, then thin away
function trCross(W,H,pal){
  const px=Math.max(50,Math.min(W,H)/9),nx=Math.ceil(W/px),ny=Math.ceil(H/px),cs=[];
  for(let y=0;y<ny;y++)for(let x=0;x<nx;x++)cs.push({x:x*px,y:y*px,d:(x/nx+y/ny)/2*.45+Math.random()*.15,c:pal[(x+y)%pal.length]});
  return (g,p)=>cs.forEach(c=>{
    const s=p<.5?clamp01((p*2-c.d)/.4):1-clamp01(((p-.5)*2-(.6-c.d))/.4);if(s<=0)return;
    const t=px*s+(s>=1?1:0);g.fillStyle=c.c;g.fillRect(c.x,c.y+(px-t)/2,px+(s>=1?1:0),t);g.fillRect(c.x+(px-t)/2,c.y,t,px+(s>=1?1:0));
  });
}
const TR_FX=[trCurtains,trBalls,trPixels,trRings,trStripes,trWave,trDoors,trDiamonds,trChecker,trRows,trClock,trIris,trZig,trSpiral,trNest,trSlats,trBubbles,trTris,trBeam,trBurst,trCross];
function trRun(swap){
  if(TR.busy)return;TR.busy=true;
  let cv=document.getElementById('trc');
  if(!cv){cv=document.createElement('canvas');cv.id='trc';cv.style.cssText='position:fixed;inset:0;width:100%;height:100%;z-index:9999;pointer-events:none;display:none';document.body.appendChild(cv);}
  const dpr=Math.min(2,window.devicePixelRatio||1),W=innerWidth,H=innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.display='block';cv.style.pointerEvents='auto';
  const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);
  let k;do{k=Math.floor(Math.random()*TR_FX.length);}while(k===TR.last);TR.last=k;
  const pal=pick(TR_PAL).slice().sort(()=>Math.random()-.5),draw=TR_FX[k](W,H,pal);
  const DUR=matchMedia('(prefers-reduced-motion: reduce)').matches?1:1150,t0=performance.now();let swapped=false;
  const step=now=>{
    const p=Math.min(1,(now-t0)/DUR);
    g.clearRect(0,0,W,H);
    if(p>=.5&&!swapped){swapped=true;try{swap();}catch(e){console.error(e);}}
    draw(g,p);
    if(p<1)requestAnimationFrame(step);
    else{cv.style.display='none';cv.style.pointerEvents='none';TR.busy=false;}
  };
  requestAnimationFrame(step);
}
// switching games, opening the piano, or going home now plays a transition
function withTr(fn,snd){return function(...a){if(TR.busy)return;try{cancelSeq();}catch(e){}if(snd)try{snd();}catch(e){}trRun(()=>fn.apply(null,a));};}
// opening a game: fast major-chord arpeggio. Going back: a high note, then a low one.
function sfxIn(){initAudio();pianoReady().then(()=>{const r=ri(55,64);[0,4,7,12,16].forEach((n,i)=>setTimeout(()=>playPiano(r+n,.45,.7),i*55));});}
function sfxBack(){initAudio();pianoReady().then(()=>{const sc=[0,2,4,5,7,9,11],r=ri(0,11);for(let i=0;i<15;i++){const k=14-i,n=60+r%6+12*Math.floor(k/7)+sc[k%7];setTimeout(()=>playPiano(n,.35,.55+.02*(14-i)),i*38);}});}
const _menu=menu;
menu=withTr(menu,sfxBack);startGame=withTr(startGame,sfxIn);openPiano=withTr(openPiano,sfxIn);


/* ============ MOVING BACKGROUND (reacts to the cursor) ============ */
(function(){
  const c=document.createElement('canvas');c.id='bg';
  c.style.cssText='position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none';
  document.body.prepend(c);
  const g=c.getContext('2d'),calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W=0,H=0;
  const fit=()=>{const d=Math.min(1.5,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0);};
  fit();addEventListener('resize',fit);
  const st={mx:.5,my:.5,sx:.5,sy:.5,en:0,t:0,lx:0,ly:0,clr:false},ps=[],pulses=[];
  for(let i=0;i<64;i++)ps.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,vx:rnd(-.35,.35),vy:rnd(-.35,.35),r:rnd(7,30),k:i%4,a:Math.random()*6.28,va:rnd(-.012,.012),o:rnd(-55,55),z:rnd(.3,1)});
  addEventListener('pointermove',e=>{
    st.en=Math.min(1.6,st.en+Math.hypot(e.clientX-st.lx,e.clientY-st.ly)/90);
    st.lx=e.clientX;st.ly=e.clientY;st.mx=e.clientX/innerWidth;st.my=e.clientY/innerHeight;
  });
  addEventListener('pointerdown',e=>pulses.push({x:e.clientX,y:e.clientY,r:6,a:.7}));
  function frame(){
    requestAnimationFrame(frame);
    if(document.hidden)return;
    const app=document.getElementById('app');
    if(app&&app.classList.contains('wide')){if(!st.clr){g.clearRect(0,0,W,H);st.clr=true;}return;}   // keep the piano page fast
    st.clr=false;
    st.sx+=(st.mx-st.sx)*.06;st.sy+=(st.my-st.sy)*.06;st.en*=.95;st.t+=.016;
    const hue=(250+st.sx*140+Math.sin(st.t*.4)*18)%360;        // left = violet/blue, right = warm
    const spd=(calm?.25:1)*(.35+(1-st.sy)*1.1+st.en*1.6);     // higher up = faster, wiggling the mouse = faster
    const cx=st.sx*W,cy=st.sy*H;
    g.clearRect(0,0,W,H);
    const gl=g.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*.45);
    gl.addColorStop(0,`hsla(${hue},90%,55%,.16)`);gl.addColorStop(1,`hsla(${hue},90%,55%,0)`);
    g.fillStyle=gl;g.fillRect(0,0,W,H);
    g.lineWidth=1.6;
    for(const p of ps){
      const dx=p.x-cx,dy=p.y-cy,d=Math.hypot(dx,dy)||1;
      if(d<260){const f=(1-d/260)*.9*(1+st.en);p.vx+=dx/d*f*.06;p.vy+=dy/d*f*.06;}
      p.vx*=.992;p.vy*=.992;
      if(Math.abs(p.vx)+Math.abs(p.vy)<.25){p.vx+=rnd(-.02,.02);p.vy+=rnd(-.02,.02);}
      p.x+=p.vx*spd*p.z*2;p.y+=p.vy*spd*p.z*2;p.a+=p.va*spd;
      if(p.x<-40)p.x=W+40;if(p.x>W+40)p.x=-40;if(p.y<-40)p.y=H+40;if(p.y>H+40)p.y=-40;
      const X=p.x+(st.sx-.5)*-70*p.z,Y=p.y+(st.sy-.5)*-70*p.z,col=`hsla(${(hue+p.o+360)%360},85%,66%,${.16+.26*p.z})`;
      g.strokeStyle=col;g.fillStyle=col;g.beginPath();
      if(p.k===0)g.arc(X,Y,p.r,0,6.283);
      else if(p.k===1){g.arc(X,Y,p.r*.3,0,6.283);g.fill();continue;}
      else if(p.k===2){const l=p.r*1.4;g.moveTo(X-Math.cos(p.a)*l,Y-Math.sin(p.a)*l);g.lineTo(X+Math.cos(p.a)*l,Y+Math.sin(p.a)*l);}
      else{for(let i=0;i<3;i++){const a=p.a+i*2.094;g.lineTo(X+Math.cos(a)*p.r,Y+Math.sin(a)*p.r);}g.closePath();}
      g.stroke();
    }
    for(let i=pulses.length-1;i>=0;i--){
      const q=pulses[i];q.r+=7;q.a-=.018;
      if(q.a<=0){pulses.splice(i,1);continue;}
      g.strokeStyle=`hsla(${hue},90%,70%,${q.a})`;g.lineWidth=2.5;g.beginPath();g.arc(q.x,q.y,q.r,0,6.283);g.stroke();
    }
    g.strokeStyle=`hsla(${hue},90%,75%,.5)`;g.lineWidth=1.5;g.beginPath();g.arc(cx,cy,14+st.en*26,0,6.283);g.stroke();   // cursor ring
  }
  frame();
})();
