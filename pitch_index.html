<style>

<body>
<div id="app">
  <header>
    <div class="logo" onclick="menu()">pitch<span>.</span></div>
    <div class="status"><span class="dot" id="dot"></span><span id="stxt">piano: loading</span><label class="ld" id="ldl">load .sf2<input id="sff" type="file" accept=".sf2,.sf3" hidden></label><span class="ld" id="dfl" style="display:none">use default</span></div>
  </header>
  <main id="main"></main>

<script>
/* ============ AUDIO ============ */
const NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const mf=m=>440*Math.pow(2,(m-69)/12);
let ctx,master,reverb,samples={},sampleMode=false,sf=null,sfP=null,salP=null,voices=[];

/*SF2START*/
function parseSF2(buf){
  const dv=new DataView(buf),u8=new Uint8Array(buf);
  const id=o=>String.fromCharCode(u8[o],u8[o+1],u8[o+2],u8[o+3]);
  if(id(0)!=='RIFF'||id(8)!=='sfbk')throw new Error('not an sf2 file');
  const ch={};
  const walk=(p,e)=>{while(p+8<=e){const c=id(p),sz=dv.getUint32(p+4,true);
    if(c==='LIST')walk(p+12,p+8+sz);else ch[c]=[p+8,sz];p+=8+sz+(sz&1);}};
  walk(12,buf.byteLength);
  const rec=(k,size,fn)=>{const [o,s]=ch[k],r=[];for(let i=0;i+size<=s;i+=size)r.push(fn(o+i));return r;};
  const [so,ss]=ch.smpl;
  const pcm=(so%2)?new Int16Array(buf.slice(so,so+ss)):new Int16Array(buf,so,ss>>1);
  const shdr=rec('shdr',46,o=>({start:dv.getUint32(o+20,true),end:dv.getUint32(o+24,true),rate:dv.getUint32(o+36,true),pitch:u8[o+40],corr:dv.getInt8(o+41)}));
  const gl=k=>rec(k,4,o=>({op:dv.getUint16(o,true),v:dv.getInt16(o+2,true),lo:u8[o+2],hi:u8[o+3]}));
  const pgen=gl('pgen'),igen=gl('igen');
  const pbag=rec('pbag',4,o=>dv.getUint16(o,true)),ibag=rec('ibag',4,o=>dv.getUint16(o,true));
  const phdr=rec('phdr',38,o=>dv.getUint16(o+24,true)),inst=rec('inst',22,o=>dv.getUint16(o+20,true));
  const zones=(bags,g,from,to)=>{const z=[];for(let i=from;i<to;i++)z.push(g.slice(bags[i],bags[i+1]));return z;};
  const toMap=a=>{const m={};a.forEach(g=>m[g.op]=g);return m;};
  const regions=[];
  const pz=zones(pbag,pgen,phdr[0],phdr[1]);
  let pglobal={};
  pz.forEach((z,zi)=>{
    const m=toMap(z);
    if(!m[41]){if(zi===0)pglobal=m;return;}
    const pv=m[44]||pglobal[44];
    const ii=m[41].v,iz=zones(ibag,igen,inst[ii],inst[ii+1]);
    let iglobal={};
    iz.forEach((q,qi)=>{
      const n=toMap(q);
      if(!n[53]){if(qi===0)iglobal=n;return;}
      const get=(op,def)=>n[op]?n[op].v:(iglobal[op]?iglobal[op].v:def);
      const kr=n[43]||iglobal[43],vr=n[44]||iglobal[44];
      const sid=n[53].v,h=shdr[sid];
      let vLo=vr?vr.lo:0,vHi=vr?vr.hi:127;
      if(pv){vLo=Math.max(vLo,pv.lo);vHi=Math.min(vHi,pv.hi);}
      let root=get(58,-1);if(root<0)root=(h.pitch===255?60:h.pitch);
      regions.push({sid,kLo:kr?kr.lo:0,kHi:kr?kr.hi:127,vLo,vHi,root,
        scale:get(56,100),tune:get(51,0)*100+get(52,0)+h.corr,
        pan:Math.max(-1,Math.min(1,get(17,0)/500)),fc:get(8,13500),att:Math.max(0,get(48,0))});
    });
  });
  return {pcm,shdr,regions,cache:{}};
}
/*SF2END*/

function sfBuf(sid){
  if(sf.cache[sid])return sf.cache[sid];
  const h=sf.shdr[sid],n=h.end-h.start,buf=ctx.createBuffer(1,n,h.rate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=sf.pcm[h.start+i]/32768;
  return sf.cache[sid]=buf;
}
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('pitch-sf',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
const idbReq=async(mode,fn)=>{const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('f',mode),q=fn(t.objectStore('f'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);});};
const idbGet=k=>idbReq('readonly',o=>o.get(k));
const idbSet=(k,v)=>idbReq('readwrite',o=>o.put(v,k));
const idbDel=k=>idbReq('readwrite',o=>o.delete(k));
const SF_FILE='1_Giga_piano.sf2';
let sfSrc='',sfCustom=false;

// Load order: file you picked manually -> 1_Giga_piano.sf2 from this page's directory -> Salamander online -> synth
function loadSF2Auto(){
  if(sfP)return sfP;
  sfP=(async()=>{
    try{const c=await idbGet('custom');if(c&&c.buf){sf=parseSF2(c.buf);sfSrc=c.name;sfCustom=true;setStatus();return true;}}catch(e){}
    sfCustom=false;
    try{const r=await fetch(SF_FILE);if(r.ok){sf=parseSF2(await r.arrayBuffer());sfSrc=SF_FILE;setStatus();return true;}}catch(e){}
    return false;
  })();
  return sfP;
}
async function loadSF2File(file){
  try{
    const b=await file.arrayBuffer();sf=parseSF2(b);sfSrc=file.name;sfCustom=true;sfP=Promise.resolve(true);setStatus();
    try{await idbSet('custom',{buf:b,name:file.name})}catch(e){}
  }catch(e){alert('Could not read that soundfont: '+e.message);}
}
async function useDefaultSF(){
  try{await idbDel('custom')}catch(e){}
  sf=null;sfP=null;sfSrc='';sfCustom=false;setStatus();
  const ok=await loadSF2Auto();
  if(!ok&&ctx&&!sampleMode)await loadSamples();
  setStatus();
}
function pianoReady(){
  initAudio();
  return loadSF2Auto().then(ok=>ok?true:salP);
}

function initAudio(){
  if(ctx){ if(ctx.state==='suspended')ctx.resume(); return; }
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  const comp=ctx.createDynamicsCompressor();
  master=ctx.createGain(); master.gain.value=.9;
  master.connect(comp); comp.connect(ctx.destination);
  const len=ctx.sampleRate*1.6, ir=ctx.createBuffer(2,len,ctx.sampleRate);
  for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.2);}
  reverb=ctx.createConvolver(); reverb.buffer=ir;
  const rg=ctx.createGain(); rg.gain.value=.16; reverb.connect(rg); rg.connect(comp);
  salP=loadSF2Auto().then(ok=>ok?null:loadSamples());
}

// Fallback: Salamander Grand (hosted for Tone.js)
async function loadSamples(){
  const base='https://tonejs.github.io/audio/salamander/';
  const jobs=[];
  for(let o=2;o<=6;o++)[['C',0],['Ds',3],['Fs',6],['A',9]].forEach(([n,s])=>{
    const midi=12*(o+1)+s;
    jobs.push(fetch(base+n+o+'.mp3').then(r=>{if(!r.ok)throw 0;return r.arrayBuffer()})
      .then(b=>ctx.decodeAudioData(b)).then(buf=>{samples[midi]=buf;}).catch(()=>{}));
  });
  await Promise.all(jobs);
  sampleMode=Object.keys(samples).length>=8;
  setStatus();
}
function setStatus(){
  const d=document.getElementById('dot'),t=document.getElementById('stxt');
  document.getElementById('dfl').style.display=sfCustom?'inline':'none';
  if(sf){d.className='dot ok';t.textContent='piano: '+sfSrc;}
  else if(sampleMode){d.className='dot ok';t.textContent='piano: sampled grand (no sf2 found)';}
  else{d.className='dot synth';t.textContent='piano: synth (no sf2 found)';}
}

// voice tracking so a sequence can be cut off cleanly
function trackVoice(env,end){const n=ctx.currentTime;voices=voices.filter(v=>v.end>n);voices.push({env,end});}
function fadeVoices(){
  if(!ctx)return;const n=ctx.currentTime;
  voices.filter(v=>v.end>n).forEach(({env})=>{try{env.gain.cancelScheduledValues(n);env.gain.setValueAtTime(env.gain.value,n);env.gain.linearRampToValueAtTime(0,n+.15);}catch(e){}});
  voices=[];
}

function mkHandle(env){return {release(r=.35){if(!ctx)return;const n=ctx.currentTime;try{env.gain.cancelScheduledValues(n);env.gain.setValueAtTime(Math.max(env.gain.value,.0005),n);env.gain.exponentialRampToValueAtTime(.0005,n+r);}catch(e){}}};}
function playSF(midi,dur,vel,t){
  const mk=Math.round(midi);
  const vi=Math.max(1,Math.round(vel*127));
  let rs=sf.regions.filter(r=>mk>=r.kLo&&mk<=r.kHi&&vi>=r.vLo&&vi<=r.vHi);
  if(!rs.length)return null;
  rs=rs.filter(r=>r.vLo===rs[0].vLo&&r.vHi===rs[0].vHi); // layers overlap at their edges: use one
  const env=ctx.createGain(),peak=.5+.5*vel;
  env.gain.setValueAtTime(peak,t);env.gain.setValueAtTime(peak,t+dur);
  env.gain.exponentialRampToValueAtTime(.001,t+dur+.5);
  env.connect(master);env.connect(reverb);
  rs.forEach(r=>{
    const src=ctx.createBufferSource();src.buffer=sfBuf(r.sid);
    src.playbackRate.value=Math.pow(2,((midi-r.root)*r.scale+r.tune)/1200);
    let node=src;
    if(r.fc<13500){const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=Math.min(20000,8.176*Math.pow(2,r.fc/1200));lp.Q.value=.7;node.connect(lp);node=lp;}
    const g=ctx.createGain();g.gain.value=Math.pow(10,-r.att/200);node.connect(g);node=g;
    if(ctx.createStereoPanner){const p=ctx.createStereoPanner();p.pan.value=r.pan;node.connect(p);node=p;}
    node.connect(env);src.start(t);src.stop(t+dur+.6);
  });
  trackVoice(env,t+dur+.6);
  return env;
}

function playPiano(midi,dur=2.2,vel=.8,when=0){
  initAudio();
  const t=ctx.currentTime+when+.01;
  if(sf){const e=playSF(midi,dur,vel,t);if(e)return mkHandle(e);}
  if(sampleMode){
    const keys=Object.keys(samples).map(Number);
    const near=keys.reduce((a,b)=>Math.abs(b-midi)<Math.abs(a-midi)?b:a);
    const src=ctx.createBufferSource(); src.buffer=samples[near];
    src.playbackRate.value=Math.pow(2,(midi-near)/12);
    const g=ctx.createGain();
    g.gain.setValueAtTime(vel,t);
    g.gain.setValueAtTime(vel,t+dur);
    g.gain.exponentialRampToValueAtTime(.001,t+dur+.5);
    src.connect(g); g.connect(master); g.connect(reverb);
    src.start(t); src.stop(t+dur+.6);
    trackVoice(g,t+dur+.6);
    return mkHandle(g);
  }
  // additive synth fallback
  const f0=mf(midi), B=.0004, out=ctx.createGain();
  const lp=ctx.createBiquadFilter(); lp.type='lowpass';
  lp.frequency.setValueAtTime(Math.min(9000,f0*14),t);
  lp.frequency.exponentialRampToValueAtTime(Math.max(900,f0*2.5),t+dur);
  out.gain.setValueAtTime(vel*.38,t);
  out.gain.setValueAtTime(vel*.38,t+dur);
  out.gain.exponentialRampToValueAtTime(.0005,t+dur+.35);
  out.connect(lp); lp.connect(master); lp.connect(reverb);
  trackVoice(out,t+dur+.5);
  const decayBase=Math.max(.8,3.4-midi/30);
  for(let n=1;n<=10;n++){
    const f=f0*n*Math.sqrt(1+B*n*n); if(f>12000)break;
    for(const det of [-1.2,1.2]){
      const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=f; o.detune.value=det*(1+n*.05);
      const g=ctx.createGain(), amp=(1/Math.pow(n,1.15))*(n%2===0?.8:1)*.5;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(amp,t+.004);
      g.gain.exponentialRampToValueAtTime(.0005,t+decayBase/(1+n*.35)+.3);
      o.connect(g); g.connect(out); o.start(t); o.stop(t+dur+.5);
    }
  }
  const nb=ctx.createBuffer(1,ctx.sampleRate*.05,ctx.sampleRate), d=nb.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
  const ns=ctx.createBufferSource(); ns.buffer=nb;
  const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=Math.min(4000,f0*4); bp.Q.value=.8;
  const ng=ctx.createGain(); ng.gain.value=.25*vel;
  ns.connect(bp); bp.connect(ng); ng.connect(out); ns.start(t);
  return mkHandle(out);
}
const CHORDS={maj:[0,4,7],min:[0,3,7],aug:[0,4,8],dim:[0,3,6]};
const CHORD_NAMES={maj:'major',min:'minor',aug:'augmented',dim:'diminished'};
const chordIv=q=>CHORDS[q]||CHORDS.maj;
function playChord(root,q,dur=1.7){
  chordIv(q).forEach((i,k)=>playPiano(root+i,dur,.72,k*.03));
}
function playArp(root,q){
  [...chordIv(q),12].forEach((i,k,a)=>playPiano(root+i,k===a.length-1?1.8:.9,.75,k*.35));
}

/* ----- timed sequences (cancelled whenever the round ends / menu opens) ----- */
let timers=[],seqId=0;
function cancelSeq(){seqId++;timers.forEach(clearTimeout);timers=[];stopHeld();fadeVoices();}
function later(ms,fn){const id=seqId;timers.push(setTimeout(()=>{if(id===seqId)fn();},ms));}
function seq(steps){ // steps: [[ms,fn],...] — waits for the piano to be ready first
  cancelSeq();const id=seqId;
  pianoReady().then(()=>{if(id!==seqId)return;steps.forEach(([ms,fn])=>later(ms,fn));});
}

// pure sine for the pitch-match game (target)
function pureTone(freq,secs){
  initAudio();
  const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;
  o.type='sine';o.frequency.value=freq;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.35,t+.04);
  g.gain.setValueAtTime(.35,t+secs-.1);g.gain.linearRampToValueAtTime(0,t+secs);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+secs+.05);
  return o;
}

const setBest=(k,v)=>{try{localStorage.setItem('best_'+k,v)}catch(e){}};
let held=null;
function stopHeld(){
  if(held&&ctx){const {o,g}=held;held=null;
    try{const n=ctx.currentTime;g.gain.cancelScheduledValues(n);g.gain.setValueAtTime(g.gain.value,n);g.gain.linearRampToValueAtTime(0,n+.06);o.stop(n+.08);}catch(e){}
  }
}

/* ============ GAME 1: MATCH THE TONE ============ */
const FMIN=150,FMAX=1000,SL=(FMAX-FMIN)*100;  // one slider step = exactly 0.01 Hz
const s2f=v=>FMIN+v/100;
const hz=f=>f.toFixed(2);
function gMatch(){
  S.title='Match the tone';S.max=100;
  S.start=()=>{
    cancelSeq();
    S.target=Math.round(Math.exp(rnd(Math.log(200),Math.log(800)))*100)/100;
    S.done=false;
    M.innerHTML=header('Match the tone')+`<div class="stage">
      <div class="big" id="bigm">♪</div>
      <div class="hint" id="hm">Listen closely…</div>
      <input type="range" id="sl" min="0" max="${SL}" value="${ri(5000,SL-5000)}" disabled>
      <div class="row" style="margin-top:0"><button class="btn acc" id="sub" disabled>Lock in</button></div>
      <div class="result" id="res"><div class="res-sub">Arrow keys nudge the slider by 0.01 Hz.</div></div></div>`;
    const sl=$('sl');
    const startMine=()=>{
      initAudio();
      const o=ctx.createOscillator(),g=ctx.createGain(),n=ctx.currentTime;
      o.type='sine';o.frequency.value=s2f(+sl.value);
      g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(.3,n+.05);
      o.connect(g);g.connect(master);o.start();held={o,g};
    };
    const showLive=()=>{$('hm').innerHTML=`Your tone: <span class="live">${hz(s2f(+sl.value))} Hz</span>`;};
    sl.addEventListener('input',()=>{
      if(S.done)return;
      if(held)held.o.frequency.setTargetAtTime(s2f(+sl.value),ctx.currentTime,.01);
      showLive();
    });
    $('sub').onclick=()=>{
      if(S.done)return;S.done=true;stopHeld();
      const g=s2f(+sl.value),cents=1200*Math.log2(g/S.target),ac=Math.abs(cents);
      const pts=Math.round(Math.max(0,100*(1-ac/200)));
      S.score+=pts;$('sc').textContent=S.score;
      $('bigm').textContent=hz(S.target)+' Hz';
      $('hm').textContent='You: '+hz(g)+' Hz';
      $('res').innerHTML=`<div class="pts ${pts>80?'g':pts>40?'a':'b'}">+${pts}</div>
        <div class="res-sub">${ac<1?'Perfect.':Math.round(ac)+' cents '+(cents>0?'sharp':'flat')+' · '+Math.abs(g-S.target).toFixed(2)+' Hz off'}</div>
        <div class="row"><button class="btn acc" onclick="nextOrEnd()">${S.round+1>=S.rounds?'Finish':'Next'}</button></div>`;
      $('sub').disabled=true;sl.disabled=true;
    };
    initAudio();
    pureTone(S.target,2);
    later(2050,()=>{
      sl.disabled=false;$('sub').disabled=false;
      showLive();
      startMine();                      // your tone now sounds constantly while you slide
    });
  };
  S.start();
}

/* ============ PIANO UI ============ */
const LOW=48,HIGH=83; // C3..B5
function buildPiano(onKey){
  const whites=[],blacks=[];
  for(let m=LOW;m<=HIGH;m++){NAMES[m%12].includes('#')?blacks.push(m):whites.push(m);}
  const W=whites.length;
  let h=`<div class="pianoWrap"><div class="piano" id="piano">`;
  whites.forEach(m=>h+=`<div class="wk" data-m="${m}"></div>`);
  blacks.forEach(m=>{
    const wi=whites.filter(w=>w<m).length; // white keys to the left
    h+=`<div class="bk" data-m="${m}" style="left:calc(${wi/W*100}% - 1.6%)"></div>`;
  });
  return h+`</div></div>`;
}
function bindPiano(fn){
  document.querySelectorAll('#piano [data-m]').forEach(el=>el.addEventListener('pointerdown',e=>{e.preventDefault();fn(+el.dataset.m,el)}));
}
const label=m=>NAMES[m%12]+(Math.floor(m/12)-1);

/* ============ GAME 2: NAME THE NOTE ============ */
function gNote(){
  S.title='Name the note';S.max=100;
  S.start=()=>{
    S.target=ri(LOW,HIGH);S.done=false;
    M.innerHTML=header('Name the note')+`<div class="stage">
      <div class="big" id="bigm">♪</div>

      ${buildPiano()}

    bindPiano((m,el)=>{

      const base=Math.max(0,100*(1-d/12)),pts=Math.round(d===0?base:base/2); // wrong guesses earn half (1 off = 46, not 92)
      const msg=d===0?'Exact key!':d+' half step'+(d>1?'s':'')+' away';
      S.score+=pts;$('sc').textContent=S.score;

      $('hm').textContent='You picked '+label(m);
      $('res').innerHTML=`<div class="pts ${pts===100?'g':pts?'a':'b'}">+${pts}</div><div class="res-sub">${msg}</div>
        <div class="row"><button class="btn acc" onclick="nextOrEnd()">${S.round+1>=S.rounds?'Finish':'Next'}</button></div>`;
    });

}

/* ============ GAME 5: HIGHER OR LOWER ============ */
const HL_CENTS=Array.from({length:20},(_,i)=>Math.round(100-i*99/19));   // 20 rounds, a constant step from 100 cents down to 1 cent
function gHL(){
  S.title='Higher or lower';S.max=10;
  const pool=Array.from({length:19},(_,i)=>i+1);S.same=new Set();     // four surprise "same" rounds
  while(S.same.size<4)S.same.add(pool[ri(0,pool.length-1)]);
  S.start=()=>{
    const cents=S.same.has(S.round)?0:HL_CENTS[S.round];
    S.dir=cents===0?0:(Math.random()<.5?1:-1);
    S.cents=cents;S.base=rnd(52,70);S.done=false;
    const m2=S.base+S.dir*cents/100;
    M.innerHTML=header('Higher or lower')+`<div class="stage">
      <div class="big" id="bigm">♪</div>
      <div class="hint" id="hm">Is the second note higher, lower, or the same?</div>
      <div class="seg" id="hlseg"><button data-a="1">Higher</button><button data-a="0">Same</button><button data-a="-1">Lower</button></div>
      <div class="result" id="res"></div></div>`;
    document.querySelectorAll('#hlseg button').forEach(b=>b.onclick=()=>{
      if(S.done)return;S.done=true;
      const a=+b.dataset.a,ok=a===S.dir,pts=ok?10:0;
      S.score+=pts;$('sc').textContent=S.score;
      document.querySelectorAll('#hlseg button').forEach(x=>{
        x.classList.remove('sel');
        if(+x.dataset.a===S.dir)x.classList.add('good');else if(x===b)x.classList.add('bad');});
      $('bigm').textContent=S.dir===0?'Same':S.cents+' cents';
      $('hm').textContent=S.dir===0?'The two notes were identical':'The second note was '+S.cents+' cent'+(S.cents>1?'s':'')+(S.dir>0?' higher':' lower');
      $('res').innerHTML=`<div class="pts ${ok?'g':'b'}">+${pts}</div>
        <div class="row"><button class="btn acc" onclick="nextOrEnd()">${S.round+1>=S.rounds?'Finish':'Next'}</button></div>`;
    });
    seq([[250,()=>playPiano(S.base,1.1,.8)],[1500,()=>playPiano(m2,1.1,.8)]]);
  };
  S.start();
}

/* ============ GAME 6: ODD ONE OUT ============ */
const ODD_CENTS=Array.from({length:10},(_,i)=>50-i*5);   // 10 rounds: 50, 45, 40 ... 5 cents off
const OD_COL=[['Red','#ff5d5d'],['Yellow','#ffe27a'],['Green','#4ade80'],['Blue','#5ad1ff'],['Purple','#bc4dff']];
function gOdd(){
  S.title='Odd one out';S.max=10;
  S.start=()=>{
    S.cents=ODD_CENTS[S.round];S.odd=ri(0,4);S.sign=Math.random()<.5?1:-1;
    S.base=ri(52,72);S.done=false;S.heard=false;S.busy=false;
    const pitch=i=>S.base+(i===S.odd?S.sign*S.cents/100:0);
    const btns=OD_COL.map(([nm,c],i)=>{
      const a=(-90+72*i)*Math.PI/180;
      return `<button class="ob dim" data-i="${i}" aria-label="${nm}" style="left:${50+37*Math.cos(a)}%;top:${50+37*Math.sin(a)}%;background:${c};--c:${c}">${i+1}</button>`;
    }).join('');
    M.innerHTML=header('Odd one out')+`<div class="stage">
      <div class="hint" id="hm">Four buttons play the same pitch. One is off. Press Listen, then pick it.</div>
      <div class="odd" id="odd">${btns}<button class="btn acc listen" id="lis">Listen</button></div>
      <div class="result" id="res"></div></div>`;
    const all=[...document.querySelectorAll('#odd .ob')];

      if(S.busy||S.done)return;S.busy=true;$('lis').disabled=true;
      const steps=[];
      all.forEach((b,i)=>{
        steps.push([i*900,()=>{playPiano(pitch(i),.75,.8);b.classList.add('lit');}]);
        steps.push([i*900+750,()=>b.classList.remove('lit')]);
      });
      steps.push([4*900+800,()=>{S.busy=false;S.heard=true;$('lis').disabled=S.done;$('lis').textContent='Listen again';all.forEach(b=>b.classList.remove('dim'));}]);
      seq(steps);
    };
    all.forEach(b=>b.onclick=()=>{
      if(!S.heard||S.busy||S.done)return;S.done=true;$('lis').disabled=true;
      const i=+b.dataset.i,ok=i===S.odd,pts=ok?10:0;
      S.score+=pts;$('sc').textContent=S.score;
      all.forEach((x,j)=>{if(j===S.odd)x.classList.add('good');else if(x===b)x.classList.add('bad');else x.classList.add('dim');});
      $('hm').textContent=`${OD_COL[S.odd][0]} (${S.odd+1}) was ${S.cents} cent${S.cents>1?'s':''} ${S.sign>0?'sharp':'flat'}`;
      $('res').innerHTML=`<div class="pts ${ok?'g':'b'}">+${pts}</div>
        <div class="row"><button class="btn acc" onclick="nextOrEnd()">${S.round+1>=S.rounds?'Finish':'Next'}</button></div>`;
    });
  };
  S.start();
}

/* ============ GAME 7: RHYTHM ============ */
const BPM=80,SPB=60/BPM,BARB=4;            // one 4-beat bar per round
let pc=null,pcP=null,pcSrc='',pcKeysCache=null;
const PC_FILE='Percussion.sf2';
function loadPercAuto(){
  if(pcP)return pcP;
  pcP=(async()=>{
    try{const c=await idbGet('perc');if(c&&c.buf){pc=parseSF2(c.buf);pcSrc=c.name;pcKeysCache=null;return true;}}catch(e){}
    try{const r=await fetch(PC_FILE);if(r.ok){pc=parseSF2(await r.arrayBuffer());pcSrc=PC_FILE;pcKeysCache=null;return true;}}catch(e){}
    return false;
  })();
  return pcP;
}
async function loadPercFile(file){
  try{
    const b=await file.arrayBuffer();pc=parseSF2(b);pcSrc=file.name;pcKeysCache=null;pcP=Promise.resolve(true);
    try{await idbSet('perc',{buf:b,name:file.name})}catch(e){}
  }catch(e){alert('Could not read that soundfont: '+e.message);}
  pcStatus();
}
function pcStatus(){
  const el=$('pcs');if(!el)return;
  el.innerHTML=pc?`percussion: ${pcSrc}`:`${PC_FILE} not found next to this page, so synth sounds are used. <label class="ld">load ${PC_FILE}<input id="pcf" type="file" accept=".sf2" hidden></label>`;
  const f=$('pcf');if(f)f.onchange=e=>{if(e.target.files[0])loadPercFile(e.target.files[0]);};
}
function percKeys(){
  if(pcKeysCache)return pcKeysCache;
  const set=new Set();pc.regions.forEach(r=>{for(let k=r.kLo;k<=r.kHi;k++)set.add(k);});
  return pcKeysCache=[...set].sort((a,b)=>a-b);
}
function percBuf(sid){
  if(pc.cache[sid])return pc.cache[sid];
  const h=pc.shdr[sid],n=h.end-h.start,b=ctx.createBuffer(1,n,h.rate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=pc.pcm[h.start+i]/32768;
  return pc.cache[sid]=b;
}
function drumKeys(){
  const c=pc?percKeys():null;
  const pickK=(cands,avoid)=>{
    if(!c)return cands.find(k=>!avoid.includes(k));
    const a=cands.find(k=>c.includes(k)&&!avoid.includes(k));
    if(a!==undefined)return a;
    const b=c.find(k=>!avoid.includes(k));return b!==undefined?b:c[0];
  };
  const main=pickK([38,37,56,76],[]),low=pickK([36,45,77,35],[main]);
  const tick=pickK([42,75,44,37],[main,low]),tap=pickK([39,76,56,40],[main,low,tick]);
  const kick=pickK([36,35],[]),snare=pickK([38,40,37],[kick]),hat=pickK([42,44,46],[kick,snare]),met=pickK([75,76,77,56],[kick,snare,hat]);
  return {main,low,tick,tap,kick,snare,hat,met};
}
function synthHit(key,t,vel){
  const g=ctx.createGain();g.connect(master);
  if(key<41){
    const o=ctx.createOscillator();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);
    g.gain.setValueAtTime(.9*vel,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);
    o.connect(g);o.start(t);o.stop(t+.25);
  }else{
    const n=Math.floor(ctx.sampleRate*.12),b=ctx.createBuffer(1,n,ctx.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
    const s=ctx.createBufferSource();s.buffer=b;
    const f=ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=900+((key*37)%1800);
    s.connect(f);f.connect(g);g.gain.value=.8*vel;s.start(t);
  }
}
function playPerc(key,t,vel=.85){
  if(!pc)return synthHit(key,t,vel);
  const vi=Math.max(1,Math.round(vel*127));
  let rs=pc.regions.filter(r=>key>=r.kLo&&key<=r.kHi&&vi>=r.vLo&&vi<=r.vHi);
  if(!rs.length)return synthHit(key,t,vel);
  rs=rs.filter(r=>r.vLo===rs[0].vLo&&r.vHi===rs[0].vHi);
  const env=ctx.createGain();env.gain.value=.5+.5*vel;env.connect(master);
  rs.forEach(r=>{
    const src=ctx.createBufferSource();src.buffer=percBuf(r.sid);
    src.playbackRate.value=Math.pow(2,((key-r.root)*r.scale+r.tune)/1200);
    let node=src;
    const g=ctx.createGain();g.gain.value=Math.pow(10,-r.att/200);node.connect(g);node=g;
    if(ctx.createStereoPanner){const p=ctx.createStereoPanner();p.pan.value=r.pan;node.connect(p);node=p;}
    node.connect(env);src.start(t);src.stop(t+3);
  });
}

const rpick=a=>a[ri(0,a.length-1)];
const shufflePick=(a,n)=>a.slice().sort(()=>Math.random()-.5).slice(0,n);
// Pattern = events {t: beat position inside the bar, l: 0 main sound / 1 low sound}. Gets harder each round.
function genPattern(r){
  const E=(ts,l=0)=>ts.map(t=>({t,l}));
  const grid=(step,n)=>{const all=[];for(let t=step;t<BARB-1e-9;t+=step)all.push(+t.toFixed(4));return [0,...shufflePick(all,n-1)];};
  let ev,label;
  switch(r){
    case 0:ev=E([0,1,2,3]);label='Steady quarter notes';break;
    case 1:ev=E([0,...shufflePick([1,2,3],ri(1,2))]);label='Quarter notes with rests';break;
    case 2:ev=E([0,...shufflePick([1,2,3],2),...shufflePick([.5,1.5,2.5,3.5],2)]);label='Eighth-note off-beats';break;
    case 3:ev=E(grid(.5,ri(6,7)));label='Eighth-note groove';break;
    case 4:ev=E(grid(.25,ri(5,6)));label='Syncopation';break;
    case 5:ev=E(grid(.25,ri(7,8)));label='Sixteenth notes';break;
    case 6:ev=E(grid(1/3,ri(6,7)));label='Triplets';break;
    case 7:{
      let ts,anyT;
      do{ts=[];anyT=false;
        for(let b=0;b<4;b++){const T=Math.random()<.5;anyT=anyT||T;
          (T?[0,1/3,2/3]:[0,.5]).forEach((x,i)=>{if(i===0||Math.random()<.75)ts.push(+(b+x).toFixed(4));});}
      }while(ts.length<6||!anyT);
      ev=E(ts);label='Triplets mixed with straight notes';break;}
    default:{
      const [p,q]=rpick(r===8?[[3,4],[3,2]]:[[5,4],[5,3],[7,4]]);
      ev=[...E(Array.from({length:p},(_,k)=>+(k*BARB/p).toFixed(4))),...E(Array.from({length:q},(_,k)=>+(k*BARB/q).toFixed(4)),1)];
      label=`Polyrhythm ${p}:${q}`;}
  }
  ev.sort((a,b)=>a.t-b.t||a.l-b.l);
  ev=ev.filter((e,i)=>!i||e.t-ev[i-1].t>1e-6);
  return {ev,label};
}

// Judging: Timing (60%) how close each hit is - 100 ms off is ~45% for that hit, not zero.
// Steadiness (25%) how even your offsets are (a steady player who is consistently a bit late keeps this).
// Cleanliness (15%) hit every note, no extra / wrong-key taps.
function hitScore(d){d=Math.abs(d);if(d<=.03)return 1;if(d<=.1)return 1-.55*(d-.03)/.07;if(d<=.2)return .45-.35*(d-.1)/.1;if(d<=.3)return .1*(1-(d-.2)/.1);return 0;}
function judge(ev,taps,spb){            // ev: {t in beats, key?}  taps: {t in seconds, key?}
  const used=new Set(),match=[];
  ev.forEach((e,ei)=>{
    const tt=e.t*spb;let bi=-1,bd=9;
    taps.forEach((tp,i)=>{if(used.has(i)||(e.key&&tp.key!==e.key))return;const d=Math.abs(tp.t-tt);if(d<bd){bd=d;bi=i;}});
    if(bi>=0&&bd<=.3){used.add(bi);match[ei]={i:bi,dt:taps[bi].t-tt};}
  });
  const n=ev.length,ms=match.filter(Boolean),m=ms.length,extra=taps.length-used.size;
  const timing=ms.reduce((a,x)=>a+hitScore(x.dt),0)/n;
  let steady=0,sd=0,avg=0;
  if(m)avg=ms.reduce((a,x)=>a+x.dt,0)/m;
  if(m>=2){sd=Math.sqrt(ms.reduce((a,x)=>a+(x.dt-avg)*(x.dt-avg),0)/m);steady=Math.max(0,1-sd/.1)*(m/n);}
  else if(m===1&&n===1)steady=1;
  const clean=(m/n)*(1-Math.min(1,extra/n));
  const pts=Math.round(60*timing+25*steady+15*clean);
  return {pts,timing,steady,clean,match,used,extra,m,n,avgMs:avg*1000,sdMs:sd*1000};
}
const rateOf=p=>p>=92?'Perfect':p>=80?'Great':p>=65?'Good':p>=50?'Okay':'Keep practicing';
const pc100=x=>Math.round(x*100)+'%';
function breakdown(r){
  return `Timing ${pc100(r.timing)} · Steadiness ${pc100(r.steady)} · Clean ${pc100(r.clean)}<br>${r.m}/${r.n} hits${r.extra?` · ${r.extra} extra`:''}${r.m?` · avg ${Math.abs(Math.round(r.avgMs))} ms ${r.avgMs<0?'early':'late'}`:''}`;
}

function gRhythm(){
  S.title='Rhythm';S.max=100;
  S.start=()=>{
    const {ev,label}=genPattern(S.round);
    S.ev=ev;S.label=label;S.phase='idle';S.done=false;S.heard=false;S.taps=[];
    M.innerHTML=header('Rhythm')+`<div class="stage">
      <div class="big" id="bigm">♪</div>
      <div class="hint" id="hm">Press Listen, then Record and tap the pattern back.</div>
      <div class="row" style="margin-top:0"><button class="btn acc" id="rl">▶ Listen</button><button class="btn ghost" id="rr" disabled>● Record</button></div>
      <button class="tap" id="tap" disabled>TAP<small>or press Space</small></button>
      <div class="result" id="res"></div>
      <div class="pvhelp" id="pcs"></div></div>`;
    $('rl').onclick=()=>rhRun('listen');
    $('rr').onclick=()=>rhRun('rec');
    $('tap').addEventListener('pointerdown',e=>{e.preventDefault();rhTap(e.timeStamp);});
    pcStatus();loadPercAuto().then(pcStatus);
    rhBtns();
  };
  S.start();
}
function rhBtns(){
  if(!$('rl'))return;
  const busy=S.phase==='listen'||S.phase==='rec';
  $('rl').disabled=busy||S.done;
  $('rr').disabled=busy||S.done||!S.heard;
  $('tap').disabled=S.phase!=='rec';
  $('tap').classList.toggle('on',S.phase==='rec');
}
function rhRun(mode){
  if(S.phase==='listen'||S.phase==='rec'||S.done)return;
  initAudio();
  loadPercAuto().then(()=>{
    if(S.phase==='listen'||S.phase==='rec'||S.done||!$('rl'))return;
    cancelSeq();
    pcStatus();
    const K=S.keys=drumKeys(),lat=(ctx.outputLatency||0)+(ctx.baseLatency||0);
    const a0=ctx.currentTime+.2,bar=a0+4*SPB;
    for(let k=0;k<4;k++)playPerc(K.tick,a0+k*SPB,k===0?.75:.55);               // count-in
    if(mode==='listen')S.ev.forEach(e=>playPerc(e.l?K.low:K.main,bar+e.t*SPB,.9));
    S.perfBar=performance.now()+(bar-ctx.currentTime)*1000+lat*1000;           // when the downbeat is heard, in performance.now() time
    S.taps=[];S.phase=mode;rhBtns();
    $('res').innerHTML='';
    $('hm').textContent=mode==='listen'?'Listen…':'Get ready…';
    for(let k=0;k<4;k++)later(200+k*SPB*1000,()=>{$('bigm').textContent=k+1;});
    later(200+4*SPB*1000,()=>{$('bigm').textContent=mode==='listen'?'♪':'Tap!';$('hm').textContent=mode==='listen'?'Listen to the pattern':'Your turn';});
    if(mode==='listen')later(200+8*SPB*1000+300,()=>{S.phase='idle';S.heard=true;$('bigm').textContent='♪';$('hm').textContent='Listen again, or press Record when ready.';rhBtns();});
    else later(200+8*SPB*1000+500,rhFinish);
  });
}
function rhTap(ts){
  if(S.phase!=='rec'||!ctx)return;
  const rel=(ts-S.perfBar)/1000;
  if(rel<-.3||rel>BARB*SPB+.5)return;
  S.taps.push(rel);
  playPerc(S.keys.tap,ctx.currentTime,.9);
  const t=$('tap');if(t){t.classList.add('hit');setTimeout(()=>t.classList.remove('hit'),80);}
}
function rhFinish(){
  S.phase='idle';S.done=true;rhBtns();
  const r=judge(S.ev.map(e=>({t:e.t})),S.taps.map(t=>({t})),SPB),pts=r.pts;
  S.score+=pts;$('sc').textContent=S.score;
  const total=BARB*SPB,X=t=>(4+92*Math.max(0,Math.min(1,t/total)))+'%';
  const tl=`<div class="tl">${[1,2,3].map(b=>`<i class="g" style="left:${X(b*SPB)}"></i>`).join('')}
    ${S.ev.map(e=>`<i class="p" style="left:${X(e.t*SPB)}"></i>`).join('')}
    ${S.taps.map((t,i)=>`<i class="t${r.used.has(i)?'':' x'}" style="left:${X(t)}"></i>`).join('')}</div>`;
  $('bigm').textContent=pts+'%';
  $('hm').textContent=`${rateOf(pts)} · ${S.label}`;
  $('res').innerHTML=`<div class="pts ${pts>=65?'g':pts>=50?'a':'b'}">+${pts}</div>
    <div class="res-sub">${breakdown(r)}</div>
    ${tl}<div class="res-sub">white = the rhythm · purple = your taps${r.extra?' · red = extra':''}</div>
    <div class="row"><button class="btn ghost" id="rl2">Hear it again</button><button class="btn acc" onclick="nextOrEnd()">${S.round+1>=S.rounds?'Finish':'Next'}</button></div>`;
  $('rl2').onclick=()=>{ // replay the answer (no scoring effect)
    initAudio();cancelSeq();const K=S.keys,t0=ctx.currentTime+.15;
    S.ev.forEach(e=>playPerc(e.l?K.low:K.main,t0+e.t*SPB,.9));
  };
}
addEventListener('keydown',e=>{
  if(e.code!=='Space'||S.key!=='rhythm'||!$('tap'))return;
  e.preventDefault();if(!e.repeat)rhTap(e.timeStamp);
});
addEventListener('keyup',e=>{if(e.code==='Space'&&S.key==='rhythm'&&$('tap'))e.preventDefault();});

/* ============ GAME 8: DRUMS (read the strip, play it) ============ */
const DR_BPM=70,DSPB=60/DR_BPM;
// one character per grid slot: . rest, R right hand (J), L left hand (F), K kick (Space), A=K+R, B=L+R, C=K+L, D=K+L+R
const DK={R:['R'],L:['L'],K:['K'],A:['K','R'],B:['L','R'],C:['K','L'],D:['K','L','R']};
const DRUM_STAGES=[
  {n:'Steady snare',tip:'Left hand (F) on every beat.',g:16,mode:'g',bars:['L...L...L...L...','L...L...L...L...']},
  {n:'Kick and snare',tip:'Space is the kick, F is the snare.',g:16,mode:'g',bars:['K...L...K...L...','K...L...K...L...']},
  {n:'Hi-hat eighths',tip:'Right hand (J) on every eighth note.',g:16,mode:'g',bars:['R.R.R.R.R.R.R.R.','R.R.R.R.R.R.R.R.']},
  {n:'Basic rock beat',tip:'Hat with J, snare with F on 2 and 4, kick on 1 and 3. Stack them.',g:16,mode:'g',bars:['A.R.B.R.A.R.B.R.','A.R.B.R.A.R.B.R.']},
  {n:'Syncopated kick',tip:'Same hands, but the kick moves around.',g:16,mode:'g',bars:['A.R.B.R.R.A.B.R.','A.R.B.RKA.R.B.R.']},
  {n:'Sixteenth hats',tip:'Right hand plays four notes per beat. Keep it even.',g:16,mode:'s2',bars:['ARRRBRRRARRRBRRR','ARRRBRRRARRRBRRR']},
  {n:'Paradiddle',tip:'Sticking is written on the notes: J = R, F = L.',g:16,mode:'s',bars:['R.L.R.R.L.R.L.L.','R.L.R.R.L.R.L.L.']},
  {n:'Triplet strokes',tip:'Three notes per beat, alternating hands.',g:12,mode:'s',bars:['RLRLRLRLRLRL','RLRLRLRLRLRL']},
  {n:'Sixteenth paradiddles',tip:'Fast sticking. Stay relaxed and even.',g:16,mode:'s',bars:['RLRRLRLLRLRRLRLL','RLRRLRLLRLRRLRLL']},
  {n:'Funk groove',tip:'Sixteenth hats with moving kicks and a backbeat snare.',g:16,mode:'g',bars:['ARRRBRRKRRARBRRR','ARRKBRRRRKARBRRR']}
];
function drParse(st){
  const ev=[];
  st.bars.forEach((bar,bi)=>[...bar].forEach((ch,si)=>{if(ch==='.')return;DK[ch].forEach(key=>ev.push({t:bi*4+si*4/st.g,key}));}));
  return ev;
}
function gDrums(){
  S.title='Drums';S.max=100;
  S.start=()=>{
    const st=DRUM_STAGES[S.round];
    S.st=st;S.ev=drParse(st);S.total=st.bars.length*4;S.phase='idle';S.done=false;S.taps=[];S.live=new Set();
    const stick=st.mode==='s',L=3,Wd=90,X=t=>6+Wd*t/S.total;
    const rows=stick?{R:55,L:55,K:55}:{R:26,L:52,K:78};
    let h='';
    if(stick)h+=`<div class="sl" style="top:55%"></div>`;
    else [['HH',26],['SD',52],['BD',78]].forEach(([l,y])=>{h+=`<div class="sl" style="top:${y}%"></div><span class="rl" style="top:${y}%">${l}</span>`;});
    for(let b=0;b<=st.bars.length;b++)h+=`<div class="sb" style="left:${6+Wd*b/st.bars.length}%"></div>`;
    for(let i=0;i<S.total;i++)h+=`<span class="sn" style="left:${X(i)}%">${i%4+1}</span>`;
    S.ev.forEach((e,i)=>{
      const isHat=!stick&&e.key==='R';
      h+=`<span class="nt${isHat?' hh':''}" data-i="${i}" style="left:${X(e.t)}%;top:${rows[e.key]}%">${isHat?'×':stick?e.key:''}</span>`;
    });
    h+=`<div class="ph" id="ph"></div>`;
    M.innerHTML=header('Drums')+`<div class="stage">
      <div class="hint" id="hm"><b>Stage ${S.round+1}: ${esc(st.n)}</b> · ${esc(st.tip)}</div>
      <div class="big" id="bigm" style="font-size:clamp(56px,10vw,100px)">♪</div>
      <div class="sheet" id="sheet">${h}</div>
      <div class="pads"><button class="pad" data-k="L" disabled>L<small>F</small></button><button class="pad" data-k="R" disabled>R<small>J</small></button><button class="pad" data-k="K" disabled${stick?' style="visibility:hidden"':''}>Kick<small>Space</small></button></div>
      <div class="row"><button class="btn acc" id="dgo">▶ Start (4 count-in)</button></div>
      <div class="result" id="res"></div>
      <div class="pvhelp" id="pcs"></div></div>`;
    $('dgo').onclick=drStart;
    document.querySelectorAll('.pad').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();drTap(b.dataset.k,e.timeStamp);}));
    pcStatus();loadPercAuto().then(pcStatus);
  };
  S.start();
}
function drSound(key){
  const K=S.keys;
  if(S.st.mode==='s')return {k:K.snare,v:key==='R'?.9:.8};
  return {k:key==='K'?K.kick:key==='L'?K.snare:K.hat,v:.9};
}
function drStart(){
  if(S.phase!=='idle'||S.done)return;
  initAudio();$('dgo').disabled=true;
  loadPercAuto().then(()=>{
    if(S.phase!=='idle'||!$('sheet'))return;
    cancelSeq();pcStatus();
    const K=S.keys=drumKeys(),lat=(ctx.outputLatency||0)+(ctx.baseLatency||0);
    const a0=ctx.currentTime+.25,bar=a0+4*DSPB;
    for(let k=0;k<4;k++)playPerc(K.met,a0+k*DSPB,k===0?.8:.6);                         // count-in
    for(let b=0;b<S.total;b++)playPerc(K.met,bar+b*DSPB,b%4===0?.55:.35);              // metronome keeps going
    S.perfBar=performance.now()+(bar-ctx.currentTime)*1000+lat*1000;
    S.taps=[];S.live=new Set();S.phase='run';
    document.querySelectorAll('.pad').forEach(b=>b.disabled=false);
    for(let k=0;k<4;k++)later(250+k*DSPB*1000,()=>{$('bigm').textContent=k+1;});
    later(250+4*DSPB*1000,()=>{$('bigm').textContent='Go!';$('ph').style.display='block';drLoop();});
    later(250+(4+S.total)*DSPB*1000+450,drFinish);
  });
}
function drLoop(){
  const ph=$('ph');if(!ph||S.phase!=='run')return;
  const u=(performance.now()-S.perfBar)/1000/(S.total*DSPB);
  ph.style.left=(6+90*Math.max(0,Math.min(1,u)))+'%';
  requestAnimationFrame(drLoop);
}
function drTap(key,ts){
  if(S.phase!=='run'||!ctx)return;
  const rel=(ts-S.perfBar)/1000;
  if(rel<-.3||rel>S.total*DSPB+.4)return;
  S.taps.push({t:rel,key});
  const snd=drSound(key);playPerc(snd.k,ctx.currentTime,snd.v);
  // live colouring of the closest unplayed note for this key
  let bi=-1,bd=.3;
  S.ev.forEach((e,i)=>{if(e.key!==key||S.live.has(i))return;const d=Math.abs(rel-e.t*DSPB);if(d<bd){bd=d;bi=i;}});
  const pad=document.querySelector(`.pad[data-k="${key}"]`);
  if(bi>=0){S.live.add(bi);const n=document.querySelector(`.nt[data-i="${bi}"]`);if(n)n.classList.add(bd<=.06?'g1':bd<=.12?'g2':'g3');}
  if(pad){pad.classList.add(bi>=0?'hit':'bad');setTimeout(()=>pad.classList.remove('hit','bad'),90);}
}
function drFinish(){
  if(S.phase!=='run')return;
  S.phase='done';S.done=true;
  document.querySelectorAll('.pad').forEach(b=>b.disabled=true);
  const r=judge(S.ev,S.taps,DSPB),pts=r.pts;
  S.score+=pts;$('sc').textContent=S.score;
  S.ev.forEach((e,i)=>{
    const n=document.querySelector(`.nt[data-i="${i}"]`);if(!n)return;
    n.classList.remove('g1','g2','g3','miss');
    const m=r.match[i];n.classList.add(!m?'miss':Math.abs(m.dt)<=.06?'g1':Math.abs(m.dt)<=.12?'g2':'g3');
  });
  $('ph').style.display='none';
  $('bigm').textContent=pts+'%';
  $('hm').innerHTML=`<b>${rateOf(pts)}</b> · ${esc(S.st.n)}`;
  $('res').innerHTML=`<div class="pts ${pts>=65?'g':pts>=50?'a':'b'}">+${pts}</div>
    <div class="res-sub">${breakdown(r)}</div>
    <div class="res-sub">green ≤ 60 ms · yellow ≤ 120 ms · orange later · red = missed or wrong hand</div>
    <div class="row"><button class="btn acc" onclick="nextOrEnd()">${S.round+1>=S.rounds?'Finish':'Next'}</button></div>`;
}
const DR_KEYS={KeyF:'L',KeyJ:'R',Space:'K'};
addEventListener('keydown',e=>{
  if(S.key!=='drums'||!$('sheet')||e.ctrlKey||e.metaKey||e.altKey)return;
  const k=DR_KEYS[e.code];if(!k)return;
  e.preventDefault();if(!e.repeat)drTap(k,e.timeStamp);
});
addEventListener('keyup',e=>{if(S.key==='drums'&&$('sheet')&&e.code==='Space')e.preventDefault();});

/* ============ GAME 9: 8D AUDIO ============ */
const SP_NOTES=[12,10,8,7,6,5,4,3,2,1];     // the rhythm gets shorter every round, ending on a single note
function spPlay(az,n,f0){                   // returns total length in seconds
  initAudio();
  const p=ctx.createPanner();p.panningModel='HRTF';p.distanceModel='inverse';p.refDistance=1;p.rolloffFactor=0;
  const x=Math.sin(az),z=-Math.cos(az);                       // listener faces -Z; azimuth is clockwise from the front
  if(p.positionX){p.positionX.value=x;p.positionY.value=0;p.positionZ.value=z;}else p.setPosition(x,0,z);
  const out=ctx.createGain();out.gain.value=1.1;p.connect(out);out.connect(master);
  let t=ctx.currentTime+.2;const t0=t;
  for(let i=0;i<n;i++){
    const d=.14;
    const env=ctx.createGain();env.gain.setValueAtTime(0,t);env.gain.linearRampToValueAtTime(.6,t+.006);env.gain.exponentialRampToValueAtTime(.001,t+d);
    env.connect(p);
    const o=ctx.createOscillator();o.type='sawtooth';o.frequency.value=f0*(i%3===2?1.5:1);o.connect(env);o.start(t);o.stop(t+d+.02);
    const nb=ctx.createBuffer(1,Math.floor(ctx.sampleRate*d),ctx.sampleRate),dd=nb.getChannelData(0);
    for(let k=0;k<dd.length;k++)dd[k]=(Math.random()*2-1)*(1-k/dd.length);
    const ns=ctx.createBufferSource();ns.buffer=nb;const ng=ctx.createGain();ng.gain.value=.5;ns.connect(ng);ng.connect(env);ns.start(t);
    t+=rpick([.17,.17,.25,.34]);
  }
  return t-t0;
}
const dirName=a=>['front','front-right','right','back-right','back','back-left','left','front-left'][Math.round(((a%360)+360)%360/45)%8];
function gSpatial(){
  S.title='8D audio';S.max=10;
  S.start=()=>{
    S.n=SP_NOTES[S.round];S.az=rnd(0,Math.PI*2);S.done=false;S.heard=false;S.drag=false;S.guess=null;
    M.innerHTML=header('8D audio')+`<div class="stage">
      <div class="hint" id="hm">Headphones on. Press Ready. The sound plays once. Then drag the dot to where it came from.</div>
      <div class="joy" id="joy"><div class="ring"></div><span class="jl f">FRONT</span><span class="jl b">BACK</span><span class="jl l">L</span><span class="jl r">R</span><div class="head"></div><div class="puck" id="puck"></div></div>
      <div class="row" style="margin-top:0"><button class="btn acc" id="rdy">Ready</button><button class="btn ghost" id="lock" disabled>Lock in</button></div>
      <div class="result" id="res"></div></div>`;
    const joy=$('joy'),puck=$('puck');
    const setPuck=(cx,cy)=>{
      const r=joy.getBoundingClientRect(),R=r.width/2;
      let dx=cx-(r.left+R),dy=cy-(r.top+R);const d=Math.hypot(dx,dy);
      if(d>R*.92){dx*=R*.92/d;dy*=R*.92/d;}
      puck.style.left=(50+dx/r.width*100)+'%';puck.style.top=(50+dy/r.height*100)+'%';puck.classList.add('set');
      S.guess=Math.hypot(dx,dy)>R*.12?{dx,dy}:null;$('lock').disabled=!S.guess;
    };
    joy.addEventListener('pointerdown',e=>{if(!S.heard||S.done)return;joy.setPointerCapture(e.pointerId);S.drag=true;setPuck(e.clientX,e.clientY);});
    joy.addEventListener('pointermove',e=>{if(S.drag&&!S.done)setPuck(e.clientX,e.clientY);});
    ['pointerup','pointercancel'].forEach(ev=>joy.addEventListener(ev,()=>{S.drag=false;}));
    $('rdy').onclick=()=>{
      if(S.heard||$('rdy').disabled)return;$('rdy').disabled=true;$('hm').textContent='Listen…';
      const dur=spPlay(S.az,S.n,rpick([262,330,392,440]));
      later(dur*1000+450,()=>{S.heard=true;$('hm').textContent='Drag the dot to where you think it came from, then lock in.';});
    };
    $('lock').onclick=()=>{
      if(!S.guess||S.done)return;S.done=true;$('lock').disabled=true;
      const ga=Math.atan2(S.guess.dx,-S.guess.dy);
      let err=Math.abs(((ga-S.az)*180/Math.PI+540)%360-180);
      const pts=Math.round(10*Math.max(0,1-err/100));
      S.score+=pts;$('sc').textContent=S.score;
      const src=document.createElement('div');src.className='src';src.textContent='♪';
      src.style.left=(50+40*Math.sin(S.az))+'%';src.style.top=(50-40*Math.cos(S.az))+'%';joy.appendChild(src);
      $('hm').textContent=`It came from the ${dirName(S.az*180/Math.PI)} · you were ${Math.round(err)}° off${S.n>1?'':' (a single note!)'}`;
      $('res').innerHTML=`<div class="pts ${pts>=7?'g':pts>=4?'a':'b'}">+${pts}</div>
        <div class="row"><button class="btn acc" onclick="nextOrEnd()">${S.round+1>=S.rounds?'Finish':'Next'}</button></div>`;
    };
  };
  S.start();
}

/* ---- tiny MIDI parser: every non-drum channel becomes notes {m,t,d,v} in seconds ---- */
function parseMidi(buf){
  const u=new Uint8Array(buf),dv=new DataView(buf);
  const id4=o=>String.fromCharCode(u[o],u[o+1],u[o+2],u[o+3]);
  if(u.length<14||id4(0)!=='MThd')throw new Error('not a MIDI file');
  const hl=dv.getUint32(4),nt=dv.getUint16(10),div=dv.getUint16(12);
  if(div&0x8000)throw new Error('SMPTE timing is not supported');
  let p=8+hl,tr=0;const tempos=[[0,500000]],evs=[];
  while(tr<nt&&p+8<=u.length){
    const id=id4(p),len=dv.getUint32(p+4),end=Math.min(u.length,p+8+len);p+=8;
    if(id!=='MTrk'){p=end;continue;}
    tr++;let tick=0,run=0;
    const vlq=()=>{let v=0,b;do{b=u[p++];v=v*128+(b&127);}while((b&128)&&p<end);return v;};
    while(p<end){
      tick+=vlq();let st=u[p];
      if(st===0xFF){const ty=u[p+1];p+=2;const l=vlq();
        if(ty===0x51&&l===3)tempos.push([tick,(u[p]<<16)|(u[p+1]<<8)|u[p+2]]);
        p+=l;if(ty===0x2F)break;continue;}
      if(st===0xF0||st===0xF7){p++;p+=vlq();continue;}
      if(st&128){run=st;p++;}else st=run;
      const hi=st>>4,ch=st&15;
      if(hi===8||hi===9){const a=u[p],b=u[p+1];p+=2;evs.push([tick,(hi===9&&b>0)?1:0,ch,a,b]);}
      else if(hi===0xA||hi===0xB||hi===0xE)p+=2;
      else if(hi===0xC||hi===0xD)p+=1;
      else p++;
    }
    p=end;
  }
  tempos.sort((x,y)=>x[0]-y[0]);
  const seg=[];let sec=0;
  tempos.forEach((tp,i)=>{if(i>0){const pv=tempos[i-1];sec+=(tp[0]-pv[0])*pv[1]/1e6/div;}seg.push({tick:tp[0],sec,us:tp[1]});});
  const toSec=tk=>{let lo=0,hi=seg.length-1;while(lo<hi){const mid=(lo+hi+1)>>1;if(seg[mid].tick<=tk)lo=mid;else hi=mid-1;}const g=seg[lo];return g.sec+(tk-g.tick)*g.us/1e6/div;};
  evs.sort((x,y)=>x[0]-y[0]||x[1]-y[1]);   // note-offs before note-ons on the same tick
  const open={},notes=[];let dur=0;
  const fit=m=>{while(m<PLOW)m+=12;while(m>PHIGH)m-=12;return m;};
  const close=(o,t)=>{const d=Math.max(.06,t-o.t);notes.push({m:o.m,t:o.t,d,v:o.v});dur=Math.max(dur,o.t+d);};
  for(const [tk,on,ch,nn,vel] of evs){
    if(ch===9)continue;                       // skip drums
    const t=toSec(tk),k=ch*128+nn;
    if(on){(open[k]||(open[k]=[])).push({t,m:fit(nn),v:vel});}
    else if(open[k]&&open[k].length)close(open[k].shift(),t);
  }
  for(const k in open)open[k].forEach(o=>close(o,o.t+.5));
  if(!notes.length)throw new Error('no playable notes found');
  notes.sort((x,y)=>x.t-y.t||x.m-y.m);
  const lastTick=evs.length?evs[evs.length-1][0]:0,secTot=toSec(lastTick);
  const bpm=secTot>0?lastTick/div/(secTot/60):60e6/seg[seg.length-1].us;   // average tempo of the whole piece
  const speed=SONGSPEED*Math.max(.5,Math.min(2.2,bpm/100));                // slow pieces fall slower, fast ones faster
  return {notes,dur,bpm,speed,lead:BARH/speed+.3,tempos:seg.map(g=>({sec:g.sec,bpm:60e6/g.us}))};
}
async function sgLoad(e){
  if(e.song)return e.song;
  let buf=e.buf;
  if(!buf){
    let why='';
    if(location.protocol==='file:')why=' This page was opened as a file:// address, and browsers block loading other files that way. Use the "pick folder" button to choose the folder with your songs, or run a local server in it (for example "python -m http.server") and open http://localhost:8000.';
    else{
      let found=false;
      for(const u of [e.url].concat(e.alts||[])){
        try{const r=await fetch(u);if(!r.ok)continue;const b=await r.arrayBuffer();found=true;parseMidi(b);buf=b;break;}
        catch(err){if(found){why=' A file was found but could not be read: '+err.message;break;}}
      }
    }
    if(!buf)throw new Error('could not load "'+e.name+'".'+(why||' No file with that name (.mid, .midi or no extension) was found next to this page.'));
  }
  e.song=parseMidi(buf);return e.song;
}
const fmtT=x=>{x=Math.max(0,Math.floor(x));return Math.floor(x/60)+':'+String(x%60).padStart(2,'0');};

function sgFill(sel){

  el.innerHTML=L.map((s,i)=>`<option value="${i}">${s.name.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</option>`).join('');

}
function sgHalt(){
  clearInterval(PS.timer);PS.timer=0;
  (PS.hs||[]).forEach(x=>{try{x.h.release(.12)}catch(e){}});PS.hs=[];PS.playing=false;
}
function sgReset(){
  sgHalt();PS.song=null;PS.entry=null;PS.pos=0;PS.vlo=0;
  if(PV.on){PV.bpmtxt='';$('sgbpm').textContent='';$('sgplay').textContent='▶ Play';$('sgt').textContent='';$('sgp').style.width='0';}
}
function sgPause(){
  if(!PS.playing)return;
  PS.pos=ctx.currentTime-PS.base;PS.playing=false;sgHalt();
  $('sgplay').textContent='▶ Resume';
}
function sgStart(){
  PS.playing=true;PS.base=ctx.currentTime-PS.pos;PS.vlo=0;PS.hs=[];
  const N=PS.song.notes;let lo=0,hi=N.length;while(lo<hi){const mid=(lo+hi)>>1;if(N[mid].t<PS.pos)lo=mid+1;else hi=mid;}PS.i=lo;
  PS.timer=setInterval(sgTick,40);sgTick();
  $('sgplay').textContent='⏸ Pause';
}
function sgTick(){
  if(!PS.playing||!PS.song)return;
  const pos=ctx.currentTime-PS.base,N=PS.song.notes;
  while(PS.i<N.length&&N[PS.i].t<pos+.3){
    const n=N[PS.i++],w=n.t-pos;if(w<-.05)continue;
    PS.hs.push({h:playPiano(n.m,Math.max(.12,n.d),.3+.6*(n.v/127),Math.max(0,w)),end:n.t+n.d+.7});
  }
  if(PS.hs.length>64)PS.hs=PS.hs.filter(x=>x.end>pos);
  if(pos>PS.song.dur+1){sgHalt();PS.pos=-PS.song.lead;PS.vlo=0;$('sgplay').textContent='▶ Play';}
}
async function sgToggle(){
  if(!PV.on)return;
  initAudio();
  if(PS.playing){sgPause();return;}
  const e=songList()[+$('sgsel').value];if(!e)return;
  const btn=$('sgplay');
  if(PS.entry!==e||!PS.song){
    sgHalt();btn.disabled=true;btn.textContent='Loading…';
    try{PS.song=await sgLoad(e);PS.entry=e;PS.pos=-PS.song.lead;PS.vlo=0;}
    catch(err){btn.disabled=false;btn.textContent='▶ Play';if(PV.on)$('sgt').textContent='Could not load: '+err.message;return;}
    btn.disabled=false;
  }
  await pianoReady();
  if(!PV.on||PS.playing)return;
  sgStart();
}
function sgDraw(g,W,H){
  const cnt=PV.cnt;cnt.fill(0);
  let pos=null;
  if(PS.song)pos=PS.playing?ctx.currentTime-PS.base:PS.pos;
  if(pos!==null){
    const N=PS.song.notes,SP=PS.song.speed,look=H/SP;
    while(PS.vlo<N.length&&N[PS.vlo].t+N[PS.vlo].d<pos-.05)PS.vlo++;
    for(let k=PS.vlo;k<N.length;k++){
      const n=N[k];if(n.t>pos+look)break;
      if(n.t+n.d<pos-.05)continue;
      const f=PV.cx[n.m],w=f[1]*W,x=f[0]*W-w/2,bot=H-(n.t-pos)*SP,top=H-(n.t+n.d-pos)*SP;
      const y=top+1,h=Math.max(3,bot-top-2);
      g.fillStyle=f[2]?'#2f8fd1':'#5ad1ff';
      g.beginPath();if(g.roundRect)g.roundRect(x,y,w,h,Math.min(4,w/2));else g.rect(x,y,w,h);g.fill();
      if(n.t<=pos&&pos<n.t+n.d)cnt[n.m]=1;
    }
    const bt='♩ '+Math.round(PS.song.bpm)+' BPM';   // average tempo (some files change tempo hundreds of times)
    if(PV.bpmtxt!==bt){PV.bpmtxt=bt;$('sgbpm').textContent=bt;}
    const dur=PS.song.dur,txt=fmtT(pos)+' / '+fmtT(dur);
    if(PV.sgtxt!==txt){PV.sgtxt=txt;const t=$('sgt');if(t)t.textContent=txt;}
    $('sgp').style.width=Math.max(0,Math.min(1,pos/dur))*100+'%';
  }
  for(let m=PLOW;m<=PHIGH;m++){
    const want=(PS.playing&&cnt[m])?1:0;
    if(want!==PV.auOn[m]){PV.auOn[m]=want;PV.els[m].classList.toggle('au',!!want);}
  }
}

function openPiano(){

function trCurtains(W,H,pal){
  const n=Math.max(10,Math.round(W/46)),w=W/n,cols=[];

    for(const p of ps){
      const dx=p.x-cx,dy=p.y-cy,d=Math.hypot(dx,dy)||1;
      if(d<260){const f=(1-d/260)*.9*(1+st.en);p.vx+=dx/d*f*.06;p.vy+=dy/d*f*.06;}
      p.vx*=.992;p.vy*=.992;
      if(Math.abs(p.vx)+Math.abs(p.vy)<.25){p.vx+=rnd(-.02,.02);p.vy+=rnd(-.02,.02);}
      p.x+=p.vx*spd*p.z*2;p.y+=p.vy*spd*p.z*2;p.a+=p.va*spd;
      if(p.x<-40)p.x=W+40;if(p.x>W+40)p.x=-40;if(p.y<-40)p.y=H+40;if(p.y>H+40)p.y=-40;
      const X=p.x+(st.sx-.5)*-70*p.z,Y=p.y+(st.sy-.5)*-70*p.z,col=`hsla(${(hue+p.o+360)%360},85%,66%,${.16+.26*p.z})`;
      g.strokeStyle=col;g.fillStyle=col;g.beginPath();
      if(p.k===0)g.arc(X,Y,p.r,0,6.283);
      else if(p.k===1){g.arc(X,Y,p.r*.3,0,6.283);g.fill();continue;}
      else if(p.k===2){const l=p.r*1.4;g.moveTo(X-Math.cos(p.a)*l,Y-Math.sin(p.a)*l);g.lineTo(X+Math.cos(p.a)*l,Y+Math.sin(p.a)*l);}
      else{for(let i=0;i<3;i++){const a=p.a+i*2.094;g.lineTo(X+Math.cos(a)*p.r,Y+Math.sin(a)*p.r);}g.closePath();}
      g.stroke();
    }
    for(let i=pulses.length-1;i>=0;i--){
      const q=pulses[i];q.r+=7;q.a-=.018;
      if(q.a<=0){pulses.splice(i,1);continue;}
      g.strokeStyle=`hsla(${hue},90%,70%,${q.a})`;g.lineWidth=2.5;g.beginPath();g.arc(q.x,q.y,q.r,0,6.283);g.stroke();
    }
    g.strokeStyle=`hsla(${hue},90%,75%,.5)`;g.lineWidth=1.5;g.beginPath();g.arc(cx,cy,14+st.en*26,0,6.283);g.stroke();   // cursor ring
  }
  frame();
})();

$('sff').addEventListener('change',e=>{if(e.target.files[0])loadSF2File(e.target.files[0]);e.target.value='';});
$('dfl').addEventListener('click',useDefaultSF);
loadSF2Auto().then(()=>setStatus());
_menu();
addEventListener('pointerdown',()=>{if(!ctx){initAudio();}},{once:true});
</script>
