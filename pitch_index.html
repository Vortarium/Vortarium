function pvLoop(){
  if(!PV.on)return;
  const g=PV.g,H=BARH,W=PV.w,now=nowS(),acc=getComputedStyle(document.documentElement).getPropertyValue('--acc').trim()||'#bc4dff';
  g.clearRect(0,0,W,H);
  sgDraw(g,W,H);
  PV.bars=PV.bars.filter(b=>{
    const bottom=H-(b.t1?(now-b.t1)*BARSPEED:0),top=Math.min(H-(now-b.t0)*BARSPEED,bottom-4);
    if(bottom<0)return false;
    const [fx,fw,blk]=PV.cx[b.m],cx=fx*W,w=fw*W;
    g.globalAlpha=Math.max(.1,Math.min(1,bottom/H*1.4));
    g.fillStyle=blk?'#ff6bf1':acc;g.shadowColor=blk?'#ff6bf1':acc;g.shadowBlur=14;
    g.beginPath();if(g.roundRect)g.roundRect(cx-w/2,top,w,bottom-top,4);else g.rect(cx-w/2,top,w,bottom-top);g.fill();
    return true;
  });
  g.globalAlpha=1;g.shadowBlur=0;
  PV.raf=requestAnimationFrame(pvLoop);
}
const modKey=c=>c.startsWith('Shift')?'up':c.startsWith('Control')?'down':c==='KeyS'?'sus':null;
function pvKeyDown(e){
  if(!PV.on)return;
  const c=e.code,k=modKey(c);
  if(k){
    if(c==='KeyS'||e.ctrlKey)e.preventDefault();
    if(e.repeat||PV.mod[k])return;
    PV.mod[k]={t:performance.now(),was:PV[k]};   // tap = latch, hold = momentary
    PV[k]=!PV[k];if(k==='sus'&&!PV.sus)pvSusOff();
    pvUpdate();return;
  }
  if(c==='KeyA'){e.preventDefault();if(!e.repeat){PV.up=PV.down=false;pvUpdate();}return;}
  if(c in KEYMAP){e.preventDefault();if(!e.repeat)pvOn('k'+c,pvScaleNote(KEYMAP[c]));}
}
function pvKeyUp(e){
  if(!PV.on)return;
  const c=e.code,k=modKey(c);
  if(k){
    const m=PV.mod[k];delete PV.mod[k];
    if(m&&performance.now()-m.t>350){PV[k]=m.was;if(k==='sus'&&!PV.sus)pvSusOff();pvUpdate();}
    return;
  }
  if(c in KEYMAP)pvOff('k'+c);
}
addEventListener('keydown',pvKeyDown);
addEventListener('keyup',pvKeyUp);
// glissando: follow each pointer across keys, filling in any keys skipped between two events
addEventListener('pointermove',e=>{
  if(!PV.on)return;
  const id='p'+e.pointerId;if(!(id in PV.ptr))return;
  if(e.pointerType==='mouse'&&!(e.buttons&1)){delete PV.ptr[id];delete PV.lp[id];pvOff(id);return;}
  let lp=PV.lp[id]||[e.clientX,e.clientY],k=0;
  let pts=e.getCoalescedEvents?e.getCoalescedEvents():[];if(!pts.length)pts=[e];
  for(const q of pts){
    const dx=q.clientX-lp[0],dy=q.clientY-lp[1],st=Math.max(1,Math.ceil(Math.hypot(dx,dy)/Math.max(2,PV.w/104)));
    for(let s=1;s<=st;s++){
      const m=pvKeyAt(lp[0]+dx*s/st,lp[1]+dy*s/st);
      if(m===PV.ptr[id])continue;
      pvOff(id);PV.ptr[id]=m;
      if(m!=null){pvOn(id,m,Math.min(.08,k*.012));k++;}
    }
    lp=[q.clientX,q.clientY];
  }
  PV.lp[id]=lp;
});
['pointerup','pointercancel'].forEach(t=>addEventListener(t,e=>{if(PV.on){const id='p'+e.pointerId;delete PV.ptr[id];delete PV.lp[id];pvOff(id);}}));
addEventListener('blur',()=>{if(PV.on){PV.mod={};Object.keys(PV.held).forEach(pvOff);}});

/* ============ SCREEN TRANSITIONS ============ */
const TR={busy:false,last:-1};
const TR_PAL=[['#bc4dff','#ff6bf1','#5ad1ff','#4ade80'],['#ff5d5d','#ffe27a','#ff6bf1','#bc4dff'],['#5ad1ff','#4ade80','#ffe27a','#f4f4f5'],['#bc4dff','#5ad1ff','#f4f4f5','#ff5d5d']];
const clamp01=x=>x<0?0:x>1?1:x;
const eo=t=>1-Math.pow(1-t,3),ei=t=>t*t,eio=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const bounce=t=>{const n=7.5625,d=2.75;if(t<1/d)return n*t*t;if(t<2/d)return n*(t-=1.5/d)*t+.75;if(t<2.5/d)return n*(t-=2.25/d)*t+.9375;return n*(t-=2.625/d)*t+.984375;};
const pick=a=>a[Math.floor(Math.random()*a.length)];
// every effect is draw(g,p): p 0..0.5 covers the screen, p 0.5..1 uncovers it again

// colour bars drop from the top like curtains, then fall away off the bottom
function trCurtains(W,H,pal){
  const n=Math.max(10,Math.round(W/46)),w=W/n,cols=[];
  for(let i=0;i<n;i++)cols.push({d:Math.random()*.5,e:Math.random()*.5,c:pick(pal)});
  return (g,p)=>cols.forEach((c,i)=>{
    let y0=0,y1=H;
    if(p<.5)y1=H*eo(clamp01((p*2-c.d)/(1-c.d)));else y0=H*ei(clamp01(((p-.5)*2-c.e)/(1-c.e)));
    if(y1-y0<=0)return;
    g.fillStyle=c.c;g.fillRect(i*w-.5,y0,w+1,y1-y0);
    if(p<.5&&y1<H-1){g.beginPath();g.arc(i*w+w/2,y1,w/2+.5,0,Math.PI*2);g.fill();}
  });
}
// glossy balls rain down and bounce into a pile that fills the screen, then drop out the bottom
function trBalls(W,H,pal){
  const s=Math.max(60,Math.min(W,H)/6.5),nc=Math.ceil(W/s)+1,nr=Math.ceil(H/s)+1,R=s*.9,balls=[];
  for(let r=0;r<nr;r++)for(let c=0;c<nc;c++)balls.push({x:c*s+(Math.random()-.5)*s*.12,y:r*s+(Math.random()-.5)*s*.12,
    d:(1-r/nr)*.35+Math.random()*.15,e:(r/nr)*.3+Math.random()*.2,c:pick(pal)});
  return (g,p)=>balls.forEach(b=>{
    let y;
    if(p<.5){const q=clamp01((p*2-b.d)/(1-b.d));if(q<=0)return;y=-R+(b.y+R)*bounce(q);}
    else{const r=clamp01(((p-.5)*2-b.e)/(1-b.e));y=b.y+(H-b.y+2*R)*ei(r);if(y-R>H)return;}
    g.fillStyle=b.c;g.beginPath();g.arc(b.x,y,R,0,Math.PI*2);g.fill();
    g.fillStyle='rgba(255,255,255,.22)';g.beginPath();g.arc(b.x-R*.3,y-R*.3,R*.28,0,Math.PI*2);g.fill();
  });
}
// pixel blocks pop in as a diagonal wave with static, then pop out the opposite way
function trPixels(W,H,pal){
  const px=Math.max(28,Math.min(W,H)/15),nx=Math.ceil(W/px),ny=Math.ceil(H/px),flip=Math.random()<.5,cells=[];
  for(let y=0;y<ny;y++)for(let x=0;x<nx;x++){
    const dg=(x/nx+y/ny)/2;
    cells.push({x,y,o:.55*(flip?1-dg:dg)+.35*Math.random(),o2:.55*(flip?dg:1-dg)+.35*Math.random(),c:pick(pal)});
  }
  return (g,p)=>cells.forEach(c=>{
    const s=p<.5?clamp01((p*2-c.o)/.09):1-clamp01(((p-.5)*2-c.o2)/.09);
    if(s<=0)return;
    const sz=px*s;g.fillStyle=c.c;g.fillRect(c.x*px+(px-sz)/2,c.y*px+(px-sz)/2,sz+(s>=1?1:0),sz+(s>=1?1:0));
  });
}
// concentric colour ripples spread from a point, then a hole opens out of the middle
function trRings(W,H,pal){
  const cx=W*(.25+Math.random()*.5),cy=H*(.25+Math.random()*.5),R=Math.hypot(Math.max(cx,W-cx),Math.max(cy,H-cy))+4,K=3,cs=pal.slice(0,3);
  return (g,p)=>{
    for(let k=0;k<K;k++){
      let rin=0,rout=R;
      if(p<.5){const dl=k*.14;rout=R*eo(clamp01((p*2-dl)/(1-dl)));}
      else{const dl=(K-1-k)*.14;rin=R*ei(clamp01(((p-.5)*2-dl)/(1-dl)));}
      if(rout<=rin)continue;
      g.fillStyle=cs[k];g.beginPath();g.arc(cx,cy,rout,0,Math.PI*2);
      if(rin>0){g.moveTo(cx+rin,cy);g.arc(cx,cy,rin,0,Math.PI*2,true);}
      g.fill('evenodd');
    }
  };
}
// slanted bands slide in from alternating sides, then keep going out the far side
function trStripes(W,H,pal){
  const L=Math.hypot(W,H),n=9,bh=L/n,ang=(Math.random()<.5?-1:1)*.38,bands=[];
  for(let i=0;i<n;i++)bands.push({d:Math.random()*.4,e:Math.random()*.4,dir:i%2?1:-1,c:pal[i%pal.length]});
  return (g,p)=>{
    g.save();g.translate(W/2,H/2);g.rotate(ang);
    bands.forEach((b,i)=>{
      let off;
      if(p<.5)off=-b.dir*L*(1-eo(clamp01((p*2-b.d)/(1-b.d))));
      else off=b.dir*L*ei(clamp01(((p-.5)*2-b.e)/(1-b.e)));
      g.fillStyle=b.c;g.fillRect(-L/2+off,-L/2+i*bh-.5,L,bh+1);
    });
    g.restore();
  };
}
// layered colour waves rise over the screen, then drain upward and away
function trWave(W,H,pal){
  const K=3,cs=pal.slice(0,3),ph=Math.random()*6,amp=Math.max(30,H*.06),fr=2+Math.random()*2;
  const ed=(x,base,t)=>base+amp*Math.sin(x/W*fr*6.2832+ph+t*8);
  return (g,p)=>{
    for(let k=0;k<K;k++){
      g.fillStyle=cs[k];g.beginPath();
      if(p<.5){
        const dl=k*.12,base=(H+2*amp)*(1-eio(clamp01((p*2-dl)/(1-dl))))-amp;
        if(base>H+amp)continue;
        g.moveTo(0,H+10);for(let x=0;x<=W+8;x+=8)g.lineTo(x,ed(x,base,p));g.lineTo(W,H+10);
      }else{
        const dl=(K-1-k)*.12,base=(H+2*amp)*(1-eio(clamp01(((p-.5)*2-dl)/(1-dl))))-amp;
        if(base<-amp*2)continue;
        g.moveTo(0,-10);g.lineTo(W,-10);for(let x=W;x>=-8;x-=8)g.lineTo(x,ed(x,base,p));
      }
      g.closePath();g.fill();
    }
  };
}
// two doors close from the sides, then swing away up and down
function trDoors(W,H,pal){
  return (g,p)=>{
    let l=0,r=0,ly=0,ry=0;
    if(p<.5){const q=eo(p*2);l=W/2*q;r=W/2*q;}else{l=r=W/2;const q=ei((p-.5)*2);ly=-H*q;ry=H*q;}
    g.fillStyle=pal[0];g.fillRect(0,ly,l+1,H);g.fillStyle=pal[1];g.fillRect(W-r-1,ry,r+1,H);
  };
}
// diamonds swell outward from the middle, then shrink away from the middle
function trDiamonds(W,H,pal){
  const px=Math.max(48,Math.min(W,H)/8),nx=Math.ceil(W/px)+1,ny=Math.ceil(H/px)+1,cells=[];
  for(let y=0;y<ny;y++)for(let x=0;x<nx;x++){const dx=(x*px-W/2)/W,dy=(y*px-H/2)/H;cells.push({x:x*px,y:y*px,d:Math.min(1,Math.hypot(dx,dy)*1.4),c:pal[(x+y)%pal.length]});}
  return (g,p)=>cells.forEach(c=>{
    const s=p<.5?clamp01((p*2-c.d*.6)/.4):1-clamp01(((p-.5)*2-(1-c.d)*.6)/.4);
    if(s<=0)return;const d=px*1.05*s;
    g.fillStyle=c.c;g.beginPath();g.moveTo(c.x,c.y-d);g.lineTo(c.x+d,c.y);g.lineTo(c.x,c.y+d);g.lineTo(c.x-d,c.y);g.closePath();g.fill();
  });
}
// a checkerboard of tiles that spin in at random and spin out again
function trChecker(W,H,pal){
  const px=Math.max(44,Math.min(W,H)/10),nx=Math.ceil(W/px),ny=Math.ceil(H/px),cells=[];
  for(let y=0;y<ny;y++)for(let x=0;x<nx;x++)cells.push({x,y,o:Math.random()*.6,o2:Math.random()*.6,c:pal[(x+y)%2?0:1]});
  return (g,p)=>cells.forEach(c=>{
    const s=p<.5?clamp01((p*2-c.o)/.4):1-clamp01(((p-.5)*2-c.o2)/.4);
    if(s<=0)return;
    g.save();g.translate(c.x*px+px/2,c.y*px+px/2);g.rotate((1-s)*Math.PI);g.fillStyle=c.c;const z=px*s+(s>=1?1:0);g.fillRect(-z/2,-z/2,z,z);g.restore();
  });
}
// horizontal bars slide across from alternating sides and exit the far side
function trRows(W,H,pal){
  const n=9,bh=H/n,rows=[];
  for(let i=0;i<n;i++)rows.push({d:Math.random()*.4,e:Math.random()*.4,dir:i%2?1:-1,c:pal[i%pal.length]});
  return (g,p)=>rows.forEach((b,i)=>{
    let off;
    if(p<.5)off=-b.dir*W*(1-eo(clamp01((p*2-b.d)/(1-b.d))));else off=b.dir*W*ei(clamp01(((p-.5)*2-b.e)/(1-b.e)));
    g.fillStyle=b.c;g.fillRect(off,i*bh-.5,W,bh+1);
  });
}
// pie wedges sweep around a point like a clock, then sweep away
function trClock(W,H,pal){
  const cx=W/2,cy=H/2,R=Math.hypot(W,H)/2+4,n=8,sp=Math.PI*2/n,ws=[];
  for(let i=0;i<n;i++)ws.push({d:i*.05,e:i*.05,c:pal[i%pal.length]});
  return (g,p)=>ws.forEach((w,i)=>{
    const a0=-Math.PI/2+i*sp;let from=a0,to=a0;
    if(p<.5)to=a0+sp*eo(clamp01((p*2-w.d)/(1-w.d)));else{to=a0+sp;from=a0+sp*ei(clamp01(((p-.5)*2-w.e)/(1-w.e)));}
    if(to-from<=0)return;
    g.fillStyle=w.c;g.beginPath();g.moveTo(cx,cy);g.arc(cx,cy,R,from-.004,to+.004);g.closePath();g.fill();
  });
}
function annulus(g,W,H,cx,cy,rin,rout){g.beginPath();g.rect(0,0,W,H);if(rout>0){g.moveTo(cx+rout,cy);g.arc(cx,cy,rout,0,Math.PI*2,true);}g.fill('evenodd');}
// a round hole closes down to a point, then opens again
function trIris(W,H,pal){
  const R=Math.hypot(W,H)/2+4,cx=W/2,cy=H/2;
  return (g,p)=>{const r=p<.5?R*(1-eo(p*2)):R*eo((p-.5)*2),b=Math.min(90,r);
    g.fillStyle=pal[1];annulus(g,W,H,cx,cy,0,r+b);g.fillStyle=pal[0];annulus(g,W,H,cx,cy,0,r);};
}
// a zigzag-edged wall sweeps across, then leaves the same way
function trZig(W,H,pal){
  const n=12,bh=H/n,tooth=Math.max(30,W/16);
  const poly=(g,xf,right)=>{g.beginPath();if(!right){g.moveTo(0,0);for(let i=0;i<=n;i++)g.lineTo(xf-(i%2?tooth:0),i*bh);g.lineTo(0,H);}else{g.moveTo(W,0);for(let i=0;i<=n;i++)g.lineTo(xf+(i%2?tooth:0),i*bh);g.lineTo(W,H);}g.closePath();g.fill();};
  return (g,p)=>{
    if(p<.5){const x=-tooth+(W+tooth*2)*eo(p*2);g.fillStyle=pal[1];poly(g,x-45,false);g.fillStyle=pal[0];poly(g,x,false);}
    else{const x=-tooth+(W+tooth*2)*ei((p-.5)*2);g.fillStyle=pal[1];poly(g,x+45,true);g.fillStyle=pal[0];poly(g,x,true);}
  };
}
// dots swirl outward along a spiral, then vanish along it
function trSpiral(W,H,pal){
  const px=Math.max(46,Math.min(W,H)/9),nx=Math.ceil(W/px)+1,ny=Math.ceil(H/px)+1,cells=[];
  for(let y=0;y<ny;y++)for(let x=0;x<nx;x++){const dx=x*px-W/2,dy=y*px-H/2;cells.push({x:x*px,y:y*px,k:Math.hypot(dx,dy)+(Math.atan2(dy,dx)+Math.PI)/6.2832*px*3});}
  const mx=Math.max(...cells.map(c=>c.k));cells.forEach((c,i)=>{c.d=c.k/mx;c.c=pal[i%pal.length];});
  return (g,p)=>cells.forEach(c=>{
    const s=p<.5?clamp01((p*2-c.d*.6)/.4):1-clamp01(((p-.5)*2-c.d*.6)/.4);
    if(s<=0)return;g.fillStyle=c.c;g.beginPath();g.arc(c.x,c.y,px*.78*s,0,6.2832);g.fill();
  });
}
// nested rectangles grow from the middle, then shrink back into it
function trNest(W,H,pal){
  const K=6;
  return (g,p)=>{for(let k=0;k<K;k++){
    let q;if(p<.5){const dl=k*.09;q=eo(clamp01((p*2-dl)/(1-dl)));}else{const dl=(K-1-k)*.09;q=1-ei(clamp01(((p-.5)*2-dl)/(1-dl)));}
    if(q<=0)continue;g.fillStyle=pal[k%pal.length];g.fillRect(W/2-W*q/2-.5,H/2-H*q/2-.5,W*q+1,H*q+1);}};
}
// vertical slats flip open in a wave from left to right
function trSlats(W,H,pal){
  const n=16,w=W/n;
  return (g,p)=>{for(let i=0;i<n;i++){const d=i/n*.5;
    const s=p<.5?clamp01((p*2-d)/.5):1-clamp01(((p-.5)*2-d)/.5);if(s<=0)continue;
    g.fillStyle=pal[i%pal.length];const z=w*s+(s>=1?1:0);g.fillRect(i*w+(w-z)/2,0,z,H);}};
}
// soft bubbles bloom everywhere and then pop
function trBubbles(W,H,pal){
  const px=Math.max(W,H)/7,nx=Math.ceil(W/px)+1,ny=Math.ceil(H/px)+1,bs=[];
  for(let y=0;y<ny;y++)for(let x=0;x<nx;x++)bs.push({x:x*px+(Math.random()-.5)*px*.5,y:y*px+(Math.random()-.5)*px*.5,d:Math.random()*.5,e:Math.random()*.5,c:pick(pal)});
  return (g,p)=>bs.forEach(b=>{
    const s=p<.5?eo(clamp01((p*2-b.d)/(1-b.d))):1-ei(clamp01(((p-.5)*2-b.e)/(1-b.e)));if(s<=0)return;
    g.fillStyle=b.c;g.globalAlpha=.95;g.beginPath();g.arc(b.x,b.y,px*1.4*s,0,6.2832);g.fill();g.globalAlpha=1;
  });
}
// a field of triangles pops in and out
function trTris(W,H,pal){
  const px=Math.max(50,Math.min(W,H)/9),nx=Math.ceil(W/px),ny=Math.ceil(H/px),ts=[];
  for(let y=0;y<ny;y++)for(let x=0;x<nx;x++){const X=x*px,Y=y*px;
    ts.push({pts:[[X,Y],[X+px,Y],[X,Y+px]],o:Math.random()*.55,o2:Math.random()*.55,c:pick(pal)});
    ts.push({pts:[[X+px,Y+px],[X+px,Y],[X,Y+px]],o:Math.random()*.55,o2:Math.random()*.55,c:pick(pal)});}
  return (g,p)=>ts.forEach(t=>{
    const s=p<.5?clamp01((p*2-t.o)/.4):1-clamp01(((p-.5)*2-t.o2)/.4);if(s<=0)return;
    const cx=(t.pts[0][0]+t.pts[1][0]+t.pts[2][0])/3,cy=(t.pts[0][1]+t.pts[1][1]+t.pts[2][1])/3,k=s*1.04;
    g.fillStyle=t.c;g.beginPath();t.pts.forEach(([x,y],i)=>{const X=cx+(x-cx)*k,Y=cy+(y-cy)*k;i?g.lineTo(X,Y):g.moveTo(X,Y);});g.closePath();g.fill();
  });
}
// a slanted beam of light wipes the screen, then wipes it clean
function trBeam(W,H,pal){
  const L=Math.hypot(W,H),ang=(Math.random()<.5?-1:1)*.5;
  return (g,p)=>{g.save();g.translate(W/2,H/2);g.rotate(ang);
    if(p<.5){const e=-L/2+L*eo(p*2);g.fillStyle=pal[0];g.fillRect(-L/2,-L/2,e+L/2,L);g.fillStyle=pal[1];g.fillRect(e-55,-L/2,55,L);}
    else{const e=-L/2+L*ei((p-.5)*2);g.fillStyle=pal[0];g.fillRect(e,-L/2,L/2-e,L);g.fillStyle=pal[1];g.fillRect(e,-L/2,55,L);}
    g.restore();};
}
// rays burst out from the centre like a sunburst, then retract outward
function trBurst(W,H,pal){
  const n=28,sp=Math.PI*2/n,R=Math.hypot(W,H)/2+4,cx=W/2,cy=H/2,rs=[];
  for(let i=0;i<n;i++)rs.push({d:Math.random()*.4,e:Math.random()*.4,c:pal[i%pal.length]});
  return (g,p)=>rs.forEach((r,i)=>{
    let rin=0,rout=R;
    if(p<.5)rout=R*eo(clamp01((p*2-r.d)/(1-r.d)));else rin=R*ei(clamp01(((p-.5)*2-r.e)/(1-r.e)));
    if(rout<=rin)return;const a0=i*sp-.003,a1=(i+1)*sp+.003;
    g.fillStyle=r.c;g.beginPath();g.arc(cx,cy,rout,a0,a1);g.arc(cx,cy,rin,a1,a0,true);g.closePath();g.fill();
  });
}
// plus signs swell until they fuse into a wall, then thin away
function trCross(W,H,pal){
  const px=Math.max(50,Math.min(W,H)/9),nx=Math.ceil(W/px),ny=Math.ceil(H/px),cs=[];
  for(let y=0;y<ny;y++)for(let x=0;x<nx;x++)cs.push({x:x*px,y:y*px,d:(x/nx+y/ny)/2*.45+Math.random()*.15,c:pal[(x+y)%pal.length]});
  return (g,p)=>cs.forEach(c=>{
    const s=p<.5?clamp01((p*2-c.d)/.4):1-clamp01(((p-.5)*2-(.6-c.d))/.4);if(s<=0)return;
    const t=px*s+(s>=1?1:0);g.fillStyle=c.c;g.fillRect(c.x,c.y+(px-t)/2,px+(s>=1?1:0),t);g.fillRect(c.x+(px-t)/2,c.y,t,px+(s>=1?1:0));
  });
}
const TR_FX=[trCurtains,trBalls,trPixels,trRings,trStripes,trWave,trDoors,trDiamonds,trChecker,trRows,trClock,trIris,trZig,trSpiral,trNest,trSlats,trBubbles,trTris,trBeam,trBurst,trCross];
function trRun(swap){
  if(TR.busy)return;TR.busy=true;
  let cv=document.getElementById('trc');
  if(!cv){cv=document.createElement('canvas');cv.id='trc';cv.style.cssText='position:fixed;inset:0;width:100%;height:100%;z-index:9999;pointer-events:none;display:none';document.body.appendChild(cv);}
  const dpr=Math.min(2,window.devicePixelRatio||1),W=innerWidth,H=innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.display='block';cv.style.pointerEvents='auto';
  const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);
  let k;do{k=Math.floor(Math.random()*TR_FX.length);}while(k===TR.last);TR.last=k;
  const pal=pick(TR_PAL).slice().sort(()=>Math.random()-.5),draw=TR_FX[k](W,H,pal);
  const DUR=matchMedia('(prefers-reduced-motion: reduce)').matches?1:1150,t0=performance.now();let swapped=false;
  const step=now=>{
    const p=Math.min(1,(now-t0)/DUR);
    g.clearRect(0,0,W,H);
    if(p>=.5&&!swapped){swapped=true;try{swap();}catch(e){console.error(e);}}
    draw(g,p);
    if(p<1)requestAnimationFrame(step);
    else{cv.style.display='none';cv.style.pointerEvents='none';TR.busy=false;}
  };
  requestAnimationFrame(step);
}
// switching games, opening the piano, or going home now plays a transition
function withTr(fn,snd){return function(...a){if(TR.busy)return;try{cancelSeq();}catch(e){}if(snd)try{snd();}catch(e){}trRun(()=>fn.apply(null,a));};}
// opening a game: fast major-chord arpeggio. Going back: a high note, then a low one.
function sfxIn(){initAudio();pianoReady().then(()=>{const r=ri(55,64);[0,4,7,12,16].forEach((n,i)=>setTimeout(()=>playPiano(r+n,.45,.7),i*55));});}
function sfxBack(){initAudio();pianoReady().then(()=>{const sc=[0,2,4,5,7,9,11],r=ri(0,11);for(let i=0;i<15;i++){const k=14-i,n=60+r%6+12*Math.floor(k/7)+sc[k%7];setTimeout(()=>playPiano(n,.35,.55+.02*(14-i)),i*38);}});}
const _menu=menu;
menu=withTr(menu,sfxBack);startGame=withTr(startGame,sfxIn);openPiano=withTr(openPiano,sfxIn);


/* ============ MOVING BACKGROUND (reacts to the cursor) ============ */
(function(){
  const c=document.createElement('canvas');c.id='bg';
  c.style.cssText='position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none';
  document.body.prepend(c);
  const g=c.getContext('2d'),calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W=0,H=0;
  const fit=()=>{const d=Math.min(1.5,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0);};
  fit();addEventListener('resize',fit);
  const st={mx:.5,my:.5,sx:.5,sy:.5,en:0,t:0,lx:0,ly:0,clr:false},ps=[],pulses=[];
  for(let i=0;i<64;i++)ps.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,vx:rnd(-.35,.35),vy:rnd(-.35,.35),r:rnd(7,30),k:i%4,a:Math.random()*6.28,va:rnd(-.012,.012),o:rnd(-55,55),z:rnd(.3,1)});
  addEventListener('pointermove',e=>{
    st.en=Math.min(1.6,st.en+Math.hypot(e.clientX-st.lx,e.clientY-st.ly)/90);
    st.lx=e.clientX;st.ly=e.clientY;st.mx=e.clientX/innerWidth;st.my=e.clientY/innerHeight;
  });
  addEventListener('pointerdown',e=>pulses.push({x:e.clientX,y:e.clientY,r:6,a:.7}));
  function frame(){
    requestAnimationFrame(frame);
    if(document.hidden)return;
    const app=document.getElementById('app');
    if(app&&app.classList.contains('wide')){if(!st.clr){g.clearRect(0,0,W,H);st.clr=true;}return;}   // keep the piano page fast
    st.clr=false;
    st.sx+=(st.mx-st.sx)*.06;st.sy+=(st.my-st.sy)*.06;st.en*=.95;st.t+=.016;
    const hue=(250+st.sx*140+Math.sin(st.t*.4)*18)%360;        // left = violet/blue, right = warm
    const spd=(calm?.25:1)*(.35+(1-st.sy)*1.1+st.en*1.6);     // higher up = faster, wiggling the mouse = faster
    const cx=st.sx*W,cy=st.sy*H;
    g.clearRect(0,0,W,H);
    const gl=g.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*.45);
    gl.addColorStop(0,`hsla(${hue},90%,55%,.16)`);gl.addColorStop(1,`hsla(${hue},90%,55%,0)`);
    g.fillStyle=gl;g.fillRect(0,0,W,H);
    g.lineWidth=1.6;
    for(const p of ps){
      const dx=p.x-cx,dy=p.y-cy,d=Math.hypot(dx,dy)||1;
      if(d<260){const f=(1-d/260)*.9*(1+st.en);p.vx+=dx/d*f*.06;p.vy+=dy/d*f*.06;}
      p.vx*=.992;p.vy*=.992;
      if(Math.abs(p.vx)+Math.abs(p.vy)<.25){p.vx+=rnd(-.02,.02);p.vy+=rnd(-.02,.02);}
      p.x+=p.vx*spd*p.z*2;p.y+=p.vy*spd*p.z*2;p.a+=p.va*spd;
      if(p.x<-40)p.x=W+40;if(p.x>W+40)p.x=-40;if(p.y<-40)p.y=H+40;if(p.y>H+40)p.y=-40;
      const X=p.x+(st.sx-.5)*-70*p.z,Y=p.y+(st.sy-.5)*-70*p.z,col=`hsla(${(hue+p.o+360)%360},85%,66%,${.16+.26*p.z})`;
      g.strokeStyle=col;g.fillStyle=col;g.beginPath();
      if(p.k===0)g.arc(X,Y,p.r,0,6.283);
      else if(p.k===1){g.arc(X,Y,p.r*.3,0,6.283);g.fill();continue;}
      else if(p.k===2){const l=p.r*1.4;g.moveTo(X-Math.cos(p.a)*l,Y-Math.sin(p.a)*l);g.lineTo(X+Math.cos(p.a)*l,Y+Math.sin(p.a)*l);}
      else{for(let i=0;i<3;i++){const a=p.a+i*2.094;g.lineTo(X+Math.cos(a)*p.r,Y+Math.sin(a)*p.r);}g.closePath();}
      g.stroke();
    }
    for(let i=pulses.length-1;i>=0;i--){
      const q=pulses[i];q.r+=7;q.a-=.018;
      if(q.a<=0){pulses.splice(i,1);continue;}
      g.strokeStyle=`hsla(${hue},90%,70%,${q.a})`;g.lineWidth=2.5;g.beginPath();g.arc(q.x,q.y,q.r,0,6.283);g.stroke();
    }
    g.strokeStyle=`hsla(${hue},90%,75%,.5)`;g.lineWidth=1.5;g.beginPath();g.arc(cx,cy,14+st.en*26,0,6.283);g.stroke();   // cursor ring
  }
  frame();
})();
