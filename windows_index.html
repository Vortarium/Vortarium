<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Windows 12</title>
  <link rel="stylesheet" href="windows_style.css" />
</head>
<body>

  <!-- Lock Screen -->
  <div id="lockscreen">
    <div class="lock-bg" id="lock-bg"></div>
    <div class="lock-content">
      <div class="lock-time" id="lockTime"></div>
      <div class="lock-date" id="lockDate"></div>
      <div class="lock-hint">Click or press any key to unlock</div>
    </div>
  </div>

  <!-- Desktop -->
  <div id="desktop">
    <div id="wallpaper"></div>

    <!-- Desktop Icons — dynamic, managed by DesktopManager -->
    <div id="desktop-icons"></div>

    <!-- Windows Container -->
    <div id="windows-container"></div>

    <!-- Context Menu (dynamic, built by contextmenu.js) -->
    <div id="context-menu" class="hidden"></div>

    <!-- Notification Panel -->
    <div id="notification-panel" class="hidden">
      <div class="notif-header">
        <span>Notifications</span>
        <button id="clear-notifs">Clear all</button>
      </div>
      <div id="notif-list"></div>
      <div class="quick-settings">
        <div class="qs-title">Quick Settings</div>
        <div class="qs-grid">
          <div class="qs-btn active" id="qs-wifi" title="Wi-Fi">📶</div>
          <div class="qs-btn active" id="qs-bt" title="Bluetooth">🔵</div>
          <div class="qs-btn" id="qs-airplane" title="Airplane Mode">✈️</div>
          <div class="qs-btn active" id="qs-dark" title="Dark Mode">🌙</div>
          <div class="qs-btn" id="qs-dnd" title="Do Not Disturb">🔕</div>
          <div class="qs-btn" id="qs-snap" title="Snap Layouts">⊞</div>
        </div>
        <div class="qs-sliders">
          <div class="qs-slider-row"><span>🔆</span><input type="range" id="brightness-slider" min="20" max="100" value="100" /></div>
          <div class="qs-slider-row"><span>🔊</span><input type="range" id="volume-slider" min="0" max="100" value="75" /></div>
        </div>
      </div>
    </div>

    <!-- Start Menu -->
    <div id="start-menu" class="hidden">
      <div class="start-search">
        <input type="text" id="start-search-input" placeholder="Search apps, files, settings..." />
      </div>
      <div class="start-recommended">
        <div class="start-section-title">Recent Apps</div>
        <div class="start-rec-list" id="rec-list"></div>
      </div>
      <div class="start-footer">
        <div class="start-user">
          <div class="user-avatar">👤</div>
          <span id="username-display">User</span>
        </div>
        <div class="start-power-btns">
          <button class="power-btn" id="btn-sleep" title="Sleep">💤</button>
          <button class="power-btn" id="btn-restart" title="Restart">🔄</button>
          <button class="power-btn" id="btn-shutdown" title="Shut Down">⏻</button>
          <button class="power-btn" id="btn-hardreset" title="Hard Reset (Wipes all data)" style="color:#f44747;">⚠️</button>
        </div>
      </div>
    </div>

    <!-- Taskbar -->
    <div id="taskbar">
      <div class="taskbar-left">
        <button id="start-btn" title="Start">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <rect x="0" y="0" width="8" height="8" rx="1" fill="white"/>
            <rect x="10" y="0" width="8" height="8" rx="1" fill="white"/>
            <rect x="0" y="10" width="8" height="8" rx="1" fill="white"/>
            <rect x="10" y="10" width="8" height="8" rx="1" fill="white"/>
          </svg>
        </button>
        <button class="taskbar-btn" id="search-btn" title="Search">🔍</button>
        <button class="taskbar-btn" id="widgets-btn" title="Widgets">⊞</button>
        <div id="tb-fps-wrap" title="Frames per second">
          <span id="tb-fps">60 FPS</span>
        </div>
      </div>
      <div class="taskbar-center" id="taskbar-apps"></div>
      <div class="taskbar-right">
        <div class="tray-icons">
          <span class="tray-icon" title="Network">📶</span>
          <span class="tray-icon" title="Sound">🔊</span>
          <span class="tray-icon" title="Battery">🔋</span>
        </div>
        <div class="taskbar-clock" id="taskbar-clock">
          <div id="tb-time"></div>
          <div id="tb-date"></div>
        </div>
        <button class="taskbar-btn" id="notif-btn" title="Notifications">🔔</button>
        <div id="show-desktop-btn" title="Show Desktop"></div>
      </div>
    </div>
  </div>

  <!-- Power overlay -->
  <div id="power-overlay" class="hidden">
    <div class="power-message" id="power-message"></div>
  </div>

  <!-- ===== ALL SCRIPTS INLINE / FLAT ===== -->
  <script src="windows_os.js"></script>
  <script src="windows_filesystem.js"></script>
  <script src="windows_windowmanager.js"></script>
  <script src="windows_taskbar.js"></script>
  <script src="windows_notifications.js"></script>
  <script src="windows_lockscreen.js"></script>
  <script src="windows_contextmenu.js"></script>
  <script src="windows_startmenu.js"></script>
  <script src="windows_widgets.js"></script>
  <script src="windows_weather.js"></script>
  <!-- AppLauncher must exist before app files register -->
  <script>
    const AppLauncher = {
      apps: {},
      register(id, app) { this.apps[id] = app; },
      launch(id, opts) {
        if (!this.apps[id]) {
          if (typeof Notifications !== 'undefined') Notifications.send('System', 'App not found: ' + id, '❌');
          return;
        }
        this.apps[id].launch(opts || {});
      }
    };
  </script>
  <script src="windows_app_fileexplorer.js"></script>
  <script src="windows_app_terminal.js"></script>
  <script src="windows_app_settings.js"></script>
  <script src="windows_app_notepad.js"></script>
  <script src="windows_app_browser.js"></script>
  <script src="windows_app_calculator.js"></script>
  <script src="windows_app_taskmanager.js"></script>
  <script src="windows_app_paint.js"></script>
  <script src="windows_app_calendar.js"></script>
  <script src="windows_app_music.js"></script>
  <script src="windows_app_photos.js"></script>
  <script src="windows_app_store.js"></script>
  <script src="windows_app_spotify.js"></script>
  <script src="windows_app_vscode.js"></script>
  <script src="windows_app_geodash.js"></script>
  <script src="windows_app_games.js"></script>
  <script src="windows_app_myphotos.js"></script>
  <script src="windows_app_viruslab.js"></script>
  <script src="windows_app_discord.js"></script>
  <script src="windows_app_zoom.js"></script>
  <script src="windows_app_photoshop.js"></script>
  <script src="windows_app_clipchamp.js"></script>
  <script src="windows_app_notion.js"></script>
  <script src="windows_app_office.js"></script>
  <script src="windows_app_youtube.js"></script>
  <script src="windows_app_tiktok.js"></script>
  <script src="windows_app_weatherapp.js"></script>
  <script src="windows_app_word.js"></script>
  <script src="windows_app_excel.js"></script>
  <script src="windows_app_powerpoint.js"></script>
  <script src="windows_app_mail.js"></script>
  <script src="windows_app_flstudio.js"></script>
  <script src="windows_main.js"></script>
</body>
</html>
