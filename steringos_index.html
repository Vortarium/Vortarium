            function initCalculator(calcWindow) {
    const display = calcWindow.querySelector('#calc-display');
    const buttons = calcWindow.querySelectorAll('.calc-btn');
    const clearBtn = calcWindow.querySelector('#calc-clear');
    const equalsBtn = calcWindow.querySelector('#calc-equals');
    
    let currentInput = '0';
    let previousInput = '';
    let operation = null;
    let resetInput = false;
    
    // Update calculator display
    function updateDisplay() {
        display.textContent = currentInput;
    }
    
    // Handle number input
    function inputNumber(number) {
        if (currentInput === '0' || resetInput) {
            currentInput = number;
            resetInput = false;
        } else {
            currentInput += number;
        }
        updateDisplay();
    }
    
    // Handle decimal point
    function inputDecimal() {
        if (resetInput) {
            currentInput = '0.';
            resetInput = false;
            updateDisplay();
            return;
        }
        
        if (!currentInput.includes('.')) {
            currentInput += '.';
            updateDisplay();
        }
    }
    
    // Handle operator selection
    function handleOperator(op) {
        if (operation !== null) calculate();
        previousInput = currentInput;
        operation = op;
        resetInput = true;
    }
    
    // Perform calculation
    function calculate() {
        let result;
        const prev = parseFloat(previousInput);
        const current = parseFloat(currentInput);
        
        if (isNaN(prev) || isNaN(current)) return;
        
        switch (operation) {
            case '+':
                result = prev + current;
                break;
            case '-':
                result = prev - current;
                break;
            case '*':
                result = prev * current;
                break;
            case '/':
                result = prev / current;
                break;
            default:
                return;
        }
        
        currentInput = result.toString();
        operation = null;
        resetInput = true;
        updateDisplay();
    }
    
    // Clear calculator
    function clearAll() {
        currentInput = '0';
        previousInput = '';
        operation = null;
        updateDisplay();
    }
    
    // Button click handlers
    buttons.forEach(button => {
        if (button.id !== 'calc-clear' && button.id !== 'calc-equals') {
            button.addEventListener('click', () => {
                playClickSound();
                const value = button.dataset.value;
                
                if (value === '.') {
                    inputDecimal();
                } else if (button.classList.contains('operator')) {
                    handleOperator(value);
                } else {
                    inputNumber(value);
                }
            });
        }
    });
    
    // Equals button
    equalsBtn.addEventListener('click', () => {
        playClickSound();
        calculate();
    });
    
    // Clear button
    clearBtn.addEventListener('click', () => {
        playClickSound();
        clearAll();
    });
    
    // Keyboard support
    calcWindow.addEventListener('keydown', (e) => {
        if (/[0-9]/.test(e.key)) {
            inputNumber(e.key);
        } else if (e.key === '.') {
            inputDecimal();
        } else if (e.key === '+' || e.key === '-' || e.key === '*' || e.key === '/') {
            handleOperator(e.key);
        } else if (e.key === 'Enter' || e.key === '=') {
            calculate();
        } else if (e.key === 'Escape') {
            clearAll();
        } else if (e.key === 'Backspace') {
            currentInput = currentInput.slice(0, -1) || '0';
            updateDisplay();
        }
    });
    
    // Focus the window for keyboard input
    calcWindow.querySelector('.window-content').tabIndex = 0;
}

function initClock(clockWindow) {
    // Elements
    const digitalClock = clockWindow.querySelector('#digital-clock');
    const currentMonthEl = clockWindow.querySelector('#current-month');
    const calendarDaysEl = clockWindow.querySelector('.calendar-days');
    const prevMonthBtn = clockWindow.querySelector('#prev-month');
    const nextMonthBtn = clockWindow.querySelector('#next-month');
    const stopwatchBtn = clockWindow.querySelector('#stopwatch-btn');
    const timerBtn = clockWindow.querySelector('#timer-btn');
    const clockView = clockWindow.querySelector('#clock-view');
    const stopwatchView = clockWindow.querySelector('#stopwatch-view');
    const timerView = clockWindow.querySelector('#timer-view');
    const stopwatchDisplay = stopwatchView.querySelector('.time-display');
    const startStopwatchBtn = clockWindow.querySelector('#start-stopwatch');
    const resetStopwatchBtn = clockWindow.querySelector('#reset-stopwatch');
    const backFromStopwatchBtn = clockWindow.querySelector('#back-from-stopwatch');
    const timerInput = clockWindow.querySelector('#timer-input');
    const timerDisplay = clockWindow.querySelector('#timer-display');
    const startTimerBtn = clockWindow.querySelector('#start-timer');
    const resetTimerBtn = clockWindow.querySelector('#reset-timer');
    const backFromTimerBtn = clockWindow.querySelector('#back-from-timer');

    // Clock variables
    let currentDate = new Date();
    let stopwatchInterval;
    let stopwatchStartTime;
    let stopwatchElapsed = 0;
    let stopwatchRunning = false;
    let timerInterval;
    let timerEndTime;
    let timerRunning = false;
    let alarmAudio;

    // Initialize audio for timer alarm
    function initAudio() {
        alarmAudio = new Audio();
        alarmAudio.src = 'data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU...'; // Base64 encoded beep sound
    }

    // Update digital clock
    function updateDigitalClock() {
        const now = new Date();
        let hours = now.getHours();
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12;
        hours = hours ? hours : 12;
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        const milliseconds = String(now.getMilliseconds()).padStart(3, '0');
        digitalClock.textContent = `${hours}:${minutes}:${seconds}.${milliseconds} ${ampm}`;
    }

    // Update calendar
    function updateCalendar() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        
        currentMonthEl.textContent = `${new Intl.DateTimeFormat('en-US', { month: 'long' }).format(currentDate)} ${year}`;
        
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const daysInPrevMonth = new Date(year, month, 0).getDate();
        
        let daysHtml = '';
        
        // Previous month days
        for (let i = firstDay; i > 0; i--) {
            daysHtml += `<div class="calendar-day other-month">${daysInPrevMonth - i + 1}</div>`;
        }
        
        // Current month days
        const today = new Date();
        for (let i = 1; i <= daysInMonth; i++) {
            const isToday = today.getDate() === i && today.getMonth() === month && today.getFullYear() === year;
            daysHtml += `<div class="calendar-day ${isToday ? 'today' : ''}">${i}</div>`;
        }
        
        // Next month days
        const totalCells = Math.ceil((firstDay + daysInMonth) / 7) * 7;
        for (let i = 1; i <= totalCells - (firstDay + daysInMonth); i++) {
            daysHtml += `<div class="calendar-day other-month">${i}</div>`;
        }
        
        calendarDaysEl.innerHTML = daysHtml;
    }

    // Stopwatch functions
    function updateStopwatch() {
        const elapsed = stopwatchElapsed + (stopwatchRunning ? Date.now() - stopwatchStartTime : 0);
        const hours = Math.floor(elapsed / 3600000);
        const minutes = Math.floor((elapsed % 3600000) / 60000);
        const seconds = Math.floor((elapsed % 60000) / 1000);
        const milliseconds = elapsed % 1000;
        
        stopwatchDisplay.textContent = 
            `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}.${String(milliseconds).padStart(3, '0')}`;
    }

    function startStopwatch() {
        if (!stopwatchRunning) {
            stopwatchStartTime = Date.now();
            stopwatchInterval = setInterval(updateStopwatch, 10);
            stopwatchRunning = true;
            startStopwatchBtn.textContent = 'Stop';
        } else {
            clearInterval(stopwatchInterval);
            stopwatchElapsed += Date.now() - stopwatchStartTime;
            stopwatchRunning = false;
            startStopwatchBtn.textContent = 'Start';
        }
    }

    function resetStopwatch() {
        clearInterval(stopwatchInterval);
        stopwatchElapsed = 0;
        stopwatchRunning = false;
        startStopwatchBtn.textContent = 'Start';
        updateStopwatch();
    }

    // Timer functions
    function updateTimer() {
        const remaining = timerEndTime - Date.now();
        
        if (remaining <= 0) {
            clearInterval(timerInterval);
            timerRunning = false;
            startTimerBtn.textContent = 'Start';
            playAlarm();
            return;
        }
        
        const hours = Math.floor(remaining / 3600000);
        const minutes = Math.floor((remaining % 3600000) / 60000);
        const seconds = Math.floor((remaining % 60000) / 1000);
        
        timerDisplay.textContent = 
            `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    function startTimer() {
        if (!timerRunning) {
            const timeParts = timerInput.value.split(':');
            const hours = parseInt(timeParts[0]) || 0;
            const minutes = parseInt(timeParts[1]) || 0;
            const seconds = parseInt(timeParts[2]) || 0;
            
            const totalMs = (hours * 3600 + minutes * 60 + seconds) * 1000;
            
            if (totalMs <= 0) return;
            
            timerEndTime = Date.now() + totalMs;
            timerInterval = setInterval(updateTimer, 100);
            timerRunning = true;
            startTimerBtn.textContent = 'Stop';
        } else {
            clearInterval(timerInterval);
            timerRunning = false;
            startTimerBtn.textContent = 'Start';
        }
    }

    function resetTimer() {
        clearInterval(timerInterval);
        timerRunning = false;
        startTimerBtn.textContent = 'Start';
        timerDisplay.textContent = timerInput.value;
    }

    function playAlarm() {
        let playCount = 0;
        const alarmInterval = setInterval(() => {
            if (playCount >= 5) {
                clearInterval(alarmInterval);
                setTimeout(() => {
                    if (!timerRunning) {
                        playAlarm(); // Repeat if timer still not stopped
                    }
                }, 3000);
                return;
            }
            alarmAudio.play();
            playCount++;
        }, 1000);
    }

    // Event listeners
    prevMonthBtn.addEventListener('click', () => {
        currentDate.setMonth(currentDate.getMonth() - 1);
        updateCalendar();
    });

    nextMonthBtn.addEventListener('click', () => {
        currentDate.setMonth(currentDate.getMonth() + 1);
        updateCalendar();
    });

    stopwatchBtn.addEventListener('click', () => {
        clockView.style.display = 'none';
        stopwatchView.style.display = 'block';
    });

    timerBtn.addEventListener('click', () => {
        clockView.style.display = 'none';
        timerView.style.display = 'block';
    });

    backFromStopwatchBtn.addEventListener('click', () => {
        stopwatchView.style.display = 'none';
        clockView.style.display = 'block';
    });

    backFromTimerBtn.addEventListener('click', () => {
        timerView.style.display = 'none';
        clockView.style.display = 'block';
    });

    startStopwatchBtn.addEventListener('click', startStopwatch);
    resetStopwatchBtn.addEventListener('click', resetStopwatch);
    startTimerBtn.addEventListener('click', startTimer);
    resetTimerBtn.addEventListener('click', resetTimer);

    // Initialize
    initAudio();
    setInterval(updateDigitalClock, 1);
    updateCalendar();
    updateStopwatch();
    timerDisplay.textContent = timerInput.value;
}
        
        // Window management
        function setupAppControls(appName) {
            const icon = document.getElementById(`${appName}-icon`);
            icon.addEventListener('click', () => {
                playClickSound();
                createWindow(appName);
            });
        }
        
        function createWindow(appName) {
            const template = appTemplates[appName];
            const clone = template.content.cloneNode(true);
            const windowElement = clone.querySelector('.window');
            
            // Set window position
            windowCounters[appName]++;
            const offset = windowCounters[appName] * 20;
            windowElement.style.left = `${100 + offset}px`;
            windowElement.style.top = `${100 + offset}px`;
            
            // Set window title
            if (appName === 'notepad') {
                windowElement.querySelector('.window-title').textContent = `Notepad - ${currentNoteName}`;
            }
            
            // Add to desktop
            document.getElementById('desktop').appendChild(windowElement);
            windowElement.style.display = 'flex';
            
            // Initialize app-specific functionality
            switch (appName) {
                case 'music':
                    initMusicKeys(windowElement);
                    break;
                case 'search':
                    initSearch(windowElement);
                    break;
                case 'notepad':
                    setupNotepadSave(windowElement);
                    windowElement.querySelector('.notepad-content').value = savedNotes[currentNoteName] || '';
                    break;
                case 'book':
                    initBookNook(windowElement);
                    break;
                case 'games':
                    initGameStore(windowElement);
                    break;
                case 'calculator':
                    initCalculator(windowElement);
                    break;
                case 'clock':
                    initClock(windowElement);
                    break;
                case 'paint':
                    initPaint(windowElement);
            }
            
        
    

            
            // Make draggable
            const header = windowElement.querySelector('.window-header');
            makeDraggable(windowElement, header);
            
            // Window controls
            const minimize = windowElement.querySelector('.minimize');
            const maximize = windowElement.querySelector('.maximize');
            const close = windowElement.querySelector('.close');
            
            minimize.addEventListener('click', () => {
                playClickSound();
                windowElement.style.display = 'none';
            });
            
            maximize.addEventListener('click', () => {
                playClickSound();
                if (windowElement.style.width === '100%') {
                    windowElement.style.width = '';
                    windowElement.style.height = '';
                    windowElement.style.left = `${100 + windowCounters[appName] * 20}px`;
                    windowElement.style.top = `${100 + windowCounters[appName] * 20}px`;
                } else {
                    windowElement.style.width = '100%';
                    windowElement.style.height = 'calc(100% - 40px)';
                    windowElement.style.left = '0';
                    windowElement.style.top = '0';
                }
            });
            
            close.addEventListener('click', (e) => {
                playClickSound();
                e.stopPropagation();
                windowElement.remove();
            });
            
            // Bring to front on click
            windowElement.addEventListener('mousedown', () => {
                bringToFront(windowElement);
            });
            
            logAction(`Opened ${appName} app`);
            return windowElement;
        }
        
        function bringToFront(element) {
            const windows = document.querySelectorAll('.window');
            let highestZ = 0;
            
            windows.forEach(window => {
                const z = parseInt(window.style.zIndex) || 0;
                if (z > highestZ) highestZ = z;
            });
            
            element.style.zIndex = highestZ + 1;
        }
        
        function makeDraggable(element, handle) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            
            handle.onmousedown = dragMouseDown;
            
            function dragMouseDown(e) {
                e = e || window.event;
                e.preventDefault();
                // Get the mouse cursor position at startup
                pos3 = e.clientX;
                pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                // Call a function whenever the cursor moves
                document.onmousemove = elementDrag;
                bringToFront(element);
            }
            
            function elementDrag(e) {
                e = e || window.event;
                e.preventDefault();
                // Calculate the new cursor position
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;
                // Set the element's new position
                element.style.top = (element.offsetTop - pos2) + "px";
                element.style.left = (element.offsetLeft - pos1) + "px";
            }
            
            function closeDragElement() {
                // Stop moving when mouse button is released
                document.onmouseup = null;
                document.onmousemove = null;
            }
        }
        
        // File history logging
        function logAction(action) {
            const now = new Date();
            const timestamp = `[${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}]`;
            const logEntry = document.createElement('div');
            logEntry.className = 'history-item';
            logEntry.textContent = `${timestamp} ${action}`;
            
            const filesContent = document.querySelector('.file-history');
            if (filesContent) {
                filesContent.insertBefore(logEntry, filesContent.firstChild);
                
                // Keep only the last 100 entries
                if (filesContent.children.length > 100) {
                    filesContent.removeChild(filesContent.lastChild);
                }
            }
        }
