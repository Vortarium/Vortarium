<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SterlingOS</title>
    <style>
        /* Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        
        body {
            background-color: #000;
            color: #0f0;
            font-family: 'Source Code Pro', monospace;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            cursor: none;
        }
        
        /* Cursor Styles */
        .cursor {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #0f0;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
        }
        
        .cursor.click {
            transform: translate(-50%, -50%) scale(0.8);
        }
        
        /* Login Screen */
        #login-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #000;
            z-index: 100;
        }
        
        #logo {
            width: 100px;
            height: 100px;
            border: 3px solid #0f0;
            border-radius: 50%;
            margin-bottom: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
        }
        
        #sterling-name {
            margin-top: 1rem;
            font-size: 1.5rem;
        }
        
        #password-box {
            border: 2px solid #0f0;
            background-color: #000;
            color: #0f0;
            padding: 0.5rem 1rem;
            font-size: 1.2rem;
            font-family: 'Source Code Pro', monospace;
            outline: none;
            width: 300px;
            text-align: center;
            margin-top: 1rem;
        }
        
        #login-message {
            margin-top: 1rem;
            height: 20px;
        }
        
        /* Desktop */
        #desktop {
            display: none;
            width: 100%;
            height: 100%;
            position: relative;

            background-size: 400px;
            background-repeat: repeat;
        }
        
        /* Wallpaper Change Context Menu */
        #wallpaper-context {
            position: absolute;
            display: none;
            background-color: #000;
            border: 1px solid #0f0;
            padding: 5px;
            z-index: 100;
        }
        
        #wallpaper-context-item {
            padding: 5px 10px;
            cursor: none;
        }
        
        #wallpaper-context-item:hover {
            background-color: #0f0;
            color: #000;
        }
        
        /* Taskbar */
        #taskbar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40px;
            background-color: #000;
            border-top: 2px solid #0f0;
            display: flex;
            align-items: center;
            padding: 0 10px;
            z-index: 10;
        }
        
        .app-icon {
            width: 30px;
            height: 30px;
            margin-right: 15px;
            border: 1px solid #0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: none;
        }
        
        .app-icon:hover {
            background-color: #0f0;
            color: #000;
        }
        
        #system-info {
            margin-left: auto;
            display: flex;
            align-items: center;
        }
        
        #fps-indicator {
            display: flex;
            margin-right: 20px;
        }
        
        .fps-bar {
            width: 5px;
            height: 10px;
            margin-right: 2px;
            border: 1px solid #0f0;
        }
        
        .fps-bar.filled {
            background-color: #0f0;
        }
        
        #battery-indicator {
            margin-right: 30px;
            display: flex;
            align-items: center;
        }
        
        #battery-icon {
    position: relative;
    width: 20px;
    height: 10px;
    border: 1px solid #0f0;
    margin-right: 5px;
}

#battery-level {
    width: 0%;
    height: 100%;
    background-color: #0f0;
    transition: width 10s ease;
}

#battery-charging {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 12px;
    line-height: 1;
    display: none;
    color: #000;
    z-index: 2;
}

#battery-icon.charging #battery-charging {
    display: block;
}

#battery-icon.charging #battery-level {
    background-color: #0f0;
}

#battery-icon.charging.low-battery #battery-level {
    background-color: #f00;
}

#battery-icon.charging #battery-charging {
    color: #000;
}

#battery-icon:not(.charging) #battery-charging {
    color: #0f0;
}
        
        .low-battery {
            animation: glow 1s infinite alternate;
        }
        
        @keyframes glow {
            from {
                box-shadow: 0 0 2px #0f0;
            }
            to {
                box-shadow: 0 0 5px #0f0;
            }
        }
        
        #clock {
            text-align: right;
            margin-right: 20px;
        }
        
        /* Window Styles */
        .window {
            position: absolute;
            border: 2px solid #0f0;
            background-color: #000;
            min-width: 300px;
            min-height: 200px;
            display: none;
            flex-direction: column;
            z-index: 5;
        }
        
        .window-header {
            padding: 5px;
            background-color: #000;
            border-bottom: 1px solid #0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .window-title {
            font-weight: bold;
        }
        
        .window-controls {
            display: flex;
        }
        
        .window-control {
            width: 16px;
            height: 16px;
            margin-left: 5px;
            border: 1px solid #0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            cursor: none;
        }
        
        .window-control:hover {
            background-color: #0f0;
            color: #000;
        }
        
        .window-content {
            flex-grow: 1;
            padding: 10px;
            overflow: auto;
        }
        
        /* Notepad App */
        #notepad-content {
            width: 100%;
            height: calc(100% - 30px);
            background-color: #000;
            color: #0f0;
            border: none;
            resize: none;
            font-family: 'Source Code Pro', monospace;
            outline: none;
            padding: 5px;
        }
        
        .notepad-toolbar {
            display: flex;
            margin-bottom: 5px;
        }
        
        .notepad-button {
            border: 1px solid #0f0;
            padding: 2px 5px;
            margin-right: 5px;
            cursor: none;
            position: relative;
        }
        
        .notepad-button:hover {
            background-color: #0f0;
            color: #000;
        }
        
        .notepad-button:hover::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background-color: #000;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 2px 5px;
            font-size: 12px;
            white-space: nowrap;
            z-index: 100;
        }
        
        /* Search App */
        #search-box {
            width: 100%;
            padding: 5px;
            background-color: #000;
            color: #0f0;
            border: 1px solid #0f0;
            margin-bottom: 10px;
        }
        
        #search-results {
            border: 1px solid #0f0;
            height: calc(100% - 30px);
            padding: 5px;
            overflow-y: auto;
        }
        
        .search-result {
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 1px dotted #0f0;
            cursor: none;
        }
        
        .search-result:hover {
            color: #000;
            background-color: #0f0;
        }

.browser-toolbar {
    background-color: #000;
    border-bottom: 1px solid #0f0;
    padding: 5px;
}

.browser-tabs {
    display: flex;
    margin-bottom: 5px;
}

    padding: 5px 15px;
    border: 1px solid #0f0;

}

}

.browser-tab-add {

}

.browser-url-bar {

}

.search-box {

.go-button {
    background-color: #000;

}

.game-store-embed {
    height: 100%;

}
        
        /* Music App */
        #music-keys {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: calc(100% - 60px);
        }
        
        .music-keys {
            display: flex;
            align-items: flex-end;
            height: 120px;
            padding-left: 20px;
            white-space: nowrap;
            overflow-x: auto;
        }
        
        .music-key:hover {
            background-color: #0f0;
        }
        
        .music-controls {
            display: flex;
            margin-bottom: 10px;
        }
        
        #key-signature {
            border: 1px solid #0f0;
            background-color: #000;
            color: #0f0;
            padding: 2px;
            width: 50px;
            margin-left: 10px;
        }
        
        /* Files App */
        #file-history {
            height: 100%;
            overflow-y: auto;
            border: 1px solid #0f0;
            padding: 5px;
        }
        
        .history-item {
            margin-bottom: 5px;
            padding-bottom: 5px;
            border-bottom: 1px dotted #0f0;
        }
        
        /* Book Nook App */
        #book-content {
            height: calc(100% - 30px);
            overflow-y: auto;
            padding: 10px;
            border: 1px solid #0f0;
        }
        
        .book-page {
            margin-bottom: 20px;
        }
        
        .book-title {
            font-size: 1.2rem;
            margin-bottom: 10px;
            text-decoration: underline;
        }
        
        .book-chapter {
            font-weight: bold;
            margin: 10px 0;
        }
        
        .book-navigation {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }
        
        .book-nav-button {
            border: 1px solid #0f0;
            padding: 2px 10px;
            cursor: none;
        }
        
        .book-nav-button:hover {
            background-color: #0f0;
            color: #000;
        }
        
        /* Save Dialog */
        #save-dialog, #open-dialog {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #000;
            border: 2px solid #0f0;
            padding: 20px;
            z-index: 100;
            display: none;
        }
        
        #save-filename, #open-filename {
            border: 1px solid #0f0;
            background-color: #000;
            color: #0f0;
            padding: 5px;
            width: 200px;
            margin: 10px 0;
        }
        
        .save-buttons, .open-buttons {
            display: flex;
            justify-content: flex-end;
        }
        
        .save-button, .open-button {
            border: 1px solid #0f0;
            padding: 2px 10px;
            margin-left: 10px;
            cursor: none;
        }
        
        .save-button:hover, .open-button:hover {
            background-color: #0f0;
            color: #000;
        }
        
        /* Error Window */
        .error-window {
            position: absolute;
            border: 2px solid #f00;
            background-color: #000;
            width: 200px;
            height: 100px;
            display: flex;
            flex-direction: column;
            z-index: 999;
        }
        
        .error-header {
            padding: 5px;
            background-color: #300;
            border-bottom: 1px solid #f00;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .error-content {
            flex-grow: 1;
            padding: 10px;
            color: #f00;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        
        /* Boot Sequence */
        #boot-sequence {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #0f0;
            font-family: 'Source Code Pro', monospace;
            overflow: hidden;
            z-index: 1000;
            display: none;
        }
        
        .boot-line {
            margin: 5px;
            white-space: nowrap;
        }
        
        /* Game Store App */
        .game-button {
            width: 100%;
            padding: 15px;
            margin-bottom: 10px;
            border: 2px solid #0f0;
            background-color: #000;
            color: #0f0;
            text-align: center;
            cursor: none;
            position: relative;
        }
        
        .game-button:hover {
            background-color: #0f0;
            color: #000;
        }
        
        .game-button::before {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            margin-right: 10px;
            vertical-align: middle;
        }
        
        .snake-icon::before {
            background-color: #0f0;
        }
        
        .pong-icon::before {
            background-color: #0f0;
            border-radius: 50%;
        }
        
        .tetris-icon::before {
            background-color: #0f0;
            width: 10px;
            height: 20px;
        }
        
        .pacman-icon::before {
            width: 0;
            height: 0;
            border: 10px solid #0f0;
            border-radius: 50%;
            border-right-color: transparent;
        }
        
        /* Game Canvas */
        .game-canvas {
            width: 100%;
            height: calc(100% - 40px);
            border: 1px solid #0f0;
            background-color: #000;
        }
        
        .back-button {
            position: absolute;
            bottom: 10px;
            right: 10px;
            border: 1px solid #0f0;
            padding: 2px 10px;
            cursor: none;
        }
        
        .back-button:hover {
            background-color: #0f0;
            color: #000;
        }
        
        /* Snake Game */
        .snake-segment {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: #0f0;
        }
        
        .snake-food {
            position: absolute;
            width: 16px;
            height: 16px;
            border: 2px solid #0f0;
            border-radius: 50%;
        }
        
        /* Pong Game */
        .pong-paddle {
            position: absolute;
            width: 10px;
            height: 60px;
            background-color: #0f0;
        }
        
        .pong-ball {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #0f0;
            border-radius: 50%;
        }
        
        /* Tetris Game */
        .tetris-block {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: #0f0;
            border: 1px solid #000;
        }
        
        /* Pacman Game */
        .pacman {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: #0f0;
            border-radius: 50%;
        }
        
        .pacman::before {
            content: '';
            position: absolute;
            width: 0;
            height: 0;
            border: 10px solid transparent;
            border-right: 10px solid #000;
            top: 0;
            left: 0;
        }
        
        .ghost {
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 10px 10px 0 0;
        }
        
        .ghost::before {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 20px;
            height: 5px;
            background-color: inherit;
        }
        
        .ghost::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 20px;
            height: 5px;
            background-color: inherit;
            clip-path: polygon(0 0, 5px 100%, 10px 0, 15px 100%, 20px 0);
        }
        
        .pellet {
            position: absolute;
            width: 4px;
            height: 4px;
            background-color: #0f0;
            border-radius: 50%;
        }
        
        .power-pellet {
            position: absolute;
            width: 8px;
            height: 8px;
            background-color: #0f0;
            border-radius: 50%;
            animation: pulse 1s infinite;
        }
        
        /* Block Breaker specific styles */
#blockbreaker-canvas {
    background-color: #000;
    border: 1px solid #0f0;
    display: block;
    margin: 0 auto;
    cursor: none;
}

/* Game over text styling */
#blockbreaker-canvas.game-over {
    position: relative;
}

#blockbreaker-canvas.game-over::after {
    content: 'GAME OVER';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #0f0;
    font-family: 'Source Code Pro', monospace;
    font-size: 30px;
    text-align: center;
}

#blockbreaker-canvas.game-over::before {
    content: 'Final Score: 000';
    position: absolute;
    top: calc(50% + 40px);
    left: 50%;
    transform: translate(-50%, -50%);
    color: #0f0;
    font-family: 'Source Code Pro', monospace;
    font-size: 20px;
    text-align: center;
}

    </div>
    
    <!-- Open Dialog -->
    <div id="open-dialog">
        <div>Open File:</div>
        <input type="text" id="open-filename">
        <div class="open-buttons">
            <div class="open-button" id="open-cancel">Cancel</div>

        </div>

    <script>
        // Custom cursor movement
        document.addEventListener('mousemove', (e) => {
            const cursor = document.getElementById('custom-cursor');
            cursor.style.left = `${e.clientX}px`;
            cursor.style.top = `${e.clientY}px`;
        });
        
        // Click sound and effect
        function playClickSound() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.type = 'square';
            oscillator.frequency.value = 800;
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.1);
            oscillator.stop(audioCtx.currentTime + 0.1);
            
            // Click effect
            const cursor = document.getElementById('custom-cursor');
            cursor.classList.add('click');
            setTimeout(() => {
                cursor.classList.remove('click');
            }, 100);
        }
        
        // Add click sound to all clickable elements
        document.addEventListener('DOMContentLoaded', () => {
            const clickableElements = document.querySelectorAll('button, [onclick], .app-icon, .window-control, .notepad-button, .search-result, .book-nav-button, .save-button, .open-button, .game-button, .back-button');
            clickableElements.forEach(element => {
                element.addEventListener('click', playClickSound);
            });
        });
        
        // Password system
        const passwordBox = document.getElementById('password-box');
        const loginScreen = document.getElementById('login-screen');
        const loginMessage = document.getElementById('login-message');
        const desktop = document.getElementById('desktop');
        const bootSequence = document.getElementById('boot-sequence');
        let userPassword = '';
        let savedNotes = {};
        let currentNoteName = 'Untitled';
        let corruptedMode = false;
        let virusActive = false;
        
        passwordBox.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                playClickSound();
                if (passwordBox.value.toLowerCase() === 'sterling' && userPassword !== 'sterling') {
                    // Special sterling password effect
                    loginMessage.textContent = 'Initializing...';
                    passwordBox.disabled = true;
                    
                    // Freeze for a second
                    setTimeout(() => {
                        // Flicker effect
                        let flickerCount = 0;
                        const flickerInterval = setInterval(() => {
                            document.body.style.backgroundColor = flickerCount % 2 === 0 ? '#0f0' : '#000';
                            flickerCount++;
                            if (flickerCount > 10) {
                                clearInterval(flickerInterval);
                                document.body.style.backgroundColor = '#000';
                                showBootSequence();
                            }
                        }, 100);
                    }, 1000);
                } else if (userPassword === '') {
                    // First time setting password
                    userPassword = passwordBox.value;
                    loginScreen.style.display = 'none';
                    desktop.style.display = 'block';
                    updateClock();
                    setInterval(updateClock, 1000);
                    startFPSCounter();
                    updateBattery();
                    setInterval(updateBattery, 60000); // Update battery every minute
                    logAction(`System booted. Password set: ${'*'.repeat(userPassword.length)}`);
                } else {
                    // Subsequent logins
                    if (passwordBox.value === userPassword) {
                        loginMessage.textContent = '';
                        loginScreen.style.display = 'none';
                        desktop.style.display = 'block';
                        logAction('User logged in');
                    } else {
                        loginMessage.textContent = 'Access denied';
                        setTimeout(() => {
                            loginMessage.textContent = '';
                            passwordBox.value = '';
                        }, 1000);
                    }
                }
            }
        });
        
        // Battery indicator
        function updateBattery() {
            // Simulate battery level (in a real app you'd use the Battery API)
            let batteryLevel = Math.random() * 100;
            if (navigator.getBattery) {
                navigator.getBattery().then(battery => {
                    batteryLevel = battery.level * 100;
                    updateBatteryUI(batteryLevel);
                });
            } else {
                updateBatteryUI(batteryLevel);
            }
        }
        
        function updateBatteryUI(level, charging) {
    const batteryIcon = document.getElementById('battery-icon');
    const batteryLevel = document.getElementById('battery-level');
    const batteryPercent = document.getElementById('battery-percent');
    const batteryCharging = document.getElementById('battery-charging');
    
    batteryLevel.style.width = `${level}%`;
    batteryPercent.textContent = `${Math.round(level)}%`;
    
    // Toggle charging class and icon
    if (charging) {
        batteryIcon.classList.add('charging');
    } else {
        batteryIcon.classList.remove('charging');
    }
    
    // Handle low battery state
    if (level < 20) {
        batteryIcon.classList.add('low-battery');
        batteryLevel.style.backgroundColor = '#f00';
        if (charging) {
            batteryCharging.style.color = '#f00';
        }
    } else {
        batteryIcon.classList.remove('low-battery');
        batteryLevel.style.backgroundColor = '#0f0';
        if (charging) {
            batteryCharging.style.color = '#000';
        }
    }
}

function updateBattery() {
    if (navigator.getBattery) {
        navigator.getBattery().then(battery => {
            updateBatteryUI(battery.level * 100, battery.charging);
            
            // Add event listeners for battery changes
            battery.addEventListener('chargingchange', () => {
                updateBatteryUI(battery.level * 100, battery.charging);
            });
            
            battery.addEventListener('levelchange', () => {
                updateBatteryUI(battery.level * 100, battery.charging);
            });
        });
    } else {
        // Fallback for browsers without Battery API
        const isCharging = Math.random() > 0.5; // Simulate random charging state
        const level = Math.random() * 100; // Random battery level
        updateBatteryUI(level, isCharging);
    }
}
        
        // Wallpaper change functionality
        const wallpaperContext = document.getElementById('wallpaper-context');
        
        document.addEventListener('contextmenu', (e) => {
            if (desktop.style.display === 'block') {
                e.preventDefault();
                wallpaperContext.style.display = 'block';
                wallpaperContext.style.left = `${e.clientX}px`;
                wallpaperContext.style.top = `${e.clientY}px`;
                playClickSound();
            }
        });
        
        document.addEventListener('click', () => {
            wallpaperContext.style.display = 'none';
        });

            changeWallpaper();
            wallpaperContext.style.display = 'none';
        });

                if (now >= lastTime + 1000) {
                    const fps = Math.round((frameCount * 1000) / (now - lastTime));
                    updateFPSIndicator(fps);

        // Initialize music keys
        function initMusicKeys(musicWindow) {
            const musicKeys = musicWindow.querySelector('.music-keys');
            const keySignature = musicWindow.querySelector('.key-signature');
            const notes = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
            
            function createKeys() {
                musicKeys.innerHTML = '';
                const baseNote = keySignature.value;
                const baseIndex = notes.indexOf(baseNote);
                
                // Create 2 octaves of keys in a straight line
                for (let i = 0; i < 24; i++) {
                    const noteIndex = (baseIndex + i) % notes.length;
                    const octave = Math.floor((baseIndex + i) / notes.length) + 4;
                    const note = notes[noteIndex].replace('#', '♯');
                    const isSharp = notes[noteIndex].includes('#');
                    
                    const key = document.createElement('div');
                    key.className = 'music-key';
                    key.textContent = note + octave;
                    key.style.width = `${isSharp ? 15 : 25}px`;
                    key.style.height = `${isSharp ? 60 : 100}px`;
                    key.style.backgroundColor = isSharp ? '#000' : '#000';
                    key.style.borderColor = isSharp ? '#0f0' : '#0f0';
                    key.style.marginLeft = isSharp ? '-8px' : '0';
                    key.style.zIndex = isSharp ? '2' : '1';
                    key.style.position = 'relative';
                    key.style.display = 'inline-block';
                    
                    // Calculate correct frequency for each note
                    const frequency = 440 * Math.pow(2, (i - 9) / 12);
                    
                    key.addEventListener('mousedown', () => {
                        playNote(frequency);
                        key.style.backgroundColor = '#0f0';
                    });
                    
                    key.addEventListener('mouseup', () => {
                        key.style.backgroundColor = isSharp ? '#000' : '#000';
                    });
                    
                    key.addEventListener('mouseleave', () => {
                        key.style.backgroundColor = isSharp ? '#000' : '#000';
                    });
                    
                    musicKeys.appendChild(key);
                }
            }
            
            keySignature.addEventListener('change', createKeys);
            createKeys();
        }

        function playNote(frequency) {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.type = 'sine';
            oscillator.frequency.value = frequency;
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.5);
            oscillator.stop(audioCtx.currentTime + 0.5);
        }

        // Game implementations
        function initSnakeGame(snakeWindow) {
    const canvas = snakeWindow.querySelector('#snake-canvas');
    const ctx = canvas.getContext('2d');
    
    // Set canvas size
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight - 40;
    
    const gridSize = 6;
    const tileCount = {
        x: Math.floor(canvas.width / gridSize),
        y: Math.floor(canvas.height / gridSize)
    };
    
    // Start with 3-segment snake
    let snake = [
        {x: Math.floor(tileCount.x/2), y: Math.floor(tileCount.y/2)},
        {x: Math.floor(tileCount.x/2), y: Math.floor(tileCount.y/2) + 0.05},
        {x: Math.floor(tileCount.x/2), y: Math.floor(tileCount.y/2) + 0.10}
    ];
    
    let velocity = {x: 0, y: -1};
    let food = {
        x: Math.floor(Math.random() * tileCount.x),
        y: Math.floor(Math.random() * tileCount.y)
    };
    let score = 0;
    let gameSpeed = 100; // More reasonable speed
    let gameLoop;
    
    // DRAW FUNCTIONS
    function drawSnake() {
        ctx.fillStyle = '#0f0';
        snake.forEach(segment => {
            ctx.fillRect(
                Math.floor(segment.x * gridSize), 
                Math.floor(segment.y * gridSize), 
                gridSize, 
                gridSize
            );
        });
    }
    
    function drawFood() {
        ctx.strokeStyle = '#0f0';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(
            food.x * gridSize + gridSize/2,
            food.y * gridSize + gridSize/2,
            gridSize/2 - 1,
            0,
            Math.PI * 2
        );
        ctx.stroke();
    }
    
    function drawScore() {
        ctx.fillStyle = '#0f0';
        ctx.font = '20px Source Code Pro';
        ctx.fillText(`Score: ${score}`, 10, 25);
    }
    
    // GAME LOGIC
    function update() {
        // Move snake
        const head = {x: snake[0].x + velocity.x, y: snake[0].y + velocity.y};
        snake.unshift(head);
        
        // Check food collision (distance-based)
        const headCenterX = head.x * gridSize + gridSize/2;
        const headCenterY = head.y * gridSize + gridSize/2;
        const foodCenterX = food.x * gridSize + gridSize/2;
        const foodCenterY = food.y * gridSize + gridSize/2;
        
        const distance = Math.sqrt(
            Math.pow(headCenterX - foodCenterX, 2) + 
            Math.pow(headCenterY - foodCenterY, 2)
        );
        
        if (distance < gridSize) { // If head touches food
            score++;
            // Create new food
            food = {
                x: Math.floor(Math.random() * tileCount.x),
                y: Math.floor(Math.random() * tileCount.y)
            };
            // Don't remove tail - snake grows
        } else {
            snake.pop(); // Remove tail if no food eaten
        }
        
        // Wall collision
        if (head.x < 0 || head.y < 0 || 
            head.x >= tileCount.x || head.y >= tileCount.y) {
            gameOver();
        }
    }
    
    function gameOver() {
        clearInterval(gameLoop);
        ctx.fillStyle = '#0f0';
        ctx.font = '30px Source Code Pro';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2);
        ctx.font = '20px Source Code Pro';
        ctx.fillText(`Final Score: ${score}`, canvas.width/2, canvas.height/2 + 30);
        ctx.textAlign = 'left';
    }
    
    function game() {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        update();
        drawSnake();
        drawFood(); // THIS WAS MISSING BEFORE
        drawScore();
    }
    
    // CONTROLS
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowUp' && velocity.y !== 1) {
            velocity = {x: 0, y: -1};
        } else if (e.key === 'ArrowDown' && velocity.y !== -1) {
            velocity = {x: 0, y: 1};
        } else if (e.key === 'ArrowLeft' && velocity.x !== 1) {
            velocity = {x: -1, y: 0};
        } else if (e.key === 'ArrowRight' && velocity.x !== -1) {
            velocity = {x: 1, y: 0};
        }
    });
    
    gameLoop = setInterval(game, gameSpeed);
    
    snakeWindow.querySelector('.back-button').addEventListener('click', () => {
        playClickSound();
        clearInterval(gameLoop);
        snakeWindow.remove();
        createWindow('games');
    });
    function createWindow(appName) {
    }
}
        
        function initPongGame(pongWindow) {
            const canvas = pongWindow.querySelector('#pong-canvas');
            const ctx = canvas.getContext('2d');
            
            // Set canvas size
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight - 40;
            
            // Game variables
            const paddleWidth = 10;
            const paddleHeight = 50;
            const ballSize = 8;
            
            let playerPaddle = {
                x: 10,
                y: canvas.height / 2 - paddleHeight / 2,
                speed: 6
            };
            
            let aiPaddle = {
                x: canvas.width - 20,
                y: canvas.height / 2 - paddleHeight / 2,
                speed: 1.5
            };
            
            let ball = {
                x: canvas.width / 2,
                y: canvas.height / 2,
                speedX: 3,
                speedY: 3,
                size: ballSize
            };
            
            let playerScore = 0;
            let aiScore = 0;
            let gameLoop;
            
            // Draw functions
            function drawPaddles() {
                ctx.fillStyle = '#0f0';
                ctx.fillRect(
                    playerPaddle.x, 
                    playerPaddle.y, 
                    paddleWidth, 
                    paddleHeight
                );
                
                ctx.fillRect(
                    aiPaddle.x, 
                    aiPaddle.y, 
                    paddleWidth, 
                    paddleHeight
                );
            }
            
            function drawBall() {
                ctx.fillStyle = '#0f0';
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.size, 0, Math.PI * 2);
                ctx.fill();
            }
            
            function drawScores() {
                ctx.fillStyle = '#0f0';
                ctx.font = '30px Source Code Pro';
                ctx.fillText(playerScore, canvas.width / 4, 40);
                ctx.fillText(aiScore, (canvas.width / 4) * 3, 40);
            }
            
            function drawCenterLine() {
                ctx.strokeStyle = '#0f0';
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.moveTo(canvas.width / 2, 0);
                ctx.lineTo(canvas.width / 2, canvas.height);
                ctx.stroke();
                ctx.setLineDash([]);
            }
            
            // Game logic
            function update() {
                // Move ball
                ball.x += ball.speedX;
                ball.y += ball.speedY;
                
                // AI paddle movement
                if (aiPaddle.y + paddleHeight / 2 < ball.y) {
                    aiPaddle.y += aiPaddle.speed;
                } else if (aiPaddle.y + paddleHeight / 2 > ball.y) {
                    aiPaddle.y -= aiPaddle.speed;
                }
                
                // Ball collision with top and bottom
                if (ball.y - ball.size < 0 || ball.y + ball.size > canvas.height) {
                    ball.speedY = -ball.speedY;
                }
                
                // Ball collision with paddles
                if (
                    ball.x - ball.size < playerPaddle.x + paddleWidth &&
                    ball.x + ball.size > playerPaddle.x &&
                    ball.y > playerPaddle.y &&
                    ball.y < playerPaddle.y + paddleHeight
                ) {
                    // Calculate angle based on where ball hits paddle
                    const hitPosition = (ball.y - (playerPaddle.y + paddleHeight / 2)) / (paddleHeight / 2);
                    ball.speedX = Math.abs(ball.speedX);
                    ball.speedY = hitPosition * 5;
                }
                
                if (
                    ball.x + ball.size > aiPaddle.x &&
                    ball.x - ball.size < aiPaddle.x + paddleWidth &&
                    ball.y > aiPaddle.y &&
                    ball.y < aiPaddle.y + paddleHeight
                ) {
                    const hitPosition = (ball.y - (aiPaddle.y + paddleHeight / 2)) / (paddleHeight / 2);
                    ball.speedX = -Math.abs(ball.speedX);
                    ball.speedY = hitPosition * 5;
                }
                
                // Scoring
                if (ball.x < 0) {
                    aiScore++;
                    resetBall();
                } else if (ball.x > canvas.width) {
                    playerScore++;
                    resetBall();
                }
            }
            
            function resetBall() {
                ball.x = canvas.width / 2;
                ball.y = canvas.height / 2;
                ball.speedX = -ball.speedX;
                ball.speedY = Math.random() * 6 - 3;
            }
            
            function game() {
                // Clear canvas
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                update();
                drawPaddles();
                drawBall();
                drawScores();
                drawCenterLine();
            }
            
            // Controls
            const keys = {};
            document.addEventListener('keydown', (e) => {
                keys[e.key] = true;

                if (frightenedMode) {
                    // Eat ghost
                    ghost.x = 13 + Math.floor(Math.random() * 2);
                    ghost.y = 11 + Math.floor(Math.random() * 4);
                    score += 200;
                } else {
                    // Lose life
                    lives--;
                    
                    if (lives <= 0) {
                        gameOver = true;
                    } else {
                        // Reset positions
                        pacman.x = 14;
                        pacman.y = 23;
                        pacman.direction = {x: 0, y: 0};
                        pacman.nextDirection = {x: 0, y: 0};
                    }
                }
            }
        });
    }

    function activateFrightenedMode() {
        frightenedMode = true;
        frightenedTimer = 10 * 60; // 10 seconds at 60fps
        
        // Reverse ghost directions
        ghosts.forEach(ghost => {
            ghost.direction.x *= -1;
            ghost.direction.y *= -1;
        });
    }

    function game() {
        if (!gameOver) {
            update();
            
            drawMaze();
            drawPellets();
            drawPacman();
            drawGhosts();
            drawScore();
            
            gameLoop = requestAnimationFrame(game);
        } else {
            ctx.fillStyle = '#0f0';
            ctx.font = '30px Source Code Pro';
            ctx.textAlign = 'center';
            ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2);
            ctx.font = '20px Source Code Pro';
            ctx.fillText(`Final Score: ${score}`, canvas.width/2, canvas.height/2 + 30);
            ctx.textAlign = 'left';
        }
    }

    // Controls
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowUp') {
            pacman.nextDirection = {x: 0, y: -1};
        } else if (e.key === 'ArrowDown') {
            pacman.nextDirection = {x: 0, y: 1};
        } else if (e.key === 'ArrowLeft') {
            pacman.nextDirection = {x: -1, y: 0};
        } else if (e.key === 'ArrowRight') {
            pacman.nextDirection = {x: 1, y: 0};
        }
    });

    // Initialize game
    initPellets();
    game();

    // Back button
    pacmanWindow.querySelector('.back-button').addEventListener('click', () => {
        cancelAnimationFrame(gameLoop);
        pacmanWindow.remove();
        createWindow('games');
    });
}
function initBlockBreakerGame(blockbreakerWindow) {
    const canvas = blockbreakerWindow.querySelector('#blockbreaker-canvas');
    const ctx = canvas.getContext('2d');
    
    // Set canvas size
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight - 40;
    
    // Game variables
    const paddleHeight = 10;
    const paddleWidth = 75;
    const brickRowCount = 6;
    const brickColumnCount = 11;
    const brickWidth = 70;
    const brickHeight = 20;
    const brickPadding = 1;
    const brickOffsetTop = 30;
    const brickOffsetLeft = 30;
    
    let x = canvas.width / 2;
    let y = canvas.height - 30;
    let dx = 2;
    let dy = -2;
    let paddleX = (canvas.width - paddleWidth) / 2;
    let rightPressed = false;
    let leftPressed = false;
    let score = 0;
    let gameOver = false;
    let gameLoop;
    
    // Create bricks
    let bricks = [];
    for (let c = 0; c < brickColumnCount; c++) {
        bricks[c] = [];
        for (let r = 0; r < brickRowCount; r++) {
            bricks[c][r] = { x: 0, y: 0, status: 1 };
        }
    }
    
    // Event listeners
    document.addEventListener('keydown', keyDownHandler);
    document.addEventListener('keyup', keyUpHandler);
    
    function keyDownHandler(e) {
        if (e.key === 'Right' || e.key === 'ArrowRight') {
            rightPressed = true;
        } else if (e.key === 'Left' || e.key === 'ArrowLeft') {
            leftPressed = true;
        }
    }
    
    function keyUpHandler(e) {
        if (e.key === 'Right' || e.key === 'ArrowRight') {
            rightPressed = false;
        } else if (e.key === 'Left' || e.key === 'ArrowLeft') {
            leftPressed = false;
        }
    }
    
    function collisionDetection() {
        let bricksLeft = 0;
        
        for (let c = 0; c < brickColumnCount; c++) {
            for (let r = 0; r < brickRowCount; r++) {
                const b = bricks[c][r];
                if (b.status === 1) {
                    bricksLeft++;
                    if (
                        x > b.x && 
                        x < b.x + brickWidth && 
                        y > b.y && 
                        y < b.y + brickHeight
                    ) {
                        dy = -dy;
                        b.status = 0;
                        score += 10;
                        
                        // Check if all bricks are broken
                        if (bricksLeft === 1) { // Last brick
                            // Increase speed by 10%
                            dx *= 1.1;
                            dy *= 1.1;
                            level++;
                            
                            // Reset ball position
                            x = canvas.width / 2;
                            y = canvas.height - 30;
                            paddleX = (canvas.width - paddleWidth) / 2;
                            
                            // Reset bricks
                            initBricks();
                        }
                    }
                }
            }
        }
    }
    
    function drawBall() {
        ctx.beginPath();
        ctx.arc(x, y, 10, 0, Math.PI * 2);
        ctx.fillStyle = '#0f0';
        ctx.fill();
        ctx.closePath();
    }
    
    function drawPaddle() {
        ctx.beginPath();
        ctx.rect(paddleX, canvas.height - paddleHeight, paddleWidth, paddleHeight);
        ctx.fillStyle = '#0f0';
        ctx.fill();
        ctx.closePath();
    }
    
    function drawBricks() {
        for (let c = 0; c < brickColumnCount; c++) {
            for (let r = 0; r < brickRowCount; r++) {
                if (bricks[c][r].status === 1) {
                    const brickX = c * (brickWidth + brickPadding) + brickOffsetLeft;
                    const brickY = r * (brickHeight + brickPadding) + brickOffsetTop;
                    bricks[c][r].x = brickX;
                    bricks[c][r].y = brickY;
                    
                    ctx.beginPath();
                    ctx.rect(brickX, brickY, brickWidth, brickHeight);
                    ctx.fillStyle = '#0f0';
                    ctx.fill();
                    ctx.closePath();
                }
            }
        }
    }
    
    function drawScore() {
        ctx.font = '16px Source Code Pro';
        ctx.fillStyle = '#0f0';
        ctx.fillText(`Score: ${score}`, 8, 20);
    }
    
    function drawGameOver() {
        ctx.font = '30px Source Code Pro';
        ctx.fillStyle = '#0f0';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
        ctx.fillText(`Final Score: ${score}`, canvas.width / 2, canvas.height / 2 + 40);
        ctx.textAlign = 'left';
    }
    
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawBricks();
        drawBall();
        drawPaddle();
        drawScore();
        collisionDetection();
        
        // Ball collision with walls
        if (x + dx > canvas.width - 10 || x + dx < 10) {
            dx = -dx;
        }
        
        if (y + dy < 10) {
            dy = -dy;
        } else if (y + dy > canvas.height - 10) {
            // Ball hits bottom
            if (x > paddleX && x < paddleX + paddleWidth) {
                dy = -dy;
            } else {
                gameOver = true;
            }
        }
        
        // Paddle movement
        if (rightPressed && paddleX < canvas.width - paddleWidth) {
            paddleX += 7;
        } else if (leftPressed && paddleX > 0) {
            paddleX -= 7;
        }
        
        if (!gameOver) {
            x += dx;
            y += dy;
            gameLoop = requestAnimationFrame(draw);
        } else {
            drawGameOver();
        }
    }
    
    // Start game
    draw();
    
    // Back button
    blockbreakerWindow.querySelector('.back-button').addEventListener('click', () => {
        playClickSound();
        cancelAnimationFrame(gameLoop);
        blockbreakerWindow.remove();
        createWindow('games');
    });
}

function initPlatformerGame(platformerWindow) {
    const canvas = platformerWindow.querySelector('#platformer-canvas');
    const ctx = canvas.getContext('2d');
    
    // Set canvas size
    canvas.width = 800;
    canvas.height = 600;
    
    // Game variables
    const player = {
    x: 100,
    y: 300,
    width: 30,
    height: 30,
    velocityX: 4, // Start with slow automatic movement
    velocityY: 0,
    speed: 5,
    baseSpeed: 4, // Base automatic speed
    jumpForce: 10,
    isJumping: false,
    color: '#0f0'
};
    
    const gravity = 0.5;
    const platforms = [];
    const viewport = {
        x: 0,
        y: 0,
        width: canvas.width,
        height: canvas.height
    };
    
    let score = 0;
    let gameOver = false;
    let gameLoop;
    let lastPlatformX = 50;
    
    // Generate initial platforms
    function generateInitialPlatforms() {
        // Starting platform
        platforms.push({
            x: 0,
            y: 400,
            width: 1000,
            height: 20,
            color: '#0f0'
        });
        
        // First gap
        lastPlatformX = 300;
        
        // Generate first few platforms
        for (let i = 0; i < 5; i++) {
            generatePlatform();
        }
    }
    
    // Generate a new platform
    function generatePlatform() {
        const gapWidth = 50 + Math.random() * 50 + score * 0.2;
        const platformWidth = 100 + Math.random() * 100;
        
        platforms.push({
            x: lastPlatformX + gapWidth,
            y: 350 + (Math.random() * 100 - 50),
            width: platformWidth,
            height: 20,
            color: '#0f0'
        });
        
        lastPlatformX = lastPlatformX + gapWidth + platformWidth;
    }
    
    // Draw functions
    function drawPlayer() {
        ctx.fillStyle = player.color;
        ctx.fillRect(
            player.x - viewport.x,
            player.y - viewport.y,
            player.width,
            player.height
        );
    }
    
    function drawPlatforms() {
        platforms.forEach(platform => {
            if (isInViewport(platform)) {
                ctx.fillStyle = platform.color;
                ctx.fillRect(
                    platform.x - viewport.x,
                    platform.y - viewport.y,
                    platform.width,
                    platform.height
                );
            }
        });
    }
    
    function drawScore() {
        ctx.fillStyle = '#0f0';
        ctx.font = '20px Source Code Pro';
        ctx.fillText(`Score: ${score}`, 20, 30);
    }
    
    function isInViewport(object) {
        return (
            object.x + object.width > viewport.x &&
            object.x < viewport.x + viewport.width &&
            object.y + object.height > viewport.y &&
            object.y < viewport.y + viewport.height
        );
    }
    
    // Game logic
    function update() {
    // Apply gravity
    player.velocityY += gravity;
    
    // Automatic movement (remove manual left/right controls)
    player.velocityX = player.baseSpeed;
    
    // Update player position
    player.x += player.velocityX;
    player.y += player.velocityY;
    
    // Check platform collisions
    let onPlatform = false;
    platforms.forEach(platform => {
        if (
            player.x + player.width > platform.x &&
            player.x < platform.x + platform.width &&
            player.y + player.height >= platform.y &&
            player.y + player.height <= platform.y + platform.height + player.velocityY
        ) {
            player.y = platform.y - player.height;
            player.velocityY = 0;
            player.isJumping = false;
            onPlatform = true;
        }
    });
    
    // Check if player fell off the bottom
    if (player.y > viewport.y + viewport.height) {
        gameOver = true;
    }
    
    // Update viewport to follow player
    viewport.x = player.x - 100;
    
    // Generate new platforms as needed
    while (lastPlatformX < viewport.x + viewport.width + 200) {
        generatePlatform();
    }
    
    // Remove platforms that are far behind and increase score
    platforms.forEach((platform, index) => {
        if (platform.x + platform.width < viewport.x - 200) {
            platforms.splice(index, 1);
            score++;
            
            // Increase speed every 5 points
            if (score % 5 === 0) {
                player.baseSpeed *= 1.05; // 5% speed increase
            }
        }
    });
}
    
    // Game loop
    function game() {
        if (!gameOver) {
            // Clear canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            update();
            drawPlatforms();
            drawPlayer();
            drawScore();
            
            gameLoop = requestAnimationFrame(game);
        } else {
            // Game over screen
            ctx.fillStyle = '#0f0';
            ctx.font = '30px Source Code Pro';
            ctx.textAlign = 'center';
            ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2);
            ctx.font = '20px Source Code Pro';
            ctx.fillText(`Final Score: ${score}`, canvas.width/2, canvas.height/2 + 30);
            ctx.textAlign = 'left';
        }
    }
    
    // Controls
    const keys = {};
    document.addEventListener('keydown', (e) => {
        keys[e.key.toLowerCase()] = true;
        
        if (e.key.toLowerCase() === 'w' && !player.isJumping) {
            player.velocityY = -player.jumpForce;
            player.isJumping = true;
        }
    });
    
    document.addEventListener('keyup', (e) => {
        keys[e.key.toLowerCase()] = false;
    });
    
    function handleInput() {
        player.velocityX = 0;
        
        if (keys['a']) {
            player.velocityX = -player.speed;
        }
        if (keys['d']) {
            player.velocityX = player.speed;
        }
    }
    
    // Initialize game
    generateInitialPlatforms();
    
    // Input handling loop
    setInterval(handleInput, 16);
    game();
    
    // Back button
    platformerWindow.querySelector('.back-button').addEventListener('click', () => {
        cancelAnimationFrame(gameLoop);
        platformerWindow.remove();
        createWindow('games');
    });
}

function initPaint(paintWindow) {
    const canvas = paintWindow.querySelector('#paint-canvas');
    const ctx = canvas.getContext('2d');
    const colorInput = paintWindow.querySelector('#paint-color');
    const savedFiles = paintWindow.querySelector('#paint-saved-files');
    const saveButton = paintWindow.querySelector('.save');
    const saveAsButton = paintWindow.querySelector('.saveas');
    const openButton = paintWindow.querySelector('.open');
    const saveDialog = document.getElementById('save-dialog');
    const openDialog = document.getElementById('open-dialog');
    
    // Set canvas size
    canvas.width = 100;
    canvas.height = 100;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    let currentPaint = 'Untitled';
    let savedPaintings = {};
    let brushSize = 1;
    let isDrawing = false;
    
    // Set up brush size options
    paintWindow.querySelectorAll('.paint-option').forEach(option => {
        option.addEventListener('click', () => {
            playClickSound();
            brushSize = parseInt(option.dataset.size);
            paintWindow.querySelectorAll('.paint-option').forEach(opt => {
                opt.style.backgroundColor = opt === option ? '#0f0' : '#000';
                opt.style.color = opt === option ? '#000' : '#0f0';
            });
        });
    });
    
    // Set initial brush size
    paintWindow.querySelector('.paint-option[data-size="1"]').click();
    
    // Drawing functionality
    function getColor() {
        const greenValue = parseInt(colorInput.value);
        const clampedValue = Math.min(100, Math.max(0, greenValue));
        colorInput.value = clampedValue;
        return `rgb(0, ${Math.floor(255 * (clampedValue / 100))}, 0)`;
    }
    
    function draw(e) {
        if (!isDrawing) return;
        
        const rect = canvas.getBoundingClientRect();
        const x = Math.floor((e.clientX - rect.left) / (rect.width / canvas.width));
        const y = Math.floor((e.clientY - rect.top) / (rect.height / canvas.height));
        
        ctx.fillStyle = getColor();
        
        for (let i = 0; i < brushSize; i++) {
            for (let j = 0; j < brushSize; j++) {
                const px = x + i - Math.floor(brushSize / 2);
                const py = y + j - Math.floor(brushSize / 2);
                if (px >= 0 && px < canvas.width && py >= 0 && py < canvas.height) {
                    ctx.fillRect(px, py, 1, 1);
                }
            }
        }
    }
    
    canvas.addEventListener('mousedown', (e) => {
        isDrawing = true;
        draw(e);
    });
    
    canvas.addEventListener('mousemove', draw);
    
    canvas.addEventListener('mouseup', () => {
        isDrawing = false;
    });
    
    canvas.addEventListener('mouseleave', () => {
        isDrawing = false;
    });
    
    // Save functionality
    function savePainting() {
        savedPaintings[currentPaint] = canvas.toDataURL();
        logAction(`Saved painting: ${currentPaint}`);
    }
    
    function loadPainting(dataUrl) {
        const img = new Image();
        img.onload = function() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0);
        };
        img.src = dataUrl;
    }
    
    saveButton.addEventListener('click', savePainting);
    
    saveAsButton.addEventListener('click', () => {
        playClickSound();
        saveDialog.style.display = 'block';
        document.getElementById('save-filename').value = currentPaint;
    });
    
    openButton.addEventListener('click', () => {
        playClickSound();
        savedFiles.innerHTML = '';
        Object.keys(savedPaintings).forEach(name => {
            const fileItem = document.createElement('div');
            fileItem.textContent = name;
            fileItem.style.padding = '5px';
            fileItem.style.cursor = 'none';
            fileItem.addEventListener('click', () => {
                playClickSound();
                currentPaint = name;
                loadPainting(savedPaintings[name]);
                paintWindow.querySelector('.window-title').textContent = `Paint - ${name}`;
                savedFiles.style.display = 'none';
            });
            savedFiles.appendChild(fileItem);
        });
        savedFiles.style.display = savedFiles.children.length > 0 ? 'block' : 'none';
    });
    
    // Save dialog buttons
    document.getElementById('save-confirm').addEventListener('click', () => {
        playClickSound();
        const newName = document.getElementById('save-filename').value;
        if (newName) {
            currentPaint = newName;
            paintWindow.querySelector('.window-title').textContent = `Paint - ${newName}`;
            saveDialog.style.display = 'none';
            savePainting();
        }
    });
    
    // Open dialog buttons
    document.getElementById('open-confirm').addEventListener('click', () => {
        playClickSound();
        const paintingName = document.getElementById('open-filename').value;
        if (paintingName && savedPaintings[paintingName]) {
            currentPaint = paintingName;
            loadPainting(savedPaintings[paintingName]);
            paintWindow.querySelector('.window-title').textContent = `Paint - ${paintingName}`;
            openDialog.style.display = 'none';
            logAction(`Opened painting: ${paintingName}`);
        } else {
            alert('Painting not found!');
        }
    });
    
    // Initialize with empty painting
    savedPaintings['Untitled'] = canvas.toDataURL();
}
