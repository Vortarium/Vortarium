<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ragebait 3</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;font-family:'Rajdhani',Arial,sans-serif;overflow:hidden;width:100vw;height:100vh;}
/* TRANSITION WIPE */
#wipe{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:200;pointer-events:none;opacity:0;display:flex;align-items:center;justify-content:center;}
#wipe.wiping{opacity:1;pointer-events:all;}
.spinner{width:48px;height:48px;border:4px solid rgba(255,255,255,0.1);border-top:4px solid #ff4466;border-radius:50%;animation:spin 0.7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
/* SCREENS */
.screen{position:fixed;top:0;left:0;width:100%;height:100%;opacity:0;pointer-events:none;transition:opacity 0.3s ease;z-index:10;}
.screen.active{opacity:1;pointer-events:all;}
/* TITLE */
#titleScreen{display:flex;align-items:center;justify-content:center;background-size:cover;background-position:center;background-repeat:no-repeat;}
.glass-panel{background:rgba(0,0,0,0.55);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.12);border-radius:4px;padding:48px 64px;text-align:center;box-shadow:0 0 60px rgba(255,40,80,0.25),0 8px 32px rgba(0,0,0,0.7);min-width:340px;}
.title-logo{font-family:'Press Start 2P',monospace;font-size:2.2rem;color:#fff;letter-spacing:2px;text-shadow:0 0 30px #ff2255,0 0 60px #ff224488,2px 2px 0 #aa0033;margin-bottom:4px;line-height:1.3;}
.title-ep{font-family:'Press Start 2P',monospace;font-size:0.55rem;color:#ff4466;letter-spacing:4px;margin-bottom:6px;text-shadow:0 0 10px #ff4466;}
.title-prod{color:rgba(255,255,255,0.35);font-size:0.75rem;letter-spacing:3px;margin-bottom:36px;font-family:'Rajdhani',sans-serif;text-transform:uppercase;}
.btn{display:block;width:100%;padding:13px 0;margin:8px 0;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.18);border-radius:3px;color:#fff;font-size:0.85rem;font-weight:700;letter-spacing:3px;cursor:pointer;transition:background 0.2s,transform 0.1s,box-shadow 0.2s;text-transform:uppercase;font-family:'Rajdhani',sans-serif;}
.btn:hover{background:rgba(255,60,90,0.2);border-color:rgba(255,60,90,0.5);transform:translateY(-2px);box-shadow:0 4px 20px rgba(255,40,80,0.3);}
.btn:active{transform:translateY(0);}
.btn-danger{border-color:rgba(255,80,80,0.4);color:#ff8888;}
.btn-danger:hover{background:rgba(255,40,40,0.2);border-color:#ff4444;}
/* COSMETICS */
#cosmeticsScreen{background:linear-gradient(135deg,#0a0010 0%,#100020 50%,#0a0015 100%);display:flex;flex-direction:column;align-items:center;overflow-y:auto;padding:32px 16px;}
.cosmetics-header{font-family:'Press Start 2P',monospace;color:#fff;font-size:1.1rem;letter-spacing:2px;margin-bottom:4px;text-shadow:0 0 20px #aa44ff;}
.shards-display{color:#ffd700;font-size:1.1rem;font-weight:700;margin-bottom:28px;letter-spacing:2px;text-shadow:0 0 10px #ffd70088;}
.cosmetics-section{width:100%;max-width:720px;margin-bottom:28px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:4px;padding:20px;}
.cosmetics-section h3{font-family:'Press Start 2P',monospace;font-size:0.55rem;letter-spacing:3px;text-transform:uppercase;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,0.08);}
.section-colors h3{color:#ff6688;}
.section-particles h3{color:#44aaff;}
.section-death h3{color:#ff8844;}
.items-grid{display:flex;flex-wrap:wrap;gap:10px;}
.item-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:3px;padding:14px 16px;cursor:pointer;transition:all 0.2s;min-width:110px;text-align:center;position:relative;}
.item-card:hover{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.25);}
.item-card.selected{border-color:#ffd700;background:rgba(255,215,0,0.08);box-shadow:0 0 12px rgba(255,215,0,0.2);}
.item-card.owned{border-color:rgba(100,255,150,0.35);}
.item-card .item-name{color:#fff;font-weight:700;font-size:0.85rem;margin-bottom:4px;font-family:'Rajdhani',sans-serif;letter-spacing:1px;}
.item-card .item-cost{color:#ffd700;font-size:0.75rem;}
.item-card .item-status{font-size:0.7rem;margin-top:4px;font-family:'Rajdhani',sans-serif;}
.item-card.selected .item-status{color:#ffd700;}
.item-card.owned:not(.selected) .item-status{color:#64ff96;}
.item-card:not(.owned):not(.selected) .item-status{color:rgba(255,255,255,0.35);}
.color-preview{width:28px;height:28px;border-radius:3px;margin:0 auto 8px;border:2px solid rgba(255,255,255,0.2);}
.death-sound-btns{display:flex;gap:10px;flex-wrap:wrap;}
.death-btn{padding:10px 20px;border-radius:3px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);color:#fff;cursor:pointer;font-size:0.8rem;font-weight:700;transition:all 0.2s;letter-spacing:2px;font-family:'Rajdhani',sans-serif;}
.death-btn:hover{background:rgba(255,136,68,0.15);border-color:rgba(255,136,68,0.4);}
.death-btn.selected{border-color:#ff8844;background:rgba(255,136,68,0.12);color:#ff8844;box-shadow:0 0 10px rgba(255,136,68,0.2);}
.death-btn.locked-sound{opacity:0.5;}
.back-btn-wrap{margin-top:8px;width:100%;max-width:720px;}
/* LEVEL SELECT */
#levelSelectScreen{background-size:cover;background-position:center;background-repeat:no-repeat;display:flex;flex-direction:column;align-items:center;overflow-y:auto;padding:32px 16px;}
#levelSelectScreen::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:0;}
#levelSelectScreen>*{position:relative;z-index:1;}
.level-select-header{font-family:'Press Start 2P',monospace;color:#fff;font-size:1rem;letter-spacing:3px;margin-bottom:28px;text-shadow:0 0 20px #4488ff;}
.levels-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;width:100%;max-width:820px;}
.level-card{background:rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.12);border-radius:3px;padding:18px 14px;cursor:pointer;transition:all 0.2s;text-align:center;position:relative;overflow:hidden;backdrop-filter:blur(8px);}
.level-card:hover:not(.locked){background:rgba(255,255,255,0.1);transform:translateY(-3px);box-shadow:0 6px 24px rgba(100,150,255,0.25);}
.level-card.locked{opacity:0.4;cursor:not-allowed;}
.level-card.completed{border-color:rgba(100,255,150,0.35);}
.level-num{font-family:'Press Start 2P',monospace;color:rgba(255,255,255,0.25);font-size:0.45rem;letter-spacing:2px;margin-bottom:8px;}
.level-diff{font-size:0.8rem;font-weight:700;margin-bottom:8px;font-family:'Rajdhani',sans-serif;letter-spacing:2px;}
.level-best{color:rgba(255,255,255,0.45);font-size:0.85rem;font-family:'Rajdhani',sans-serif;letter-spacing:2px;}
.lock-icon{font-size:1.4rem;margin-bottom:6px;}
.diff-easy{color:#64ff96;}
.diff-normal{color:#64d4ff;}
.diff-normalplus{color:#64b4ff;}
.diff-medium{color:#ffcc44;}
.diff-hard{color:#ff8844;}
.diff-insane{color:#ff4444;}
.diff-extreme{color:#ff44aa;}
.diff-extremeplus{color:#cc44ff;}
.diff-abyssal{color:#8844ff;}
.diff-abyssal2{color:#ff0088;}
.level-select-back{margin-top:20px;width:100%;max-width:820px;}
#btnDecathlon:hover{background:linear-gradient(135deg,rgba(255,215,0,0.22),rgba(255,100,0,0.22));border-color:rgba(255,215,0,0.7);transform:translateY(-2px);box-shadow:0 4px 24px rgba(255,215,0,0.2);}
#btnDecathlon:active{transform:translateY(0);}
/* GAME SCREEN */
#gameScreen{background:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;}
#gameHeartsBar{color:#fff;font-size:1.3rem;letter-spacing:6px;margin-bottom:8px;text-align:center;font-family:'Rajdhani',sans-serif;}
#fallingWarnings{height:22px;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:4px;min-height:22px;}
.fall-warn{background:rgba(255,60,60,0.85);color:#fff;font-size:0.65rem;font-weight:700;padding:2px 7px;border-radius:2px;font-family:'Press Start 2P',monospace;animation:pulse 0.5s infinite alternate;}
@keyframes pulse{from{opacity:0.7;}to{opacity:1;}}
#risingWarnings{height:22px;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px;min-height:22px;}
.rise-warn{background:rgba(255,140,0,0.85);color:#fff;font-size:0.65rem;font-weight:700;padding:2px 7px;border-radius:2px;font-family:'Press Start 2P',monospace;}
#gameCanvas{display:block;border:2px solid rgba(255,255,255,0.15);}
#shiftBar{width:500px;height:10px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);border-radius:2px;margin-top:8px;overflow:hidden;position:relative;}
#shiftFill{height:100%;width:0%;background:linear-gradient(90deg,#4466ff,#aa44ff);transition:width 0.1s linear;border-radius:2px;}
#shiftBar.ready #shiftFill{background:linear-gradient(90deg,#44ffaa,#44ffff);box-shadow:0 0 10px #44ffaa,0 0 20px #44ffaa88;animation:glow 1s infinite alternate;}
@keyframes glow{from{box-shadow:0 0 6px #44ffaa;}to{box-shadow:0 0 18px #44ffaa,0 0 30px #44ffaa66;}}
#shiftLabel{text-align:center;font-size:0.6rem;color:rgba(255,255,255,0.4);margin-top:3px;font-family:'Press Start 2P',monospace;letter-spacing:1px;}
/* OVERLAYS */
.game-overlay{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;opacity:0;pointer-events:none;transition:opacity 0.4s;background:rgba(0,0,0,0.8);}
.game-overlay.visible{opacity:1;pointer-events:all;}
.overlay-title{font-family:'Press Start 2P',monospace;font-size:2rem;color:#fff;text-shadow:0 0 30px rgba(255,80,80,0.9);letter-spacing:3px;margin-bottom:16px;}
.overlay-sub{color:rgba(255,255,255,0.65);font-size:1rem;margin-bottom:32px;letter-spacing:2px;font-family:'Rajdhani',sans-serif;}
.overlay-btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;}
.overlay-btn{padding:13px 26px;border-radius:3px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.25);color:#fff;font-size:0.8rem;font-weight:700;letter-spacing:2px;cursor:pointer;transition:all 0.2s;text-transform:uppercase;font-family:'Rajdhani',sans-serif;}
.overlay-btn:hover{background:rgba(255,60,90,0.2);border-color:rgba(255,60,90,0.5);transform:translateY(-2px);}
.shards-earned{color:#ffd700;font-size:1.1rem;font-weight:700;margin-bottom:8px;font-family:'Rajdhani',sans-serif;letter-spacing:2px;text-shadow:0 0 10px #ffd70088;}
/* COUNTDOWN */
#countdown{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Press Start 2P',monospace;font-size:5rem;color:#fff;text-shadow:0 0 40px rgba(255,80,80,1);z-index:60;opacity:0;pointer-events:none;transition:opacity 0.2s;}
#countdown.visible{opacity:1;}
/* FLASH */
#screenFlash{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(255,0,0,0.3);z-index:100;opacity:0;pointer-events:none;transition:opacity 0.1s;}
/* CONFIRM MODAL */
#confirmModal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:300;display:none;align-items:center;justify-content:center;}
#confirmModal.open{display:flex;}
.confirm-box{background:#0d0010;border:1px solid rgba(255,80,80,0.4);border-radius:4px;padding:40px 48px;text-align:center;box-shadow:0 0 40px rgba(255,40,80,0.3);}
.confirm-box h2{font-family:'Press Start 2P',monospace;color:#fff;font-size:0.9rem;margin-bottom:12px;letter-spacing:2px;}
.confirm-box p{color:rgba(255,255,255,0.55);font-size:0.85rem;margin-bottom:28px;font-family:'Rajdhani',sans-serif;letter-spacing:1px;}
.confirm-btns{display:flex;gap:14px;justify-content:center;}
.confirm-btn{padding:11px 28px;border-radius:3px;font-size:0.8rem;font-weight:700;letter-spacing:2px;cursor:pointer;font-family:'Rajdhani',sans-serif;text-transform:uppercase;transition:all 0.2s;}
.confirm-yes{background:rgba(255,40,40,0.15);border:1px solid #ff4444;color:#ff8888;}
.confirm-yes:hover{background:rgba(255,40,40,0.3);}
.confirm-no{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.2);color:#fff;}
.confirm-no:hover{background:rgba(255,255,255,0.12);}
/* SCROLLBAR */
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:rgba(255,255,255,0.03);}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:2px;}
</style>
</head>
<body>
<div id="wipe"><div class="spinner"></div></div>
<div id="screenFlash"></div>
<div id="countdown"></div>
<div id="confirmModal">
  <div class="confirm-box">
    <h2>RESET SAVE?</h2>
    <p>This will erase all progress, shards, and unlocks.</p>
    <div class="confirm-btns">
      <button class="confirm-btn confirm-yes" id="confirmYes">YES, RESET</button>
      <button class="confirm-btn confirm-no" id="confirmNo">CANCEL</button>
    </div>
  </div>
</div>
<!-- TITLE -->
<div id="titleScreen" class="screen">
  <div class="glass-panel">
    <div class="title-logo">RAGEBAIT 3</div>
    <div class="title-ep">Music is your lifeblood</div>
    <div class="title-prod">Vortarium Productions</div>
    <button class="btn" id="btnPlay">PLAY</button>
    <button class="btn" id="btnCosmetics">COSMETICS</button>
    <button class="btn btn-danger" id="btnRestart">RESET SAVE</button>
  </div>
</div>
<!-- COSMETICS -->
<div id="cosmeticsScreen" class="screen">
  <div class="cosmetics-header">COSMETICS</div>
  <div class="shards-display" id="shardsDisplay">✦ 0 SHARDS</div>
  <div class="cosmetics-section section-colors">
    <h3>Player Color</h3>
    <div class="items-grid" id="colorGrid"></div>
  </div>
  <div class="cosmetics-section section-particles">
    <h3>Movement Particles</h3>
    <div class="items-grid" id="particleGrid"></div>
  </div>
  <div class="cosmetics-section section-death">
    <h3>Death Sound</h3>
    <div class="death-sound-btns" id="deathSoundBtns"></div>
  </div>
  <div class="back-btn-wrap">
    <button class="btn" id="btnCosmeticsBack">← BACK</button>
  </div>
</div>
<!-- LEVEL SELECT -->
<div id="levelSelectScreen" class="screen">
  <div class="level-select-header">SELECT LEVEL</div>
  <div class="levels-grid" id="levelsGrid"></div>
  <div id="decathlonWrap" style="width:100%;max-width:820px;margin-top:16px;">
    <button id="btnDecathlon" style="width:100%;padding:18px;background:linear-gradient(135deg,rgba(255,215,0,0.12),rgba(255,100,0,0.12));border:1px solid rgba(255,215,0,0.4);border-radius:3px;color:#ffd700;font-family:'Press Start 2P',monospace;font-size:0.65rem;letter-spacing:2px;cursor:pointer;transition:all 0.2s;text-transform:uppercase;line-height:1.8;">
      ★ DECATHLON — PLAY ALL 10 LEVELS ★<br>
      <span style="font-size:0.45rem;color:rgba(255,215,0,0.6);margin-top:6px;display:block;">6 HEARTS · 250 SHARDS · 500 IF PERFECT</span>
    </button>
  </div>
  <div class="level-select-back">
    <button class="btn" id="btnLevelSelectBack">← BACK</button>
  </div>
</div>
<!-- GAME -->
<div id="gameScreen" class="screen">
  <div id="gameLevelTitle" style="font-family:'Press Start 2P',monospace;color:#fff;font-size:0.6rem;letter-spacing:3px;margin-bottom:6px;text-align:center;text-shadow:0 0 10px rgba(255,255,255,0.4);opacity:0.7;">LEVEL 1</div>
  <div id="musicBarWrap" style="width:500px;height:6px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);border-radius:2px;margin-bottom:6px;overflow:hidden;">
    <div id="musicBarFill" style="height:100%;width:0%;background:linear-gradient(90deg,#4466ff,#aa44ff,#ff4466);border-radius:2px;transition:width 0.25s linear;"></div>
  </div>
  <div id="musicPct" style="font-family:'Press Start 2P',monospace;font-size:0.45rem;color:rgba(255,255,255,0.35);text-align:center;margin-bottom:4px;letter-spacing:1px;">0.0%</div>
  <div id="gameHeartsBar">❤️❤️❤️</div>
  <div id="fallingWarnings"></div>
  <canvas id="gameCanvas" width="500" height="500"></canvas>
  <div id="risingWarnings"></div>
  <div id="shiftBar"><div id="shiftFill"></div></div>
  <div id="shiftLabel">SPACE — INVINCIBILITY</div>
  <button id="btnLeaveLevel" style="margin-top:12px;padding:8px 22px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.18);border-radius:3px;color:rgba(255,255,255,0.5);font-size:0.7rem;font-weight:700;letter-spacing:2px;cursor:pointer;font-family:'Rajdhani',sans-serif;text-transform:uppercase;transition:all 0.2s;">← LEAVE LEVEL</button>
</div>
<!-- DEATH OVERLAY -->
<div class="game-overlay" id="deathOverlay">
  <div class="overlay-title">YOU DIED</div>
  <div class="overlay-sub" id="deathSub">Better luck next time.</div>
  <div class="overlay-btns">
    <button class="overlay-btn" id="btnRestartLevel">RESTART LEVEL</button>
    <button class="overlay-btn" id="btnDeathMenu">MAIN MENU</button>
  </div>
</div>
<!-- WIN OVERLAY -->
<div class="game-overlay" id="winOverlay">
  <div class="overlay-title">LEVEL COMPLETE!</div>
  <div class="shards-earned" id="shardsEarned"></div>
  <div class="overlay-sub" id="winSub"></div>
  <div class="overlay-btns">
    <button class="overlay-btn" id="btnNextLevel">NEXT LEVEL</button>
    <button class="overlay-btn" id="btnRestartWin">RESTART</button>
    <button class="overlay-btn" id="btnWinMenu">MENU</button>
  </div>
</div>
<script>// ============ STATE ============
const DEFAULT_SAVE={shards:0,ownedColors:['white'],ownedParticles:['none'],selectedColor:'white',selectedParticle:'none',selectedDeathSound:1,ownedDeathSounds:[1],unlockedLevels:[1],bestHearts:{},totalShards:0};
let save=JSON.parse(JSON.stringify(DEFAULT_SAVE));
function loadSave(){try{const r=localStorage.getItem('ragebait3_save');if(r){const p=JSON.parse(r);save=Object.assign(JSON.parse(JSON.stringify(DEFAULT_SAVE)),p);}}catch(e){save=JSON.parse(JSON.stringify(DEFAULT_SAVE));}}
function writeSave(){localStorage.setItem('ragebait3_save',JSON.stringify(save));}
let currentScreen='title',gameInProgress=false,currentLevel=1,gameState=null;

// ============ LEVELS ============
const LEVELS=[
  {num:1,diff:'Easy',diffClass:'diff-easy'},
  {num:2,diff:'Normal',diffClass:'diff-normal'},
  {num:3,diff:'Normal+',diffClass:'diff-normalplus'},
  {num:4,diff:'Medium',diffClass:'diff-medium'},
  {num:5,diff:'Hard',diffClass:'diff-hard'},
  {num:6,diff:'Insane',diffClass:'diff-insane'},
  {num:7,diff:'Extreme',diffClass:'diff-extreme'},
  {num:8,diff:'Extreme+',diffClass:'diff-extremeplus'},
  {num:9,diff:'Abyssal',diffClass:'diff-abyssal'},
  {num:10,diff:'Abyssal II',diffClass:'diff-abyssal2'}
];

// ============ COSMETICS DATA ============
const COLOR_ITEMS=[
  {id:'white',   name:'White',   cost:0,   color:'#ffffff'},
  {id:'red',     name:'Red',     cost:25,  color:'#ff4444'},
  {id:'blue',    name:'Blue',    cost:40,  color:'#4488ff'},
  {id:'green',   name:'Green',   cost:55,  color:'#44ff88'},
  {id:'gold',    name:'Gold',    cost:70,  color:'#ffd700'},
  {id:'cyan',    name:'Cyan',    cost:85,  color:'#44ffff'},
  {id:'pink',    name:'Pink',    cost:100, color:'#ff44cc'},
  {id:'orange',  name:'Orange',  cost:115, color:'#ff8833'},
  {id:'purple',  name:'Purple',  cost:130, color:'#aa44ff'},
  {id:'lime',    name:'Lime',    cost:145, color:'#aaff00'},
  {id:'rainbow', name:'Rainbow', cost:200, color:'rainbow'}
];
const PARTICLE_ITEMS=[
  {id:'none',   name:'None',         cost:0,   desc:''},
  {id:'sparks', name:'Sparks',       cost:60,  desc:'Tiny sparks burst off you'},
  {id:'stars',  name:'Stars',        cost:80,  desc:'Little stars float away'},
  {id:'trails', name:'Pixel Trail',  cost:100, desc:'Tiny pixels mark your path'},
  {id:'trail2', name:'Glow Trail',   cost:150, desc:'Glowing colored dots fade behind you'},
  {id:'trail3', name:'Fire Trail',   cost:220, desc:'Fiery embers streak behind you'},
  {id:'trail4', name:'Rainbow Trail',cost:320, desc:'Rainbow pixels shimmer in your wake'}
];
const DEATH_SOUNDS=[
  {n:1,name:'Classic',cost:0},
  {n:2,name:'Crunch',cost:60},
  {n:3,name:'Boom',cost:60}
];

// ============ AUDIO ============
let titleMusic=null;
let levelMusic=null;
function ensureTitleMusic(){
  if(gameState&&(gameState.phase==='playing'||gameState.phase==='countdown'||gameState.phase==='waiting'))return;
  if(!titleMusic){titleMusic=new Audio('ragebait 3_title.mp3');titleMusic.loop=true;titleMusic.volume=0.7;}
  titleMusic.volume=0.7; // restore volume in case it was faded
  if(!titleMusic.paused)return;
  titleMusic.play().catch(()=>{});
}
function stopLevelMusic(){

// ============ GAME CONSTANTS ============
const ARENA=500,PS=14,SPD=3;
let rainbowHue=0;
function getPlayerColor(){
  const c=save.selectedColor;
  if(c==='rainbow'){rainbowHue=(rainbowHue+2)%360;return `hsl(${rainbowHue},100%,60%)`;}
  return {white:'#ffffff',red:'#ff4444',blue:'#4488ff',green:'#44ff88',gold:'#ffd700',cyan:'#44ffff',pink:'#ff44cc',orange:'#ff8833',purple:'#aa44ff',lime:'#aaff00'}[c]||'#ffffff';
}

// ============ GAME STATE ============
function createGameState(lvl){
  return {
    lvl,hearts:3,
    px:ARENA/2-PS/2,py:ARENA/2-PS/2,
    invincible:false,invTimer:0,
    shiftCooldown:0,shiftActive:false,shiftTimer:0,
    SHIFT_CD:10000,SHIFT_DUR:1500,
    phase:'waiting',
    cdVal:3,cdTimer:0,
    attacks:[],projectiles:[],explosions:[],boulders:[],gridLines:[],
    particles:[],trailPts:[],
    spinAngle:0,
    atkTimer:0,atkInterval:1000,
    projTimer:0,projInterval:2000,
    explTimer:0,explInterval:4000,
    boulderTimer:0,boulderInterval:2500,
    gridTimer:0,gridInterval:8000,
    diagTimer:0,diagInterval:3000,
    movingLaserTimer:0,movingLaserInterval:3500,
    won:false,lastTime:0,keys:{},moving:false
  };
}

// ============ START LEVEL ============
function startLevel(num){
  currentLevel=num;gameInProgress=true;
  if(num===11){startDecathlon();return;}
  gameState=createGameState(num);
  stopLevelMusic();
  levelMusic=new Audio(`ragebait 3_${num}.mp3`);
  levelMusic.volume=0.7;
  levelMusic.addEventListener('ended',()=>{if(gameState&&gameState.phase==='playing')triggerWin();});
  if(titleMusic&&!titleMusic.paused){
    let v=titleMusic.volume;
    const iv=setInterval(()=>{v=Math.max(0,v-0.05);titleMusic.volume=v;if(v<=0){clearInterval(iv);titleMusic.pause();}},40);
  }
  // Set level title
  document.getElementById('gameLevelTitle').textContent=`LEVEL ${num}`;
  // Reset music bar
  document.getElementById('musicBarFill').style.width='0%';
  document.getElementById('musicPct').textContent='0.0%';
  updateHeartsDisplay(3);
  hideAllOverlays();
  showScreen('game');
  gameState.lastTime=performance.now();
  requestAnimationFrame(gameLoop);
}

function updateHeartsDisplay(h){
  const maxH=(gameState&&gameState.decathlon)?6:3;
  let s='';for(let i=0;i<maxH;i++)s+=i<h?'❤️':'🖤';
  document.getElementById('gameHeartsBar').textContent=s;
}

// ============ DECATHLON ============
let decathlonState=null;

function startDecathlon(){
  decathlonState={
    currentStage:1,
    hearts:6,
    startedPerfect:true,
    breakTimer:0,
    inBreak:false,
    totalSongs:10
  };
  _launchDecathlonStage(1,6);
}

function _launchDecathlonStage(stage,hearts){
  stopLevelMusic();
  const gs=createGameState(stage); // use real stage for attack logic
  gs.lvl=stage;                    // real level for attacks
  gs.decathlon=true;               // flag so triggerWin is skipped
  gs.hearts=hearts;
  gameState=gs;
  if(titleMusic&&!titleMusic.paused){
    let v=titleMusic.volume;
    const iv=setInterval(()=>{v=Math.max(0,v-0.05);titleMusic.volume=v;if(v<=0){clearInterval(iv);titleMusic.pause();}},40);
  }
  levelMusic=new Audio(`ragebait 3_${stage}.mp3`);
  levelMusic.volume=0.7;
  levelMusic.addEventListener('ended',()=>{
    if(gameState&&gameState.decathlon&&gameState.phase==='playing')decathlonNextStage();
  });
  document.getElementById('gameLevelTitle').textContent=`DECATHLON — LEVEL ${stage}/10`;
  document.getElementById('musicBarFill').style.width='0%';
  document.getElementById('musicPct').textContent='0.0%';
  updateHeartsDisplay(hearts);
  hideAllOverlays();
  showScreen('game');
  gs.lastTime=performance.now();
  requestAnimationFrame(gameLoop);
}

function decathlonNextStage(){
  if(!decathlonState||!gameState)return;
  const ds=decathlonState;
  const hearts=gameState.hearts;
  ds.hearts=hearts;
  ds.currentStage++;
  if(ds.currentStage>10){
    triggerDecathlonWin();
    return;
  }
  // Enter 10-second break — keep game loop running, just change phase
  stopLevelMusic();
  gameState.phase='break';
  gameState.attacks=[];gameState.projectiles=[];gameState.explosions=[];
  gameState.boulders=[];gameState.gridLines=[];
  ds.breakTimer=10000;
  ds.inBreak=true;
  document.getElementById('gameLevelTitle').textContent=`BREAK — LEVEL ${ds.currentStage} NEXT`;
}

function updateDecathlonBreak(dt){
  if(!decathlonState||!decathlonState.inBreak)return;
  const ds=decathlonState;
  ds.breakTimer=Math.max(0,ds.breakTimer-dt);
  const sec=Math.ceil(ds.breakTimer/1000);
  document.getElementById('gameLevelTitle').textContent=`BREAK — LEVEL ${ds.currentStage} IN ${sec}s`;
  if(ds.breakTimer<=0){
    ds.inBreak=false;
    _launchDecathlonStage(ds.currentStage,ds.hearts);
  }
}

function updateMusicBarDecathlon(){
  if(!decathlonState)return;
  const ds=decathlonState;
  if(ds.inBreak){
    // Show overall progress frozen at stage boundary
    const pct=((ds.currentStage-1)/ds.totalSongs)*100;
    document.getElementById('musicBarFill').style.width=pct.toFixed(1)+'%';
    document.getElementById('musicPct').textContent=pct.toFixed(1)+'%';
    return;
  }
  if(!levelMusic||!levelMusic.duration||isNaN(levelMusic.duration))return;
  const stagePct=(ds.currentStage-1)/ds.totalSongs;
  const songPct=(levelMusic.currentTime/levelMusic.duration)/ds.totalSongs;
  const total=Math.min(100,(stagePct+songPct)*100);
  document.getElementById('musicBarFill').style.width=total.toFixed(1)+'%';
  document.getElementById('musicPct').textContent=total.toFixed(1)+'%';
}

function triggerDecathlonWin(){
  if(!decathlonState||!gameState)return;
  const ds=decathlonState;
  const hearts=ds.hearts;
  gameState.phase='won';
  gameState.attacks=[];gameState.projectiles=[];gameState.explosions=[];
  gameState.boulders=[];gameState.gridLines=[];
  stopLevelMusic();
  playWinSound();
  const perfect=ds.startedPerfect&&hearts===6;
  const earned=perfect?500:250;
  save.shards+=earned;save.totalShards+=earned;
  writeSave();
  document.getElementById('shardsEarned').textContent=`+${earned} SHARDS EARNED${perfect?' ★ PERFECT!':''}`;
  document.getElementById('winSub').textContent=`Hearts remaining: ${'❤️'.repeat(hearts)} — All 10 Levels Complete!`;
  document.getElementById('btnNextLevel').style.display='none';
  setTimeout(()=>{
    document.getElementById('winOverlay').classList.add('visible');
    ensureTitleMusic();
  },500);
  decathlonState=null;
}

// ============ GAME LOOP ============
function gameLoop(ts){
  if(!gameState)return;
  const dt=Math.min(ts-gameState.lastTime,50);
  gameState.lastTime=ts;
  update(dt);render();
  const p=gameState.phase;
  if(p!=='dead'&&p!=='won')requestAnimationFrame(gameLoop);
}

function isMoving(){
  const k=gameState.keys;
  return k['ArrowUp']||k['ArrowDown']||k['ArrowLeft']||k['ArrowRight']||k['w']||k['s']||k['a']||k['d']||k['W']||k['S']||k['A']||k['D'];
}

// ============ UPDATE ============
function update(dt){
  const gs=gameState;
  // Decathlon break phase — keep loop alive, just count down
  if(gs.phase==='break'){
    updateDecathlonBreak(dt);
    updateMusicBarDecathlon();
    return;
  }
  if(gs.phase==='waiting'){if(isMoving()){gs.phase='countdown';gs.cdVal=3;gs.cdTimer=0;showCountdown(3);}return;}
  if(gs.phase==='countdown'){
    gs.cdTimer+=dt;
    if(gs.cdTimer>=1000){gs.cdTimer-=1000;gs.cdVal--;
      if(gs.cdVal<=0){gs.phase='playing';hideCountdown();showCountdownText('GO!');setTimeout(hideCountdown,600);levelMusic.play().catch(()=>{});}
      else showCountdown(gs.cdVal);
    }
    movePlayer(dt);updateParticles(dt);return;
  }
  if(gs.phase==='playing'){
    movePlayer(dt);
    updateShift(dt);
    spawnAttacks(dt);
    updateAttacks(dt);
    updateProjectiles(dt);
    updateExplosions(dt);
    updateBoulders(dt);
    updateGridLines(dt);
    updateParticles(dt);
    checkCollisions();
    if(gs.invincible){gs.invTimer-=dt;if(gs.invTimer<=0)gs.invincible=false;}
    updateShiftBar();
    updateWarnings();
    if(decathlonState)updateMusicBarDecathlon();else updateMusicBar();
  }
}

// ============ SHIFT MECHANIC ============
function updateShift(dt){
  const gs=gameState;
  if(gs.shiftActive){
    gs.shiftTimer-=dt;
    if(gs.shiftTimer<=0){gs.shiftActive=false;gs.invincible=false;gs.shiftCooldown=gs.SHIFT_CD;}
  } else if(gs.shiftCooldown>0){
    gs.shiftCooldown=Math.max(0,gs.shiftCooldown-dt);
  }
}
function updateShiftBar(){
  const gs=gameState;
  const bar=document.getElementById('shiftBar');
  const fill=document.getElementById('shiftFill');
  if(gs.shiftActive){
    // Bar drains from 100% → 0% over SHIFT_DUR while invincible
    const pct=Math.round((gs.shiftTimer/gs.SHIFT_DUR)*100);
    fill.style.width=pct+'%';
    bar.classList.remove('ready');
    fill.style.background='linear-gradient(90deg,#44ffaa,#44ffff)';
    fill.style.boxShadow='0 0 10px #44ffaa, 0 0 20px #44ffaa88';
    return;
  }
  // Recharging: 0% → 100% as cooldown counts down
  const pct=gs.shiftCooldown<=0?100:Math.round((1-gs.shiftCooldown/gs.SHIFT_CD)*100);
  fill.style.width=pct+'%';
  fill.style.background='';
  fill.style.boxShadow='';
  if(pct>=100){bar.classList.add('ready');}else{bar.classList.remove('ready');}
}

// ============ PLAYER MOVEMENT ============
function movePlayer(dt){
  const gs=gameState;const k=gs.keys;
  // Normalise to 60fps so speed is consistent regardless of frame timing
  const scale=dt/16.667;
  let dx=0,dy=0;
  if(k['ArrowLeft']||k['a']||k['A'])dx-=SPD;
  if(k['ArrowRight']||k['d']||k['D'])dx+=SPD;
  if(k['ArrowUp']||k['w']||k['W'])dy-=SPD;
  if(k['ArrowDown']||k['s']||k['S'])dy+=SPD;
  dx*=scale;dy*=scale;
  gs.moving=(dx!==0||dy!==0);
  gs.px=Math.max(0,Math.min(ARENA-PS,gs.px+dx));
  gs.py=Math.max(0,Math.min(ARENA-PS,gs.py+dy));
  if(gs.moving&&save.selectedParticle!=='none')spawnParticle(gs.px+PS/2,gs.py+PS/2);
  if(['trails','trail2','trail3','trail4'].includes(save.selectedParticle)&&gs.moving){
    if(!gs.trailDist)gs.trailDist=0;
    gs.trailDist+=Math.hypot(dx,dy);
    if(gs.trailDist>=4){
      gs.trailDist=0;
      gs.trailPts.push({x:gs.px+PS/2,y:gs.py+PS/2,age:0});
      if(gs.trailPts.length>80)gs.trailPts.shift();
    }
  }
  if(!gs.moving){gs.trailPts=[];gs.trailDist=0;}
}

// ============ DAMAGE ============
function takeDamage(){
  const gs=gameState;
  if(gs.invincible||gs.shiftActive||gs.phase!=='playing')return;
  gs.hearts--;gs.invincible=true;gs.invTimer=1500;
  if(decathlonState){
    decathlonState.hearts=gs.hearts;
    decathlonState.startedPerfect=false; // took a hit — no longer perfect
  }
  updateHeartsDisplay(gs.hearts);
  triggerScreenFlash();
  if(gs.hearts<=0)triggerDeath();
}
function triggerScreenFlash(){
  const el=document.getElementById('screenFlash');
  el.style.opacity='1';setTimeout(()=>el.style.opacity='0',150);
}
function triggerDeath(){
  const gs=gameState;gs.phase='dead';
  if(decathlonState){decathlonState.startedPerfect=false;}
  fadeOutLevelMusic(()=>playDeathSound());
  setTimeout(()=>{
    document.getElementById('deathOverlay').classList.add('visible');
    ensureTitleMusic();
    decathlonState=null; // end decathlon run on death
  },900);
}
function triggerWin(){
  const gs=gameState;if(gs.won)return;
  if(gs.decathlon){decathlonNextStage();return;} // decathlon handles its own win flow
  gs.won=true;gs.phase='won';
  gs.attacks=[];gs.projectiles=[];gs.explosions=[];gs.boulders=[];gs.gridLines=[];
  playWinSound();
  const base=15+(gs.lvl-1)*5;
  let earned=gs.hearts===3?base:gs.hearts===2?base-5:base-10;
  earned=Math.max(0,earned);
  save.shards+=earned;save.totalShards+=earned;
  const prev=save.bestHearts[gs.lvl];
  if(prev===undefined||gs.hearts>prev)save.bestHearts[gs.lvl]=gs.hearts;
  if(gs.lvl<10&&!save.unlockedLevels.includes(gs.lvl+1))save.unlockedLevels.push(gs.lvl+1);
  writeSave();
  document.getElementById('shardsEarned').textContent=`+${earned} SHARDS EARNED`;
  const musicPctVal=levelMusic&&levelMusic.duration?((levelMusic.currentTime/levelMusic.duration)*100).toFixed(1):'100.0';
  document.getElementById('winSub').textContent=`Hearts remaining: ${'❤️'.repeat(gs.hearts)} — ${musicPctVal}% survived`;
  document.getElementById('btnNextLevel').style.display=gs.lvl<10?'':'none';
  setTimeout(()=>{
    document.getElementById('winOverlay').classList.add('visible');
    ensureTitleMusic();
  },500);
}

// ============ ATTACK SPAWNING ============
// Each tick: random interval 0.5–2s between attempts.
// Spawn chance: level 1 = 30%, level 2 = 35%, ... level 15+ = 100%
function spawnAttacks(dt){
  const gs=gameState,lvl=gs.lvl;

  // Spinning laser angle always updates (lvl 4+) — passive, always on
  // Each level after 3 adds 5% speed: lvl4=base, lvl5=+5%, lvl6=+10% etc.
  if(lvl>=4){
    const spinSpeedMult=1+Math.max(0,(lvl-3))*0.05;
    gs.spinAngle=(gs.spinAngle+dt*0.0008*spinSpeedMult)%(Math.PI*2);
  }

  // Spin laser has its own warn/fire cycle (lvl 4+)
  if(lvl>=4){
    if(!gs.spinLaser)gs.spinLaser={phase:'warning',timer:0,warnDur:2000,fireDur:3000};
    const sl=gs.spinLaser;
    sl.timer+=dt;
    if(sl.phase==='warning'&&sl.timer>=sl.warnDur){sl.phase='fire';sl.timer=0;}
    if(sl.phase==='fire'&&sl.timer>=sl.fireDur){sl.phase='warning';sl.timer=0;}
  }

  // Random-interval attack pool
  if(!gs.poolTimer)gs.poolTimer=0;
  if(!gs.poolInterval)gs.poolInterval=500+Math.random()*1500; // 0.5–2s
  gs.poolTimer+=dt;
  if(gs.poolTimer>=gs.poolInterval){
    gs.poolTimer=0;
    gs.poolInterval=500+Math.random()*1500; // pick next interval
    const spawnChance=Math.min(1.0,0.25+lvl*0.05); // lvl1=30%, lvl2=35%...lvl15=100%
    if(Math.random()<spawnChance){
      spawnRandomAttack(lvl);
    }
  }
}

function spawnRandomAttack(lvl){
  const pool=[];
  pool.push('beam','beam','beam');
  if(lvl>=2)pool.push('bars','bars');
  if(lvl>=3)pool.push('half','half');
  if(lvl>=5)pool.push('fall','fall');
  if(lvl>=6)pool.push('explode');
  if(lvl>=7)pool.push('grid');
  if(lvl>=8)pool.push('boulder','boulder');
  if(lvl>=9)pool.push('diag','diag');
  if(lvl>=10)pool.push('moving','moving');

  const pick=pool[Math.floor(Math.random()*pool.length)];
  if(pick==='beam')spawnBeam();
  else if(pick==='bars')spawnPrisonBars();
  else if(pick==='half')spawnHalfScreen();
  else if(pick==='fall')spawnFallingCircle();
  else if(pick==='explode')spawnExplosion();
  else if(pick==='grid')spawnGrid();
  else if(pick==='boulder')spawnBoulder();
  else if(pick==='diag')spawnDiagLaser();
  else if(pick==='moving')spawnMovingLaser();
}

function spawnBeam(){
  const gs=gameState,lvl=gs.lvl;
  const thick=Math.min(60,18+(lvl-1)*3);
  const warnDur=Math.max(800,2000-(lvl-1)*100);
  const type=Math.random()<0.5?'hline':'vline';
  const atk={type,phase:'warning',timer:0,warnDur,fireDur:500,thick};
  if(type==='hline'){atk.y=Math.random()*(ARENA-thick);atk.x=0;atk.w=ARENA;atk.h=thick;}
  else{atk.x=Math.random()*(ARENA-thick);atk.y=0;atk.w=thick;atk.h=ARENA;}
  gs.attacks.push(atk);
}

function spawnPrisonBars(){
  const gs=gameState,lvl=gs.lvl;
  const thick=Math.min(30,12+(lvl-2)*2);
  const gap=Math.max(30,60-(lvl-2)*3);
  const warnDur=Math.max(700,1800-(lvl-2)*80);
  const horiz=Math.random()<0.5;
  const bars=[];
  // Random offset so bars aren't always at the same position
  const offset=Math.floor(Math.random()*(gap+thick));
  if(horiz){
    for(let y=-offset;y<ARENA;y+=gap+thick){
      if(y+thick<0||y>ARENA)continue;
      bars.push({type:'hline',x:0,y,w:ARENA,h:thick,phase:'warning',timer:0,warnDur,fireDur:500,thick,group:true});
    }
  } else {
    for(let x=-offset;x<ARENA;x+=gap+thick){
      if(x+thick<0||x>ARENA)continue;
      bars.push({type:'vline',x,y:0,w:thick,h:ARENA,phase:'warning',timer:0,warnDur,fireDur:500,thick,group:true});
    }
  }
  bars.forEach(b=>gs.attacks.push(b));
}

function spawnHalfScreen(){

  // Quarter screen — pick one of 4 quadrants
  const quad=Math.floor(Math.random()*4);

  else if(quad===1){atk.x=ARENA/2;atk.y=0;    atk.w=ARENA/2;atk.h=ARENA/2;} // top-right
  else if(quad===2){atk.x=0;  atk.y=ARENA/2;  atk.w=ARENA/2;atk.h=ARENA/2;} // bottom-left
  else{atk.x=ARENA/2;         atk.y=ARENA/2;  atk.w=ARENA/2;atk.h=ARENA/2;} // bottom-right
  gs.attacks.push(atk);
}

function spawnFallingCircle(){
  const gs=gameState,lvl=gs.lvl;
  const r=Math.min(80,28+(lvl-5)*5);
  const warnDur=Math.max(800,2000-(lvl-5)*100);
  // Snapshot player position NOW — ball will fall toward where player was when spawned
  const targetX=gs.px+PS/2;
  const targetY=gs.py+PS/2;
  const spd=3+(lvl-5)*0.4;
  // Pick a random incoming direction (top, bottom, left, right)
  const dir=Math.floor(Math.random()*4);
  let sx,sy,vx=0,vy=0;
  if(dir===0){sx=targetX;sy=-r;vy=spd;}            // from top → fall down
  else if(dir===1){sx=targetX;sy=ARENA+r;vy=-spd;} // from bottom → rise up
  else if(dir===2){sx=-r;sy=targetY;vx=spd;}        // from left → go right
  else{sx=ARENA+r;sy=targetY;vx=-spd;}              // from right → go left
  gs.projectiles.push({x:sx,y:sy,vx,vy,r,phase:'falling',warnDur,warnTimer:warnDur,targetX,targetY,active:true});
}

// ============ UPDATE ATTACKS ============
function updateAttacks(dt){
  const gs=gameState;
  gs.attacks=gs.attacks.filter(atk=>{
    atk.timer+=dt;
    if(atk.type==='moving'&&atk.phase==='fire'){
      const spd=0.15;
      atk.pos=Math.min(ARENA,atk.pos+spd*dt);
    }
    if(atk.phase==='warning'&&atk.timer>=atk.warnDur){atk.phase='fire';atk.timer=0;}
    if(atk.phase==='fire'&&atk.timer>=atk.fireDur)return false;
    return true;
  });
}

function updateProjectiles(dt){
  const gs=gameState;
  gs.projectiles=gs.projectiles.filter(p=>{
    if(p.warnTimer>0){
      p.warnTimer-=dt;
      // Do NOT update target — position was snapshotted at spawn time
      return true;
    }
    // Move straight with fixed velocity (no homing)
    p.x+=(p.vx||0);
    p.y+=(p.vy||0);
    return p.x+p.r>0&&p.x-p.r<ARENA&&p.y+p.r>0&&p.y-p.r<ARENA;
  });
}

function updateExplosions(dt){
  const gs=gameState;
  gs.explosions=gs.explosions.filter(e=>{
    e.timer+=dt;
    if(e.phase==='warning'&&e.timer>=e.warnDur){e.phase='fire';e.timer=0;}
    if(e.phase==='fire'&&e.timer>=e.fireDur)return false;
    return true;
  });
}

function updateBoulders(dt){
  const gs=gameState;
  gs.boulders=gs.boulders.filter(b=>{
    if(b.warnTimer>0){b.warnTimer-=dt;return true;}
    b.y+=b.vy;
    return b.y+b.r>0;
  });
}

// ============ COLLISION ============
function checkCollisions(){
  const gs=gameState;
  if(gs.invincible||gs.shiftActive)return;
  const px=gs.px,py=gs.py,pw=PS,ph=PS;
  // Attacks
  for(const atk of gs.attacks){
    if(atk.phase!=='fire')continue;
    let ax=atk.x,ay=atk.y,aw=atk.w,ah=atk.h;
    if(atk.type==='moving'){
      if(atk.dir===0){ay=atk.pos;ax=0;aw=ARENA;ah=atk.thick;}
      else if(atk.dir===1){ax=ARENA-atk.pos;ay=0;aw=atk.thick;ah=ARENA;}
      else if(atk.dir===2){ay=ARENA-atk.pos;ax=0;aw=ARENA;ah=atk.thick;}
      else{ax=atk.pos;ay=0;aw=atk.thick;ah=ARENA;}
    }
    if(atk.type==='diag'){
      if(diagHitsPlayer(atk,px,py,pw,ph)){takeDamage();return;}
      continue;
    }
    if(atk.type==='spin'){
      if(spinHitsPlayer(atk,px,py,pw,ph)){takeDamage();return;}
      continue;
    }
    if(rectOverlap(px,py,pw,ph,ax,ay,aw,ah)){takeDamage();return;}
  }
  // Projectiles
  for(const p of gs.projectiles){
    if(p.warnTimer>0)continue;
    if(circleRectOverlap(p.x,p.y,p.r,px,py,pw,ph)){takeDamage();return;}
  }
  // Explosions
  for(const e of gs.explosions){
    if(e.phase!=='fire')continue;
    if(circleRectOverlap(e.x,e.y,e.r,px,py,pw,ph)){takeDamage();return;}
  }
  // Boulders
  for(const b of gs.boulders){
    if(b.warnTimer>0)continue;
    if(circleRectOverlap(b.x,b.y,b.r,px,py,pw,ph)){takeDamage();return;}
  }
  // Spin laser
  if(checkSpinLaserCollision()){takeDamage();return;}
}

function rectOverlap(ax,ay,aw,ah,bx,by,bw,bh){
  return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;
}
function circleRectOverlap(cx,cy,cr,rx,ry,rw,rh){
  const nx=Math.max(rx,Math.min(cx,rx+rw));
  const ny=Math.max(ry,Math.min(cy,ry+rh));
  return (cx-nx)**2+(cy-ny)**2<cr*cr;
}
function diagHitsPlayer(atk,px,py,pw,ph){
  const thick=atk.thick;
  const pts=[[px,py],[px+pw,py],[px,py+ph],[px+pw,py+ph]];
  for(const [x,y] of pts){
    let d;
    if(atk.diag===0)d=Math.abs(y-x)/Math.SQRT2;
    else d=Math.abs(y-(ARENA-x))/Math.SQRT2;
    if(d<thick/2)return true;
  }
  return false;
}
function spinHitsPlayer(atk,px,py,pw,ph){return false;}

// ============ SPIN LASER COLLISION ============
function checkSpinLaserCollision(){
  const gs=gameState;
  if(!gs.spinLaser||gs.spinLaser.phase!=='fire')return false;
  const cx=ARENA/2,cy=ARENA/2;
  const px=gs.px+PS/2,py=gs.py+PS/2;
  const thick=14/2+2;
  // Build list of angles to check: base laser + perpendicular if lvl 7+
  const angles=[gs.spinAngle];
  if(gs.lvl>=7)angles.push(gs.spinAngle+Math.PI/2);
  for(const baseAngle of angles){
    for(let i=0;i<2;i++){
      const a=baseAngle+i*Math.PI;
      const dx=Math.cos(a),dy=Math.sin(a);
      const t=(px-cx)*dx+(py-cy)*dy;
      if(t<0)continue;
      const closestX=cx+dx*t,closestY=cy+dy*t;
      const dist=Math.hypot(px-closestX,py-closestY);
      if(dist<thick)return true;
    }
  }
  return false;
}

// ============ RENDER ============
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');

function render(){
  const gs=gameState;
  ctx.clearRect(0,0,ARENA,ARENA);

  // Break screen for decathlon
  if(gs.phase==='break'){
    ctx.fillStyle='#0a0010';
    ctx.fillRect(0,0,ARENA,ARENA);
    ctx.save();
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font='bold 14px "Press Start 2P",monospace';
    ctx.fillStyle='#ffd700';
    ctx.shadowColor='#ffd700';ctx.shadowBlur=20;
    ctx.fillText('BREAK TIME',ARENA/2,ARENA/2-40);
    ctx.shadowBlur=0;
    ctx.font='bold 9px "Press Start 2P",monospace';
    ctx.fillStyle='rgba(255,255,255,0.7)';
    if(decathlonState){
      ctx.fillText(`LEVEL ${decathlonState.currentStage} COMING UP`,ARENA/2,ARENA/2);
      const sec=Math.ceil(decathlonState.breakTimer/1000);
      ctx.font='bold 28px "Press Start 2P",monospace';
      ctx.fillStyle='#fff';ctx.shadowColor='#fff';ctx.shadowBlur=16;
      ctx.fillText(sec,ARENA/2,ARENA/2+50);
      ctx.shadowBlur=0;
    }
    // Hearts
    ctx.font='20px serif';
    const maxH=6;const hearts=gs.hearts||decathlonState?.hearts||6;
    let hStr='';for(let i=0;i<maxH;i++)hStr+=i<hearts?'❤️':'🖤';
    ctx.font='16px serif';ctx.fillStyle='#fff';
    ctx.fillText(hStr,ARENA/2,ARENA/2+100);
    ctx.restore();
    return;
  }
  // White arena background
  ctx.fillStyle='#ffffff';
  ctx.fillRect(0,0,ARENA,ARENA);

  // Draw spinning laser (lvl 4+)
  if(gs.lvl>=4&&gs.spinLaser){
    drawSpinLaser(gs.spinAngle,gs.spinLaser);
    // Second perpendicular laser (lvl 7+) — offset 90°
    if(gs.lvl>=7){
      drawSpinLaser(gs.spinAngle+Math.PI/2,gs.spinLaser);
    }
  }

  // Draw attacks
  for(const atk of gs.attacks){
    drawAttack(atk);
  }

  // Draw explosions
  for(const e of gs.explosions){
    drawExplosion(e);
  }

  // Draw projectiles (falling circles)
  for(const p of gs.projectiles){
    drawProjectile(p);
  }

  // Draw boulders
  for(const b of gs.boulders){
    drawBoulder(b);
  }

  // Draw trail — tiny pixels left along the walked path
  if(save.selectedParticle==='trails'&&gs.trailPts.length>0){
    ctx.save();
    for(const t of gs.trailPts){
      const alpha=(1-(t.age/500))*0.7;
      ctx.globalAlpha=alpha;
      ctx.fillStyle=getPlayerColor();
      ctx.fillRect(t.x-1,t.y-1,2,2);
    }
    ctx.globalAlpha=1;ctx.restore();
  }
  if(save.selectedParticle==='trail2'&&gs.trailPts.length>0){
    ctx.save();
    for(const t of gs.trailPts){
      const alpha=(1-(t.age/800))*0.85;
      ctx.globalAlpha=alpha;
      ctx.shadowColor=getPlayerColor();ctx.shadowBlur=4;
      ctx.fillStyle=getPlayerColor();
      ctx.fillRect(t.x-2,t.y-2,3,3);
    }
    ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.restore();
  }
  if(save.selectedParticle==='trail3'&&gs.trailPts.length>0){
    ctx.save();
    for(const t of gs.trailPts){
      const alpha=(1-(t.age/700))*0.9;
      const hue=30+Math.sin(t.age*0.01)*20;
      ctx.globalAlpha=alpha;
      ctx.fillStyle=`hsl(${hue},100%,60%)`;
      const sz=Math.max(1,3*(1-t.age/700));
      ctx.fillRect(t.x-sz/2,t.y-sz/2,sz,sz);
    }
    ctx.globalAlpha=1;ctx.restore();
  }
  if(save.selectedParticle==='trail4'&&gs.trailPts.length>0){
    ctx.save();
    let hIdx=0;
    for(const t of gs.trailPts){
      const alpha=(1-(t.age/900))*0.9;
      const hue=(hIdx*18+Date.now()*0.05)%360;
      ctx.globalAlpha=alpha;
      ctx.shadowColor=`hsl(${hue},100%,60%)`;ctx.shadowBlur=6;
      ctx.fillStyle=`hsl(${hue},100%,65%)`;
      const sz=Math.max(1,4*(1-t.age/900));
      ctx.fillRect(t.x-sz/2,t.y-sz/2,sz,sz);
      hIdx++;
    }
    ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.restore();
  }

  // Draw particles
  for(const p of gs.particles){
    ctx.save();ctx.globalAlpha=p.life;
    if(p.type==='spark'){ctx.fillStyle='#ffcc44';ctx.fillRect(p.x-2,p.y-2,4,4);}
    else if(p.type==='star'){ctx.fillStyle='#ffffff';ctx.font='10px serif';ctx.fillText('*',p.x,p.y);}
    ctx.restore();
  }

  // Draw player
  const col=getPlayerColor();
  const blink=gs.invincible&&Math.floor(Date.now()/100)%2===0;
  if(!blink){
    ctx.fillStyle=col;
    ctx.fillRect(gs.px,gs.py,PS,PS);
    ctx.strokeStyle='#000000';
    ctx.lineWidth=2;
    ctx.strokeRect(gs.px,gs.py,PS,PS);
    // Shift glow
    if(gs.shiftActive){
      ctx.save();ctx.shadowColor='#44ffaa';ctx.shadowBlur=16;
      ctx.strokeStyle='#44ffaa';ctx.lineWidth=2;ctx.strokeRect(gs.px-2,gs.py-2,PS+4,PS+4);
      ctx.restore();
    }
  }

  // Draw attack timers on canvas
  for(const atk of gs.attacks){
    if(atk.phase==='warning')drawAttackTimer(atk);
  }
  for(const e of gs.explosions){
    if(e.phase==='warning')drawExplosionTimer(e);
  }
  // Spin laser timer is drawn inside drawSpinLaser itself
}

function drawAttack(atk){
  const t=atk.timer;
  let ax=atk.x,ay=atk.y,aw=atk.w,ah=atk.h;
  if(atk.type==='moving'){
    if(atk.phase==='warning'){
      // Show where it will be
      if(atk.dir===0){ay=0;ax=0;aw=ARENA;ah=atk.thick;}
      else if(atk.dir===1){ax=ARENA-atk.thick;ay=0;aw=atk.thick;ah=ARENA;}
      else if(atk.dir===2){ay=ARENA-atk.thick;ax=0;aw=ARENA;ah=atk.thick;}
      else{ax=0;ay=0;aw=atk.thick;ah=ARENA;}
    } else {
      if(atk.dir===0){ay=atk.pos;ax=0;aw=ARENA;ah=atk.thick;}
      else if(atk.dir===1){ax=ARENA-atk.pos;ay=0;aw=atk.thick;ah=ARENA;}
      else if(atk.dir===2){ay=ARENA-atk.pos;ax=0;aw=ARENA;ah=atk.thick;}
      else{ax=atk.pos;ay=0;aw=atk.thick;ah=ARENA;}
    }
  }
  if(atk.type==='diag'){drawDiagLaser(atk);return;}
  if(atk.phase==='warning'){
    const prog=t/atk.warnDur;
    ctx.fillStyle=`rgba(255,40,40,${0.15+prog*0.25})`;
    ctx.fillRect(ax,ay,aw,ah);
    ctx.strokeStyle=`rgba(255,80,80,${0.4+prog*0.4})`;
    ctx.lineWidth=1;ctx.strokeRect(ax,ay,aw,ah);
  } else {
    ctx.fillStyle='rgba(255,30,30,0.92)';
    ctx.fillRect(ax,ay,aw,ah);
    ctx.shadowColor='#ff0000';ctx.shadowBlur=12;
    ctx.fillStyle='rgba(255,120,120,0.5)';
    ctx.fillRect(ax,ay,aw,ah);
    ctx.shadowBlur=0;
  }
}

function drawDiagLaser(atk){
  ctx.save();
  const prog=atk.phase==='warning'?atk.timer/atk.warnDur:1;
  if(atk.phase==='warning'){
    ctx.strokeStyle=`rgba(255,40,40,${0.2+prog*0.4})`;
    ctx.lineWidth=atk.thick;
  } else {
    ctx.strokeStyle='rgba(255,30,30,0.92)';
    ctx.lineWidth=atk.thick;
    ctx.shadowColor='#ff0000';ctx.shadowBlur=10;
  }
  ctx.beginPath();
  if(atk.diag===0){ctx.moveTo(0,0);ctx.lineTo(ARENA,ARENA);}
  else{ctx.moveTo(ARENA,0);ctx.lineTo(0,ARENA);}
  ctx.stroke();ctx.restore();
}

function drawSpinLaser(angle,sl){
  if(!sl)return;
  const cx=ARENA/2,cy=ARENA/2;
  const len=ARENA*1.5;
  ctx.save();
  if(sl.phase==='warning'){
    const prog=sl.timer/sl.warnDur;
    const remaining=(sl.warnDur-sl.timer)/1000;
    ctx.strokeStyle=`rgba(255,40,40,${0.12+prog*0.25})`;
    ctx.lineWidth=14;
    for(let i=0;i<2;i++){
      const a=angle+i*Math.PI;
      ctx.beginPath();ctx.moveTo(cx,cy);
      ctx.lineTo(cx+Math.cos(a)*len,cy+Math.sin(a)*len);
      ctx.stroke();
    }
    // Timer label
    ctx.font='bold 9px "Press Start 2P",monospace';
    ctx.textAlign='center';ctx.textBaseline='middle';
    const label=remaining.toFixed(1)+'s';
    const w=ctx.measureText(label).width+10;
    ctx.fillStyle='rgba(0,0,0,0.72)';ctx.fillRect(cx-w/2,cy-10,w,20);
    ctx.fillStyle='#ff8888';ctx.fillText(label,cx,cy);
  } else {
    // Firing — solid red, full opacity
    ctx.strokeStyle='rgba(255,30,30,0.92)';
    ctx.lineWidth=14;
    ctx.shadowColor='#ff0000';ctx.shadowBlur=12;
    for(let i=0;i<2;i++){
      const a=angle+i*Math.PI;
      ctx.beginPath();ctx.moveTo(cx,cy);
      ctx.lineTo(cx+Math.cos(a)*len,cy+Math.sin(a)*len);
      ctx.stroke();
    }
  }
  ctx.restore();
}

function drawExplosion(e){
  ctx.save();
  if(e.phase==='warning'){
    const prog=e.timer/e.warnDur;
    ctx.strokeStyle=`rgba(255,80,0,${0.3+prog*0.5})`;
    ctx.lineWidth=2+prog*2;
    ctx.setLineDash([6,4]);
    ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.stroke();
    ctx.setLineDash([]);
    // Pulsing inner
    ctx.fillStyle=`rgba(255,80,0,${0.05+prog*0.1})`;
    ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();
  } else {
    const prog=e.timer/e.fireDur;
    ctx.fillStyle=`rgba(255,40,0,${0.9-prog*0.8})`;
    ctx.shadowColor='#ff4400';ctx.shadowBlur=20;
    ctx.beginPath();ctx.arc(e.x,e.y,e.r*(0.5+prog*0.5),0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

function drawProjectile(p){
  ctx.save();
  if(p.warnTimer>0){
    // Show target circle at landing position (tracks player)
    const tx=p.targetX||p.x,ty=p.targetY||p.y;
    const prog=1-(p.warnTimer/(p.warnTimer+(p.warnDur-p.warnTimer)));
    ctx.strokeStyle='rgba(255,60,60,0.8)';ctx.lineWidth=2;
    // Outer ring showing impact radius
    ctx.setLineDash([5,4]);
    ctx.beginPath();ctx.arc(tx,ty,p.r,0,Math.PI*2);ctx.stroke();
    ctx.setLineDash([]);
    // X crosshair at center
    const cs=10;
    ctx.lineWidth=2;ctx.strokeStyle='rgba(255,80,80,0.9)';
    ctx.beginPath();ctx.moveTo(tx-cs,ty-cs);ctx.lineTo(tx+cs,ty+cs);ctx.stroke();
    ctx.beginPath();ctx.moveTo(tx+cs,ty-cs);ctx.lineTo(tx-cs,ty+cs);ctx.stroke();
  } else {
    ctx.fillStyle='rgba(255,40,40,0.92)';
    ctx.shadowColor='#ff0000';ctx.shadowBlur=12;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

function drawBoulder(b){
  ctx.save();
  if(b.warnTimer>0){
    ctx.strokeStyle='rgba(255,60,60,0.8)';ctx.lineWidth=2;
    // Arrow pointing up from bottom edge
    ctx.beginPath();ctx.moveTo(b.x-10,ARENA-6);ctx.lineTo(b.x+10,ARENA-6);ctx.stroke();
    ctx.beginPath();ctx.moveTo(b.x,ARENA-16);ctx.lineTo(b.x,ARENA-2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(b.x-6,ARENA-12);ctx.lineTo(b.x,ARENA-18);ctx.lineTo(b.x+6,ARENA-12);ctx.stroke();
  } else {
    // Red boulder
    ctx.fillStyle='#dd2222';
    ctx.shadowColor='#ff0000';ctx.shadowBlur=10;
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#880000';ctx.lineWidth=2;ctx.stroke();
    // Crack detail
    ctx.shadowBlur=0;ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(b.x-b.r*0.3,b.y-b.r*0.4);ctx.lineTo(b.x+b.r*0.1,b.y+b.r*0.2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(b.x+b.r*0.2,b.y-b.r*0.3);ctx.lineTo(b.x-b.r*0.1,b.y+b.r*0.3);ctx.stroke();
  }
  ctx.restore();
}

function drawAttackTimer(atk){
  const remaining=(atk.warnDur-atk.timer)/1000;
  if(remaining<=0)return;
  let tx,ty;
  if(atk.type==='hline'){tx=ARENA/2;ty=atk.y+atk.h/2;}
  else if(atk.type==='vline'){tx=atk.x+atk.w/2;ty=ARENA/2;}
  else if(atk.type==='half'){tx=atk.x+atk.w/2;ty=atk.y+atk.h/2;}
  else if(atk.type==='diag'){tx=ARENA/2;ty=ARENA/2;}
  else if(atk.type==='moving'){tx=ARENA/2;ty=ARENA/2;}
  else return;
  ctx.save();
  ctx.font='bold 9px "Press Start 2P",monospace';
  ctx.textAlign='center';ctx.textBaseline='middle';
  const label=remaining.toFixed(1)+'s';
  const w=ctx.measureText(label).width+10;
  ctx.fillStyle='rgba(0,0,0,0.72)';
  ctx.fillRect(tx-w/2,ty-10,w,20);
  ctx.fillStyle='#ffffff';
  ctx.fillText(label,tx,ty);
  ctx.restore();
}

function drawExplosionTimer(e){
  const remaining=(e.warnDur-e.timer)/1000;
  if(remaining<=0)return;
  ctx.save();
  ctx.font='bold 9px "Press Start 2P",monospace';
  ctx.textAlign='center';ctx.textBaseline='middle';
  const label=remaining.toFixed(1)+'s';
  const w=ctx.measureText(label).width+10;
  ctx.fillStyle='rgba(0,0,0,0.72)';
  ctx.fillRect(e.x-w/2,e.y-10,w,20);
  ctx.fillStyle='#ffaa44';
  ctx.fillText(label,e.x,e.y);
  ctx.restore();
}

// ============ EVENT LISTENERS ============
document.addEventListener('keydown',e=>{
  if(gameState)gameState.keys[e.key]=true;
  if(gameState&&(e.key===' '||e.key==='Spacebar')&&gameState.phase==='playing'){
    const gs=gameState;
    if(!gs.shiftActive&&gs.shiftCooldown<=0){
      gs.shiftActive=true;gs.shiftTimer=gs.SHIFT_DUR;gs.invincible=true;gs.invTimer=gs.SHIFT_DUR+100;
    }
  }
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
});
document.addEventListener('keyup',e=>{if(gameState)gameState.keys[e.key]=false;});

// ============ BUTTON WIRING ============
document.getElementById('btnPlay').addEventListener('click',()=>{
  if(gameInProgress&&gameState&&gameState.phase!=='dead'&&gameState.phase!=='won'){
    wipeTransition(()=>{showScreen('game');});
  } else {
    wipeTransition(()=>{renderLevelSelect();showScreen('levelSelect');});
  }
});
document.getElementById('btnCosmetics').addEventListener('click',()=>{
  wipeTransition(()=>{renderCosmetics();showScreen('cosmetics');});
});
document.getElementById('btnRestart').addEventListener('click',()=>{
  document.getElementById('confirmModal').classList.add('open');
});
document.getElementById('confirmYes').addEventListener('click',()=>{
  save=JSON.parse(JSON.stringify(DEFAULT_SAVE));writeSave();
  gameInProgress=false;gameState=null;
  document.getElementById('confirmModal').classList.remove('open');
  updateTitleButtons();
  flashMessage('Save reset!');
});
document.getElementById('confirmNo').addEventListener('click',()=>{
  document.getElementById('confirmModal').classList.remove('open');
});
document.getElementById('btnCosmeticsBack').addEventListener('click',()=>{
  wipeTransition(()=>{updateTitleBg();showScreen('title');updateTitleButtons();});
});
document.getElementById('btnLevelSelectBack').addEventListener('click',()=>{
  wipeTransition(()=>{updateTitleBg();showScreen('title');updateTitleButtons();});
});
document.getElementById('btnDecathlon').addEventListener('click',()=>{
  wipeTransition(()=>startLevel(11));
});
document.getElementById('btnLeaveLevel').addEventListener('click',()=>{
  if(!gameState)return;
  gameState.phase='dead'; // stop the loop
  gameState.keys={};      // clear all held keys
  hideCountdown();        // dismiss any active countdown
  stopLevelMusic();
  gameInProgress=false;
  decathlonState=null;    // cancel any active decathlon
  gameState=null;         // null BEFORE ensureTitleMusic so guard doesn't block it
  hideAllOverlays();
  wipeTransition(()=>{
    renderLevelSelect();
    showScreen('levelSelect');
    ensureTitleMusic();
  });
});
document.getElementById('btnRestartLevel').addEventListener('click',()=>{
  hideAllOverlays();
  wipeTransition(()=>startLevel(currentLevel));
});
document.getElementById('btnDeathMenu').addEventListener('click',()=>{
  gameInProgress=false;gameState=null;
  goToTitle();
});
document.getElementById('btnNextLevel').addEventListener('click',()=>{
  hideAllOverlays();
  wipeTransition(()=>startLevel(currentLevel+1));
});
document.getElementById('btnRestartWin').addEventListener('click',()=>{
  hideAllOverlays();
  wipeTransition(()=>startLevel(currentLevel));
});
document.getElementById('btnWinMenu').addEventListener('click',()=>{
  gameInProgress=false;gameState=null;
  goToTitle();
});

// ============ INIT ============
loadSave();
updateTitleBg();
showScreen('title');
updateTitleButtons();
// Start title music on first user interaction (only if not in a level)
document.addEventListener('click',()=>{if(!gameState)ensureTitleMusic();},{once:true});
document.addEventListener('keydown',()=>{if(!gameState)ensureTitleMusic();},{once:true});
</script>
