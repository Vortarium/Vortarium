<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAGEBAIT 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #080810;
  font-family: 'Press Start 2P', monospace;
  overflow: hidden;
  width: 100vw; height: 100vh;
  display: flex; align-items: center; justify-content: center;
}
.screen {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  display: none;
  align-items: center; justify-content: center;
  flex-direction: column;
}
.screen.active { display: flex; }

/* ===== MENU ===== */
#screen-menu { background: none; }
#menu-bg {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  object-fit: cover; image-rendering: pixelated; z-index: 0;
}
#menu-content {
  position: relative; z-index: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 18px;
  background: rgba(0,0,0,0.35);
  padding: 40px 60px;
}
#menu-title { text-align: center; line-height: 1.3; margin-bottom: 24px; }
#menu-title .t1 {
  display: block; font-size: 52px; color: #fff;
  text-shadow: 4px 4px 0 #000, 3px 3px 0 #222, 2px 2px 0 #333, -1px -1px 0 #555, 6px 6px 0 #000, 8px 8px 0 rgba(0,0,0,0.4);
  letter-spacing: 4px;
}
#menu-title .t2 {
  display: block; font-size: 80px; color: #ffcc00;
  text-shadow: 4px 4px 0 #000, 3px 3px 0 #aa6600, 2px 2px 0 #cc8800, 6px 6px 0 #000, 8px 8px 0 rgba(0,0,0,0.5);
  letter-spacing: 8px;
}

/* ===== BUTTONS ===== */
.btn {
  font-family: 'Press Start 2P', monospace; font-size: 13px; color: #eeeeff;
  background: #1a1a2e; border: 2px solid #4455aa; padding: 12px 28px; cursor: pointer;
  box-shadow: 0 4px 0 #000, inset 0 1px 0 rgba(255,255,255,0.1);
  transition: transform 0.05s, box-shadow 0.05s; min-width: 180px; text-align: center;
  border-radius: 0; outline: none; letter-spacing: 1px;
}
.btn:hover { background: #2a2a4e; transform: translateY(-2px); box-shadow: 0 6px 0 #000, inset 0 1px 0 rgba(255,255,255,0.15); }
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #000, inset 0 1px 0 rgba(255,255,255,0.05); }
.btn-sm { font-size: 10px; padding: 8px 16px; min-width: 100px; }
.btn-back { font-size: 10px; padding: 8px 14px; min-width: 80px; background: #111122; border-color: #334466; }
.btn-danger { border-color: #aa2233; color: #ff6677; }
.btn-danger:hover { background: #2e1a1a; }
.btn-gold { border-color: #aa8800; color: #ffcc00; }
.btn-green { border-color: #008844; color: #00ff88; }

/* ===== LEVEL SELECT ===== */
#screen-levelselect { background: #080810; flex-direction: column; }
#ls-header { width: 100%; display: flex; align-items: center; padding: 18px 24px; position: relative; }
#ls-title { position: absolute; left: 50%; transform: translateX(-50%); font-size: 16px; color: #eeeeff; text-shadow: 2px 2px 0 #000; }
#ls-stars-display { margin-left: auto; font-size: 12px; color: #ffcc00; }
#ls-body { flex: 1; display: flex; align-items: center; justify-content: center; gap: 24px; width: 100%; }
.ls-arrow {
  font-size: 28px; background: none; border: 2px solid #334466; color: #eeeeff;
  padding: 12px 18px; cursor: pointer; font-family: 'Press Start 2P', monospace;
  box-shadow: 0 4px 0 #000; transition: transform 0.05s, box-shadow 0.05s;
}
.ls-arrow:hover { transform: translateY(-2px); box-shadow: 0 6px 0 #000; background: #1a1a2e; }
.ls-arrow:active { transform: translateY(2px); box-shadow: 0 2px 0 #000; }
#ls-card {
  background: #111122; border: 2px solid #334466;
  box-shadow: 0 8px 0 #000, inset 0 1px 0 rgba(255,255,255,0.05);
  padding: 28px 36px; min-width: 340px; display: flex; flex-direction: column; align-items: center; gap: 14px;
}
#ls-level-num { font-size: 10px; color: #667788; }
#ls-level-name { font-size: 15px; color: #eeeeff; text-align: center; }
#ls-difficulty { font-size: 10px; }
#ls-stats { font-size: 9px; color: #667788; display: flex; gap: 18px; }
#ls-stars-row { display: flex; gap: 10px; font-size: 18px; }
#ls-lock-msg { font-size: 10px; color: #ff6677; text-align: center; }
#ls-play-btn { margin-top: 8px; }

/* ===== COSMETICS ===== */
#screen-cosmetics { background: #080810; flex-direction: column; align-items: stretch; }
#cos-header { display: flex; align-items: center; padding: 16px 24px; border-bottom: 2px solid #334466; background: #111122; }
#cos-title { position: absolute; left: 50%; transform: translateX(-50%); font-size: 14px; color: #eeeeff; }
#cos-stars { margin-left: auto; font-size: 12px; color: #ffcc00; }
#cos-body { flex: 1; display: flex; overflow: hidden; }
#cos-tabs { display: flex; flex-direction: column; gap: 4px; padding: 16px 12px; background: #0d0d1a; border-right: 2px solid #334466; min-width: 130px; }
.cos-tab {
  font-family: 'Press Start 2P', monospace; font-size: 9px; color: #667788;
  background: #111122; border: 2px solid #334466; padding: 10px 8px; cursor: pointer;
  text-align: center; box-shadow: 0 3px 0 #000; transition: all 0.05s;
}
.cos-tab:hover { color: #eeeeff; background: #1a1a2e; }
.cos-tab.active { color: #ffcc00; border-color: #aa8800; background: #1a1a2e; }
#cos-list { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
.cos-item {
  display: flex; align-items: center; gap: 12px; background: #111122; border: 2px solid #334466;
  padding: 10px 14px; cursor: pointer; transition: all 0.05s; box-shadow: 0 3px 0 #000;
}
.cos-item:hover { background: #1a1a2e; border-color: #4455aa; }
.cos-item.equipped { border-color: #aa8800; background: #1a1a10; }
.cos-item.locked { opacity: 0.5; cursor: not-allowed; }
.cos-swatch { width: 20px; height: 20px; border: 2px solid #334466; flex-shrink: 0; image-rendering: pixelated; }
.cos-item-name { font-size: 9px; color: #eeeeff; flex: 1; }
.cos-item-req { font-size: 8px; color: #667788; }
.cos-badge { font-size: 7px; padding: 3px 6px; border: 1px solid; }
.cos-badge.equipped { color: #ffcc00; border-color: #aa8800; }
.cos-badge.unlocked { color: #00ff88; border-color: #008844; }
.cos-badge.locked { color: #667788; border-color: #334466; }
#cos-preview { width: 200px; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 12px; border-left: 2px solid #334466; background: #0d0d1a; }
#cos-preview-label { font-size: 8px; color: #667788; }
#cos-preview-frame { width: 120px; height: 120px; background: #080810; border: 2px solid #334466; display: flex; align-items: center; justify-content: center; image-rendering: pixelated; }
#cos-preview-canvas { image-rendering: pixelated; }

/* ===== GAME SCREEN ===== */
#screen-game { background: #000; position: relative; overflow: hidden; }
#hud {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 5px 12px; background: rgba(8,8,16,0.92); border-bottom: 2px solid #334466;
  font-size: 9px; color: #eeeeff; height: 36px; box-sizing: border-box;
}
#hud-left { display: flex; gap: 16px; align-items: center; }
#hud-center { position: absolute; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 2px; }
#hud-progress-bar { width: 200px; height: 6px; background: #334466; border: 1px solid #4455aa; }
#hud-progress-fill { height: 100%; background: #00ff88; width: 0%; transition: width 0.1s; }
#hud-mode { font-size: 7px; color: #ffcc00; }
#game-canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; position: absolute; }

/* ===== EDITOR SCREEN ===== */
#screen-editor { background: #080810; flex-direction: column; align-items: stretch; }
#editor-toolbar {
  display: flex; align-items: center; gap: 6px; padding: 6px 10px;
  background: #111122; border-bottom: 2px solid #334466; flex-wrap: wrap; min-height: 48px;
}
.editor-tool-btn {
  font-family: 'Press Start 2P', monospace; font-size: 7px; color: #aabbcc;
  background: #1a1a2e; border: 2px solid #334466; padding: 5px 8px; cursor: pointer;
  transition: all 0.05s; white-space: nowrap;
}
.editor-tool-btn:hover { background: #2a2a4e; color: #eeeeff; }
.editor-tool-btn.active { border-color: #ffcc00; color: #ffcc00; background: #1a1a10; }
#editor-canvas-wrap { flex: 1; overflow: hidden; position: relative; cursor: crosshair; }
#editor-canvas { display: block; image-rendering: pixelated; }
#editor-coords { position: absolute; bottom: 8px; right: 12px; font-size: 8px; color: #667788; pointer-events: none; }

/* ===== OVERLAYS ===== */
.overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.75); display: none; align-items: center; justify-content: center;
  flex-direction: column; z-index: 200; gap: 20px;
}
.overlay.active { display: flex; }
.overlay-box {
  background: #111122; border: 2px solid #334466;
  box-shadow: 0 8px 0 #000, inset 0 1px 0 rgba(255,255,255,0.05);
  padding: 32px 40px; display: flex; flex-direction: column; align-items: center; gap: 18px; min-width: 300px;
}
.overlay-title { font-size: 20px; color: #eeeeff; text-shadow: 2px 2px 0 #000; }
.overlay-sub { font-size: 9px; color: #667788; text-align: center; }
.overlay-stats { font-size: 9px; color: #aabbcc; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.overlay-stars { font-size: 22px; display: flex; gap: 8px; }
.overlay-btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: #080810; }
::-webkit-scrollbar-thumb { background: #334466; }

/* ===== FLASH MSG ===== */
#flash-msg {
  position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
  background: #1a1a2e; border: 2px solid #4455aa; color: #ff6677;
  font-size: 9px; padding: 8px 16px; z-index: 9999; display: none; pointer-events: none;
}

/* ===== BACK BUTTON (v.png) ===== */
#back-to-index {
  position: fixed; top: 130px; left: 20px; width: 120px; z-index: 9998;
  display: none;
}
#back-to-index img { width: 120px; image-rendering: pixelated; }
</style>
</head>
<body>

<!-- FLASH MESSAGE -->
<div id="flash-msg"></div>

<!-- BACK TO INDEX BUTTON -->
<a id="back-to-index" href="index.html"><img src="v.png" alt="Back"></a>

<!-- MENU SCREEN -->
<div id="screen-menu" class="screen active">
  <img id="menu-bg" src="ragebait 3_title.gif" alt="">
  <div id="menu-content">
    <div id="menu-title">
      <span class="t1">RAGEBAIT</span>
      <span class="t2">3</span>
    </div>
    <button class="btn" id="btn-play">PLAY</button>
    <button class="btn" id="btn-editor">EDITOR</button>
    <button class="btn" id="btn-cosmetics">COSMETICS</button>
    <button class="btn btn-danger" id="btn-reset">RESET</button>
  </div>
</div>

<!-- LEVEL SELECT SCREEN -->
<div id="screen-levelselect" class="screen">
  <div id="ls-header">
    <button class="btn btn-back" id="ls-back">&lt; BACK</button>
    <span id="ls-title">SELECT LEVEL</span>
    <span id="ls-stars-display">&#9733; 0</span>
  </div>
  <div id="ls-body">
    <button class="ls-arrow" id="ls-prev">&lt;</button>
    <div id="ls-card">
      <div id="ls-level-num">LEVEL 1</div>
      <div id="ls-level-name">THE AWAKENING</div>
      <div id="ls-difficulty">EASY</div>
      <div id="ls-stars-row">
        <span id="ls-star-0">&#9734;</span>
        <span id="ls-star-1">&#9734;</span>
        <span id="ls-star-2">&#9734;</span>
      </div>
      <div id="ls-stats">
        <span id="ls-deaths">DEATHS: 0</span>
        <span id="ls-time">BEST: --:--.--</span>
      </div>
      <div id="ls-lock-msg" style="display:none"></div>
      <button class="btn btn-green" id="ls-play-btn">PLAY</button>
    </div>
    <button class="ls-arrow" id="ls-next">&gt;</button>
  </div>
</div>

<!-- COSMETICS SCREEN -->
<div id="screen-cosmetics" class="screen">
  <div id="cos-header" style="position:relative;">
    <button class="btn btn-back" id="cos-back">&lt; BACK</button>
    <span id="cos-title">COSMETICS</span>
    <span id="cos-stars">&#9733; 0</span>
  </div>
  <div id="cos-body">
    <div id="cos-tabs">
      <button class="cos-tab active" data-tab="color">COLOR</button>
      <button class="cos-tab" data-tab="trail">TRAIL</button>
      <button class="cos-tab" data-tab="death">DEATH SFX</button>
    </div>
    <div id="cos-list"></div>
    <div id="cos-preview">
      <div id="cos-preview-label">PREVIEW</div>
      <div id="cos-preview-frame">
        <canvas id="cos-preview-canvas" width="120" height="120"></canvas>
      </div>
      <div id="cos-equipped-info" style="font-size:8px;color:#667788;text-align:center;"></div>
    </div>
  </div>
</div>

<!-- GAME SCREEN -->
<div id="screen-game" class="screen">
  <div id="hud">
    <div id="hud-left">
      <span id="hud-deaths">DEATHS: 0</span>
      <span id="hud-coins">&#9733; 0/3</span>
    </div>
    <div id="hud-center">
      <div id="hud-progress-bar"><div id="hud-progress-fill"></div></div>
      <div id="hud-mode">CUBE</div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <span id="hud-time">00:00.00</span>
      <button class="btn btn-back btn-sm" id="hud-back">&lt; BACK</button>
    </div>
  </div>
  <canvas id="game-canvas" width="800" height="450"></canvas>
  <!-- DEATH OVERLAY -->
  <div id="overlay-death" class="overlay">
    <div class="overlay-box">
      <div class="overlay-title" style="color:#ff3344;">YOU DIED</div>
      <div class="overlay-sub">Click or press Space to retry</div>
      <div class="overlay-stats" id="death-stats"></div>
    </div>
  </div>
  <!-- WIN OVERLAY -->
  <div id="overlay-win" class="overlay">
    <div class="overlay-box">
      <div class="overlay-title" style="color:#00ff88;">LEVEL CLEAR!</div>
      <div class="overlay-stars" id="win-stars">&#9734;&#9734;&#9734;</div>
      <div class="overlay-stats" id="win-stats"></div>
      <div class="overlay-btns">
        <button class="btn btn-green" id="win-continue">CONTINUE</button>
        <button class="btn btn-sm" id="win-retry">RETRY</button>
        <button class="btn btn-sm btn-back" id="win-menu">MENU</button>
      </div>
    </div>
  </div>
</div>

<!-- EDITOR SCREEN -->
<div id="screen-editor" class="screen">
  <div id="editor-toolbar">
    <button class="btn btn-back btn-sm" id="editor-back">&lt; BACK</button>
    <span style="font-size:8px;color:#667788;margin:0 4px;">TOOL:</span>
    <button class="editor-tool-btn active" data-tool="block">BLOCK</button>
    <button class="editor-tool-btn" data-tool="spike">SPIKE</button>
    <button class="editor-tool-btn" data-tool="orb_yellow">ORB Y</button>
    <button class="editor-tool-btn" data-tool="orb_blue">ORB B</button>
    <button class="editor-tool-btn" data-tool="orb_green">ORB G</button>
    <button class="editor-tool-btn" data-tool="portal_ship">P:SHIP</button>
    <button class="editor-tool-btn" data-tool="portal_ball">P:BALL</button>
    <button class="editor-tool-btn" data-tool="portal_wave">P:WAVE</button>
    <button class="editor-tool-btn" data-tool="portal_robot">P:ROBOT</button>
    <button class="editor-tool-btn" data-tool="portal_spider">P:SPIDER</button>
    <button class="editor-tool-btn" data-tool="coin">COIN</button>
    <button class="editor-tool-btn" data-tool="eraser">ERASE</button>
    <span style="margin-left:8px;font-size:8px;color:#334466;">|</span>
    <button class="editor-tool-btn" id="editor-save">SAVE</button>
    <button class="editor-tool-btn" id="editor-load">LOAD</button>
    <button class="editor-tool-btn" id="editor-export">EXPORT</button>
    <label class="editor-tool-btn" style="cursor:pointer;">IMPORT<input type="file" id="editor-import-file" accept=".json" style="display:none;"></label>
    <button class="editor-tool-btn" id="editor-playtest" style="color:#00ff88;border-color:#008844;">PLAY TEST</button>
    <button class="editor-tool-btn" id="editor-clear" style="color:#ff6677;border-color:#aa2233;">CLEAR</button>
  </div>
  <div id="editor-canvas-wrap">
    <canvas id="editor-canvas"></canvas>
    <div id="editor-coords">0, 0</div>
  </div>
</div>

<!-- RESET CONFIRM OVERLAY -->
<div id="overlay-reset" class="overlay" style="position:fixed;z-index:9997;">
  <div class="overlay-box">
    <div class="overlay-title" style="color:#ff3344;">RESET ALL DATA?</div>
    <div class="overlay-sub">This will erase all progress, stars, and cosmetics. This cannot be undone.</div>
    <div class="overlay-btns">
      <button class="btn btn-danger" id="reset-confirm">YES, RESET</button>
      <button class="btn" id="reset-cancel">CANCEL</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// SAVE, AUDIO, SCREEN MANAGEMENT, COSMETICS
// ============================================================

// --- AUDIO ---
let bgMusic = new Audio('ragebait 3_title.mp3');
bgMusic.loop = true; bgMusic.volume = 0.35;
function ensureMusicPlaying() { if (bgMusic.paused) bgMusic.play().catch(()=>{}); }
function stopBgMusic() { bgMusic.pause(); }
function playClick() { const a=new Audio('ragebait 3_click.mp3'); a.volume=0.6; a.play().catch(()=>{}); }
function sfx(src,vol=0.7) { const a=new Audio(src); a.volume=vol; a.play().catch(()=>{}); }
ensureMusicPlaying();
document.addEventListener('click', ()=>ensureMusicPlaying());
document.addEventListener('keydown', ()=>ensureMusicPlaying());

// --- SAVE SYSTEM ---
const SAVE_KEY = 'rb3save';
function defaultSave() {
  const levels = {};
  for (let i=1;i<=5;i++) levels[i]={deaths:0,bestTime:null,stars:[false,false,false],coins:[false,false,false]};
  return { equippedColor:'white', equippedTrail:'none', equippedDeath:'default', levels };
}
let save = defaultSave();
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      save = Object.assign(defaultSave(), p);
      for (let i=1;i<=5;i++) {
        if (!save.levels[i]) save.levels[i]={deaths:0,bestTime:null,stars:[false,false,false],coins:[false,false,false]};
        if (!save.levels[i].stars) save.levels[i].stars=[false,false,false];
        if (!save.levels[i].coins) save.levels[i].coins=[false,false,false];
      }
    }
  } catch(e) { save=defaultSave(); }
}
function writeSave() { try { localStorage.setItem(SAVE_KEY,JSON.stringify(save)); } catch(e){} }
function totalStars() {
  let c=0;
  for (let i=1;i<=5;i++) if (save.levels[i]&&save.levels[i].stars) for (const s of save.levels[i].stars) if(s) c++;
  return c;
}
loadSave();

// --- SCREEN MANAGEMENT ---
const screens = {
  menu: document.getElementById('screen-menu'),
  levelselect: document.getElementById('screen-levelselect'),
  cosmetics: document.getElementById('screen-cosmetics'),
  game: document.getElementById('screen-game'),
  editor: document.getElementById('screen-editor')
};
function showScreen(name) {
  for (const el of Object.values(screens)) el.classList.remove('active');
  screens[name].classList.add('active');
  const backBtn = document.getElementById('back-to-index');
  backBtn.style.display = (name==='menu') ? 'block' : 'none';
  if (name!=='game') ensureMusicPlaying();
  else stopBgMusic();
}

// --- FLASH MESSAGE ---
let flashTimer=null;
function showFlash(msg) {
  const el=document.getElementById('flash-msg');
  el.textContent=msg; el.style.display='block';
  if(flashTimer) clearTimeout(flashTimer);
  flashTimer=setTimeout(()=>{el.style.display='none';},1800);
}

// --- COSMETICS DATA ---
const COLORS = [
  {id:'white', hex:'#ffffff', name:'WHITE', cost:0},
  {id:'green', hex:'#00ff44', name:'GREEN', cost:3},
  {id:'cyan',  hex:'#00ffff', name:'CYAN',  cost:8},
  {id:'red',   hex:'#ff3333', name:'RED',   cost:15},
  {id:'purple',hex:'#9933ff', name:'PURPLE',cost:20},
];
const TRAILS = [
  {id:'none',      name:'NONE',      cost:0,  desc:'No trail'},
  {id:'dots',      name:'DOTS',      cost:5,  desc:'White pixel dots'},
  {id:'fireflies', name:'FIREFLIES', cost:10, desc:'Green glowing dots'},
  {id:'embers',    name:'EMBERS',    cost:15, desc:'Purple rising embers'},
];
const DEATH_SFXS = [
  {id:'default',  name:'DEFAULT',  cost:0,  file:'ragebait 3_death.mp3'},
  {id:'dramatic', name:'DRAMATIC', cost:10, file:'ragebait 3_death2.mp3'},
  {id:'realistic',name:'REALISTIC',cost:20, file:'ragebait 3_death3.mp3'},
];
let currentCosTab='color';

function renderCosmetics() {
  const stars=totalStars();
  document.getElementById('cos-stars').textContent='\u2605 '+stars;
  const list=document.getElementById('cos-list');
  list.innerHTML='';
  let items,equippedId,equipFn;
  if (currentCosTab==='color') {
    items=COLORS; equippedId=save.equippedColor;
    equipFn=(id)=>{save.equippedColor=id;writeSave();renderCosmetics();updatePreviewCanvas();};
  } else if (currentCosTab==='trail') {
    items=TRAILS; equippedId=save.equippedTrail;
    equipFn=(id)=>{save.equippedTrail=id;writeSave();renderCosmetics();};
  } else {
    items=DEATH_SFXS; equippedId=save.equippedDeath;
    equipFn=(id)=>{save.equippedDeath=id;writeSave();renderCosmetics();};
  }
  for (const item of items) {

  else { const d=DEATH_SFXS.find(d=>d.id===save.equippedDeath); infoEl.textContent=d?d.name:''; }

}

function updatePreviewCanvas() {
  const canvas=document.getElementById('cos-preview-canvas');
  const ctx=canvas.getContext('2d');

  ctx.fillStyle='#080810'; ctx.fillRect(0,0,120,120);

  const hex=c?c.hex:'#ffffff';
  ctx.shadowColor=hex; ctx.shadowBlur=12;
  ctx.fillStyle=hex; ctx.fillRect(44,44,32,32);
  ctx.shadowBlur=0;
  ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.lineWidth=2;
  ctx.strokeRect(44,44,32,32);
}

function updateLevelSelectCard() {
  const def=LEVEL_DEFS[currentLevelIndex];

function formatTime(ms) {
  const s=Math.floor(ms/1000), m=Math.floor(s/60), sec=s%60, cs=Math.floor((ms%1000)/10);
  return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0')+'.'+String(cs).padStart(2,'0');
}

<script>
// ============================================================
// GAME ENGINE - GD-style physics, 6 modes, canvas rendering
// ============================================================
const canvas = document.getElementById("game-canvas");
const ctx = canvas.getContext("2d");
let currentGameLevel = 1;
let currentIsCustom = false;
let gameRunning = false;
let gameState = "playing"; // playing, dead, win
let animFrame = null;
let levelData = null;
let objects = [];
let particles = [];
let trailParticles = [];
let orbCooldowns = new Map();
let collectedCoins = [false,false,false];
let sessionDeaths = 0;
let gameStartTime = 0;
let gameElapsed = 0;
let deathCount = 0;

// Player state
let player = {};

// Camera
let camX = 0;

// Canvas layout
const HUD_H = 36;
let CW = 800, CH = 450;

function doLayout() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const avail = vh - HUD_H;
  const scale = Math.min(vw/800, avail/450);
  CW = Math.round(800*scale); CH = Math.round(450*scale);
  canvas.style.width = CW+"px"; canvas.style.height = CH+"px";
  canvas.style.left = Math.round((vw-CW)/2)+"px";
  canvas.style.top = HUD_H+"px";
}
window.addEventListener("resize", doLayout);

// Input
let inputDown = false;
let inputJustPressed = false;
let inputJustReleased = false;

function handleInputDown(e) {
  if (e.type==="keydown" && e.code==="Escape") {
    e.preventDefault();
    // Escape always goes back to previous screen
    const gameScreen = document.getElementById('screen-game');
    const editorScreen = document.getElementById('screen-editor');
    if (gameScreen.classList.contains('active')) { playClick(); leaveGame(); return; }
    if (editorScreen.classList.contains('active')) { playClick(); showScreen('menu'); return; }
    return;
  }
  if (e.type==="keydown" && e.code!=="Space" && e.code!=="ArrowUp" && e.code!=="KeyW") return;
  if (e.type==="keydown" && e.repeat) return;
  if (!inputDown) { inputJustPressed = true; }
  inputDown = true;
  if (gameState==="dead") { restartLevel(); return; }
  if (gameState==="win") return;
}
function handleInputUp(e) {
  if (e.type==="keyup" && e.code!=="Space" && e.code!=="ArrowUp" && e.code!=="KeyW") return;
  inputDown = false; inputJustReleased = true;
}
document.addEventListener("keydown", handleInputDown);
document.addEventListener("keyup", handleInputUp);
canvas.addEventListener("mousedown", handleInputDown);
canvas.addEventListener("mouseup", handleInputUp);
canvas.addEventListener("touchstart", (e)=>{e.preventDefault();handleInputDown(e);},{passive:false});
canvas.addEventListener("touchend", (e)=>{e.preventDefault();handleInputUp(e);},{passive:false});

function getPlayerColor() {
  const c = COLORS.find(c=>c.id===save.equippedColor);
  return c ? c.hex : "#ffffff";
}

function initPlayer(lv) {
  player = {
    x: lv.startX * TILE + 2,
    y: lv.startY * TILE,
    w: 36, h: 36,
    vx: SCROLL_SPEED, vy: 0,
    onGround: false,
    onCeiling: false,
    mode: "cube",
    gravDir: 1,
    coyoteTime: 0,
    jumpBuffer: 0,
    hasDoubleJump: true,
    rotation: 0,
    robotHolding: false,
    robotJumpTime: 0,
    spiderOnCeiling: false,
    dead: false,
    won: false,
  };
}

function startGame(levelId, isCustom) {
  currentGameLevel = levelId;
  currentIsCustom = isCustom;
  if (isCustom) {
    const raw = localStorage.getItem("rb3_custom_level");
    if (!raw) { showFlash("No custom level saved!"); return; }
    levelData = JSON.parse(raw);
    levelData.bgTop = levelData.bgTop||"#0a0a1a";
    levelData.bgBot = levelData.bgBot||"#1a0a2e";
    levelData.startX = levelData.startX||2;
    levelData.startY = levelData.startY||9;
    levelData.endX = levelData.endX||100;
    levelData.width = levelData.width||120;
  } else {
    levelData = BUILT_IN_LEVELS.find(l=>l.id===levelId);
  }
  if (!levelData) { showFlash("Level not found!"); return; }
  objects = levelData.objects.map(o=>({...o, collected:false, broken:false, activated:false}));
  collectedCoins = [false,false,false];
  orbCooldowns.clear();
  particles = []; trailParticles = [];
  sessionDeaths = 0;
  gameStartTime = performance.now();
  gameElapsed = 0;
  deathCount = save.levels[levelId] ? save.levels[levelId].deaths : 0;
  initPlayer(levelData);
  camX = 0;
  gameState = "playing";
  gameRunning = true;
  document.getElementById("overlay-death").classList.remove("active");
  document.getElementById("overlay-win").classList.remove("active");
  showScreen("game");
  doLayout();
  if (animFrame) cancelAnimationFrame(animFrame);
  animFrame = requestAnimationFrame(gameLoop);
}

function restartLevel() {
  objects = levelData.objects.map(o=>({...o, collected:false, broken:false, activated:false}));
  collectedCoins = [false,false,false];
  orbCooldowns.clear();
  particles = []; trailParticles = [];
  gameStartTime = performance.now();
  gameElapsed = 0;
  initPlayer(levelData);
  camX = 0;
  gameState = "playing";
  document.getElementById("overlay-death").classList.remove("active");
}

function leaveGame() {
  gameRunning = false;
  if (animFrame) { cancelAnimationFrame(animFrame); animFrame=null; }
  document.getElementById("overlay-death").classList.remove("active");
  document.getElementById("overlay-win").classList.remove("active");
  showScreen("menu");
}

// ============================================================
// PHYSICS & COLLISION
// ============================================================
const GRAVITY = 0.6;
const JUMP_VY = -13;
const MAX_FALL = 18;
const COYOTE_FRAMES = 6;
const JUMP_BUFFER_FRAMES = 8;

function getBlocksAt(px, py, pw, ph) {
  const results = [];
  for (const o of objects) {
    if (o.type !== 'block' || o.collected) continue;
    const ox = o.x * TILE, oy = o.y * TILE;
    if (px < ox+TILE && px+pw > ox && py < oy+TILE && py+ph > oy) {
      results.push({ox, oy, o});
    }
  }
  return results;
}

function resolveCollisions(p) {
  p.onGround = false;
  p.onCeiling = false;
  // Horizontal
  const hBlocks = getBlocksAt(p.x + p.vx, p.y, p.w, p.h);
  if (hBlocks.length > 0) {
    if (p.vx > 0) p.x = hBlocks[0].ox - p.w;
    else if (p.vx < 0) p.x = hBlocks[0].ox + TILE;
    p.vx = 0;
  } else {
    p.x += p.vx;
  }
  // Vertical
  const vBlocks = getBlocksAt(p.x, p.y + p.vy, p.w, p.h);
  if (vBlocks.length > 0) {
    if (p.vy > 0) {
      // Landing on top
      let topY = Infinity;
      for (const b of vBlocks) if (b.oy < topY) topY = b.oy;
      p.y = topY - p.h;
      p.onGround = true;
    } else {
      // Hitting ceiling
      let botY = -Infinity;
      for (const b of vBlocks) if (b.oy + TILE > botY) botY = b.oy + TILE;
      p.y = botY;
      p.onCeiling = true;
    }
    p.vy = 0;
  } else {
    p.y += p.vy;
  }
}

function checkSpikes(p) {
  for (const o of objects) {
    if (o.type !== 'spike' || o.collected) continue;
    const ox = o.x * TILE, oy = o.y * TILE;
    // Spike hitbox is smaller (triangle)
    const margin = 6;
    if (p.x + margin < ox + TILE - margin && p.x + p.w - margin > ox + margin &&
        p.y + margin < oy + TILE && p.y + p.h - margin > oy + margin) {
      return true;
    }
  }
  return false;
}

function checkOrbs(p) {
  for (const o of objects) {
    if (!o.type.startsWith('orb_') || o.collected) continue;
    const ox = o.x * TILE + TILE/2, oy = o.y * TILE + TILE/2;
    const cx = p.x + p.w/2, cy = p.y + p.h/2;
    const dist = Math.hypot(cx-ox, cy-oy);
    if (dist < TILE*0.7) {
      const key = o.x+'_'+o.y;
      if (!orbCooldowns.has(key)) {
        o.collected = true;
        orbCooldowns.set(key, 30);
        return o.type;
      }
    }
  }
  return null;
}

function checkPortals(p) {
  for (const o of objects) {
    if (!o.type.startsWith('portal_') || o.activated) continue;
    const ox = o.x * TILE, oy = o.y * TILE;
    if (p.x + p.w > ox && p.x < ox + TILE && p.y + p.h > oy && p.y < oy + TILE*2) {
      return o;
    }
  }
  return null;
}

function checkCoins(p) {
  for (const o of objects) {
    if (o.type !== 'coin' || o.collected) continue;
    const ox = o.x * TILE + TILE/2, oy = o.y * TILE + TILE/2;
    const cx = p.x + p.w/2, cy = p.y + p.h/2;
    if (Math.hypot(cx-ox, cy-oy) < TILE*0.7) {
      o.collected = true;
      if (o.coinIdx !== undefined) collectedCoins[o.coinIdx] = true;
      spawnCoinParticles(ox, oy);
      return true;
    }
  }
  return false;
}

function checkWin(p) {
  if (!levelData) return false;
  return p.x + p.w/2 >= levelData.endX * TILE;
}

function checkFallDeath(p) {
  return p.y > 12 * TILE + 100 || p.y < -200;
}

// ============================================================
// MODE PHYSICS
// ============================================================
function updateCube(p) {
  // Gravity
  p.vy += GRAVITY * p.gravDir;
  if (p.vy * p.gravDir > MAX_FALL) p.vy = MAX_FALL * p.gravDir;

  // Coyote time
  if (p.onGround) { p.coyoteTime = COYOTE_FRAMES; }
  else if (p.coyoteTime > 0) p.coyoteTime--;

  // Jump buffer
  if (inputJustPressed) p.jumpBuffer = JUMP_BUFFER_FRAMES;
  else if (p.jumpBuffer > 0) p.jumpBuffer--;

  // Single jump only — must be on ground (or coyote window)
  if (p.jumpBuffer > 0 && p.coyoteTime > 0) {
    p.vy = JUMP_VY * p.gravDir;
    p.coyoteTime = 0; p.jumpBuffer = 0;
    spawnJumpParticles(p);
  }

  // Rotation
  if (!p.onGround) p.rotation += 4 * p.gravDir;
  else p.rotation = Math.round(p.rotation/90)*90;

  resolveCollisions(p);
}

function updateShip(p) {
  if (inputDown) {
    p.vy -= 0.5 * p.gravDir;
    if (p.vy * p.gravDir < -8) p.vy = -8 * p.gravDir;
  } else {
    p.vy += GRAVITY * 0.7 * p.gravDir;
    if (p.vy * p.gravDir > 8) p.vy = 8 * p.gravDir;
  }
  p.rotation = Math.max(-30, Math.min(30, -p.vy * 2));
  resolveCollisions(p);
}

function updateBall(p) {
  p.vy += GRAVITY * p.gravDir;
  if (p.vy * p.gravDir > MAX_FALL) p.vy = MAX_FALL * p.gravDir;

  if (inputJustPressed) {
    if (p.onGround || p.onCeiling) {
      p.gravDir *= -1;
      p.vy = -2 * p.gravDir;
      spawnJumpParticles(p);
    }
  }
  p.rotation += 5 * p.gravDir;
  resolveCollisions(p);
}

function updateWave(p) {
  const speed = 6;
  if (inputDown) {
    p.vy = -speed * p.gravDir;
  } else {
    p.vy = speed * p.gravDir;
  }
  p.rotation = p.vy > 0 ? 45 : -45;
  resolveCollisions(p);
}

function updateRobot(p) {
  p.vy += GRAVITY * p.gravDir;
  if (p.vy * p.gravDir > MAX_FALL) p.vy = MAX_FALL * p.gravDir;

  if (p.onGround) { p.coyoteTime = COYOTE_FRAMES; p.hasDoubleJump = true; p.robotHolding = false; }
  else if (p.coyoteTime > 0) p.coyoteTime--;

  if (inputJustPressed) p.jumpBuffer = JUMP_BUFFER_FRAMES;
  else if (p.jumpBuffer > 0) p.jumpBuffer--;

  if (p.jumpBuffer > 0 && p.coyoteTime > 0) {
    p.vy = (JUMP_VY - 3) * p.gravDir;
    p.robotHolding = true; p.robotJumpTime = 0;
    p.coyoteTime = 0; p.jumpBuffer = 0;
    spawnJumpParticles(p);
  }
  if (p.robotHolding && inputDown) {
    p.robotJumpTime++;
    if (p.robotJumpTime < 20) p.vy -= 0.4 * p.gravDir;
  }
  if (!inputDown) p.robotHolding = false;

  if (!p.onGround) p.rotation += 4 * p.gravDir;
  else p.rotation = Math.round(p.rotation/90)*90;
  resolveCollisions(p);
}

function updateSpider(p) {
  p.vy += GRAVITY * p.gravDir;
  if (p.vy * p.gravDir > MAX_FALL) p.vy = MAX_FALL * p.gravDir;

  if (inputJustPressed) {
    if (p.onGround) {
      // Teleport to ceiling
      p.gravDir = -1;
      p.y = 0;
      p.vy = 0;
      p.spiderOnCeiling = true;
      spawnJumpParticles(p);
    } else if (p.onCeiling || p.spiderOnCeiling) {
      // Teleport to floor
      p.gravDir = 1;
      p.y = 11 * TILE - p.h;
      p.vy = 0;
      p.spiderOnCeiling = false;
      spawnJumpParticles(p);
    }
  }
  p.rotation += 3 * p.gravDir;
  resolveCollisions(p);
}

// ============================================================
// PARTICLES & TRAIL
// ============================================================
function spawnJumpParticles(p) {
  const col = getPlayerColor();
  for (let i=0;i<8;i++) {
    particles.push({
      x: p.x + p.w/2, y: p.y + p.h,
      vx: (Math.random()-0.5)*4, vy: Math.random()*-3-1,
      life: 20+Math.random()*10, maxLife: 30,
      color: col, size: 3+Math.random()*3
    });
  }
}
function spawnDeathParticles(p) {
  const col = getPlayerColor();
  for (let i=0;i<20;i++) {
    const angle = (i/20)*Math.PI*2;
    particles.push({
      x: p.x+p.w/2, y: p.y+p.h/2,
      vx: Math.cos(angle)*5*(0.5+Math.random()),
      vy: Math.sin(angle)*5*(0.5+Math.random()),
      life: 30+Math.random()*20, maxLife: 50,
      color: col, size: 4+Math.random()*4
    });
  }
}
function spawnCoinParticles(cx, cy) {
  for (let i=0;i<10;i++) {
    particles.push({
      x: cx, y: cy,
      vx: (Math.random()-0.5)*5, vy: Math.random()*-4-1,
      life: 25, maxLife: 25,
      color: '#ffcc00', size: 3+Math.random()*3
    });
  }
}
function updateParticles() {
  for (let i=particles.length-1;i>=0;i--) {
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.15; p.life--;
    if (p.life<=0) particles.splice(i,1);
  }
}
function updateTrail(p) {
  const trail = save.equippedTrail;
  if (trail==='none') return;
  if (trail==='dots') {
    trailParticles.push({x:p.x+p.w/2, y:p.y+p.h/2, life:15, maxLife:15, color:'#ffffff', size:3, type:'dot'});
  } else if (trail==='fireflies') {
    trailParticles.push({x:p.x+p.w/2+(Math.random()-0.5)*8, y:p.y+p.h/2+(Math.random()-0.5)*8, life:25, maxLife:25, color:'#00ff88', size:4, type:'firefly', vx:(Math.random()-0.5)*0.5, vy:-0.3});
  } else if (trail==='embers') {
    trailParticles.push({x:p.x+p.w/2+(Math.random()-0.5)*10, y:p.y+p.h, life:30, maxLife:30, color:'#cc44ff', size:3+Math.random()*2, type:'ember', vx:(Math.random()-0.5)*1, vy:-1-Math.random()});
  }
  for (let i=trailParticles.length-1;i>=0;i--) {
    const t=trailParticles[i];
    if (t.vx) t.x+=t.vx;
    if (t.vy) t.y+=t.vy;
    t.life--;
    if (t.life<=0) trailParticles.splice(i,1);
  }
}

// ============================================================
// DRAWING
// ============================================================
let bgImg = null, bgImgSrc = '';
function drawBg() {
  // Use gif background if available
  if (levelData && levelData.bgGif) {
    if (bgImgSrc !== levelData.bgGif) {
      bgImgSrc = levelData.bgGif;
      bgImg = new Image();
      bgImg.src = bgImgSrc;
    }
    if (bgImg && bgImg.complete && bgImg.naturalWidth > 0) {
      ctx.drawImage(bgImg, 0, 0, 800, 450);
      // Dark overlay so objects are visible
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(0,0,800,450);
      return;
    }
  }
  // Fallback gradient
  const top = levelData ? (levelData.bgTop||'#0a0a1a') : '#0a0a1a';
  const bot = levelData ? (levelData.bgBot||'#1a0a2e') : '#1a0a2e';
  const grad = ctx.createLinearGradient(0,0,0,450);
  grad.addColorStop(0, top); grad.addColorStop(1, bot);
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,800,450);
  // Stars
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  for (let i=0;i<40;i++) {
    const sx = ((i*137+camX*0.1)%800+800)%800;
    const sy = (i*73)%200;
    ctx.fillRect(sx,sy,1,1);
  }
}

function drawBlock(ox, oy) {
  ctx.fillStyle = '#667788';
  ctx.fillRect(ox,oy,TILE,TILE);
  ctx.fillStyle = '#889aaa';
  ctx.fillRect(ox,oy,TILE,3);
  ctx.fillRect(ox,oy,3,TILE);
  ctx.fillStyle = '#445566';
  ctx.fillRect(ox,oy+TILE-3,TILE,3);
  ctx.fillRect(ox+TILE-3,oy,3,TILE);
  ctx.strokeStyle = '#334455';
  ctx.lineWidth = 1;
  ctx.strokeRect(ox+0.5,oy+0.5,TILE-1,TILE-1);
}

function drawSpike(ox, oy) {
  ctx.fillStyle = '#ffcc00';
  ctx.beginPath();
  ctx.moveTo(ox+TILE/2, oy);
  ctx.lineTo(ox+TILE, oy+TILE);
  ctx.lineTo(ox, oy+TILE);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#cc9900';
  ctx.lineWidth = 1;
  ctx.stroke();
}

function drawOrb(ox, oy, type) {
  const colors = {orb_yellow:'#ffcc00', orb_blue:'#4488ff', orb_green:'#00ff88'};
  const col = colors[type]||'#ffffff';
  const cx = ox+TILE/2, cy = oy+TILE/2, r = TILE*0.35;
  ctx.shadowColor = col; ctx.shadowBlur = 12;
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 2;
  ctx.stroke();
  // Inner shine
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.beginPath(); ctx.arc(cx-r*0.3,cy-r*0.3,r*0.3,0,Math.PI*2); ctx.fill();
}

function drawPortal(ox, oy, type) {
  const colors = {portal_ship:'#00aaff', portal_ball:'#ff8800', portal_wave:'#ff00ff', portal_robot:'#00ff44', portal_spider:'#aa00ff'};
  const labels = {portal_ship:'SHIP', portal_ball:'BALL', portal_wave:'WAVE', portal_robot:'ROBOT', portal_spider:'SPIDER'};
  const col = colors[type]||'#ffffff';
  ctx.shadowColor = col; ctx.shadowBlur = 15;
  ctx.fillStyle = col+'44';
  ctx.fillRect(ox, oy, TILE, TILE*2);
  ctx.strokeStyle = col; ctx.lineWidth = 2;
  ctx.strokeRect(ox, oy, TILE, TILE*2);
  ctx.shadowBlur = 0;
  ctx.fillStyle = col;
  ctx.font = 'bold 7px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(labels[type]||'?', ox+TILE/2, oy+TILE);
  ctx.textAlign = 'left';
}

function drawCoin(ox, oy) {
  const cx = ox+TILE/2, cy = oy+TILE/2;
  ctx.shadowColor = '#ffcc00'; ctx.shadowBlur = 10;
  ctx.fillStyle = '#ffcc00';
  ctx.font = 'bold 22px serif';
  ctx.textAlign = 'center';
  ctx.fillText('\u2605', cx, cy+8);
  ctx.shadowBlur = 0;
  ctx.textAlign = 'left';
}

function drawPlayer(p) {
  const col = getPlayerColor();
  const cx = p.x + p.w/2, cy = p.y + p.h/2;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(p.rotation * Math.PI/180);
  // Glow
  ctx.shadowColor = col; ctx.shadowBlur = 16;
  ctx.fillStyle = col;
  ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
  ctx.shadowBlur = 0;
  // Inner detail
  ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 2;
  ctx.strokeRect(-p.w/2+3, -p.h/2+3, p.w-6, p.h-6);
  // Mode indicator
  const modeColors = {cube:'#ffffff', ship:'#00aaff', ball:'#ff8800', wave:'#ff00ff', robot:'#00ff44', spider:'#aa00ff'};
  ctx.fillStyle = modeColors[p.mode]||'#ffffff';
  ctx.fillRect(-4,-4,8,8);
  ctx.restore();
}

function drawTrailParticles() {
  for (const t of trailParticles) {
    const alpha = t.life/t.maxLife;
    ctx.globalAlpha = alpha;
    ctx.shadowColor = t.color; ctx.shadowBlur = 6;
    ctx.fillStyle = t.color;
    ctx.beginPath(); ctx.arc(t.x-camX, t.y, t.size, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;
}

function drawParticles() {
  for (const p of particles) {
    const alpha = p.life/p.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x-camX-p.size/2, p.y-p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

function drawObjects() {
  const viewLeft = camX - TILE, viewRight = camX + 800 + TILE;
  for (const o of objects) {
    if (o.collected) continue;
    const ox = o.x*TILE - camX, oy = o.y*TILE;
    if (ox+TILE < -TILE || ox > 800+TILE) continue;
    if (o.type==='block') drawBlock(ox,oy);
    else if (o.type==='spike') drawSpike(ox,oy);
    else if (o.type.startsWith('orb_')) drawOrb(ox,oy,o.type);
    else if (o.type.startsWith('portal_')) drawPortal(ox,oy,o.type);
    else if (o.type==='coin') drawCoin(ox,oy);
  }
}

function drawHUD() {
  const def = LEVEL_DEFS.find(l=>l.id===currentGameLevel);
  const pct = levelData ? Math.min(100, Math.round((player.x/(levelData.endX*TILE))*100)) : 0;
  document.getElementById('hud-deaths').textContent = 'DEATHS: '+deathCount;
  const coins = collectedCoins.filter(Boolean).length;
  document.getElementById('hud-coins').textContent = '\u2605 '+coins+'/3';
  document.getElementById('hud-progress-fill').style.width = pct+'%';
  document.getElementById('hud-mode').textContent = player.mode.toUpperCase();
  const elapsed = gameElapsed;
  document.getElementById('hud-time').textContent = formatTime(elapsed);
}

// ============================================================
// GAME LOOP
// ============================================================
function gameLoop(ts) {
  if (!gameRunning) return;
  animFrame = requestAnimationFrame(gameLoop);

  if (gameState === 'playing') {
    gameElapsed = ts - gameStartTime;

    // Update orb cooldowns
    for (const [k,v] of orbCooldowns) {
      if (v <= 1) orbCooldowns.delete(k);
      else orbCooldowns.set(k, v-1);
    }

    // Update trail
    updateTrail(player);

    // Mode physics
    switch(player.mode) {
      case 'cube':   updateCube(player); break;
      case 'ship':   updateShip(player); break;
      case 'ball':   updateBall(player); break;
      case 'wave':   updateWave(player); break;
      case 'robot':  updateRobot(player); break;
      case 'spider': updateSpider(player); break;
    }

    // Camera follows player (player stays at ~30% from left)
    const targetCamX = player.x - 240;
    camX += (targetCamX - camX) * 0.15;
    if (camX < 0) camX = 0;

    // Check orbs
    const orbHit = checkOrbs(player);
    if (orbHit) {
      if (orbHit === 'orb_yellow') { player.vy = JUMP_VY * player.gravDir; spawnJumpParticles(player); }
      else if (orbHit === 'orb_blue') { player.gravDir *= -1; player.vy = -4 * player.gravDir; spawnJumpParticles(player); }
      else if (orbHit === 'orb_green') { player.vy = (JUMP_VY*0.6) * player.gravDir; spawnJumpParticles(player); }
    }

    // Check portals
    const portal = checkPortals(player);
    if (portal) {
      portal.activated = true;
      const mode = portal.type.replace('portal_','');
      player.mode = mode;
      player.gravDir = 1;
      player.vy = 0;
      spawnJumpParticles(player);
    }

    // Check coins
    checkCoins(player);

    // Check death
    if (checkSpikes(player) || checkFallDeath(player)) {
      killPlayer();
    }

    // Check win
    if (checkWin(player)) {
      winLevel();
    }

    // Update particles
    updateParticles();
  }

  // Draw
  ctx.clearRect(0,0,800,450);
  drawBg();
  drawTrailParticles();
  drawObjects();
  if (gameState !== 'dead' || true) drawPlayer(player);
  drawParticles();
  drawHUD();

  // Reset just-pressed flags
  inputJustPressed = false;
  inputJustReleased = false;
}

function killPlayer() {
  if (gameState !== 'playing') return;
  gameState = 'dead';
  sessionDeaths++;
  deathCount++;
  if (!currentIsCustom && save.levels[currentGameLevel]) {
    save.levels[currentGameLevel].deaths = deathCount;
    writeSave();
  }
  spawnDeathParticles(player);
  // Play death sfx
  const sfxMap = {default:'ragebait 3_death.mp3', dramatic:'ragebait 3_death2.mp3', realistic:'ragebait 3_death3.mp3'};
  sfx(sfxMap[save.equippedDeath]||sfxMap.default);
  // Show death overlay after brief delay
  setTimeout(()=>{
    if (gameState === 'dead') {
      document.getElementById('death-stats').innerHTML = 'SESSION DEATHS: '+sessionDeaths+'<br>TOTAL DEATHS: '+deathCount;
      document.getElementById('overlay-death').classList.add('active');
    }
  }, 600);
}

function winLevel() {
  if (gameState !== 'playing') return;
  gameState = 'win';
  const elapsed = gameElapsed;
  const def = LEVEL_DEFS.find(l=>l.id===currentGameLevel);
  const coins = collectedCoins.filter(Boolean).length;

  // Calculate stars
  let starsEarned = [false,false,false];
  starsEarned[0] = true; // Complete level
  starsEarned[1] = def && elapsed/1000 <= def.timeThreshold; // Time
  starsEarned[2] = coins >= 3; // All coins

  // Save
  if (!currentIsCustom && save.levels[currentGameLevel]) {
    const lvl = save.levels[currentGameLevel];
    for (let i=0;i<3;i++) if (starsEarned[i]) lvl.stars[i] = true;
    if (!lvl.bestTime || elapsed < lvl.bestTime) lvl.bestTime = elapsed;
    writeSave();
  }

  // Show win overlay
  const starEls = document.getElementById('win-stars');
  starEls.innerHTML = starsEarned.map(s=>s?'<span style="color:#ffcc00">\u2605</span>':'<span style="color:#334466">\u2606</span>').join('');
  const statsEl = document.getElementById('win-stats');
  statsEl.innerHTML = 'TIME: '+formatTime(elapsed)+'<br>COINS: '+coins+'/3<br>DEATHS: '+sessionDeaths;
  document.getElementById('overlay-win').classList.add('active');
  sfx('ragebait 3_win.mp3', 0.7);
}

// ============================================================
// LEVEL EDITOR
// ============================================================
const EDITOR_TILE = 40;
let editorObjects = [];
let editorCamX = 0;
let editorTool = 'block';
let editorMouseDown = false;
let editorLastTile = null;
let editorCanvas, editorCtx;
let editorWidth = 100; // tiles wide
let editorHeight = 12;

const EDITOR_COLORS = {
  block:'#667788', spike:'#ffcc00', orb_yellow:'#ffcc00', orb_blue:'#4488ff',
  orb_green:'#00ff88', portal_ship:'#00aaff', portal_ball:'#ff8800',
  portal_wave:'#ff00ff', portal_robot:'#00ff44', portal_spider:'#aa00ff',
  coin:'#ffcc00', eraser:'#ff3333'
};

function initEditor() {
  editorCanvas = document.getElementById('editor-canvas');
  editorCtx = editorCanvas.getContext('2d');
  const wrap = document.getElementById('editor-canvas-wrap');
  editorCanvas.width = wrap.clientWidth || 800;
  editorCanvas.height = wrap.clientHeight || 400;
  editorObjects = [];
  editorCamX = 0;
  editorTool = 'block';
  document.querySelectorAll('.editor-tool-btn[data-tool]').forEach(b=>{
    b.classList.toggle('active', b.dataset.tool==='block');
  });
  renderEditor();
}

function renderEditor() {
  if (!editorCtx) return;
  const W = editorCanvas.width, H = editorCanvas.height;
  editorCtx.fillStyle = '#080810';
  editorCtx.fillRect(0,0,W,H);

  // Infinite grid — draw as many tiles as fit the viewport
  editorCtx.strokeStyle = '#1a1a2e';
  editorCtx.lineWidth = 1;
  const startTileX = Math.floor(editorCamX/EDITOR_TILE);
  const endTileX = startTileX + Math.ceil(W/EDITOR_TILE) + 2;
  for (let tx=startTileX; tx<=endTileX; tx++) {
    const sx = tx*EDITOR_TILE - editorCamX;
    editorCtx.beginPath(); editorCtx.moveTo(sx,0); editorCtx.lineTo(sx,H); editorCtx.stroke();
  }
  for (let ty=0; ty<=editorHeight+2; ty++) {
    const sy = ty*EDITOR_TILE;
    editorCtx.beginPath(); editorCtx.moveTo(0,sy); editorCtx.lineTo(W,sy); editorCtx.stroke();
  }

  // Draw start position marker (tile 2, row 9)
  const startTX = 2, startTY = 9;
  const startSX = startTX*EDITOR_TILE - editorCamX;
  const startSY = startTY*EDITOR_TILE;
  if (startSX > -EDITOR_TILE && startSX < W+EDITOR_TILE) {
    editorCtx.fillStyle = 'rgba(0,255,136,0.25)';
    editorCtx.fillRect(startSX, startSY, EDITOR_TILE, EDITOR_TILE);
    editorCtx.strokeStyle = '#00ff88';
    editorCtx.lineWidth = 2;
    editorCtx.strokeRect(startSX+1, startSY+1, EDITOR_TILE-2, EDITOR_TILE-2);
    editorCtx.fillStyle = '#00ff88';
    editorCtx.font = 'bold 8px monospace';
    editorCtx.textAlign = 'center';
    editorCtx.fillText('START', startSX+EDITOR_TILE/2, startSY+EDITOR_TILE/2+3);
    editorCtx.textAlign = 'left';
  }

  // Objects
  for (const o of editorObjects) {
    const ox = o.x*EDITOR_TILE - editorCamX, oy = o.y*EDITOR_TILE;
    if (ox+EDITOR_TILE < 0 || ox > W) continue;
    const col = EDITOR_COLORS[o.type]||'#ffffff';
    if (o.type==='block') {
      editorCtx.fillStyle = '#667788'; editorCtx.fillRect(ox,oy,EDITOR_TILE,EDITOR_TILE);
      editorCtx.strokeStyle = '#334455'; editorCtx.lineWidth=1; editorCtx.strokeRect(ox+0.5,oy+0.5,EDITOR_TILE-1,EDITOR_TILE-1);
    } else if (o.type==='spike') {
      editorCtx.fillStyle='#ffcc00'; editorCtx.beginPath();
      editorCtx.moveTo(ox+EDITOR_TILE/2,oy); editorCtx.lineTo(ox+EDITOR_TILE,oy+EDITOR_TILE); editorCtx.lineTo(ox,oy+EDITOR_TILE); editorCtx.closePath(); editorCtx.fill();
    } else if (o.type.startsWith('orb_')) {
      editorCtx.fillStyle=col; editorCtx.beginPath(); editorCtx.arc(ox+EDITOR_TILE/2,oy+EDITOR_TILE/2,EDITOR_TILE*0.35,0,Math.PI*2); editorCtx.fill();
    } else if (o.type.startsWith('portal_')) {
      editorCtx.fillStyle=col+'44'; editorCtx.fillRect(ox,oy,EDITOR_TILE,EDITOR_TILE*2);
      editorCtx.strokeStyle=col; editorCtx.lineWidth=2; editorCtx.strokeRect(ox,oy,EDITOR_TILE,EDITOR_TILE*2);
    } else if (o.type==='coin') {
      editorCtx.fillStyle='#ffcc00'; editorCtx.font='bold 22px serif'; editorCtx.textAlign='center';
      editorCtx.fillText('\u2605',ox+EDITOR_TILE/2,oy+EDITOR_TILE/2+8); editorCtx.textAlign='left';
    }
  }
  document.getElementById('editor-coords').textContent = 'W:'+editorWidth+' tiles';
}

function editorGetTile(clientX, clientY) {
  const rect = editorCanvas.getBoundingClientRect();
  const mx = clientX - rect.left, my = clientY - rect.top;
  const tx = Math.floor((mx + editorCamX) / EDITOR_TILE);
  const ty = Math.floor(my / EDITOR_TILE);
  return {tx, ty};
}

function editorPlace(tx, ty) {
  if (ty < 0 || ty >= editorHeight) return;
  if (editorTool === 'eraser') {
    editorObjects = editorObjects.filter(o=>!(o.x===tx && o.y===ty));
  } else {
    editorObjects = editorObjects.filter(o=>!(o.x===tx && o.y===ty));
    const coinIdx = editorObjects.filter(o=>o.type==='coin').length;
    editorObjects.push({type:editorTool, x:tx, y:ty, coinIdx: editorTool==='coin'?coinIdx:undefined});
    if (tx >= editorWidth-5) editorWidth = tx + 20;
  }
  renderEditor();
}

// Editor event listeners
document.getElementById('editor-canvas-wrap').addEventListener('mousedown', (e)=>{
  if (e.button===2) { editorTool='eraser'; }
  editorMouseDown = true;
  const {tx,ty} = editorGetTile(e.clientX, e.clientY);
  editorLastTile = {tx,ty};
  editorPlace(tx,ty);
});
document.getElementById('editor-canvas-wrap').addEventListener('mousemove', (e)=>{
  const {tx,ty} = editorGetTile(e.clientX, e.clientY);
  document.getElementById('editor-coords').textContent = 'X:'+tx+' Y:'+ty;
  if (editorMouseDown) {
    if (!editorLastTile || editorLastTile.tx!==tx || editorLastTile.ty!==ty) {
      editorLastTile = {tx,ty};
      editorPlace(tx,ty);
    }
  }
});
document.getElementById('editor-canvas-wrap').addEventListener('mouseup', ()=>{ editorMouseDown=false; });
document.getElementById('editor-canvas-wrap').addEventListener('contextmenu', (e)=>e.preventDefault());
document.getElementById('editor-canvas-wrap').addEventListener('wheel', (e)=>{
  editorCamX = Math.max(0, editorCamX + e.deltaY*0.5);
  renderEditor();
});

document.querySelectorAll('.editor-tool-btn[data-tool]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    editorTool = btn.dataset.tool;
    document.querySelectorAll('.editor-tool-btn[data-tool]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
  });
});

document.getElementById('editor-save').addEventListener('click',()=>{
  const data = {objects:editorObjects, width:editorWidth, startX:2, startY:9, endX:editorWidth-5, bgTop:'#0a0a1a', bgBot:'#1a0a2e'};
  localStorage.setItem('rb3_custom_level', JSON.stringify(data));
  showFlash('Level saved!');
});
document.getElementById('editor-load').addEventListener('click',()=>{
  const raw = localStorage.getItem('rb3_custom_level');
  if (!raw) { showFlash('No saved level!'); return; }
  const data = JSON.parse(raw);
  editorObjects = data.objects||[];
  editorWidth = data.width||100;
  renderEditor();
  showFlash('Level loaded!');
});
document.getElementById('editor-export').addEventListener('click',()=>{
  const data = {objects:editorObjects, width:editorWidth, startX:2, startY:9, endX:editorWidth-5, bgTop:'#0a0a1a', bgBot:'#1a0a2e'};
  const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='rb3_level.json'; a.click();
});
document.getElementById('editor-import-file').addEventListener('change',(e)=>{
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try {
      const data = JSON.parse(ev.target.result);
      editorObjects = data.objects||[];
      editorWidth = data.width||100;
      renderEditor();
      showFlash('Level imported!');
    } catch(err) { showFlash('Invalid JSON!'); }
  };
  reader.readAsText(file);
});
document.getElementById('editor-playtest').addEventListener('click',()=>{
  const data = {objects:editorObjects, width:editorWidth, startX:2, startY:9, endX:editorWidth-5, bgTop:'#0a0a1a', bgBot:'#1a0a2e'};
  localStorage.setItem('rb3_custom_level', JSON.stringify(data));
  startGame(1, true);
});
document.getElementById('editor-clear').addEventListener('click',()=>{
  editorObjects=[]; editorWidth=100; renderEditor(); showFlash('Cleared!');
});
document.getElementById('editor-back').addEventListener('click',()=>{ playClick(); showScreen('menu'); });

// Close script and end file
</script>
