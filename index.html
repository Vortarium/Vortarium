<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortarium Productions</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* ── Custom scrollbar ── */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.4); border-radius: 10px; }
        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.25);
            border-radius: 10px;
            border: 2px solid transparent;
            background-clip: padding-box;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.5);
            border: 2px solid transparent;
            background-clip: padding-box;
        }
        * { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.25) rgba(0,0,0,0.4); }

        body {
            font-family: 'Quicksand', sans-serif;
            color: #fff;
            background: url('cafe.gif') no-repeat center center fixed;
            background-size: cover;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* ── Curtain transition ── */
        #curtain {
            position: fixed;
            inset: 0;
            z-index: 99999;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
        }

        /* Top and bottom curtain panels */
        .curtain-panel {
            position: absolute;
            left: 0;
            width: 100%;
            height: 50%;
            background: #0a0a0a;
            transition: transform 0.6s cubic-bezier(0.77, 0, 0.18, 1);
        }
        .curtain-panel.top    { top: 0;   transform: translateY(-100%); }
        .curtain-panel.bottom { bottom: 0; transform: translateY(100%); }

        /* Closed state — panels slide in */
        #curtain.closing .curtain-panel.top    { transform: translateY(0); }
        #curtain.closing .curtain-panel.bottom { transform: translateY(0); }
        #curtain.closed  .curtain-panel.top    { transform: translateY(0); }
        #curtain.closed  .curtain-panel.bottom { transform: translateY(0); }

        /* Opening state — panels slide back out */
        #curtain.opening .curtain-panel.top    { transform: translateY(-100%); }
        #curtain.opening .curtain-panel.bottom { transform: translateY(100%); }

        /* Spinner — only visible when curtain is closed */
        #curtain-spinner {
            position: relative;
            z-index: 1;
            width: 64px;
            height: 64px;
            opacity: 0;
            transition: opacity 0.25s;
        }
        #curtain.closed #curtain-spinner { opacity: 1; }

        #curtain-spinner::before {
            content: '';
            display: block;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 5px solid rgba(255,255,255,0.15);
            border-top-color: #fff;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Playtime Tracker */
        header {
            position: fixed;
            top: 0;
            right: 0;
            padding: 20px;
            z-index: 100;
        }
        .playtime {
            background: rgba(0,0,0,0.6);
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 1.2rem;
            font-weight: 700;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* Main Branding */
        .hero { text-align: center; padding: 80px 20px 40px; }
        .main-logo {
            width: 600px;
            max-width: 90%;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 15px rgba(0,0,0,0.8));
        }
        .creator-desc {
            font-size: 1.3rem;
            color: #f7e1d7;
            max-width: 800px;
            margin: 0 auto;
            line-height: 1.6;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
            background: rgba(0,0,0,0.4);
            padding: 20px;
            border-radius: 20px;
        }

        /* Grid */
        .container { max-width: 1100px; margin: 40px auto 100px; padding: 20px; }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
            justify-items: center;
        }
        .game-card {
            width: 320px;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
        }
        .game-card:hover { transform: scale(1.08); }
        .game-thumb {
            width: 320px;
            height: 320px;
            object-fit: cover;
            border-radius: 20px;
            border: 4px solid rgba(255,255,255,0.15);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            margin-bottom: 15px;
        }
        .game-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,1);
        }

        /* Fullscreen game overlay */
        #game-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 9999;
        }
        #game-iframe { width: 100%; height: 100%; border: none; }

        /* Back button — 2× size, full opacity */
        #back-logo {
            position: absolute;
            top: 30px;
            left: 30px;
            width: 160px;
            height: auto;
            opacity: 1;
            cursor: pointer;
            z-index: 10001;
            transition: transform 0.2s;
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));
        }
        #back-logo:hover { transform: scale(1.08); }

        #mute-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 12px 20px;
            border-radius: 50px;
            cursor: pointer;
            z-index: 100;
            font-weight: bold;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <audio id="cafe-music" src="cafe.mp3" loop></audio>

    <!-- Curtain transition overlay -->
    <div id="curtain">
        <div class="curtain-panel top"></div>
        <div class="curtain-panel bottom"></div>
        <div id="curtain-spinner"></div>
    </div>

    <header>
        <div class="playtime">Playtime: <span id="playtime-display">0m 0s</span></div>
    </header>

    <div class="hero">
        <img src="v.png" alt="Vortarium Productions" class="main-logo">
        <p class="creator-desc">
            Hey it's me Logan, the creator of all the games, have fun playing them! <br>
            If you want to return back to the home page just click the logo in the top left corner.
        </p>
    </div>

    <div class="container">
        <div class="game-grid" id="game-grid"></div>
    </div>

    <button id="mute-btn" onclick="toggleMute()">🔊 Mute Music</button>

    <div id="game-overlay">
        <img src="v.png" id="back-logo" onclick="closeGame()">
        <iframe id="game-iframe" src=""></iframe>
    </div>

    <script>
        // ── Playtime tracker ──────────────────────────────────────────────────
        let totalSeconds = parseInt(localStorage.getItem('vortarium_playtime')) || 0;
        const timeDisplay = document.getElementById('playtime-display');

        function updateTimerDisplay() {
            const d = Math.floor(totalSeconds / 86400);
            const h = Math.floor((totalSeconds % 86400) / 3600);
            const m = Math.floor((totalSeconds % 3600) / 60);
            const s = totalSeconds % 60;
            if (d > 0)      timeDisplay.innerText = `${d}d ${h}h`;
            else if (h > 0) timeDisplay.innerText = `${h}h ${m}m`;
            else            timeDisplay.innerText = `${m}m ${s}s`;
        }
        setInterval(() => {
            totalSeconds++;
            localStorage.setItem('vortarium_playtime', totalSeconds);
            updateTimerDisplay();
        }, 1000);
        updateTimerDisplay();

        // ── Game list ─────────────────────────────────────────────────────────
        const games = [
            { prefix: 'backrooms',       name: 'Backrooms',       img: 'backrooms.png' },
            { prefix: 'ragebait',        name: 'Ragebait',        img: 'ragebait.png' },
            { prefix: 'ragebait 2',      name: 'Ragebait 2',      img: 'ragebait-2.png' },
            { prefix: 'ragebait 3',      name: 'Ragebait 3',      img: 'ragebait-3.png' },
            { prefix: 'mindscape',       name: 'Mindscape',       img: 'mindscape.png' },
            { prefix: 'trivio',          name: 'Trivio',          img: 'trivio.png' },
            { prefix: 'coriachi island', name: 'Coriachi Island',  img: 'coriachi-island.png' },
            { prefix: 'home',            name: 'Home',            img: 'home.png' },
            { prefix: 'void run',        name: 'Void Run',        img: 'void-run.png' },
            { prefix: 'the eye',         name: 'The Eye',         img: 'the-eye.png' },
            { prefix: 'mini pet',        name: 'Mini Pet',        img: 'mini-pet.png' }
        ];

        const grid = document.getElementById('game-grid');
        games.forEach(game => {
            const card = document.createElement('div');
            card.className = 'game-card';
            card.onclick = () => launchGame(game.prefix);
            card.innerHTML = `
                <img src="${game.img}" class="game-thumb" alt="${game.name}">
                <div class="game-title">${game.name}</div>
            `;
            grid.appendChild(card);
        });

        // ── Audio ─────────────────────────────────────────────────────────────
        const overlay = document.getElementById('game-overlay');
        const iframe  = document.getElementById('game-iframe');
        const music   = document.getElementById('cafe-music');
        const muteBtn = document.getElementById('mute-btn');

        // Start music on first click (only when hub is visible)
        document.body.addEventListener('click', () => {
            if (overlay.style.display !== 'block' && !music.muted) {
                music.play().catch(() => {});
            }
        }, { once: true });

        function toggleMute() {
            music.muted = !music.muted;
            muteBtn.innerText = music.muted ? '🔇 Unmute' : '🔊 Mute Music';
            if (!music.muted && overlay.style.display !== 'block') {
                music.play().catch(() => {});
            } else {
                music.pause();
            }
        }

        // Fade helpers — duration in ms
        function fadeOut(audio, duration) {
            return new Promise(resolve => {
                if (audio.paused) { resolve(); return; }
                const start   = audio.volume;
                const steps   = 30;
                const stepMs  = duration / steps;
                const stepVol = start / steps;
                const id = setInterval(() => {
                    audio.volume = Math.max(0, audio.volume - stepVol);
                    if (audio.volume <= 0) {
                        clearInterval(id);
                        audio.pause();
                        audio.volume = start; // restore for next play
                        resolve();
                    }
                }, stepMs);
            });
        }

        function fadeIn(audio, duration) {
            if (audio.muted) return;
            audio.volume = 0;
            audio.play().catch(() => {});
            const target  = 1;
            const steps   = 30;
            const stepMs  = duration / steps;
            const stepVol = target / steps;
            const id = setInterval(() => {
                audio.volume = Math.min(target, audio.volume + stepVol);
                if (audio.volume >= target) clearInterval(id);
            }, stepMs);
        }

        // ── Curtain transition ────────────────────────────────────────────────
        const curtain = document.getElementById('curtain');

        // Returns a promise that resolves after the curtain fully closes (panels meet)
        // then holds for `holdMs`, then opens again.
        // `onMidpoint` is called while the curtain is fully closed (load the content here).
        function runCurtain(onMidpoint, holdMs = 1400) {
            return new Promise(resolve => {
                // 1. Close curtain
                curtain.style.pointerEvents = 'all';
                curtain.classList.remove('opening');
                curtain.classList.add('closing');

                // After close animation (0.6s) → show spinner, run midpoint callback
                setTimeout(() => {
                    curtain.classList.remove('closing');
                    curtain.classList.add('closed');
                    onMidpoint();

                    // 2. Hold with spinner for holdMs
                    setTimeout(() => {
                        // 3. Open curtain
                        curtain.classList.remove('closed');
                        curtain.classList.add('opening');

                        // After open animation (0.6s) → done
                        setTimeout(() => {
                            curtain.classList.remove('opening');
                            curtain.style.pointerEvents = 'none';
                            resolve();
                        }, 650);
                    }, holdMs);
                }, 650);
            });
        }

        // ── Launch game ───────────────────────────────────────────────────────
        function launchGame(prefix) {
            // Fade out cafe music over 600ms while curtain closes
            fadeOut(music, 600);

            runCurtain(() => {
                // Midpoint: swap content while screen is hidden
                iframe.src = prefix + '_index.html';
                overlay.style.display = 'block';
            }, 1400).then(() => {
                // Curtain fully open — game is now visible, music stays silent
            });
        }

        // ── Close game / return to hub ────────────────────────────────────────
        function closeGame() {
            runCurtain(() => {
                // Midpoint: tear down game
                overlay.style.display = 'none';
                iframe.src = '';
            }, 1400).then(() => {
                // Curtain open — fade cafe music back in
                if (!music.muted) fadeIn(music, 800);
            });
        }
    </script>
</body>
</html>
