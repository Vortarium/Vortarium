<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>Vortarium Productions</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        :root {
            --ink: #f5f5f7;
            --ink-dim: rgba(245,245,247,0.62);
            --ink-faint: rgba(245,245,247,0.4);
            --glass: rgba(24,24,28,0.55);
            --glass-strong: rgba(24,24,28,0.78);
            --line: rgba(255,255,255,0.12);
            --radius-lg: 28px;
            --radius-md: 18px;
            --radius-pill: 999px;
            --page-pad: clamp(16px, 4vw, 40px);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html { background: #0b0b0e; scroll-behavior: smooth; }

        /* ── Custom scrollbar ── */
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.4); }
        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.25);
            border-radius: 10px;
            border: 2px solid transparent;
            background-clip: padding-box;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.5);
            border: 2px solid transparent;
            background-clip: padding-box;
        }
        * { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.25) rgba(0,0,0,0.4); }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: var(--ink);
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Background (bg.jpg) with a soft dark wash for readability ── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                linear-gradient(rgba(8,8,12,0.45), rgba(8,8,12,0.78)),
                url('bg.jpg') center / cover no-repeat;
        }

        button { font-family: inherit; color: inherit; }
        :focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

        /* ── Curtain transition ── */
        #curtain {
            position: fixed;
            inset: 0;
            z-index: 99999;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
        }
        .curtain-panel {
            position: absolute;
            left: 0;
            width: 100%;
            height: 50%;
            background: #0a0a0a;
            transition: transform 0.6s cubic-bezier(0.77, 0, 0.18, 1);
        }
        .curtain-panel.top    { top: 0;   transform: translateY(-100%); }
        .curtain-panel.bottom { bottom: 0; transform: translateY(100%); }
        #curtain.closing .curtain-panel.top    { transform: translateY(0); }
        #curtain.closing .curtain-panel.bottom { transform: translateY(0); }
        #curtain.closed  .curtain-panel.top    { transform: translateY(0); }
        #curtain.closed  .curtain-panel.bottom { transform: translateY(0); }
        #curtain.opening .curtain-panel.top    { transform: translateY(-100%); }
        #curtain.opening .curtain-panel.bottom { transform: translateY(100%); }

        #curtain-spinner {
            position: relative;
            z-index: 1;
            width: 64px;
            height: 64px;
            opacity: 0;
            transition: opacity 0.25s;
        }
        #curtain.closed #curtain-spinner { opacity: 1; }
        #curtain-spinner::before {
            content: '';
            display: block;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 5px solid rgba(255,255,255,0.15);
            border-top-color: #fff;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Top bar (playtime + search) ── */
        header {
            position: fixed;
            top: 0; left: 0; right: 0;
            padding: 12px var(--page-pad);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            background: rgba(14,14,18,0.55);
            backdrop-filter: saturate(180%) blur(24px);
            -webkit-backdrop-filter: saturate(180%) blur(24px);
            border-bottom: 1px solid var(--line);
        }
        .playtime {
            padding: 9px 16px;
            border-radius: var(--radius-pill);
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--ink-dim);
            background: rgba(255,255,255,0.08);
            white-space: nowrap;
            flex-shrink: 0;
            font-variant-numeric: tabular-nums;
        }
        .playtime span { color: var(--ink); }

        #search-wrap { flex: 1; max-width: 380px; position: relative; }
        #search-wrap svg {
            position: absolute;
            left: 14px; top: 50%;
            transform: translateY(-50%);
            opacity: 0.5;
            pointer-events: none;
        }
        #game-search {
            width: 100%;
            padding: 10px 16px 10px 40px;
            border-radius: var(--radius-pill);
            border: 1px solid transparent;
            background: rgba(255,255,255,0.1);
            color: var(--ink);
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 500;
            outline: none;
            transition: background 0.2s, border-color 0.2s;
        }
        #game-search::placeholder { color: var(--ink-faint); }
        #game-search:focus {
            background: rgba(255,255,255,0.16);
            border-color: rgba(255,255,255,0.4);
        }

        /* ── Hero ── */
        .hero {
            text-align: center;
            padding: 104px var(--page-pad) 8px;
        }
        .main-logo {
            width: 680px;
            max-width: 92%;
            filter: drop-shadow(0 6px 24px rgba(0,0,0,0.55));
        }
        .creator-desc {
            font-size: 0.95rem;
            line-height: 1.65;
            font-weight: 500;
            color: var(--ink-dim);
            max-width: 560px;
            margin: 18px auto 0;
        }

        /* ── Layout ── */
        main {
            max-width: 1240px;
            margin: 0 auto;
            padding: 24px var(--page-pad) 120px;
        }
        section { margin-top: 56px; }
        section:first-child { margin-top: 24px; }
        .section-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 20px;
        }
        .section-head h2 {
            font-size: clamp(1.4rem, 2.4vw, 1.75rem);
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        .section-head .count { font-size: 0.9rem; color: var(--ink-faint); font-weight: 500; }

        /* ── Trending banner: the whole widget is the thumbnail ── */
        @property --angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }
        .trending {
            position: relative;
            isolation: isolate;
            display: flex;
            align-items: center;
            width: 100%;
            min-height: 380px;
            padding: clamp(24px, 5vw, 56px);
            border: 0;
            border-radius: var(--radius-lg);
            text-align: left;
            cursor: pointer;
            background: #111;
            box-shadow: 0 30px 80px rgba(0,0,0,0.45);
        }
        .trending-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: inherit;
            z-index: 0;
        }
        /* light scrim so the text stays readable on any image */
        .trending-scrim {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            z-index: 1;
            background: linear-gradient(90deg, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.15) 55%, rgba(0,0,0,0) 100%);
        }
        .trending-copy { position: relative; z-index: 2; max-width: 520px; text-shadow: 0 2px 18px rgba(0,0,0,0.45); }
        .trending-badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 7px 14px;
            border-radius: var(--radius-pill);
            background: rgba(255,255,255,0.16);
            backdrop-filter: blur(12px);
            font-size: 0.85rem;
            font-weight: 600;
            text-shadow: none;
        }
        .trending h2 {
            font-size: clamp(2.4rem, 6vw, 4.2rem);
            font-weight: 800;
            letter-spacing: -0.035em;
            line-height: 1.02;
            margin: 18px 0 12px;
            text-transform: capitalize;
        }
        .trending p {
            font-size: 1.1rem;
            line-height: 1.5;
            color: rgba(255,255,255,0.9);
            font-weight: 500;
        }
        .play-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 28px;
            padding: 14px 30px;
            border: 0;
            border-radius: var(--radius-pill);
            background: #fff;
            color: #111;
            font-size: 1rem;
            font-weight: 700;
            text-shadow: none;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease;
        }
        .trending:hover .play-btn { background: #e8e8ed; transform: scale(1.04); }

        /* Hover: a white light races clockwise around the edge, and the banner trembles */
        .trending::before,
        .trending::after {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: calc(var(--radius-lg) + 3px);
            padding: 3px;
            background: conic-gradient(from var(--angle),
                rgba(255,255,255,0.12) 0deg,
                rgba(255,255,255,0.12) 190deg,
                rgba(255,255,255,0.55) 290deg,
                #fff 352deg,
                rgba(255,255,255,0.12) 360deg);
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 3;
        }
        .trending::after {
            inset: -8px;
            padding: 8px;
            border-radius: calc(var(--radius-lg) + 8px);
            filter: blur(14px);
            z-index: 0;
        }
        .trending:hover::before,
        .trending:focus-visible::before { opacity: 1; animation: orbit 2.4s linear infinite; }
        .trending:hover::after,
        .trending:focus-visible::after  { opacity: 0.9; animation: orbit 2.4s linear infinite; }
        .trending:hover { animation: tremble 0.14s linear infinite; }
        @keyframes orbit { to { --angle: 360deg; } }
        @keyframes tremble {
            0%   { transform: translate(0, 0) rotate(0deg); }
            20%  { transform: translate(-1px, 0.6px) rotate(-0.08deg); }
            40%  { transform: translate(0.8px, -0.8px) rotate(0.06deg); }
            60%  { transform: translate(-0.6px, -0.4px) rotate(0.08deg); }
            80%  { transform: translate(0.8px, 0.6px) rotate(-0.06deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        /* ── Game cards ── */
        .grid { display: grid; gap: 20px; }
        .grid.popular { grid-template-columns: 1fr; gap: 14px; }
        .grid.all     { grid-template-columns: repeat(4, 1fr); }

        .game-card {
            display: block;
            width: 100%;
            padding: 0;
            border: 0;
            background: none;
            text-align: left;
            cursor: pointer;
        }
        .thumb-wrap {
            position: relative;
            aspect-ratio: 1;
            border-radius: var(--radius-md);
            overflow: hidden;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--line);
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
            transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.35s;
        }
        .game-thumb { width: 100%; height: 100%; object-fit: cover; display: block; }
        .game-card:hover .thumb-wrap {
            transform: translateY(-5px);
            box-shadow: 0 18px 44px rgba(0,0,0,0.5);
        }
        .game-title {
            margin-top: 12px;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .game-date { margin-top: 2px; font-size: 0.85rem; color: var(--ink-dim); font-weight: 500; letter-spacing: 0.02em; }


        /* ── Popular: long thin ranked banners ── */
        .rank-row {
            position: relative;
            display: flex;
            align-items: center;
            gap: 22px;
            width: 100%;
            height: 108px;
            padding: 0 clamp(18px, 3vw, 32px);
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            overflow: hidden;
            background: #111;
            color: var(--ink);
            text-align: left;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.3s;
        }
        .rank-row:hover { transform: translateY(-3px); box-shadow: 0 18px 44px rgba(0,0,0,0.5); }
        .rank-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            filter: brightness(0.72) saturate(115%);
            transition: filter 0.3s;
        }
        .rank-row:hover .rank-bg { filter: brightness(0.9) saturate(120%); }
        .rank-row::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(8,8,12,0.85) 0%, rgba(8,8,12,0.45) 45%, rgba(8,8,12,0.05) 100%);
        }
        .rank-num {
            position: relative;
            z-index: 1;
            min-width: 40px;
            font-size: 2.6rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            font-variant-numeric: tabular-nums;
        }
        .rank-info { position: relative; z-index: 1; min-width: 0; flex: 1; }
        .rank-name {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .rank-info .game-date { color: rgba(245,245,247,0.75); }
        .rank-play {
            position: relative;
            z-index: 1;
            flex-shrink: 0;
            width: 42px; height: 42px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: rgba(255,255,255,0.16);
            backdrop-filter: blur(10px);
            transition: background 0.2s, color 0.2s;
        }
        .rank-row:hover .rank-play { background: #fff; color: #111; }

        #no-results {
            display: none;
            text-align: center;
            padding: 60px 20px;
            font-size: 1.1rem;
            color: var(--ink-dim);
        }

        /* ── Fullscreen game overlay ── */
        #game-overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 9999; }
        #game-iframe { width: 100%; height: 100%; border: none; }
        #back-logo {
            position: absolute;
            top: 130px; left: 30px;
            width: 160px; height: auto;
            cursor: pointer;
            z-index: 10001;
            transition: transform 0.2s;
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));
        }
        #back-logo:hover { transform: scale(1.08); }

        /* ── Music options (bottom-right drop-up) ── */
        #music-wrap { position: fixed; bottom: 24px; right: 24px; z-index: 100; }
        #mute-btn {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            background: var(--glass-strong);
            border: 1px solid var(--line);
            color: var(--ink);
            padding: 11px 16px 11px 18px;
            border-radius: var(--radius-pill);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            backdrop-filter: blur(16px);
            transition: background 0.2s;
        }
        #mute-btn:hover, #mute-btn[aria-expanded="true"] { background: rgba(50,50,56,0.88); }
        #mute-btn .chev { transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1); }
        #mute-btn[aria-expanded="true"] .chev { transform: rotate(180deg); }

        #music-menu {
            position: absolute;
            right: 0;
            bottom: calc(100% + 10px);
            min-width: 220px;
            padding: 6px;
            border-radius: 20px;
            background: rgba(28,28,33,0.82);
            border: 1px solid var(--line);
            backdrop-filter: saturate(180%) blur(24px);
            -webkit-backdrop-filter: saturate(180%) blur(24px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            transform-origin: bottom right;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: translateY(12px) scale(0.94);
            transition: opacity 0.2s ease, transform 0.32s cubic-bezier(0.2, 0.9, 0.3, 1.15), visibility 0s linear 0.32s;
        }
        #music-menu.open {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transform: translateY(0) scale(1);
            transition-delay: 0s;
        }
        .music-item {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 11px 14px;
            border: 0;
            border-radius: 14px;
            background: none;
            font-size: 0.95rem;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            opacity: 0;
            transform: translateY(8px);
            transition: background 0.15s, opacity 0.25s ease, transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
        }
        #music-menu.open .music-item { opacity: 1; transform: none; }
        #music-menu.open .music-item:nth-child(1) { transition-delay: 0.04s; }
        #music-menu.open .music-item:nth-child(2) { transition-delay: 0.08s; }
        #music-menu.open .music-item:nth-child(3) { transition-delay: 0.12s; }
        .music-item:hover { background: rgba(255,255,255,0.12); transition-delay: 0s; }
        .music-item svg { flex-shrink: 0; }
        #music-menu .icon-muted { display: none; }
        #music-menu.is-muted .icon-sound { display: none; }
        #music-menu.is-muted .icon-muted { display: block; }

        /* ── Responsive ── */
        @media (max-width: 900px) {
            .grid.all { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 700px) {
            .trending { min-height: 320px; align-items: flex-end; }
            .rank-row { height: 84px; gap: 14px; }
            .rank-num { font-size: 2rem; min-width: 28px; }
            .rank-name { font-size: 1.05rem; }
            .rank-play { display: none; }
            .grid.all { grid-template-columns: repeat(2, 1fr); gap: 16px; }
            .playtime { font-size: 0.8rem; padding: 8px 12px; }
        }
        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; scroll-behavior: auto !important; }
            .trending, .trending::before, .trending::after { animation: none !important; }
        }
    </style>
</head>
<body>

    <audio id="cafe-music" preload="auto"></audio>

    <!-- Curtain transition overlay -->
    <div id="curtain">
        <div class="curtain-panel top"></div>
        <div class="curtain-panel bottom"></div>
        <div id="curtain-spinner"></div>
    </div>

    <header>
        <div class="playtime">Playtime: <span id="playtime-display">0m 0s</span></div>
        <div id="search-wrap">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/>
            </svg>
            <input id="game-search" type="text" placeholder="Search projects" autocomplete="off" spellcheck="false" aria-label="Search projects">
        </div>
    </header>

    <div class="hero">
        <img src="v.png" alt="Vortarium Productions" class="main-logo">
        <p class="creator-desc">
            Hey it's me Logan, the creator of all the projects, have fun playing them!<br>
            To get back to this page from a project, click the logo in the top left corner.
            Projects at the top are the most recently made or updated.
        </p>
    </div>

    <main>
        <!-- Trending banner (filled in by script) -->
        <section id="trending-section" aria-label="Trending game"></section>

        <!-- Popular projects -->
        <section id="popular-section">
            <div class="section-head"><h2>Popular</h2></div>
            <div class="grid popular" id="popular-grid"></div>
        </section>

        <!-- All other projects -->
        <section id="all-section">
            <div class="section-head">
                <h2 id="all-title">All projects</h2>
                <span class="count" id="all-count"></span>
            </div>
            <div class="grid all" id="game-grid"></div>
            <div id="no-results">No projects match "<span id="no-results-term"></span>"</div>
        </section>
    </main>

    <div id="music-wrap">
        <div id="music-menu" role="menu" aria-hidden="true">
            <button class="music-item" role="menuitem" id="music-mute-item" onclick="toggleMute()">
                <svg class="icon-sound" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
                <svg class="icon-muted" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4z"/><line x1="22" y1="9" x2="16" y2="15"/><line x1="16" y1="9" x2="22" y2="15"/></svg>
                <span id="music-mute-label">Mute track</span>
            </button>
            <button class="music-item" role="menuitem" onclick="nextTrack()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4" fill="currentColor"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
                <span>Next track</span>
            </button>
            <button class="music-item" role="menuitem" onclick="shuffleTrack()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
                <span>Shuffle song</span>
            </button>
        </div>
        <button id="mute-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="music-menu" onclick="toggleMusicMenu()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
            Music Options
            <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 15 12 9 18 15"/></svg>
        </button>
    </div>

    <div id="game-overlay">
        <img src="v.png" id="back-logo" onclick="closeGame()">
        <iframe id="game-iframe" src=""></iframe>
    </div>

    <script>
        // ── Playtime tracker ──────────────────────────────────────────────────
        let totalSeconds = parseInt(localStorage.getItem('vortarium_playtime')) || 0;
        const timeDisplay = document.getElementById('playtime-display');

        function updateTimerDisplay() {
            const d = Math.floor(totalSeconds / 86400);
            const h = Math.floor((totalSeconds % 86400) / 3600);
            const m = Math.floor((totalSeconds % 3600) / 60);
            const s = totalSeconds % 60;
            if (d > 0)      timeDisplay.innerText = `${d}d ${h}h`;
            else if (h > 0) timeDisplay.innerText = `${h}h ${m}m`;
            else            timeDisplay.innerText = `${m}m ${s}s`;
        }
        setInterval(() => {
            totalSeconds++;
            localStorage.setItem('vortarium_playtime', totalSeconds);
            updateTimerDisplay();
        }, 1000);
        updateTimerDisplay();

        // ══════════════════════════════════════════════════════════════════════
        //  HOMEPAGE SETTINGS — edit these to change how the page looks
        // ══════════════════════════════════════════════════════════════════════

        // 1) TRENDING BANNER — the big banner at the top.
        //    Put the `prefix` of any project below. Set to null to hide the banner.
        const TRENDING = 'rpg';

        //    Which part of the thumbnail stays in view on the wide banner
        //    (e.g. 'center', 'top', 'bottom', 'center 30%').
        const TRENDING_FOCUS = 'center';

        // 2) POPULAR LEADERBOARD — the projects ranked 1–5 right under the banner, in this order.
        //    Use the `prefix` of each game. Add or remove as you like.
        const POPULAR = ['rpg', 'aetherium', 'breakout', 'ragebait', 'mini pet'];

        // 3) Should popular projects ALSO show up again in the "All projects" list?
        const SHOW_POPULAR_IN_ALL = false;

        // ── Project list ──────────────────────────────────────────────────────
        // The "All projects" list is sorted automatically by release date, newest
        // first. Projects released in the same month stay in the order listed here.
        //   prefix → filename prefix  (e.g. 'mygame' loads 'mygame_index.html')
        //   name   → display name on the card
        //   img    → thumbnail filename in the root folder
        //   date   → release date as 'MON YEAR' (e.g. 'SEP 2026')
        //   blurb  → (optional) one-line description, shown on the trending banner
        const games = [
            { prefix: 'rpg',             name: 'dragoneer',        img: 'rpg.png',              date: 'SEP 2026',
              blurb: 'Explore, fight and team up with friends to gather resources and become the strongest.' },
            { prefix: 'aetherium',       name: 'AETHERIUM',        img: 'aetherium.png',        date: 'AUG 2026' },
            { prefix: 'graphwar',        name: 'GRAPH WAR',        img: 'graphwar.png',         date: 'AUG 2026' },
            { prefix: 'helen',           name: 'Helen Keller Sim', img: 'helen.png',            date: 'AUG 2026' },
            { prefix: 'breakout',        name: 'Breakout',         img: 'breakout.png',         date: 'AUG 2026' },
            { prefix: 'zen',             name: 'ZenWords',         img: 'zen.png',              date: 'MAY 2026' },
            { prefix: 'windows',         name: 'Windows 12',       img: 'windows.png',          date: 'MAY 2026' },
            { prefix: 'merge',           name: 'Cosmic Merge',     img: 'merge.png',            date: 'MAY 2026' },
            { prefix: 'spotify',         name: 'Spotify',          img: 'spotify.png',          date: 'MAY 2026' },
            { prefix: 'byte-clicker',    name: 'Byte Clicker',     img: 'byte-clicker.png',     date: 'MAY 2026' },
            { prefix: 'vortacode',       name: 'Vortacode',        img: 'vortacode.png',        date: 'MAY 2026' },
            { prefix: 'ragebait 3',      name: 'Ragebait 3',       img: 'ragebait 3.png',       date: 'MAY 2026' },
            { prefix: 'slitherio',       name: 'Slither.io',       img: 'slitherio.png',        date: 'MAY 2026' },
            { prefix: 'paperio',         name: 'Paper.io',         img: 'paperio.png',          date: 'MAY 2026' },
            { prefix: 'play2game',       name: 'Play2Game',        img: 'play2game.png',        date: 'APR 2026' },
            { prefix: 'mindscape',       name: 'Mindscape',        img: 'mindscape.png',        date: 'APR 2026' },
            { prefix: 'backrooms',       name: 'Backrooms',        img: 'backrooms.png',        date: 'APR 2026' },
            { prefix: 'trivio',          name: 'Trivio',           img: 'trivio.png',           date: 'APR 2026' },
            { prefix: 'ragebait 2',      name: 'Ragebait 2',       img: 'ragebait-2.png',       date: 'APR 2026' },
            { prefix: 'coriachi island', name: 'Coriachi Island',  img: 'coriachi-island.png',  date: 'APR 2026' },
            { prefix: 'home',            name: 'Home',             img: 'home.png',             date: 'APR 2026' },
            { prefix: 'void run',        name: 'Void Run',         img: 'void-run.png',         date: 'APR 2026' },
            { prefix: 'the eye',         name: 'The Eye',          img: 'the-eye.png',          date: 'APR 2026' },
            { prefix: 'ragebait',        name: 'Ragebait',         img: 'ragebait.png',         date: 'APR 2026' },
            { prefix: 'mini pet',        name: 'Mini Pet',         img: 'mini-pet.png',         date: 'APR 2026' },
            { prefix: 'steringos',       name: 'SterlingOS',       img: 'steringos.png',        date: 'APR 2025' },
            { prefix: 'vortalk',         name: 'Vortalk',          img: 'vortalk.png',          date: 'JUL 2024' },
            { prefix: 'vplace',          name: 'V-Place',          img: 'vplace.png',           date: 'JUN 2024' },
            { prefix: 'nivorian empire', name: 'Nivorian Empire',  img: 'nivorian-empire.png',  date: 'JUN 2024' },
            { prefix: 'pixel mice sim',  name: 'Pixel Mice Sim',   img: 'pixel-mice-sim.png',   date: 'JUN 2024' },
            { prefix: 'vortarius',       name: 'Vortarius',        img: 'vortarius.png',        date: 'JUN 2024' },
            { prefix: 'beat',            name: 'Beat',             img: 'beat.png',             date: 'MAY 2024' },
            { prefix: 'canvas',          name: 'Canvas',           img: 'canvas.png',           date: 'MAY 2024' },
            { prefix: 'level up',        name: 'Level Up',         img: 'level-up.png',         date: 'APR 2024' },
            { prefix: 'fishtopia',       name: 'Fishtopia',        img: 'fishtopia.png',        date: 'FEB 2024' },
            { prefix: 'black hole',      name: 'Black Hole',       img: 'black-hole.png',       date: 'NOV 2023' },
            // ── TO ADD A NEW PROJECT: copy a line above and fill in the fields ──
        ];

        // ── Rendering ─────────────────────────────────────────────────────────
        const MONTHS = { JAN:0, FEB:1, MAR:2, APR:3, MAY:4, JUN:5, JUL:6, AUG:7, SEP:8, OCT:9, NOV:10, DEC:11 };
        function dateValue(g) {
            const [m, y] = (g.date || '').toUpperCase().split(' ');
            return (parseInt(y) || 0) * 12 + (MONTHS[m] || 0);
        }
        // Newest first; ties keep the order they were listed in
        const sortedGames = games
            .map((g, i) => [g, i])
            .sort((a, b) => dateValue(b[0]) - dateValue(a[0]) || a[1] - b[1])
            .map(x => x[0]);

        const byPrefix = Object.fromEntries(games.map(g => [g.prefix, g]));
        const trendingGame = TRENDING ? byPrefix[TRENDING] : null;
        const popularGames = POPULAR.map(p => byPrefix[p]).filter(Boolean);
        const popularSet   = new Set(popularGames.map(g => g.prefix));

        const trendingSection = document.getElementById('trending-section');
        const popularSection  = document.getElementById('popular-section');
        const popularGrid     = document.getElementById('popular-grid');
        const grid            = document.getElementById('game-grid');
        const allTitle        = document.getElementById('all-title');
        const allCount        = document.getElementById('all-count');
        const searchInput     = document.getElementById('game-search');
        const noResults       = document.getElementById('no-results');
        const noResultsTerm   = document.getElementById('no-results-term');

        function cardHTML(game) {
            return `
                <button class="game-card" data-prefix="${game.prefix}">
                    <div class="thumb-wrap">
                        <img src="${game.img}" class="game-thumb" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
                    </div>
                    <div class="game-title">${game.name}</div>
                    <div class="game-date">${game.date || ''}</div>
                </button>`;
        }

        function rankRowHTML(game, rank) {
            return `
                <button class="rank-row" data-prefix="${game.prefix}">
                    <img class="rank-bg" src="${game.img}" alt="" onerror="this.style.visibility='hidden'">
                    <span class="rank-num">${rank}</span>
                    <div class="rank-info">
                        <div class="rank-name">${game.name}</div>
                        <div class="game-date">${game.date || ''}</div>
                    </div>
                    <span class="rank-play">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8z"/></svg>
                    </span>
                </button>`;
        }

        // Trending banner
        if (trendingGame) {
            trendingSection.innerHTML = `
                <div class="trending" role="button" tabindex="0" aria-label="Play ${trendingGame.name}" data-prefix="${trendingGame.prefix}">
                    <img class="trending-bg" src="${trendingGame.img}" alt="" style="object-position:${TRENDING_FOCUS}" onerror="this.style.visibility='hidden'">
                    <div class="trending-scrim"></div>
                    <div class="trending-copy">
                        <span class="trending-badge">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2s1 4-2 7c-2 2-4 3.5-4 7a7 7 0 0 0 14 0c0-3-1.5-5-3-6.5 0 2-1 3-2 3 1-4-1-7-3-10.5z"/></svg>
                            Trending now
                        </span>
                        <h2>${trendingGame.name}</h2>
                        <p>${trendingGame.blurb || 'Jump in and see what is new.'}</p>
                        <button class="play-btn" tabindex="-1">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8z"/></svg>
                            Play now
                        </button>
                    </div>
                </div>`;
        } else {
            trendingSection.remove();
        }

        // Popular leaderboard (ranked 1–5)
        popularGrid.innerHTML = popularGames.map((g, i) => rankRowHTML(g, i + 1)).join('');
        if (!popularGames.length) popularSection.remove();

        // Main render — handles browsing and search
        function render() {
            const query    = searchInput.value.trim().toLowerCase();
            const browsing = !query;

            // Banner + popular leaderboard only show when not searching
            if (trendingGame) trendingSection.style.display = browsing ? '' : 'none';
            if (popularGames.length) popularSection.style.display = browsing ? '' : 'none';

            let list = sortedGames;
            if (browsing && !SHOW_POPULAR_IN_ALL) list = list.filter(g => !popularSet.has(g.prefix));
            if (query) list = list.filter(g => g.name.toLowerCase().includes(query));

            grid.innerHTML = list.map(g => cardHTML(g)).join('');
            allTitle.textContent = browsing ? 'All projects' : 'Results';
            allCount.textContent = list.length + (list.length === 1 ? ' project' : ' projects');

            if (list.length === 0 && query) {
                noResultsTerm.textContent = searchInput.value.trim();
                noResults.style.display = 'block';
            } else {
                noResults.style.display = 'none';
            }
        }

        // Click / keyboard launch (works for every card and the banner)
        document.addEventListener('click', e => {
            const el = e.target.closest('[data-prefix]');
            if (el) launchGame(el.dataset.prefix);
        });
        document.addEventListener('keydown', e => {
            if (e.key !== 'Enter') return;
            const el = e.target.closest('.trending[data-prefix]');
            if (el) launchGame(el.dataset.prefix);
        });

        searchInput.addEventListener('input', render);
        render();

        // ── Audio ─────────────────────────────────────────────────────────────
        const overlay = document.getElementById('game-overlay');
        const iframe  = document.getElementById('game-iframe');
        const music   = document.getElementById('cafe-music');
        const muteBtn   = document.getElementById('mute-btn');
        const musicMenu = document.getElementById('music-menu');
        const muteLabel = document.getElementById('music-mute-label');

        // ── Music tracks ──────────────────────────────────────────────────────
        // Add or remove mp3 filenames here (files go in the root folder).
        // A random one is picked on load and whenever a track ends.
        const TRACKS = ['cafe.mp3', 'cafe1.mp3', 'cafe2.mp3', 'chill.mp3', 'chill1.mp3'];
        let trackIndex = Math.floor(Math.random() * TRACKS.length);
        let trackErrors = 0;
        music.src = TRACKS[trackIndex];

        // Music only starts when returning to the hub (via closeGame → fadeIn)
        // or when you press Next track / Shuffle song / Unmute.
        // It never autoplays on initial page load.

        function loadTrack(i) {
            trackIndex = i;
            music.src = TRACKS[i];
            if (!music.muted && overlay.style.display !== 'block') {
                music.volume = 1;
                music.play().catch(() => {});
            }
        }
        function nextTrack()    { loadTrack((trackIndex + 1) % TRACKS.length); }
        function shuffleTrack() {
            let i = 0;
            if (TRACKS.length > 1) {
                do { i = Math.floor(Math.random() * TRACKS.length); } while (i === trackIndex);
            }
            loadTrack(i);
        }
        music.addEventListener('ended', shuffleTrack);
        music.addEventListener('playing', () => { trackErrors = 0; });
        // If a file is missing, skip to another track instead of going silent
        music.addEventListener('error', () => {
            if (++trackErrors < TRACKS.length) nextTrack();
        });

        function toggleMute() {
            music.muted = !music.muted;
            musicMenu.classList.toggle('is-muted', music.muted);
            muteLabel.textContent = music.muted ? 'Unmute track' : 'Mute track';
            if (!music.muted && overlay.style.display !== 'block') {
                music.play().catch(() => {});
            } else {
                music.pause();
            }
        }

        // ── Music options menu (drop-up) ──────────────────────────────────────
        function setMusicMenu(open) {
            musicMenu.classList.toggle('open', open);
            muteBtn.setAttribute('aria-expanded', open);
            musicMenu.setAttribute('aria-hidden', !open);
        }
        function toggleMusicMenu() { setMusicMenu(!musicMenu.classList.contains('open')); }
        document.addEventListener('click', e => {
            if (!e.target.closest('#music-wrap')) setMusicMenu(false);
        });
        document.addEventListener('keydown', e => { if (e.key === 'Escape') setMusicMenu(false); });

        function fadeOut(audio, duration) {
            return new Promise(resolve => {
                if (audio.paused) { resolve(); return; }
                const start   = audio.volume;
                const steps   = 30;
                const stepMs  = duration / steps;
                const stepVol = start / steps;
                const id = setInterval(() => {
                    audio.volume = Math.max(0, audio.volume - stepVol);
                    if (audio.volume <= 0) {
                        clearInterval(id);
                        audio.pause();
                        audio.volume = start;
                        resolve();
                    }
                }, stepMs);
            });
        }

        function fadeIn(audio, duration) {
            if (audio.muted) return;
            audio.volume = 0;
            audio.play().catch(() => {});
            const target  = 1;
            const steps   = 30;
            const stepMs  = duration / steps;
            const stepVol = target / steps;
            const id = setInterval(() => {
                audio.volume = Math.min(target, audio.volume + stepVol);
                if (audio.volume >= target) clearInterval(id);
            }, stepMs);
        }

        // ── Curtain transition ────────────────────────────────────────────────
        const curtain = document.getElementById('curtain');

        function runCurtain(onMidpoint, holdMs = 1400) {
            return new Promise(resolve => {
                curtain.style.pointerEvents = 'all';
                curtain.classList.remove('opening');
                curtain.classList.add('closing');

                setTimeout(() => {
                    curtain.classList.remove('closing');
                    curtain.classList.add('closed');
                    onMidpoint();

                    setTimeout(() => {
                        curtain.classList.remove('closed');
                        curtain.classList.add('opening');

                        setTimeout(() => {
                            curtain.classList.remove('opening');
                            curtain.style.pointerEvents = 'none';
                            resolve();
                        }, 650);
                    }, holdMs);
                }, 650);
            });
        }

        // ── Launch game ───────────────────────────────────────────────────────
        function launchGame(prefix) {
            fadeOut(music, 600);
            setScrollbarVisible(false);

            runCurtain(() => {
                iframe.src = prefix + '_index.html';
                overlay.style.display = 'block';
            }, 1400);
        }

        // ── Close game / return to hub ────────────────────────────────────────
        function closeGame() {
            runCurtain(() => {
                overlay.style.display = 'none';
                iframe.src = '';
            }, 1400).then(() => {
                setScrollbarVisible(true);
                if (!music.muted) fadeIn(music, 800);
            });
        }

        // ── Hide scrollbar while inside a game ───────────────────────────────
        function setScrollbarVisible(visible) {
            document.documentElement.style.overflow = visible ? '' : 'hidden';
            document.body.style.overflow            = visible ? '' : 'hidden';
        }
    </script>
</body>
</html>
