<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortarium Productions</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* ── Custom scrollbar ── */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.4); border-radius: 10px; }
        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.25);
            border-radius: 10px;
            border: 2px solid transparent;
            background-clip: padding-box;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.5);
            border: 2px solid transparent;
            background-clip: padding-box;
        }
        * { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.25) rgba(0,0,0,0.4); }

        body {
            font-family: 'Quicksand', sans-serif;
            color: #fff;
            background: url('cafe.gif') no-repeat center center fixed;
            background-size: cover;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* ── Curtain transition ── */
        #curtain {
            position: fixed;
            inset: 0;
            z-index: 99999;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
        }

        /* Top and bottom curtain panels */
        .curtain-panel {
            position: absolute;
            left: 0;
            width: 100%;
            height: 50%;
            background: #0a0a0a;
            transition: transform 0.6s cubic-bezier(0.77, 0, 0.18, 1);
        }
        .curtain-panel.top    { top: 0;   transform: translateY(-100%); }
        .curtain-panel.bottom { bottom: 0; transform: translateY(100%); }

        /* Closed state — panels slide in */
        #curtain.closing .curtain-panel.top    { transform: translateY(0); }
        #curtain.closing .curtain-panel.bottom { transform: translateY(0); }
        #curtain.closed  .curtain-panel.top    { transform: translateY(0); }
        #curtain.closed  .curtain-panel.bottom { transform: translateY(0); }

        /* Opening state — panels slide back out */
        #curtain.opening .curtain-panel.top    { transform: translateY(-100%); }
        #curtain.opening .curtain-panel.bottom { transform: translateY(100%); }

        /* Spinner — only visible when curtain is closed */
        #curtain-spinner {
            position: relative;
            z-index: 1;
            width: 64px;
            height: 64px;
            opacity: 0;
            transition: opacity 0.25s;
        }
        #curtain.closed #curtain-spinner { opacity: 1; }

        #curtain-spinner::before {
            content: '';
            display: block;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 5px solid rgba(255,255,255,0.15);
            border-top-color: #fff;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Top bar (playtime + search) ── */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 14px 24px;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            background: rgba(0,0,0,0.35);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .playtime {
            background: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: 700;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.2);
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* Search bar */
        #search-wrap {
            flex: 1;
            max-width: 420px;
            position: relative;
        }
        #search-wrap svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.45;
            pointer-events: none;
        }
        #game-search {
            width: 100%;
            padding: 10px 16px 10px 42px;
            border-radius: 25px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.5);
            color: #fff;
            font-family: 'Quicksand', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            outline: none;
            backdrop-filter: blur(8px);
            transition: border-color 0.2s, background 0.2s;
        }
        #game-search::placeholder { color: rgba(255,255,255,0.35); }
        #game-search:focus {
            border-color: rgba(255,255,255,0.5);
            background: rgba(0,0,0,0.65);
        }

        /* "No results" message */
        #no-results {
            display: none;
            text-align: center;
            padding: 60px 20px;
            font-size: 1.2rem;
            color: rgba(255,255,255,0.5);
        }

        /* Main Branding */
        .hero { text-align: center; padding: 80px 20px 40px; }
        .main-logo {
            width: 600px;
            max-width: 90%;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 15px rgba(0,0,0,0.8));
        }
        .creator-desc {
            font-size: 1.3rem;
            color: #f7e1d7;
            max-width: 800px;
            margin: 0 auto;
            line-height: 1.6;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
            background: rgba(0,0,0,0.4);
            padding: 20px;
            border-radius: 20px;
        }

        /* Grid */
        .container { max-width: 1100px; margin: 40px auto 100px; padding: 20px; }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
            justify-items: center;
        }
        .game-card {
            width: 320px;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
        }
        .game-card:hover { transform: scale(1.08); }
        .game-thumb {
            width: 320px;
            height: 320px;
            object-fit: cover;
            border-radius: 20px;
            border: 4px solid rgba(255,255,255,0.15);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            margin-bottom: 15px;
        }
        .game-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,1);
        }

        /* Fullscreen game overlay */
        #game-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 9999;
        }
        #game-iframe { width: 100%; height: 100%; border: none; }

        /* Back button — 2× size, full opacity */
        #back-logo {
            position: absolute;
            top: 30px;
            left: 30px;
            width: 160px;
            height: auto;
            opacity: 1;
            cursor: pointer;
            z-index: 10001;
            transition: transform 0.2s;
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));
        }
        #back-logo:hover { transform: scale(1.08); }

        #mute-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 12px 20px;
            border-radius: 50px;
            cursor: pointer;
            z-index: 100;
            font-weight: bold;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <audio id="cafe-music" src="cafe.mp3" loop></audio>

    <!-- Curtain transition overlay -->
    <div id="curtain">
        <div class="curtain-panel top"></div>
        <div class="curtain-panel bottom"></div>
        <div id="curtain-spinner"></div>
    </div>

    <header>
        <div class="playtime">Playtime: <span id="playtime-display">0m 0s</span></div>
        <div id="search-wrap">
            <!-- magnifier icon -->
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/>
            </svg>
            <input id="game-search" type="text" placeholder="Search games…" autocomplete="off" spellcheck="false">
        </div>
    </header>

    <div class="hero">
        <img src="v.png" alt="Vortarium Productions" class="main-logo">
        <p class="creator-desc">
            Hey it's me Logan, the creator of all the games, have fun playing them! <br>
            If you want to return back to the home page just click the logo in the top left corner.
        </p>
    </div>

    <div class="container">
        <div class="game-grid" id="game-grid"></div>
        <div id="no-results">No games match "<span id="no-results-term"></span>"</div>
    </div>

    <button id="mute-btn" onclick="toggleMute()">🔊 Mute Music</button>

    <div id="game-overlay">
        <img src="v.png" id="back-logo" onclick="closeGame()">
        <iframe id="game-iframe" src=""></iframe>
    </div>

    <script>
        // ── Playtime tracker ──────────────────────────────────────────────────
        let totalSeconds = parseInt(localStorage.getItem('vortarium_playtime')) || 0;
        const timeDisplay = document.getElementById('playtime-display');

        function updateTimerDisplay() {
            const d = Math.floor(totalSeconds / 86400);
            const h = Math.floor((totalSeconds % 86400) / 3600);
            const m = Math.floor((totalSeconds % 3600) / 60);
            const s = totalSeconds % 60;
            if (d > 0)      timeDisplay.innerText = `${d}d ${h}h`;
            else if (h > 0) timeDisplay.innerText = `${h}h ${m}m`;
            else            timeDisplay.innerText = `${m}m ${s}s`;
        }
        setInterval(() => {
            totalSeconds++;
            localStorage.setItem('vortarium_playtime', totalSeconds);
            updateTimerDisplay();
        }, 1000);
        updateTimerDisplay();

        // ── Game list ─────────────────────────────────────────────────────────
        const games = [
            // ── Games (each loads its own _index.html in the fullscreen overlay) ──
            { prefix: 'backrooms',       name: 'Backrooms',        img: 'backrooms.png'        },
            { prefix: 'ragebait',        name: 'Ragebait',         img: 'ragebait.png'         },
            { prefix: 'ragebait 2',      name: 'Ragebait 2',       img: 'ragebait-2.png'       },
            { prefix: 'ragebait 3',      name: 'Ragebait 3',       img: 'ragebait-3.png'       },
            { prefix: 'mindscape',       name: 'Mindscape',        img: 'mindscape.png'        },
            { prefix: 'trivio',          name: 'Trivio',           img: 'trivio.png'           },
            { prefix: 'coriachi island', name: 'Coriachi Island',  img: 'coriachi-island.png'  },
            { prefix: 'home',            name: 'Home',             img: 'home.png'             },
            { prefix: 'void run',        name: 'Void Run',         img: 'void-run.png'         },
            { prefix: 'the eye',         name: 'The Eye',          img: 'the-eye.png'          },
            { prefix: 'mini pet',        name: 'Mini Pet',         img: 'mini-pet.png'         },
            { prefix: 'fishtopia',       name: 'Fishtopia',        img: 'fishtopia.png'        },
            { prefix: 'steringos',       name: 'SterlingOS',       img: 'steringos.png'        },
            { prefix: 'vortalk',         name: 'Vortalk',          img: 'vortalk.png'          },
            { prefix: 'vplace',          name: 'V-Place',          img: 'vplace.png'           },
            { prefix: 'nivorian empire', name: 'Nivorian Empire',  img: 'nivorian-empire.png'  },
            { prefix: 'pixel mice sim',  name: 'Pixel Mice Sim',   img: 'pixel-mice-sim.png'   },
            { prefix: 'vortarius',       name: 'Vortarius',        img: 'vortarius.png'        },
            { prefix: 'play2game',       name: 'Play2Game',        img: 'play2game.png'        },
            { prefix: 'level up',        name: 'Level Up',         img: 'level-up.png'         },
            { prefix: 'beat',            name: 'Beat',             img: 'beat.png'             },
            { prefix: 'byte clicker',    name: 'Byte Clicker',     img: 'byte-clicker.png'     },
            { prefix: 'canvas',          name: 'Canvas',           img: 'canvas.png'           },
            { prefix: 'black hole',      name: 'Black Hole',       img: 'black-hole.png'       },
            // ── TO ADD A NEW GAME: copy a line above and fill in the three fields ──
            // prefix → filename prefix  (e.g. 'mygame' loads 'mygame_index.html')
            // name   → display name on the card
            // img    → thumbnail filename in the root folder
        ];

        const grid = document.getElementById('game-grid');
        games.forEach(game => {
            const card = document.createElement('div');
            card.className = 'game-card';
            card.onclick = () => launchGame(game.prefix);
            card.innerHTML = `
                <img src="${game.img}" class="game-thumb" alt="${game.name}" onerror="this.style.background='rgba(255,255,255,0.05)'">
                <div class="game-title">${game.name}</div>
            `;
            grid.appendChild(card);
        });

        // ── Audio ─────────────────────────────────────────────────────────────
        const overlay = document.getElementById('game-overlay');
        const iframe  = document.getElementById('game-iframe');
        const music   = document.getElementById('cafe-music');
        const muteBtn = document.getElementById('mute-btn');

        // Music only starts when returning to the hub (via closeGame → fadeIn).
        // It never autoplays on initial page load.

        function toggleMute() {
            music.muted = !music.muted;
            muteBtn.innerText = music.muted ? '🔇 Unmute' : '🔊 Mute Music';
            if (!music.muted && overlay.style.display !== 'block') {
                music.play().catch(() => {});
            } else {
                music.pause();
            }
        }

        // Fade helpers — duration in ms
        function fadeOut(audio, duration) {
            return new Promise(resolve => {
                if (audio.paused) { resolve(); return; }
                const start   = audio.volume;
                const steps   = 30;
                const stepMs  = duration / steps;
                const stepVol = start / steps;
                const id = setInterval(() => {
                    audio.volume = Math.max(0, audio.volume - stepVol);
                    if (audio.volume <= 0) {
                        clearInterval(id);
                        audio.pause();
                        audio.volume = start; // restore for next play
                        resolve();
                    }
                }, stepMs);
            });
        }

        function fadeIn(audio, duration) {
            if (audio.muted) return;
            audio.volume = 0;
            audio.play().catch(() => {});
            const target  = 1;
            const steps   = 30;
            const stepMs  = duration / steps;
            const stepVol = target / steps;
            const id = setInterval(() => {
                audio.volume = Math.min(target, audio.volume + stepVol);
                if (audio.volume >= target) clearInterval(id);
            }, stepMs);
        }

        // ── Curtain transition ────────────────────────────────────────────────
        const curtain = document.getElementById('curtain');

        // Returns a promise that resolves after the curtain fully closes (panels meet)
        // then holds for `holdMs`, then opens again.
        // `onMidpoint` is called while the curtain is fully closed (load the content here).
        function runCurtain(onMidpoint, holdMs = 1400) {
            return new Promise(resolve => {
                // 1. Close curtain
                curtain.style.pointerEvents = 'all';
                curtain.classList.remove('opening');
                curtain.classList.add('closing');

                // After close animation (0.6s) → show spinner, run midpoint callback
                setTimeout(() => {
                    curtain.classList.remove('closing');
                    curtain.classList.add('closed');
                    onMidpoint();

                    // 2. Hold with spinner for holdMs
                    setTimeout(() => {
                        // 3. Open curtain
                        curtain.classList.remove('closed');
                        curtain.classList.add('opening');

                        // After open animation (0.6s) → done
                        setTimeout(() => {
                            curtain.classList.remove('opening');
                            curtain.style.pointerEvents = 'none';
                            resolve();
                        }, 650);
                    }, holdMs);
                }, 650);
            });
        }

        // ── Launch game ───────────────────────────────────────────────────────
        function launchGame(prefix) {
            // Fade out cafe music over 600ms while curtain closes
            fadeOut(music, 600);
            // Hide page scrollbar while inside a game
            setScrollbarVisible(false);

            runCurtain(() => {
                // Midpoint: swap content while screen is hidden
                iframe.src = prefix + '_index.html';
                overlay.style.display = 'block';
            }, 1400).then(() => {
                // Curtain fully open — game is now visible, music stays silent
            });
        }

        // ── Close game / return to hub ────────────────────────────────────────
        function closeGame() {
            runCurtain(() => {
                // Midpoint: tear down game
                overlay.style.display = 'none';
                iframe.src = '';
            }, 1400).then(() => {
                // Curtain open — restore scrollbar and fade cafe music back in
                setScrollbarVisible(true);
                if (!music.muted) fadeIn(music, 800);
            });
        }
        // ── Search filtering ──────────────────────────────────────────────────
        const searchInput   = document.getElementById('game-search');
        const noResults     = document.getElementById('no-results');
        const noResultsTerm = document.getElementById('no-results-term');

        searchInput.addEventListener('input', () => {
            const query = searchInput.value.trim().toLowerCase();
            const cards = grid.querySelectorAll('.game-card');
            let visible = 0;

            cards.forEach(card => {
                const title = card.querySelector('.game-title').textContent.toLowerCase();
                const match = !query || title.includes(query);
                card.style.display = match ? '' : 'none';
                if (match) visible++;
            });

            if (visible === 0 && query) {
                noResultsTerm.textContent = searchInput.value.trim();
                noResults.style.display = 'block';
            } else {
                noResults.style.display = 'none';
            }
        });

        // ── Hide scrollbar while inside a game ───────────────────────────────
        function setScrollbarVisible(visible) {
            document.documentElement.style.overflow = visible ? '' : 'hidden';
            document.body.style.overflow            = visible ? '' : 'hidden';
        }
    </script>
</body>
</html>
